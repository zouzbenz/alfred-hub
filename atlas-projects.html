<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Atlas Pose - Projets</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <style>
        :root { --bg:#0a0f1a; --card:#111827; --accent:#3b82f6; --accent2:#10b981; --text:#f3f4f6; --dim:#9ca3af; --border:#1f2937; --danger:#ef4444; --warn:#f59e0b; }
        * { box-sizing:border-box; margin:0; padding:0; }
        body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; }
        .container { max-width:1200px; margin:0 auto; padding:15px; }
        
        .top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap:wrap; gap:10px; padding:12px; background:var(--card); border-radius:12px; border:1px solid var(--border); }
        .back-link { display:inline-flex; align-items:center; gap:6px; color:var(--accent); text-decoration:none; font-size:.85rem; padding:8px 12px; background:rgba(59,130,246,.1); border-radius:8px; }
        
        .header { text-align:center; padding:20px 15px 30px; }
        .header h1 { font-size:2rem; margin-bottom:8px; }
        .header p { color:var(--dim); font-size:1rem; }
        
        .stats-row { display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; margin-bottom:25px; }
        .stat-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:15px; text-align:center; }
        .stat-value { font-size:1.5rem; font-weight:800; }
        .stat-value.blue { color:var(--accent); }
        .stat-value.green { color:var(--accent2); }
        .stat-value.orange { color:var(--warn); }
        .stat-label { font-size:.75rem; color:var(--dim); margin-top:4px; }
        
        .filters { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; justify-content:center; }
        .filter-btn { padding:10px 18px; background:var(--card); border:1px solid var(--border); border-radius:25px; color:var(--text); cursor:pointer; font-size:.85rem; transition:.2s; }
        .filter-btn:hover, .filter-btn.active { background:var(--accent); border-color:var(--accent); }
        
        .projects-grid { display:grid; grid-template-columns:1fr; gap:15px; }
        
        .project-card { background:var(--card); border:1px solid var(--border); border-radius:16px; overflow:hidden; transition:.3s; cursor:pointer; }
        .project-card:hover { transform:translateY(-3px); box-shadow:0 10px 30px rgba(0,0,0,.3); border-color:var(--accent); }
        
        .project-header { padding:18px; border-bottom:1px solid var(--border); }
        .project-name { font-size:1.2rem; font-weight:700; margin-bottom:6px; }
        .project-client { color:var(--dim); font-size:.85rem; }
        .status-badge { display:inline-block; padding:4px 12px; border-radius:20px; font-size:.7rem; font-weight:600; margin-top:10px; }
        .status-a_venir { background:rgba(245,158,11,.2); color:var(--warn); }
        .status-en_cours { background:rgba(59,130,246,.2); color:var(--accent); }
        .status-termine { background:rgba(16,185,129,.2); color:var(--accent2); }
        
        .project-body { padding:18px; }
        .project-stats { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-bottom:15px; }
        .project-stat { text-align:center; }
        .project-stat-value { font-size:1rem; font-weight:700; }
        .project-stat-label { font-size:.7rem; color:var(--dim); }
        
        .progress-section { margin-top:12px; }
        .progress-header { display:flex; justify-content:space-between; margin-bottom:6px; font-size:.8rem; }
        .progress-bar { height:8px; background:var(--border); border-radius:4px; overflow:hidden; }
        .progress-fill { height:100%; border-radius:4px; }
        .progress-fill.safe { background:linear-gradient(90deg, var(--accent2), #34d399); }
        .progress-fill.warning { background:linear-gradient(90deg, var(--warn), #fbbf24); }
        .progress-fill.danger { background:linear-gradient(90deg, var(--danger), #f87171); }
        
        .project-footer { padding:12px 18px; background:rgba(0,0,0,.2); display:flex; justify-content:space-between; align-items:center; }
        .project-location { font-size:.8rem; color:var(--dim); }
        .project-arrow { color:var(--accent); font-size:1.2rem; }
        
        .empty-state { text-align:center; padding:50px; color:var(--dim); }
        
        .footer { text-align:center; padding:30px; color:var(--dim); font-size:.8rem; }
        .footer a { color:var(--accent); text-decoration:none; margin:0 8px; }
        
        @media(min-width:600px) { .projects-grid { grid-template-columns:repeat(2, 1fr); } .stats-row { grid-template-columns:repeat(4, 1fr); } }
        @media(min-width:900px) { .projects-grid { grid-template-columns:repeat(3, 1fr); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <a href="./atlas-backoffice.html" class="back-link">⚙️ Administration</a>
            <a href="./atlas-tasks.html" class="back-link">📋 Tâches globales</a>
            <a href="./atlas-ouvriers.html" class="back-link">👷 Main d'œuvre</a>
        </div>
        
        <div class="header">
            <h1>🔧 Atlas Pose</h1>
            <p>Suivi des chantiers</p>
        </div>
        
        <div class="stats-row">
            <div class="stat-card"><div class="stat-value blue" id="stat-total">0</div><div class="stat-label">Projets</div></div>
            <div class="stat-card"><div class="stat-value green" id="stat-encours">0</div><div class="stat-label">En cours</div></div>
            <div class="stat-card"><div class="stat-value orange" id="stat-budget">0</div><div class="stat-label">Budget</div></div>
            <div class="stat-card"><div class="stat-value blue" id="stat-spent">0</div><div class="stat-label">Dépensé</div></div>
        </div>
        
        <div class="filters">
            <button class="filter-btn active" data-filter="all">Tous</button>
            <button class="filter-btn" data-filter="en_cours">En cours</button>
            <button class="filter-btn" data-filter="a_venir">À venir</button>
            <button class="filter-btn" data-filter="termine">Terminés</button>
        </div>
        
        <div class="projects-grid" id="projects-grid"><div class="empty-state">Chargement...</div></div>
        
        <div class="footer">
            <a href="./atlas-backoffice.html">Administration</a>
            <a href="./atlas-tasks.html">📋 Tâches globales</a>
            <a href="./atlas-ouvriers.html">👷 Main d'œuvre</a>
        </div>
    </div>
    
    <script>
const SUPABASE_URL = 'https://wxhlstificzqovfcumop.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aGxzdGlmaWN6cW92ZmN1bW9wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyNjcwOTAsImV4cCI6MjA4Njg0MzA5MH0.mt6v3SKPMhWpMw9PH7D8k3ubrR1kJNIFHw0aloLmQiQ';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let projects = [], budgets = [], depenses = [], currentFilter = 'all';

async function loadData() {
    const [pRes, bRes, dRes] = await Promise.all([
        db.from('atlas_projects').select('*').order('created_at', { ascending: false }),
        db.from('atlas_budget').select('*'),
        db.from('atlas_depenses').select('*')
    ]);
    projects = pRes.data || [];
    budgets = bRes.data || [];
    depenses = dRes.data || [];
    renderStats();
    renderProjects();
}

function formatMoney(n) {
    if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
    if (n >= 1000) return (n / 1000).toFixed(0) + 'K';
    return n.toString();
}

function getBudgetTotal(pid) { return budgets.filter(b => b.project_id === pid).reduce((s, b) => s + (parseFloat(b.budget_prevu) || 0), 0); }
function getDepensesTotal(pid) { return depenses.filter(d => d.project_id === pid).reduce((s, d) => s + (parseFloat(d.montant) || 0), 0); }

function renderStats() {
    document.getElementById('stat-total').textContent = projects.length;
    document.getElementById('stat-encours').textContent = projects.filter(p => p.status === 'en_cours').length;
    document.getElementById('stat-budget').textContent = formatMoney(projects.reduce((s, p) => s + getBudgetTotal(p.id), 0));
    document.getElementById('stat-spent').textContent = formatMoney(projects.reduce((s, p) => s + getDepensesTotal(p.id), 0));
}

function renderProjects() {
    const filtered = currentFilter === 'all' ? projects : projects.filter(p => p.status === currentFilter);
    const grid = document.getElementById('projects-grid');
    
    if (!filtered.length) { grid.innerHTML = '<div class="empty-state">Aucun projet</div>'; return; }
    
    grid.innerHTML = filtered.map(p => {
        const budget = getBudgetTotal(p.id), spent = getDepensesTotal(p.id), reste = budget - spent;
        const pct = budget > 0 ? Math.round((spent / budget) * 100) : 0;
        const progressClass = pct > 100 ? 'danger' : pct > 80 ? 'warning' : 'safe';
        
        return `
        <div class="project-card" onclick="location.href='./atlas-project.html?id=${p.id}'">
            <div class="project-header">
                <div class="project-name">${p.name}</div>
                <div class="project-client">${p.client_name || '-'}</div>
                <span class="status-badge status-${p.status}">${p.status.replace('_', ' ')}</span>
            </div>
            <div class="project-body">
                <div class="project-stats">
                    <div class="project-stat"><div class="project-stat-value">${p.surface_m2 || 0}</div><div class="project-stat-label">m²</div></div>
                    <div class="project-stat"><div class="project-stat-value">${p.nb_employes || 0}</div><div class="project-stat-label">Employés</div></div>
                    <div class="project-stat"><div class="project-stat-value">${p.duree_mois || 0}</div><div class="project-stat-label">Mois</div></div>
                </div>
                <div class="progress-section">
                    <div class="progress-header"><span>Budget: ${formatMoney(budget)}</span><span style="color:${pct>100?'var(--danger)':'inherit'}">${pct}%</span></div>
                    <div class="progress-bar"><div class="progress-fill ${progressClass}" style="width:${Math.min(pct,100)}%"></div></div>
                    <div class="progress-header" style="margin-top:5px"><span style="color:var(--accent2)">Dépensé: ${formatMoney(spent)}</span><span style="color:${reste<0?'var(--danger)':'var(--dim)'}">Reste: ${formatMoney(reste)}</span></div>
                </div>
            </div>
            <div class="project-footer"><span class="project-location">📍 ${p.localisation || '-'}</span><span class="project-arrow">→</span></div>
        </div>`;
    }).join('');
}

document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderProjects();
    });
});

loadData();
    </script>
    <script src="./atlas-nav.js"></script>
</body>
</html>
