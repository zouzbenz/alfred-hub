<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nos biens à Casablanca — Insta Immo</title>
    <meta name="description" content="Appartements, villas et biens d'exception à Casablanca : Anfa, Ain Diab, CFC, Bourgogne, Bouskoura. Insta Immo, votre spécialiste immobilier.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Insta Immo">
    <meta property="og:title" content="Nos biens à Casablanca — Insta Immo">
    <meta property="og:description" content="Appartements, villas et biens d'exception à Casablanca. Découvrez notre sélection.">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./immo-core.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <style>
        .hero-head{text-align:center;padding:34px 0 30px}
        .hero-head h1{font-size:clamp(1.7rem,4.5vw,2.5rem);font-weight:800}
        .hero-head h1 span{background:var(--accent);padding:0 10px;border-radius:10px}
        .hero-head p{color:var(--dim);font-size:1.05rem;margin-top:10px}
        .filters{display:flex;gap:8px;margin:26px 0 30px;flex-wrap:wrap;justify-content:center}
        .filter-btn{padding:9px 18px;background:var(--card);border:1.5px solid var(--border);border-radius:999px;
          cursor:pointer;font-size:.88rem;font-weight:600;transition:.15s;color:var(--text)}
        .filter-btn:hover{border-color:var(--accent)}
        .filter-btn.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
        .count-line{text-align:center;color:var(--dim);font-size:.88rem;margin-bottom:22px}
        .skeleton-card{height:330px}
    </style>
</head>
<body>
    <div class="container" style="max-width:1150px">
        <header class="brand-header" style="border-bottom:none;margin-bottom:0">
            <a class="brand" href="./immo-biens.html">
                <span class="brand-mark" aria-hidden="true">🏠</span>
                <span>Insta Immo<small>Casablanca</small></span>
            </a>
            <a href="https://wa.me/212687842466" class="btn btn-primary" style="min-height:40px;padding:9px 18px;font-size:.86rem" rel="noopener">💬 Nous contacter</a>
        </header>

        <div class="hero-head">
            <h1>Trouvez votre bien <span>d'exception</span></h1>
            <p>Notre sélection exclusive à Casablanca — Anfa, Ain Diab, CFC, Bourgogne, Bouskoura</p>
        </div>

        <div class="filters" id="filters" role="group" aria-label="Filtrer par zone"></div>
        <p class="count-line" id="count-line"></p>

        <main id="biens-grid" class="biens-grid" aria-live="polite">
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
        </main>

        <footer class="site-footer">
            <p>📞 <a href="tel:+212687842466" style="text-decoration:none"><strong>+212 687 842 466</strong></a> · <a href="https://wa.me/212687842466" rel="noopener">WhatsApp</a></p>
            <p style="margin-top:6px">© 2026 <strong>Insta Immo</strong> — Zouhair Benazzouz</p>
        </footer>
    </div>

    <script src="./immo-core.js"></script>
    <script>
let biens = [], heroPhotos = {}, currentZone = 'all';

async function loadBiens() {
    try {
        /* RLS : la clé anon ne voit que les biens publiés */
        const { data, error } = await db.from('immo_biens').select('*')
            .eq('publie', true).eq('statut', 'disponible')
            .order('created_at', { ascending: false });
        if (error) throw error;
        biens = data || [];

        /* Photos hero pour les vignettes */
        if (biens.length) {
            const { data: photos } = await db.from('immo_bien_photos')
                .select('bien_id,storage_path,ordre').eq('section', 'hero')
                .in('bien_id', biens.map(b => b.id)).order('ordre');
            (photos || []).forEach(p => { if (!heroPhotos[p.bien_id]) heroPhotos[p.bien_id] = p.storage_path; });
        }

        renderFilters();
        render();
    } catch (err) {
        console.error(err);
        document.getElementById('biens-grid').innerHTML =
            '<div class="state state-error" style="grid-column:1/-1"><p><strong>Chargement impossible</strong></p><p class="state-detail">Vérifiez votre connexion puis actualisez la page.</p></div>';
    }
}

function renderFilters() {
    /* Zones réellement présentes dans le catalogue + zones de référence */
    const zones = [...new Set(biens.map(b => b.zone))];
    const el = document.getElementById('filters');
    el.innerHTML = `<button class="filter-btn active" data-zone="all">Tous les biens</button>` +
        zones.map(z => `<button class="filter-btn" data-zone="${escAttr(z)}">${esc(ZONE_LABELS[z] || z)}</button>`).join('');
    el.querySelectorAll('.filter-btn').forEach(btn => btn.addEventListener('click', () => {
        el.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentZone = btn.dataset.zone;
        render();
    }));
}

function render() {
    const grid = document.getElementById('biens-grid');
    const filtered = currentZone === 'all' ? biens : biens.filter(b => b.zone === currentZone);

    document.getElementById('count-line').textContent = filtered.length
        ? `${filtered.length} bien${filtered.length > 1 ? 's' : ''} disponible${filtered.length > 1 ? 's' : ''}`
        : '';

    if (!filtered.length) {
        grid.innerHTML = `<div class="empty" style="grid-column:1/-1;padding:56px 20px">
            Aucun bien disponible ${currentZone !== 'all' ? 'dans cette zone' : ''} pour le moment.<br>
            <a href="${AGENCE.whatsapp}" rel="noopener" style="font-weight:700">Confiez-nous votre recherche →</a></div>`;
        return;
    }

    grid.innerHTML = filtered.map(b => {
        const img = heroPhotos[b.id];
        return `
        <a class="bien-card" href="./immo-bien.html?ref=${encodeURIComponent(b.reference)}">
            <div class="bien-img">${img
                ? `<img src="${escAttr(photoUrl(img))}" alt="${escAttr(b.titre)}" loading="lazy">`
                : '<span aria-hidden="true">🏠</span>'}</div>
            <div class="bien-body">
                <span class="ref-plate">${esc(b.reference)}</span>
                <div class="bien-title">${esc(b.titre)}</div>
                <div class="bien-location">📍 ${esc(ZONE_LABELS[b.zone] || b.zone)}${b.quartier ? ' · ' + esc(b.quartier) : ''}</div>
                <div class="bien-price">${formatMoney(b.prix)} <small>MAD${b.negociable ? ' · négociable' : ''}</small></div>
                <div class="bien-features">
                    <span>🏠 ${esc(TYPE_LABELS[b.type_bien] || b.type_bien)}</span>
                    ${b.surface_m2 ? `<span>📐 ${esc(b.surface_m2)} m²</span>` : ''}
                    ${b.chambres ? `<span>🛏️ ${esc(b.chambres)} ch.</span>` : ''}
                </div>
            </div>
        </a>`;
    }).join('');
}

loadBiens();
    </script>
</body>
</html>
