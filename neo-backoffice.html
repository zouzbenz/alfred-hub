<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Backoffice - Neo Projects</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#0d0d0d">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #161616;
            --accent-color: #e63946;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --border-color: #2a2a2a;
            --success: #2ecc71;
            --warning: #f39c12;
            --danger: #e74c3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 2px solid var(--accent-color);
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 800;
        }

        .header h1 span {
            color: var(--accent-color);
        }

        .header-links {
            display: flex;
            gap: 15px;
        }

        .header-links a {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.85rem;
            padding: 8px 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            transition: 0.2s;
        }

        .header-links a:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .header-links a.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: white;
        }

        /* Login Screen */
        .login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 60vh;
        }

        .login-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-box h2 {
            margin-bottom: 10px;
        }

        .login-box p {
            color: var(--text-dim);
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .login-box input {
            width: 100%;
            padding: 15px;
            background: #111;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            margin-bottom: 15px;
            text-align: center;
        }

        .login-box input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .login-box button {
            width: 100%;
            padding: 15px;
            background: var(--accent-color);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-box button:hover {
            opacity: 0.9;
        }

        .login-error {
            color: var(--danger);
            margin-top: 15px;
            font-size: 0.85rem;
        }

        /* Backoffice Content */
        .backoffice-content {
            display: none;
        }

        .backoffice-content.visible {
            display: block;
        }

        /* Action buttons */
        .action-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .add-btn, .export-btn {
            border: none;
            color: white;
            padding: 12px 25px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .add-btn {
            background: var(--accent-color);
        }

        .export-btn {
            background: var(--success);
        }

        .add-btn:hover, .export-btn:hover {
            opacity: 0.9;
        }

        /* Projects List */
        .projects-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .project-row {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .project-row-info {
            flex: 1;
            min-width: 200px;
        }

        .project-row-name {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .project-row-meta {
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .project-row-link {
            font-size: 0.75rem;
            color: var(--accent-color);
            word-break: break-all;
        }

        .project-row-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-edit {
            background: var(--warning);
            color: black;
        }

        .btn-delete {
            background: var(--danger);
            color: white;
        }

        .btn-copy {
            background: var(--border-color);
            color: white;
        }

        .btn:hover {
            opacity: 0.8;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.visible {
            display: flex;
        }

        .modal {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal h2 {
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            background: #111;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-size: 0.9rem;
        }

        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 500px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        .form-section {
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
            margin-top: 20px;
        }

        .form-section-title {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--accent-color);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
        }

        .btn-cancel {
            background: var(--border-color);
            color: white;
        }

        .btn-save {
            background: var(--success);
            color: white;
        }

        /* Image upload */
        .image-upload-container {
            border: 2px dashed var(--border-color);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .image-upload-container:hover {
            border-color: var(--accent-color);
        }

        .image-upload-container.has-image {
            padding: 10px;
        }

        .image-preview {
            max-width: 100%;
            max-height: 150px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .image-upload-text {
            color: var(--text-dim);
            font-size: 0.85rem;
        }

        .image-upload-container input[type="file"] {
            display: none;
        }

        /* Password display */
        .password-display {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .password-display input {
            flex: 1;
        }

        .generate-pwd-btn {
            padding: 12px 15px;
            background: var(--accent-color);
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 0.8rem;
        }

        /* Status badge */
        .status-badge {
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-en_cours { background: var(--accent-color); color: white; }
        .status-a_venir { background: var(--warning); color: black; }
        .status-complete { background: var(--success); color: white; }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-dim);
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: var(--text-dim);
            background: var(--card-bg);
            border-radius: 15px;
            border: 1px dashed var(--border-color);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--success);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 0.9rem;
            display: none;
            z-index: 2000;
        }

        .toast.visible {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Neo <span>Backoffice</span></h1>
            <div class="header-links">
                <a href="./index.html">Hub</a>
                <a href="./neo-projects.html">Projects</a>
                <a href="./neo-backoffice.html" class="active">Backoffice</a>
            </div>
        </header>

        <!-- Login Screen -->
        <div class="login-screen" id="login-screen">
            <div class="login-box">
                <h2>🔐 Accès Backoffice</h2>
                <p>Entrez le mot de passe pour accéder à l'administration</p>
                <input type="password" id="password-input" placeholder="Mot de passe" onkeypress="if(event.key==='Enter')checkPassword()">
                <button onclick="checkPassword()">Accéder</button>
                <div class="login-error" id="login-error"></div>
            </div>
        </div>

        <!-- Backoffice Content -->
        <div class="backoffice-content" id="backoffice-content">
            <div class="action-bar">
                <button class="add-btn" onclick="openModal()">+ Nouveau Projet</button>
                <button class="export-btn" onclick="exportToExcel()">📥 Exporter Excel</button>
            </div>
            
            <div class="projects-list" id="projects-list">
                <div class="loading">Chargement...</div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
        <div class="modal">
            <h2 id="modal-title">Nouveau Projet</h2>
            <form id="project-form" onsubmit="saveProject(event)">
                <input type="hidden" id="project-id">
                <input type="hidden" id="existing-image-path">
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Nom du projet *</label>
                        <input type="text" id="name" required>
                    </div>
                    <div class="form-group">
                        <label>Client</label>
                        <input type="text" id="client_name">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Date de début</label>
                        <input type="date" id="date_start">
                    </div>
                    <div class="form-group">
                        <label>Statut</label>
                        <select id="status">
                            <option value="a_venir">À venir</option>
                            <option value="en_cours">En cours</option>
                            <option value="complete">Complété</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea id="description"></textarea>
                </div>

                <div class="form-group">
                    <label>Image de couverture</label>
                    <div class="image-upload-container" id="image-upload-container" onclick="document.getElementById('cover-image').click()">
                        <img id="image-preview" class="image-preview" style="display: none;">
                        <div class="image-upload-text" id="image-upload-text">📷 Cliquez pour ajouter une image</div>
                        <input type="file" id="cover-image" accept="image/*" onchange="previewImage(this)">
                    </div>
                </div>

                <div class="form-group">
                    <label>🔐 Mot de passe client (pour accéder à la page projet)</label>
                    <div class="password-display">
                        <input type="text" id="project_password" placeholder="Ex: client2026">
                        <button type="button" class="generate-pwd-btn" onclick="generatePassword()">Générer</button>
                    </div>
                </div>

                <div class="form-section">
                    <div class="form-section-title">📸 Photos</div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Total prises</label>
                            <input type="number" id="total_photos" value="0" min="0">
                        </div>
                        <div class="form-group">
                            <label>Sélectionnées</label>
                            <input type="number" id="selected_photos" value="0" min="0">
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="form-section-title">🎨 Lightroom</div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Total</label>
                            <input type="number" id="lightroom_total" value="0" min="0">
                        </div>
                        <div class="form-group">
                            <label>Traitées</label>
                            <input type="number" id="lightroom_done" value="0" min="0">
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="form-section-title">✨ Photoshop</div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Total</label>
                            <input type="number" id="photoshop_total" value="0" min="0">
                        </div>
                        <div class="form-group">
                            <label>Traitées</label>
                            <input type="number" id="photoshop_done" value="0" min="0">
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="form-section-title">🎬 DaVinci</div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Reels prévus</label>
                            <input type="number" id="davinci_reels" value="0" min="0">
                        </div>
                        <div class="form-group">
                            <label>Rendus</label>
                            <input type="number" id="davinci_rendered" value="0" min="0">
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="form-section-title">📊 Statuts</div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Paiement (%)</label>
                            <input type="number" id="payment_percent" value="0" min="0" max="100">
                        </div>
                        <div class="form-group">
                            <label>Progression projet (%)</label>
                            <input type="number" id="project_percent" value="0" min="0" max="100">
                        </div>
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-cancel" onclick="closeModal()">Annuler</button>
                    <button type="submit" class="btn btn-save" id="save-btn">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">Lien copié !</div>

    <script>
        // Config
        const SUPABASE_URL = 'https://wxhlstificzqovfcumop.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aGxzdGlmaWN6cW92ZmN1bW9wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyNjcwOTAsImV4cCI6MjA4Njg0MzA5MH0.mt6v3SKPMhWpMw9PH7D8k3ubrR1kJNIFHw0aloLmQiQ';
        const PASSWORD = 'neo2026';
        
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let selectedImageFile = null;

        // Check if already logged in
        if (sessionStorage.getItem('neo-backoffice-auth') === 'true') {
            showBackoffice();
        }

        // Check password
        function checkPassword() {
            const input = document.getElementById('password-input').value;
            if (input === PASSWORD) {
                sessionStorage.setItem('neo-backoffice-auth', 'true');
                showBackoffice();
            } else {
                document.getElementById('login-error').textContent = 'Mot de passe incorrect';
            }
        }

        // Show backoffice
        function showBackoffice() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('backoffice-content').classList.add('visible');
            loadProjects();
        }

        // Generate random password
        function generatePassword() {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let pwd = '';
            for (let i = 0; i < 6; i++) {
                pwd += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('project_password').value = pwd;
        }

        // Preview image
        function previewImage(input) {
            if (input.files && input.files[0]) {
                selectedImageFile = input.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('image-preview');
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    document.getElementById('image-upload-text').textContent = 'Cliquez pour changer l\'image';
                    document.getElementById('image-upload-container').classList.add('has-image');
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        // Compress image
        async function compressImage(file) {
            return new Promise((resolve) => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const img = new Image();
                
                img.onload = function() {
                    // Max dimensions
                    const maxWidth = 800;
                    const maxHeight = 600;
                    
                    let width = img.width;
                    let height = img.height;
                    
                    if (width > maxWidth) {
                        height = (height * maxWidth) / width;
                        width = maxWidth;
                    }
                    if (height > maxHeight) {
                        width = (width * maxHeight) / height;
                        height = maxHeight;
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    canvas.toBlob((blob) => {
                        resolve(blob);
                    }, 'image/jpeg', 0.7);
                };
                
                img.src = URL.createObjectURL(file);
            });
        }

        // Upload image to Supabase Storage
        async function uploadImage(file, projectId) {
            const compressedBlob = await compressImage(file);
            const fileName = `project-${projectId}-${Date.now()}.jpg`;
            
            const { data, error } = await db.storage
                .from('project-covers')
                .upload(fileName, compressedBlob, {
                    contentType: 'image/jpeg',
                    upsert: true
                });
            
            if (error) {
                console.error('Upload error:', error);
                return null;
            }
            
            return fileName;
        }

        // Get public URL for image
        function getImageUrl(path) {
            if (!path) return null;
            const { data } = db.storage.from('project-covers').getPublicUrl(path);
            return data.publicUrl;
        }

        // Load projects
        async function loadProjects() {
            const { data, error } = await db
                .from('neo_projects')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Error:', error);
                return;
            }

            const container = document.getElementById('projects-list');
            
            if (data.length === 0) {
                container.innerHTML = '<div class="empty-state">Aucun projet. Cliquez sur "+ Nouveau Projet" pour commencer.</div>';
                return;
            }

            container.innerHTML = data.map(p => {
                const projectUrl = `${window.location.origin}/project.html?id=${p.id}`;
                return `
                <div class="project-row">
                    <div class="project-row-info">
                        <div class="project-row-name">${p.name}</div>
                        <div class="project-row-meta">
                            ${p.client_name || 'Pas de client'} • 
                            <span class="status-badge status-${p.status}">${p.status.replace('_', ' ')}</span>
                            ${p.password ? ' • 🔐 ' + p.password : ' • ⚠️ Pas de mot de passe'}
                        </div>
                        <div class="project-row-link">${projectUrl}</div>
                    </div>
                    <div class="project-row-actions">
                        <button class="btn btn-copy" onclick="copyLink('${projectUrl}')">📋 Copier</button>
                        <button class="btn btn-edit" onclick="editProject(${p.id})">Modifier</button>
                        <button class="btn btn-delete" onclick="deleteProject(${p.id}, '${p.name}')">Supprimer</button>
                    </div>
                </div>
            `}).join('');
        }

        // Copy link
        function copyLink(url) {
            navigator.clipboard.writeText(url);
            const toast = document.getElementById('toast');
            toast.classList.add('visible');
            setTimeout(() => toast.classList.remove('visible'), 2000);
        }

        // Open modal
        function openModal(project = null) {
            document.getElementById('modal-title').textContent = project ? 'Modifier Projet' : 'Nouveau Projet';
            document.getElementById('project-form').reset();
            document.getElementById('project-id').value = project ? project.id : '';
            document.getElementById('existing-image-path').value = '';
            selectedImageFile = null;
            
            // Reset image preview
            document.getElementById('image-preview').style.display = 'none';
            document.getElementById('image-upload-text').textContent = '📷 Cliquez pour ajouter une image';
            document.getElementById('image-upload-container').classList.remove('has-image');
            
            if (project) {
                document.getElementById('name').value = project.name || '';
                document.getElementById('client_name').value = project.client_name || '';
                document.getElementById('date_start').value = project.date_start || '';
                document.getElementById('status').value = project.status || 'a_venir';
                document.getElementById('description').value = project.description || '';
                document.getElementById('project_password').value = project.password || '';
                document.getElementById('total_photos').value = project.total_photos || 0;
                document.getElementById('selected_photos').value = project.selected_photos || 0;
                document.getElementById('lightroom_total').value = project.lightroom_total || 0;
                document.getElementById('lightroom_done').value = project.lightroom_done || 0;
                document.getElementById('photoshop_total').value = project.photoshop_total || 0;
                document.getElementById('photoshop_done').value = project.photoshop_done || 0;
                document.getElementById('davinci_reels').value = project.davinci_reels || 0;
                document.getElementById('davinci_rendered').value = project.davinci_rendered || 0;
                document.getElementById('payment_percent').value = project.payment_percent || 0;
                document.getElementById('project_percent').value = project.project_percent || 0;
                
                // Show existing image
                if (project.cover_image_path) {
                    document.getElementById('existing-image-path').value = project.cover_image_path;
                    const imgUrl = getImageUrl(project.cover_image_path);
                    document.getElementById('image-preview').src = imgUrl;
                    document.getElementById('image-preview').style.display = 'block';
                    document.getElementById('image-upload-text').textContent = 'Cliquez pour changer l\'image';
                    document.getElementById('image-upload-container').classList.add('has-image');
                }
            }
            
            document.getElementById('modal-overlay').classList.add('visible');
        }

        // Close modal
        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('visible');
            selectedImageFile = null;
        }

        // Edit project
        async function editProject(id) {
            const { data, error } = await db
                .from('neo_projects')
                .select('*')
                .eq('id', id)
                .single();
            
            if (data) {
                openModal(data);
            }
        }

        // Save project
        async function saveProject(e) {
            e.preventDefault();
            
            const saveBtn = document.getElementById('save-btn');
            saveBtn.textContent = 'Enregistrement...';
            saveBtn.disabled = true;
            
            const id = document.getElementById('project-id').value;
            const existingImagePath = document.getElementById('existing-image-path').value;
            
            const projectData = {
                name: document.getElementById('name').value,
                client_name: document.getElementById('client_name').value || null,
                date_start: document.getElementById('date_start').value || null,
                status: document.getElementById('status').value,
                description: document.getElementById('description').value || null,
                password: document.getElementById('project_password').value || null,
                total_photos: parseInt(document.getElementById('total_photos').value) || 0,
                selected_photos: parseInt(document.getElementById('selected_photos').value) || 0,
                lightroom_total: parseInt(document.getElementById('lightroom_total').value) || 0,
                lightroom_done: parseInt(document.getElementById('lightroom_done').value) || 0,
                photoshop_total: parseInt(document.getElementById('photoshop_total').value) || 0,
                photoshop_done: parseInt(document.getElementById('photoshop_done').value) || 0,
                davinci_reels: parseInt(document.getElementById('davinci_reels').value) || 0,
                davinci_rendered: parseInt(document.getElementById('davinci_rendered').value) || 0,
                payment_percent: parseInt(document.getElementById('payment_percent').value) || 0,
                project_percent: parseInt(document.getElementById('project_percent').value) || 0
            };

            let error;
            let projectId = id;
            
            if (id) {
                ({ error } = await db.from('neo_projects').update(projectData).eq('id', id));
            } else {
                const { data, error: insertError } = await db.from('neo_projects').insert([projectData]).select();
                error = insertError;
                if (data && data[0]) {
                    projectId = data[0].id;
                }
            }

            if (error) {
                alert('Erreur: ' + error.message);
                saveBtn.textContent = 'Enregistrer';
                saveBtn.disabled = false;
                return;
            }

            // Upload image if selected
            if (selectedImageFile && projectId) {
                const imagePath = await uploadImage(selectedImageFile, projectId);
                if (imagePath) {
                    await db.from('neo_projects').update({ cover_image_path: imagePath }).eq('id', projectId);
                }
            }

            saveBtn.textContent = 'Enregistrer';
            saveBtn.disabled = false;
            closeModal();
            loadProjects();
        }

        // Delete project
        async function deleteProject(id, name) {
            if (!confirm(`Supprimer le projet "${name}" ?`)) return;
            
            const { error } = await db.from('neo_projects').delete().eq('id', id);
            
            if (error) {
                alert('Erreur: ' + error.message);
                return;
            }
            
            loadProjects();
        }

        // Export to Excel
        async function exportToExcel() {
            const { data, error } = await db
                .from('neo_projects')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                alert('Erreur lors du chargement des données');
                return;
            }

            // Prepare data for Excel
            const excelData = data.map(p => ({
                'Nom': p.name,
                'Client': p.client_name || '',
                'Date début': p.date_start || '',
                'Statut': p.status,
                'Description': p.description || '',
                'Mot de passe': p.password || '',
                'Photos totales': p.total_photos,
                'Photos sélectionnées': p.selected_photos,
                'Lightroom total': p.lightroom_total,
                'Lightroom fait': p.lightroom_done,
                'Photoshop total': p.photoshop_total,
                'Photoshop fait': p.photoshop_done,
                'DaVinci reels': p.davinci_reels,
                'DaVinci rendus': p.davinci_rendered,
                'Paiement %': p.payment_percent,
                'Progression %': p.project_percent,
                'Créé le': new Date(p.created_at).toLocaleDateString('fr-FR')
            }));

            // Create workbook
            const ws = XLSX.utils.json_to_sheet(excelData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Projets');

            // Download
            XLSX.writeFile(wb, `neo-projects-${new Date().toISOString().split('T')[0]}.xlsx`);
        }

        // Real-time sync
        db.channel('neo_projects_backoffice')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'neo_projects' }, () => loadProjects())
            .subscribe();
    </script>
</body>
</html>
