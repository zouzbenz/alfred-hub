<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tâches - Atlas Pose</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <style>
        :root { 
            --bg:#0a0f1a; 
            --card:#111827; 
            --accent:#3b82f6; 
            --accent2:#10b981; 
            --text:#f3f4f6; 
            --dim:#9ca3af; 
            --border:#1f2937; 
            --danger:#ef4444; 
            --warn:#f59e0b; 
            --purple:#8b5cf6;
        }
        * { box-sizing:border-box; margin:0; padding:0; }
        body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; }
        .container { max-width:1400px; margin:0 auto; padding:15px; }
        
        .top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px; padding:12px; background:var(--card); border-radius:12px; border:1px solid var(--border); }
        .back-link { display:inline-flex; align-items:center; gap:6px; color:var(--accent); text-decoration:none; font-size:.85rem; padding:8px 12px; background:rgba(59,130,246,.1); border-radius:8px; }
        
        .header { text-align:center; padding:20px 15px 30px; }
        .header h1 { font-size:2rem; margin-bottom:8px; display:flex; align-items:center; justify-content:center; gap:10px; }
        .header p { color:var(--dim); font-size:1rem; }
        
        .stats-row { display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; margin-bottom:25px; }
        .stat-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:15px; text-align:center; }
        .stat-value { font-size:1.5rem; font-weight:800; }
        .stat-value.blue { color:var(--accent); }
        .stat-value.green { color:var(--accent2); }
        .stat-value.orange { color:var(--warn); }
        .stat-value.purple { color:var(--purple); }
        .stat-label { font-size:.75rem; color:var(--dim); margin-top:4px; }
        
        .filters { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; justify-content:center; }
        .filter-btn { padding:10px 18px; background:var(--card); border:1px solid var(--border); border-radius:25px; color:var(--text); cursor:pointer; font-size:.85rem; transition:.2s; }
        .filter-btn:hover, .filter-btn.active { background:var(--accent); border-color:var(--accent); }
        
        .search-box { width:100%; max-width:400px; margin:0 auto 20px; position:relative; }
        .search-box input { width:100%; padding:12px 15px; background:var(--card); border:1px solid var(--border); border-radius:25px; color:#fff; font-size:.9rem; }
        .search-box input:focus { outline:none; border-color:var(--accent); }
        
        .tasks-grid { display:grid; grid-template-columns:1fr; gap:15px; }
        
        .task-card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:18px; transition:.3s; }
        .task-card:hover { transform:translateY(-2px); box-shadow:0 5px 20px rgba(0,0,0,.3); border-color:var(--accent); }
        .task-card.completed { opacity:0.8; background:rgba(16,185,129,.05); border-color:rgba(16,185,129,.2); }
        
        .task-header { display:flex; align-items:flex-start; gap:12px; margin-bottom:12px; }
        .task-checkbox { margin-top:2px; width:20px; height:20px; accent-color:var(--accent2); cursor:pointer; }
        .task-info { flex:1; }
        .task-title { font-size:1.1rem; font-weight:700; margin-bottom:6px; }
        .task-project { display:inline-block; padding:3px 10px; background:rgba(59,130,246,.15); color:var(--accent); border-radius:15px; font-size:.75rem; font-weight:600; margin-bottom:8px; text-decoration:none; }
        .task-project:hover { background:rgba(59,130,246,.25); }
        .task-description { color:var(--dim); font-size:.85rem; margin-bottom:12px; line-height:1.4; }
        
        .task-meta { display:flex; flex-wrap:wrap; gap:15px; font-size:.75rem; color:var(--dim); }
        .task-created { display:flex; align-items:center; gap:4px; }
        .task-completed-info { display:flex; align-items:center; gap:4px; }
        .task-completed-info span { color:var(--accent2); }
        
        .priority-high { border-left:3px solid var(--danger); }
        .priority-medium { border-left:3px solid var(--warn); }
        .priority-low { border-left:3px solid var(--accent2); }
        
        .empty-state { text-align:center; padding:50px; color:var(--dim); }
        .loading { text-align:center; padding:50px; color:var(--dim); }
        
        .footer { text-align:center; padding:30px; color:var(--dim); font-size:.8rem; }
        .footer a { color:var(--accent); text-decoration:none; margin:0 8px; }
        
        @media(min-width:768px) { 
            .tasks-grid { grid-template-columns:repeat(2, 1fr); } 
            .stats-row { grid-template-columns:repeat(4, 1fr); } 
        }
        @media(min-width:1024px) { 
            .tasks-grid { grid-template-columns:repeat(3, 1fr); } 
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <a href="./atlas-projects.html" class="back-link">← Tous les projets</a>
            <a href="./" class="back-link">🏠 Alfred Hub</a>
        </div>
        
        <div class="header">
            <h1>📋 Tâches de tous les projets</h1>
            <p>Gestion centralisée des tâches</p>
        </div>
        
        <div class="stats-row">
            <div class="stat-card"><div class="stat-value blue" id="stat-total">0</div><div class="stat-label">Tâches totales</div></div>
            <div class="stat-card"><div class="stat-value green" id="stat-pending">0</div><div class="stat-label">En cours</div></div>
            <div class="stat-card"><div class="stat-value purple" id="stat-completed">0</div><div class="stat-label">Terminées</div></div>
            <div class="stat-card"><div class="stat-value orange" id="stat-projects">0</div><div class="stat-label">Projets actifs</div></div>
        </div>
        
        <div class="search-box">
            <input type="text" id="search-input" placeholder="🔍 Rechercher des tâches...">
        </div>
        
        <div class="filters">
            <button class="filter-btn active" data-filter="all">Toutes</button>
            <button class="filter-btn" data-filter="pending">En cours</button>
            <button class="filter-btn" data-filter="completed">Terminées</button>
            <button class="filter-btn" data-filter="high-priority">Haute priorité</button>
        </div>
        
        <div class="tasks-grid" id="tasks-grid">
            <div class="loading">Chargement des tâches...</div>
        </div>
        
        <div class="footer">
            <a href="./atlas-projects.html">Projets</a>
            <a href="./atlas-backoffice.html">Administration</a>
            <a href="./">Alfred Hub</a>
        </div>
    </div>
    
    <script>
const SUPABASE_URL = 'https://wxhlstificzqovfcumop.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aGxzdGlmaWN6cW92ZmN1bW9wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyNjcwOTAsImV4cCI6MjA4Njg0MzA5MH0.mt6v3SKPMhWpMw9PH7D8k3ubrR1kJNIFHw0aloLmQiQ';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let allTasks = [], allProjects = [], currentFilter = 'all', searchQuery = '';

async function loadData() {
    const [tasksRes, projectsRes] = await Promise.all([
        db.from('atlas_taches').select('*').order('created_at', { ascending: false }),
        db.from('atlas_projects').select('*')
    ]);
    
    allTasks = tasksRes.data || [];
    allProjects = projectsRes.data || [];
    
    renderStats();
    renderTasks();
}

function formatDateTime(d) {
    if (!d) return '-';
    const date = new Date(d);
    return date.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: '2-digit' }) + ' ' + date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}

function getProjectName(projectId) {
    const project = allProjects.find(p => p.id === projectId);
    return project ? project.name : 'Projet inconnu';
}

function renderStats() {
    const totalTasks = allTasks.length;
    const pendingTasks = allTasks.filter(t => !t.completed).length;
    const completedTasks = allTasks.filter(t => t.completed).length;
    const activeProjects = new Set(allTasks.map(t => t.project_id)).size;
    
    document.getElementById('stat-total').textContent = totalTasks;
    document.getElementById('stat-pending').textContent = pendingTasks;
    document.getElementById('stat-completed').textContent = completedTasks;
    document.getElementById('stat-projects').textContent = activeProjects;
}

function filterTasks(tasks) {
    let filtered = [...tasks];
    
    // Filtre de recherche
    if (searchQuery) {
        const query = searchQuery.toLowerCase();
        filtered = filtered.filter(task => 
            task.titre.toLowerCase().includes(query) || 
            (task.description && task.description.toLowerCase().includes(query))
        );
    }
    
    // Filtre par statut
    switch(currentFilter) {
        case 'pending':
            filtered = filtered.filter(t => !t.completed);
            break;
        case 'completed':
            filtered = filtered.filter(t => t.completed);
            break;
        case 'high-priority':
            // Pour l'instant, on considère toutes les tâches comme haute priorité
            // Vous pouvez ajouter un champ priority dans la base de données
            break;
    }
    
    return filtered;
}

function renderTasks() {
    const filteredTasks = filterTasks(allTasks);
    const grid = document.getElementById('tasks-grid');
    
    if (!filteredTasks.length) {
        grid.innerHTML = '<div class="empty-state">Aucune tâche trouvée</div>';
        return;
    }
    
    grid.innerHTML = filteredTasks.map(task => {
        const projectName = getProjectName(task.project_id);
        const project = allProjects.find(p => p.id === task.project_id);
        
        return `
        <div class="task-card ${task.completed ? 'completed' : ''}" data-task-id="${task.id}">
            <div class="task-header">
                <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${task.id}, this.checked)">
                <div class="task-info">
                    <div class="task-title">${task.titre}</div>
                    <a href="./atlas-project.html?id=${task.project_id}" class="task-project">${projectName}</a>
                </div>
            </div>
            ${task.description ? `<div class="task-description">${task.description}</div>` : ''}
            <div class="task-meta">
                <div class="task-created">📅 ${formatDateTime(task.created_at)}</div>
                ${task.completed && task.completed_at ? `
                    <div class="task-completed-info">✅ Terminée le ${formatDateTime(task.completed_at)} ${task.completed_by ? `par ${task.completed_by}` : ''}</div>
                ` : ''}
            </div>
        </div>`;
    }).join('');
}

async function toggleTask(taskId, completed) {
    const task = allTasks.find(t => t.id === taskId);
    if (!task) return;
    
    const updateData = {
        completed: completed,
        completed_at: completed ? new Date().toISOString() : null,
        completed_by: completed ? (sessionStorage.getItem('atlas-user') || 'Utilisateur') : null
    };
    
    try {
        await db.from('atlas_taches').update(updateData).eq('id', taskId);
        // Mettre à jour localement
        const taskIndex = allTasks.findIndex(t => t.id === taskId);
        if (taskIndex !== -1) {
            allTasks[taskIndex] = { ...allTasks[taskIndex], ...updateData };
        }
        renderStats();
        renderTasks();
    } catch (error) {
        console.error('Erreur:', error);
        // Rétablir l'état précédent
        const checkbox = document.querySelector(`[data-task-id="${taskId}"] .task-checkbox`);
        if (checkbox) checkbox.checked = !completed;
    }
}

// Event Listeners
document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderTasks();
    });
});

document.getElementById('search-input').addEventListener('input', (e) => {
    searchQuery = e.target.value.trim();
    renderTasks();
});

// Chargement initial
loadData();

// Auto-refresh toutes les 30 secondes
setInterval(loadData, 30000);
    </script>
</body>
</html>
