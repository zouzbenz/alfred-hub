<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Client — Insta Immo</title>
    <meta name="description" content="Espace client Insta Immo : vos critères de recherche, biens correspondants, visites et offres.">
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./immo-core.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <style>
        .criteres-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
        @media (max-width:640px){.criteres-grid{grid-template-columns:1fr}}
        .critere-box{background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);padding:18px}
        .critere-title{font-weight:700;margin-bottom:12px;font-size:.92rem}
        .critere-list{display:flex;flex-wrap:wrap;gap:7px}
        .budget-display{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
        @media (max-width:520px){.budget-display{grid-template-columns:1fr 1fr}}
        .budget-item{text-align:center;padding:15px 10px;background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm)}
        .budget-value{font-size:1.1rem;font-weight:800}
        .budget-label{font-size:.75rem;color:var(--dim);margin-top:3px}
        .match-card{position:relative;border:1.5px solid rgba(15,157,110,.4)}
        .match-score{position:absolute;top:12px;right:12px;background:var(--green);color:#fff;
          padding:4px 12px;border-radius:999px;font-weight:800;font-size:.8rem;z-index:2}
        .visite-card,.offre-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);padding:18px;margin-bottom:12px}
        .row-between{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
        .visite-date{font-weight:700}
        .visite-bien{font-size:.88rem;color:var(--dim);margin-top:2px}
        .feedback{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:.92rem}
        .feedback .label{font-size:.78rem;color:var(--dim);margin-bottom:3px}
        .offre-amount{font-size:1.2rem;font-weight:800}
        .offre-info{font-size:.88rem;color:var(--dim);margin-top:8px;line-height:1.6}
        .logout-link{background:none;border:none;color:var(--dim);font-size:.84rem;cursor:pointer;text-decoration:underline}
    </style>
</head>
<body>
    <div class="container">
        <header class="brand-header">
            <a class="brand" href="#" onclick="return false">
                <span class="brand-mark" aria-hidden="true">🏠</span>
                <span>Insta Immo<small>Espace client</small></span>
            </a>
            <button class="logout-link" id="logout-btn" onclick="logout()" hidden>Se déconnecter</button>
        </header>

        <div id="login-screen">
            <div class="login-wrap">
                <form class="login-box" onsubmit="event.preventDefault();login();">
                    <div class="login-icon" aria-hidden="true">🔑</div>
                    <h2>Accès client</h2>
                    <p class="login-sub">Entrez le code d'accès transmis par votre agent</p>
                    <label for="login-code" class="sr-only" style="position:absolute;left:-9999px">Code d'accès</label>
                    <input type="text" id="login-code" class="input" placeholder="Votre code d'accès"
                        autocomplete="off" autocapitalize="none" spellcheck="false" style="text-align:center;margin-bottom:14px">
                    <button type="submit" class="btn btn-primary btn-block" id="login-btn">Accéder à mon espace</button>
                    <p class="login-error" id="login-error" role="alert"></p>
                </form>
            </div>
        </div>

        <main id="main-app" style="display:none" aria-live="polite"></main>

        <footer class="site-footer">
            <p><strong>Insta Immo</strong> — Zouhair Benazzouz · Casablanca</p>
        </footer>
    </div>

    <script src="./immo-core.js"></script>
    <script>
let portal = null; // { client, visites:[{visite,bien}], offres:[{offre,bien}], biens_disponibles:[] }
let currentCode = null;

async function login(codeParam) {
    const input = document.getElementById('login-code');
    const code = (codeParam || input.value || '').trim();
    const errEl = document.getElementById('login-error');
    if (!code) { errEl.textContent = 'Entrez votre code d\'accès.'; return; }

    const btn = document.getElementById('login-btn');
    btn.disabled = true; btn.textContent = 'Vérification…'; errEl.textContent = '';

    try {
        const { data, error } = await db.rpc('immo_client_portal', { p_code: code });
        if (error) throw error;
        if (!data) { errEl.textContent = 'Code invalide. Vérifiez le code transmis par votre agent.'; return; }

        portal = data;
        currentCode = code;
        sessionStorage.setItem('immo_client_code', code);
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        document.getElementById('logout-btn').hidden = false;
        render();
    } catch (err) {
        console.error(err);
        errEl.textContent = 'Connexion impossible pour le moment. Réessayez dans un instant.';
    } finally {
        btn.disabled = false; btn.textContent = 'Accéder à mon espace';
    }
}

function logout() {
    sessionStorage.removeItem('immo_client_code');
    location.href = location.pathname; // retire aussi ?code= de l'URL
}

/* ---- Matching : croise critères client et biens publiés ---- */
function calculateMatching() {
    const client = portal.client;
    return (portal.biens_disponibles || []).map(bien => {
        let score = 0;
        if (client.types_souhaites?.length) {
            if (client.types_souhaites.includes(bien.type_bien)) score += 20;
            else return { bien, score: 0, eliminated: true };
        }
        if (client.zones_souhaitees?.length) {
            if (client.zones_souhaitees.includes(bien.zone)) score += 20;
            else return { bien, score: 0, eliminated: true };
        }
        const prix = parseFloat(bien.prix);
        const bMin = parseFloat(client.budget_min) || 0;
        const bMax = parseFloat(client.budget_max) || Infinity;
        if (prix >= bMin && prix <= bMax) score += 20;
        else if (prix >= bMin * 0.85 && prix <= bMax * 1.15) score += 10;
        else return { bien, score: 0, eliminated: true };

        if ((bien.surface_m2 || 0) >= (client.surface_min || 0)) score += 10;
        if ((bien.chambres || 0) >= (client.chambres_min || 0)) score += 10;

        if (client.elim_rdc && bien.etage === 0) return { bien, score: 0, eliminated: true };
        if (client.elim_pas_ascenseur && !bien.ascenseur) return { bien, score: 0, eliminated: true };
        if (client.elim_pas_garage && !(bien.parking > 0)) return { bien, score: 0, eliminated: true };

        if (client.crit_ascenseur) score += bien.ascenseur ? 5 : -15;
        if (client.crit_parking) score += bien.parking > 0 ? 5 : -15;
        if (client.crit_terrasse) score += (bien.terrasse_m2 > 0 || bien.balcon) ? 5 : -15;

        return { bien, score: Math.max(0, Math.min(100, score)), eliminated: false };
    }).filter(m => !m.eliminated && m.score >= 50).sort((a, b) => b.score - a.score);
}

function bienCardHTML(bien, extra) {
    return `
    <a class="bien-card ${extra?.match ? 'match-card' : ''}" href="./immo-bien.html?ref=${encodeURIComponent(bien.reference)}">
        ${extra?.score !== undefined ? `<span class="match-score">${extra.score}%</span>` : ''}
        <div class="bien-body">
            <span class="ref-plate">${esc(bien.reference)}</span>
            <div class="bien-title">${esc(bien.titre)}</div>
            <div class="bien-location">📍 ${esc(ZONE_LABELS[bien.zone] || bien.zone)}${bien.quartier ? ' · ' + esc(bien.quartier) : ''}</div>
            <div class="bien-price">${formatMoney(bien.prix)} <small>MAD</small></div>
            <div class="bien-features">
                ${bien.surface_m2 ? `<span>📐 ${esc(bien.surface_m2)} m²</span>` : ''}
                ${bien.chambres ? `<span>🛏️ ${esc(bien.chambres)} ch.</span>` : ''}
                ${bien.ascenseur ? `<span>✓ Ascenseur</span>` : ''}
            </div>
        </div>
    </a>`;
}

function render() {
    const client = portal.client;
    const matching = calculateMatching();
    const visites = portal.visites || [];
    const offres = portal.offres || [];

    const critOblig = [
        client.crit_ascenseur && 'Ascenseur', client.crit_parking && 'Parking',
        client.crit_terrasse && 'Terrasse', client.crit_vue_mer && 'Vue mer',
        client.crit_etage_eleve && 'Étage élevé', client.crit_etage_bas && 'Étage bas',
        client.crit_immeuble_recent && 'Immeuble récent', client.crit_cuisine_equipee && 'Cuisine équipée',
        client.crit_double_exposition && 'Double exposition', client.crit_chambre_personnel && 'Chambre personnel',
        client.crit_autres
    ].filter(Boolean);

    const critElim = [
        client.elim_rdc && 'Pas de RDC', client.elim_dernier_etage && 'Pas de dernier étage',
        client.elim_vis_a_vis && 'Pas de vis-à-vis', client.elim_proche_mosquee && 'Pas proche mosquée',
        client.elim_travaux && 'Pas de travaux', client.elim_syndic_defaillant && 'Syndic fiable exigé',
        client.elim_pas_garage && 'Garage obligatoire', client.elim_pas_ascenseur && 'Ascenseur obligatoire',
        client.elim_pas_soleil && 'Ensoleillement exigé', client.elim_entree_vieille && 'Entrée récente exigée',
        client.elim_autres
    ].filter(Boolean);

    const tags = (list, cls, fallback) => list.length
        ? list.map(c => `<span class="badge ${cls}">${esc(c)}</span>`).join('')
        : `<span class="badge">${fallback}</span>`;

    const visitesHTML = visites.length ? visites.map(({ visite: v, bien }) => `
        <div class="visite-card">
            <div class="row-between">
                <div>
                    <div class="visite-date">${formatDate(v.date_visite)}</div>
                    <div class="visite-bien">${bien ? `${esc(bien.reference)} · ${esc(bien.titre)}` : 'Bien retiré du catalogue'}</div>
                </div>
                ${v.type_visite ? `<span class="badge badge-blue">${esc(String(v.type_visite).replace(/_/g, ' '))}</span>` : ''}
            </div>
            ${v.interet ? `<div class="feedback"><div class="label">Votre avis</div><strong>${esc(INTERET_LABELS[v.interet] || v.interet)}</strong></div>` : ''}
            ${v.commentaire ? `<p style="margin-top:8px;font-size:.9rem;color:var(--dim)">${escMultiline(v.commentaire)}</p>` : ''}
        </div>`).join('') : '<div class="empty">Aucune visite pour le moment — votre agent vous proposera des créneaux dès qu\'un bien correspondra.</div>';

    const offresHTML = offres.length ? offres.map(({ offre: o, bien }) => {
        const [label, color] = STATUT_OFFRE[o.statut] || ['En attente', 'orange'];
        return `
        <div class="offre-card">
            <div class="row-between">
                <div class="offre-amount">${formatMoney(o.montant)} <small style="font-size:.65em;color:var(--dim)">MAD</small></div>
                <span class="badge badge-${color}">${esc(label)}</span>
            </div>
            <div class="offre-info">
                ${bien ? `${esc(bien.reference)} · ${esc(bien.titre)}` : 'Bien retiré du catalogue'}<br>
                Déposée le ${formatDate(o.date_offre)}
                ${o.contre_offre_montant ? `<br><strong style="color:var(--text)">Contre-offre : ${formatMoney(o.contre_offre_montant)} MAD</strong>` : ''}
            </div>
        </div>`;
    }).join('') : '<div class="empty">Aucune offre déposée pour le moment.</div>';

    document.getElementById('main-app').innerHTML = `
        <div class="welcome">
            <h2>Bonjour ${esc(client.prenom || client.nom)} 👋</h2>
            <p>Vos critères, vos visites et vos offres — mis à jour en temps réel</p>
        </div>

        <section class="section card">
            <h3 class="section-title">🎯 Vos critères de recherche</h3>
            <div class="criteres-grid">
                <div class="critere-box"><div class="critere-title">🏠 Types recherchés</div>
                    <div class="critere-list">${tags((client.types_souhaites || []).map(t => TYPE_LABELS[t] || t), '', 'Tous types')}</div></div>
                <div class="critere-box"><div class="critere-title">📍 Zones</div>
                    <div class="critere-list">${tags((client.zones_souhaitees || []).map(z => ZONE_LABELS[z] || z), '', 'Toutes zones')}</div></div>
                <div class="critere-box"><div class="critere-title">✅ Indispensables</div>
                    <div class="critere-list">${tags(critOblig, 'badge-green', 'Aucun')}</div></div>
                <div class="critere-box"><div class="critere-title">❌ À éviter</div>
                    <div class="critere-list">${tags(critElim, 'badge-red', 'Aucun')}</div></div>
            </div>
            <div class="budget-display">
                <div class="budget-item"><div class="budget-value">${client.budget_min ? formatMoney(client.budget_min) : '—'}</div><div class="budget-label">Budget min (MAD)</div></div>
                <div class="budget-item"><div class="budget-value">${client.budget_max ? formatMoney(client.budget_max) : '—'}</div><div class="budget-label">Budget max (MAD)</div></div>
                <div class="budget-item"><div class="budget-value">${esc(client.chambres_min || '—')}</div><div class="budget-label">Chambres min</div></div>
            </div>
        </section>

        <section class="section">
            <h3 class="section-title">💡 Biens correspondants <span class="badge">${matching.length}</span></h3>
            ${matching.length
                ? `<div class="biens-grid">${matching.slice(0, 6).map(m => bienCardHTML(m.bien, { match: true, score: m.score })).join('')}</div>`
                : '<div class="empty">Aucun bien ne correspond à vos critères pour le moment. Nous vous alertons dès qu\'une opportunité arrive.</div>'}
        </section>

        <section class="section">
            <h3 class="section-title">📅 Vos visites <span class="badge">${visites.length}</span></h3>
            ${visitesHTML}
        </section>

        <section class="section">
            <h3 class="section-title">💰 Vos offres <span class="badge">${offres.length}</span></h3>
            ${offresHTML}
        </section>

        <div class="contact-box">
            <h3>Besoin d'aide ?</h3>
            <p>Votre agent vous répond rapidement, 7j/7</p>
            <div class="contact-actions">
                <a href="${AGENCE.whatsapp}" class="btn btn-primary" rel="noopener">💬 WhatsApp</a>
                <a href="tel:${AGENCE.tel}" class="btn btn-outline" style="border-color:rgba(255,255,255,.3);color:#fff">📞 Appeler</a>
            </div>
        </div>`;
}

/* Connexion automatique : code dans l'URL (lien envoyé) ou session en cours */
const urlCode = new URLSearchParams(location.search).get('code');
const savedCode = sessionStorage.getItem('immo_client_code');
if (urlCode || savedCode) {
    document.getElementById('login-code').value = urlCode || savedCode;
    login(urlCode || savedCode);
}
    </script>
</body>
</html>
