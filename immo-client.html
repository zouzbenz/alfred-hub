<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insta Immo - Espace Client</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <style>
        :root{--bg:#fff;--card:#f8f9fa;--border:#e0e0e0;--text:#1a1a1a;--dim:#666;--accent:#FFC107;--green:#10b981;--red:#ef4444;--orange:#f59e0b;--blue:#3b82f6;}
        *{box-sizing:border-box;margin:0;padding:0;}
        body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
        .container{max-width:900px;margin:0 auto;padding:20px;}
        .header{text-align:center;padding:30px 0;border-bottom:1px solid var(--border);margin-bottom:30px;}
        .header h1{font-size:1.8rem;font-weight:800;margin-bottom:5px;}
        .header h1 span{color:var(--accent);}
        .header p{color:var(--dim);}
        .login-box{max-width:400px;margin:80px auto;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:40px;text-align:center;}
        .login-box h2{margin-bottom:20px;}
        .login-box input{width:100%;padding:15px;margin-bottom:15px;border:1px solid var(--border);border-radius:10px;font-size:1rem;}
        .login-box button{width:100%;padding:15px;background:var(--accent);border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;}
        .login-error{color:var(--red);margin-top:10px;font-size:.9rem;}
        .welcome{background:linear-gradient(135deg,var(--accent),#FFD54F);border-radius:16px;padding:30px;margin-bottom:30px;color:#000;}
        .welcome h2{font-size:1.5rem;margin-bottom:10px;}
        .welcome p{opacity:.8;}
        .section{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:25px;margin-bottom:20px;}
        .section-title{font-size:1.2rem;font-weight:700;margin-bottom:20px;display:flex;align-items:center;gap:10px;}
        .criteres-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;}
        @media(max-width:600px){.criteres-grid{grid-template-columns:1fr;}}
        .critere-box{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;}
        .critere-title{font-weight:600;margin-bottom:15px;display:flex;align-items:center;gap:8px;}
        .critere-list{display:flex;flex-wrap:wrap;gap:8px;}
        .critere-tag{padding:6px 12px;background:var(--card);border-radius:6px;font-size:.85rem;}
        .critere-tag.green{background:rgba(16,185,129,.15);color:var(--green);}
        .critere-tag.red{background:rgba(239,68,68,.15);color:var(--red);}
        .budget-display{display:flex;gap:20px;margin-top:15px;}
        .budget-item{flex:1;text-align:center;padding:15px;background:#fff;border:1px solid var(--border);border-radius:10px;}
        .budget-value{font-size:1.3rem;font-weight:800;color:var(--accent);}
        .budget-label{font-size:.8rem;color:var(--dim);}
        .biens-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px;}
        .bien-card{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:.2s;}
        .bien-card:hover{box-shadow:0 5px 20px rgba(0,0,0,.1);}
        .bien-img{height:150px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:3rem;color:var(--dim);}
        .bien-body{padding:15px;}
        .bien-ref{display:inline-block;background:var(--accent);color:#000;padding:3px 8px;border-radius:5px;font-size:.7rem;font-weight:700;margin-bottom:8px;}
        .bien-title{font-weight:600;margin-bottom:5px;}
        .bien-location{font-size:.85rem;color:var(--dim);margin-bottom:10px;}
        .bien-price{font-size:1.2rem;font-weight:800;color:var(--accent);}
        .bien-features{display:flex;gap:10px;margin-top:10px;font-size:.8rem;color:var(--dim);}
        .visite-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:15px;}
        .visite-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;}
        .visite-date{font-weight:600;}
        .visite-bien{font-size:.9rem;color:var(--dim);}
        .visite-feedback{margin-top:15px;padding-top:15px;border-top:1px solid var(--border);}
        .feedback-label{font-size:.85rem;color:var(--dim);margin-bottom:5px;}
        .feedback-value{font-weight:600;display:flex;align-items:center;gap:8px;}
        .badge{padding:4px 10px;border-radius:6px;font-size:.75rem;font-weight:600;}
        .badge-green{background:rgba(16,185,129,.15);color:var(--green);}
        .badge-orange{background:rgba(245,158,11,.15);color:var(--orange);}
        .badge-blue{background:rgba(59,130,246,.15);color:var(--blue);}
        .badge-red{background:rgba(239,68,68,.15);color:var(--red);}
        .offre-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:15px;}
        .offre-header{display:flex;justify-content:space-between;align-items:center;}
        .offre-amount{font-size:1.3rem;font-weight:800;color:var(--accent);}
        .offre-info{font-size:.9rem;color:var(--dim);margin-top:10px;}
        .empty{text-align:center;padding:30px;color:var(--dim);}
        .contact-box{background:linear-gradient(135deg,#1a1a1a,#333);border-radius:16px;padding:30px;color:#fff;text-align:center;margin-top:30px;}
        .contact-title{font-size:1.3rem;font-weight:700;margin-bottom:15px;}
        .contact-btn{display:inline-block;padding:15px 30px;background:var(--accent);color:#000;border-radius:10px;text-decoration:none;font-weight:600;margin:5px;}
        .matching-section{margin-top:20px;}
        .match-card{background:#fff;border:2px solid var(--green);border-radius:12px;padding:20px;margin-bottom:15px;position:relative;}
        .match-score{position:absolute;top:-10px;right:20px;background:var(--green);color:#fff;padding:5px 15px;border-radius:20px;font-weight:700;font-size:.9rem;}
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🏠 Insta <span>Immo</span></h1>
            <p>Espace Client</p>
        </header>
        
        <div id="login-screen">
            <div class="login-box">
                <h2>🔑 Accès Client</h2>
                <input type="text" id="login-code" placeholder="Votre code d'accès">
                <button onclick="login()">Accéder</button>
                <div class="login-error" id="login-error"></div>
            </div>
        </div>
        
        <div id="main-app" style="display:none;"></div>
    </div>
    
    <script>
const SUPABASE_URL='https://wxhlstificzqovfcumop.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aGxzdGlmaWN6cW92ZmN1bW9wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyNjcwOTAsImV4cCI6MjA4Njg0MzA5MH0.mt6v3SKPMhWpMw9PH7D8k3ubrR1kJNIFHw0aloLmQiQ';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const params=new URLSearchParams(window.location.search);
const urlId=params.get('id');
const urlCode=params.get('code');

let client=null,visites=[],offres=[],biens=[],matchingBiens=[];

const TYPE_LABELS={studio:'Studio',appartement:'Appartement',villa:'Villa',terrain:'Terrain',local_commercial:'Local commercial',bureau:'Bureau'};
const ZONE_LABELS={anfa:'Anfa',ain_diab:'Ain Diab',cfc:'CFC',bourgogne:'Bourgogne',bouskoura:'Bouskoura'};
const INTERET_LABELS={tres_interesse:'🔥 Très intéressé',interesse:'👍 Intéressé',bof:'😐 Bof',pas_interesse:'👎 Pas intéressé'};

async function login(){
    const code=document.getElementById('login-code').value.toLowerCase().trim();
    if(!code){document.getElementById('login-error').textContent='Entrez votre code';return;}
    
    const{data}=await db.from('immo_clients').select('*').eq('code_acces',code).single();
    if(data){
        client=data;
        document.getElementById('login-screen').style.display='none';
        document.getElementById('main-app').style.display='block';
        await loadData();
    }else{
        document.getElementById('login-error').textContent='Code invalide';
    }
}

async function loadData(){
    const[visitesR,offresR,biensR]=await Promise.all([
        db.from('immo_visites').select('*,immo_biens(*)').eq('client_id',client.id).order('date_visite',{ascending:false}),
        db.from('immo_offres').select('*,immo_biens(reference,titre,prix)').eq('client_id',client.id).order('date_offre',{ascending:false}),
        db.from('immo_biens').select('*').eq('publie',true).eq('statut','disponible')
    ]);
    
    visites=visitesR.data||[];
    offres=offresR.data||[];
    biens=biensR.data||[];
    
    // Calculate matching
    matchingBiens=calculateMatching();
    
    render();
}

function calculateMatching(){
    return biens.map(bien=>{
        let score=0;
        let eliminated=false;
        
        // Type match
        if(client.types_souhaites?.length){
            if(client.types_souhaites.includes(bien.type_bien))score+=20;
            else return{bien,score:0,eliminated:true};
        }
        
        // Zone match
        if(client.zones_souhaitees?.length){
            if(client.zones_souhaitees.includes(bien.zone))score+=20;
            else return{bien,score:0,eliminated:true};
        }
        
        // Budget match
        const prix=parseFloat(bien.prix);
        const budgetMin=parseFloat(client.budget_min)||0;
        const budgetMax=parseFloat(client.budget_max)||Infinity;
        if(prix>=budgetMin&&prix<=budgetMax)score+=20;
        else if(prix>=budgetMin*0.85&&prix<=budgetMax*1.15)score+=10;
        else return{bien,score:0,eliminated:true};
        
        // Surface
        if(bien.surface_m2>=(client.surface_min||0))score+=10;
        
        // Chambres
        if(bien.chambres>=(client.chambres_min||0))score+=10;
        
        // Critères éliminatoires
        if(client.elim_rdc&&bien.etage===0)return{bien,score:0,eliminated:true};
        if(client.elim_pas_ascenseur&&!bien.ascenseur)return{bien,score:0,eliminated:true};
        if(client.elim_pas_garage&&bien.parking===0)return{bien,score:0,eliminated:true};
        
        // Critères obligatoires
        if(client.crit_ascenseur)score+=bien.ascenseur?5:-15;
        if(client.crit_parking)score+=bien.parking>0?5:-15;
        if(client.crit_terrasse)score+=(bien.terrasse_m2>0||bien.balcon)?5:-15;
        
        return{bien,score:Math.max(0,Math.min(100,score)),eliminated:false};
    }).filter(m=>!m.eliminated&&m.score>=50).sort((a,b)=>b.score-a.score);
}

function formatMoney(n){return new Intl.NumberFormat('fr-MA').format(n||0);}
function formatDate(d){return d?new Date(d).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'}):'-';}

function render(){
    const app=document.getElementById('main-app');
    
    // Critères obligatoires
    const critOblig=[];
    if(client.crit_ascenseur)critOblig.push('Ascenseur');
    if(client.crit_parking)critOblig.push('Parking');
    if(client.crit_terrasse)critOblig.push('Terrasse');
    if(client.crit_vue_mer)critOblig.push('Vue mer');
    if(client.crit_etage_eleve)critOblig.push('Étage élevé');
    if(client.crit_etage_bas)critOblig.push('Étage bas');
    if(client.crit_immeuble_recent)critOblig.push('Immeuble récent');
    if(client.crit_cuisine_equipee)critOblig.push('Cuisine équipée');
    if(client.crit_double_exposition)critOblig.push('Double exposition');
    if(client.crit_chambre_personnel)critOblig.push('Ch. personnel');
    if(client.crit_autres)critOblig.push(client.crit_autres);
    
    // Critères éliminatoires
    const critElim=[];
    if(client.elim_rdc)critElim.push('Pas de RDC');
    if(client.elim_dernier_etage)critElim.push('Pas dernier étage');
    if(client.elim_vis_a_vis)critElim.push('Pas vis-à-vis');
    if(client.elim_proche_mosquee)critElim.push('Pas proche mosquée');
    if(client.elim_travaux)critElim.push('Pas de travaux');
    if(client.elim_syndic_defaillant)critElim.push('Pas syndic défaillant');
    if(client.elim_pas_garage)critElim.push('Garage obligatoire');
    if(client.elim_pas_ascenseur)critElim.push('Ascenseur obligatoire');
    if(client.elim_pas_soleil)critElim.push('Soleil obligatoire');
    if(client.elim_entree_vieille)critElim.push('Pas entrée vieille');
    if(client.elim_autres)critElim.push(client.elim_autres);
    
    // Matching biens HTML
    const matchingHTML=matchingBiens.length?matchingBiens.slice(0,6).map(m=>`
        <div class="match-card">
            <div class="match-score">${m.score}%</div>
            <span class="bien-ref">${m.bien.reference}</span>
            <h4 class="bien-title">${m.bien.titre}</h4>
            <p class="bien-location">📍 ${ZONE_LABELS[m.bien.zone]}</p>
            <div class="bien-price">${formatMoney(m.bien.prix)} MAD</div>
            <div class="bien-features">
                ${m.bien.surface_m2?`<span>📐 ${m.bien.surface_m2}m²</span>`:''}
                ${m.bien.chambres?`<span>🛏️ ${m.bien.chambres}ch</span>`:''}
            </div>
            <a href="./immo-bien.html?ref=${m.bien.reference}" style="display:inline-block;margin-top:15px;padding:10px 20px;background:var(--accent);color:#000;border-radius:8px;text-decoration:none;font-weight:600;">Voir le bien →</a>
        </div>
    `).join(''):'<div class="empty">Aucun bien correspondant pour le moment</div>';
    
    // Visites HTML
    const visitesHTML=visites.length?visites.map(v=>{
        const bien=v.immo_biens||{};
        return`
            <div class="visite-card">
                <div class="visite-header">
                    <div>
                        <div class="visite-date">${formatDate(v.date_visite)}</div>
                        <div class="visite-bien">${bien.reference} - ${bien.titre}</div>
                    </div>
                    <span class="badge badge-blue">${(v.type_visite||'').replace('_',' ')}</span>
                </div>
                ${v.interet?`
                <div class="visite-feedback">
                    <div class="feedback-label">Votre avis</div>
                    <div class="feedback-value">${INTERET_LABELS[v.interet]||v.interet}</div>
                </div>
                `:''}
                ${v.commentaire?`<p style="margin-top:10px;font-size:.9rem;color:var(--dim);">${v.commentaire}</p>`:''}
            </div>
        `;
    }).join(''):'<div class="empty">Aucune visite effectuée</div>';
    
    // Offres HTML
    const offresHTML=offres.length?offres.map(o=>{
        const bien=o.immo_biens||{};
        const statColors={en_attente:'badge-orange',acceptee:'badge-green',refusee:'badge-red',contre_offre:'badge-blue'};
        return`
            <div class="offre-card">
                <div class="offre-header">
                    <div class="offre-amount">${formatMoney(o.montant)} MAD</div>
                    <span class="badge ${statColors[o.statut]||'badge-orange'}">${o.statut.replace('_',' ')}</span>
                </div>
                <div class="offre-info">
                    ${bien.reference} - ${bien.titre}<br>
                    Déposée le ${formatDate(o.date_offre)}
                    ${o.contre_offre_montant?`<br><strong>Contre-offre: ${formatMoney(o.contre_offre_montant)} MAD</strong>`:''}
                </div>
            </div>
        `;
    }).join(''):'<div class="empty">Aucune offre déposée</div>';
    
    app.innerHTML=`
        <div class="welcome">
            <h2>Bonjour ${client.prenom||client.nom} 👋</h2>
            <p>Retrouvez vos critères de recherche et suivez vos visites</p>
        </div>
        
        <div class="section">
            <h3 class="section-title">🎯 Vos critères de recherche</h3>
            <div class="criteres-grid">
                <div class="critere-box">
                    <div class="critere-title">🏠 Types recherchés</div>
                    <div class="critere-list">
                        ${(client.types_souhaites||[]).map(t=>`<span class="critere-tag">${TYPE_LABELS[t]||t}</span>`).join('')||'<span class="critere-tag">Tous types</span>'}
                    </div>
                </div>
                <div class="critere-box">
                    <div class="critere-title">📍 Zones</div>
                    <div class="critere-list">
                        ${(client.zones_souhaitees||[]).map(z=>`<span class="critere-tag">${ZONE_LABELS[z]||z}</span>`).join('')||'<span class="critere-tag">Toutes zones</span>'}
                    </div>
                </div>
                <div class="critere-box">
                    <div class="critere-title">✅ Critères obligatoires</div>
                    <div class="critere-list">
                        ${critOblig.map(c=>`<span class="critere-tag green">${c}</span>`).join('')||'<span class="critere-tag">Aucun</span>'}
                    </div>
                </div>
                <div class="critere-box">
                    <div class="critere-title">❌ À éviter</div>
                    <div class="critere-list">
                        ${critElim.map(c=>`<span class="critere-tag red">${c}</span>`).join('')||'<span class="critere-tag">Aucun</span>'}
                    </div>
                </div>
            </div>
            <div class="budget-display">
                <div class="budget-item">
                    <div class="budget-value">${client.budget_min?formatMoney(client.budget_min)+' MAD':'Non défini'}</div>
                    <div class="budget-label">Budget minimum</div>
                </div>
                <div class="budget-item">
                    <div class="budget-value">${client.budget_max?formatMoney(client.budget_max)+' MAD':'Non défini'}</div>
                    <div class="budget-label">Budget maximum</div>
                </div>
                <div class="budget-item">
                    <div class="budget-value">${client.chambres_min||'-'}</div>
                    <div class="budget-label">Chambres min</div>
                </div>
            </div>
        </div>
        
        <div class="section matching-section">
            <h3 class="section-title">💡 Biens correspondants (${matchingBiens.length})</h3>
            <div class="biens-grid">${matchingHTML}</div>
        </div>
        
        <div class="section">
            <h3 class="section-title">📅 Vos visites (${visites.length})</h3>
            ${visitesHTML}
        </div>
        
        <div class="section">
            <h3 class="section-title">💰 Vos offres (${offres.length})</h3>
            ${offresHTML}
        </div>
        
        <div class="contact-box">
            <h3 class="contact-title">Besoin d'aide ?</h3>
            <a href="https://wa.me/212687842466" class="contact-btn">💬 WhatsApp</a>
            <a href="tel:+212687842466" class="contact-btn">📞 Appeler</a>
        </div>
    `;
}

// Auto-login if code in URL
if(urlCode){
    document.getElementById('login-code').value=urlCode;
    login();
}
    </script>
</body>
</html>
