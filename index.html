<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alfred Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#0d0d0d; --card:#161616; --border:#2a2a2a; --text:#fff; --dim:#888; }
        * { box-sizing:border-box; margin:0; padding:0; }
        body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; }
        
        .container { max-width:800px; width:100%; }
        
        .header { text-align:center; margin-bottom:50px; }
        .header h1 { font-size:3rem; font-weight:800; margin-bottom:10px; }
        .header p { color:var(--dim); font-size:1.1rem; }
        
        .spaces { display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:25px; }
        
        .space-card {
            background:var(--card);
            border:1px solid var(--border);
            border-radius:20px;
            padding:35px;
            text-decoration:none;
            color:var(--text);
            transition:.3s;
            position:relative;
            overflow:hidden;
        }
        .space-card:hover {
            transform:translateY(-5px);
            box-shadow:0 15px 40px rgba(0,0,0,.4);
        }
        .space-card::before {
            content:'';
            position:absolute;
            top:0; left:0; right:0;
            height:4px;
        }
        
        .space-neo::before { background:linear-gradient(90deg, #e63946, #ff6b6b); }
        .space-neo:hover { border-color:#e63946; }
        
        .space-atlas::before { background:linear-gradient(90deg, #3b82f6, #10b981); }
        .space-atlas:hover { border-color:#3b82f6; }
        
        .space-icon { font-size:3rem; margin-bottom:20px; }
        .space-title { font-size:1.5rem; font-weight:700; margin-bottom:10px; }
        .space-desc { color:var(--dim); font-size:.95rem; line-height:1.5; margin-bottom:20px; }
        
        .space-links { display:flex; gap:10px; flex-wrap:wrap; }
        .space-link {
            padding:8px 16px;
            background:rgba(255,255,255,.05);
            border-radius:8px;
            font-size:.85rem;
            color:var(--dim);
            text-decoration:none;
            transition:.2s;
        }
        .space-link:hover { background:rgba(255,255,255,.1); color:#fff; }
        
        .space-arrow {
            position:absolute;
            top:35px; right:35px;
            font-size:1.5rem;
            opacity:.3;
            transition:.3s;
        }
        .space-card:hover .space-arrow { opacity:1; transform:translateX(5px); }
        
        .footer {
            margin-top:60px;
            text-align:center;
            color:var(--dim);
            font-size:.85rem;
        }
        .footer a { color:#e63946; text-decoration:none; }
        
        @media(max-width:600px) {
            .header h1 { font-size:2rem; }
            .spaces { grid-template-columns:1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Alfred Hub</h1>
            <p>Tableau de bord centralisé</p>
        </div>
        
        <div class="spaces">
            <!-- Neo Storytellers -->
            <div class="space-card space-neo">
                <span class="space-arrow">→</span>
                <div class="space-icon">🎬</div>
                <div class="space-title">Néo Storytellers</div>
                <div class="space-desc">Production vidéo • Suivi projets clients • Devis & Factures</div>
                <div class="space-links">
                    <a href="./neo-backoffice.html" class="space-link">Backoffice</a>
                    <a href="./neo-projects.html" class="space-link">Projets</a>
                    <a href="./neostorytellers.html" class="space-link">Tasks</a>
                </div>
            </div>
            
            <!-- Atlas Pose -->
            <div class="space-card space-atlas">
                <span class="space-arrow">→</span>
                <div class="space-icon">🔧</div>
                <div class="space-title">Atlas Pose</div>
                <div class="space-desc">Suivi chantiers • Budget vs Réel • Dépenses temps réel</div>
                <div class="space-links">
                    <a href="./atlas-backoffice.html" class="space-link">Backoffice</a>
                    <a href="./atlas-projects.html" class="space-link">Projets</a>
                </div>
            </div>
        </div>
        
        <div class="footer">
            Powered by <a href="#">Alfred</a> • Zouhair Benazzouzouhair
        </div>
    </div>
</body>
</html>
