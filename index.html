<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALFRED - Unified Command Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080808;
            --card-bg: #121212;
            --accent-color: #f39c12;
            --text-main: #ffffff;
            --text-dim: #888888;
            --border-color: #222222;
            --glow: 0 0 20px rgba(243, 156, 18, 0.15);
        }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            background-color: var(--bg-color); color: var(--text-main);
            font-family: 'Inter', sans-serif; overflow: hidden;
        }

        .hub-container {
            height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: radial-gradient(circle at center, #1a1a1a 0%, #080808 100%);
            padding: 20px; box-sizing: border-box;
        }

        .header { text-align: center; margin-bottom: 50px; }
        .header h1 { 
            font-size: 3.5rem; font-weight: 800; margin: 0; 
            letter-spacing: -2px; text-transform: uppercase;
        }
        .header p { color: var(--accent-color); font-weight: 600; letter-spacing: 5px; text-transform: uppercase; font-size: 0.9rem; }

        .grid {
            display: grid; grid-template-columns: repeat(3, 280px);
            grid-gap: 25px; max-width: 900px;
        }

        @media (max-width: 900px) {
            .grid { grid-template-columns: repeat(2, 1fr); padding: 0 20px; }
            .header h1 { font-size: 2.5rem; }
        }

        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr; }
            .header h1 { font-size: 2rem; }
        }

        .card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            padding: 30px; border-radius: 20px; text-align: center;
            text-decoration: none; color: white; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column; align-items: center;
            position: relative; overflow: hidden;
        }

        .card:hover {
            border-color: var(--accent-color); transform: translateY(-10px);
            box-shadow: var(--glow);
        }

        .card i { font-size: 2.5rem; margin-bottom: 15px; display: block; }
        .card h3 { margin: 10px 0 5px; font-weight: 800; font-size: 1.1rem; }
        .card p { font-size: 0.8rem; color: var(--text-dim); margin: 0; }

        .card.disabled { opacity: 0.4; pointer-events: none; }

        /* Animation de fond */
        .card::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(243, 156, 18, 0.05), transparent);
            transform: rotate(45deg); transition: 0.6s;
        }
        .card:hover::before { left: 100%; }
    </style>
</head>
<body>
    <div class="hub-container">
        <div class="header">
            <h1>ALFRED HUB</h1>
            <p>Unified Interface</p>
        </div>

        <div class="grid">
            <a href="./neostorytellers.html" class="card">
                <i>🎬</i>
                <h3>NeoStorytellers</h3>
                <p>Prod & Calendrier</p>
            </a>
            <a href="#" class="card disabled">
                <i>🍳</i>
                <h3>FoodCost V5</h3>
                <p>Bientôt disponible</p>
            </a>
            <a href="#" class="card disabled">
                <i>💰</i>
                <h3>Finances</h3>
                <p>Bientôt disponible</p>
            </a>
            <a href="#" class="card disabled">
                <i>🏠</i>
                <h3>InstaImmo</h3>
                <p>Bientôt disponible</p>
            </a>
            <a href="#" class="card disabled">
                <i>📝</i>
                <h3>Journal</h3>
                <p>Bientôt disponible</p>
            </a>
            <a href="#" class="card disabled">
                <i>🧘</i>
                <h3>Perso</h3>
                <p>Bientôt disponible</p>
            </a>
        </div>
    </div>
</body>
</html>
