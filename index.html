<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALFRED HUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#080808">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --bg-color: #080808;
            --card-bg: #121212;
            --accent-color: #f39c12;
            --text-main: #ffffff;
            --text-dim: #888888;
            --border-color: #222222;
            --glow: 0 0 20px rgba(243, 156, 18, 0.15);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            margin: 0; 
            padding: 0; 
            min-height: 100%; 
            width: 100%;
            background-color: var(--bg-color); 
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
        }

        .hub-container {
            min-height: 100vh; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            background: radial-gradient(circle at center, #1a1a1a 0%, #080808 100%);
            padding: 40px 20px;
        }

        .header { 
            text-align: center; 
            margin-bottom: 40px; 
        }
        
        .header h1 { 
            font-size: 2.5rem; 
            font-weight: 800; 
            margin: 0; 
            letter-spacing: -2px; 
            text-transform: uppercase;
        }
        
        .header p { 
            color: var(--accent-color); 
            font-weight: 600; 
            letter-spacing: 3px; 
            text-transform: uppercase; 
            font-size: 0.8rem;
            margin-top: 10px;
        }

        .grid {
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            grid-gap: 15px; 
            width: 100%;
            max-width: 600px;
        }

        .card {
            background: var(--card-bg); 
            border: 1px solid var(--border-color);
            padding: 25px 15px; 
            border-radius: 16px; 
            text-align: center;
            text-decoration: none; 
            color: white; 
            transition: 0.3s ease;
            display: flex; 
            flex-direction: column; 
            align-items: center;
            position: relative; 
            overflow: hidden;
        }

        .card:hover, .card:active {
            border-color: var(--accent-color); 
            transform: translateY(-5px);
            box-shadow: var(--glow);
        }

        .card i { 
            font-size: 2rem; 
            margin-bottom: 10px; 
            display: block; 
        }
        
        .card h3 { 
            margin: 5px 0 3px; 
            font-weight: 700; 
            font-size: 0.9rem; 
        }
        
        .card p { 
            font-size: 0.7rem; 
            color: var(--text-dim); 
            margin: 0; 
        }

        .card.disabled { 
            opacity: 0.4; 
            pointer-events: none; 
        }

        .card.new {
            border-color: #e63946;
        }

        .card.new::after {
            content: 'NEW';
            position: absolute;
            top: 10px;
            right: 10px;
            background: #e63946;
            color: white;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 10px;
        }

        /* Tablet */
        @media (min-width: 600px) {
            .header h1 { font-size: 3rem; }
            .grid { 
                grid-template-columns: repeat(3, 1fr); 
                grid-gap: 20px;
                max-width: 700px;
            }
            .card { padding: 30px 20px; }
            .card i { font-size: 2.5rem; }
            .card h3 { font-size: 1rem; }
        }

        /* Desktop */
        @media (min-width: 900px) {
            .header h1 { font-size: 3.5rem; }
            .grid { 
                grid-template-columns: repeat(3, 200px); 
                grid-gap: 25px;
                max-width: 900px;
            }
            .card { padding: 35px 25px; border-radius: 20px; }
        }

        /* Animation */
        .card::before {
            content: ''; 
            position: absolute; 
            top: -50%; 
            left: -50%; 
            width: 200%; 
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(243, 156, 18, 0.05), transparent);
            transform: rotate(45deg); 
            transition: 0.6s;
        }
        .card:hover::before { left: 100%; }
    </style>
</head>
<body>
    <div class="hub-container">
        <div class="header">
            <h1>ALFRED HUB</h1>
            <p>Unified Interface</p>
        </div>

        <div class="grid">
            <a href="./neostorytellers.html" class="card">
                <i>🎬</i>
                <h3>NeoStorytellers</h3>
                <p>Prod & Calendrier</p>
            </a>
            <a href="./neo-projects.html" class="card new">
                <i>🎥</i>
                <h3>Neo Projects</h3>
                <p>Suivi Projets</p>
            </a>
            <a href="./neo-backoffice.html" class="card new">
                <i>⚙️</i>
                <h3>Backoffice</h3>
                <p>Admin Projets</p>
            </a>
            <a href="#" class="card disabled">
                <i>🏠</i>
                <h3>Immo</h3>
                <p>Bientôt</p>
            </a>
            <a href="#" class="card disabled">
                <i>💰</i>
                <h3>Finances</h3>
                <p>Bientôt</p>
            </a>
            <a href="#" class="card disabled">
                <i>📝</i>
                <h3>Journal</h3>
                <p>Bientôt</p>
            </a>
        </div>
    </div>
</body>
</html>
