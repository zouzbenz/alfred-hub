<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insta Immo - Backoffice</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root{--bg:#fff;--card:#f8f9fa;--card2:#f0f0f0;--border:#e0e0e0;--text:#1a1a1a;--dim:#666;--accent:#FFC107;--green:#10b981;--red:#ef4444;--orange:#f59e0b;--blue:#3b82f6;}
        *{box-sizing:border-box;margin:0;padding:0;}
        body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
        .container{max-width:1400px;margin:0 auto;padding:15px;}
        .header{display:flex;justify-content:space-between;align-items:center;padding:15px 0;margin-bottom:20px;flex-wrap:wrap;gap:15px;}
        .header h1{font-size:1.6rem;font-weight:800;}
        .header h1 span{color:var(--accent);}
        .header-links{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
        .header-link{padding:10px 16px;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--dim);text-decoration:none;font-size:.85rem;transition:.2s;}
        .header-link:hover{border-color:var(--accent);color:var(--text);}
        .header-link.active{background:var(--accent);border-color:var(--accent);color:#000;font-weight:600;}
        .user-badge{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:var(--card);border:1px solid var(--border);border-radius:20px;font-size:.85rem;font-weight:600;}
        .login-box{max-width:400px;margin:100px auto;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:40px;text-align:center;}
        .login-box h2{margin-bottom:20px;}
        .login-box input{width:100%;padding:15px;margin-bottom:15px;border:1px solid var(--border);border-radius:10px;font-size:1rem;}
        .login-box button{width:100%;padding:15px;background:var(--accent);border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;}
        .login-error{color:var(--red);margin-top:10px;font-size:.9rem;}
        .tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:15px;}
        .tab{padding:12px 20px;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--dim);font-size:.85rem;font-weight:600;cursor:pointer;transition:.2s;}
        .tab:hover{border-color:var(--accent);color:var(--text);}
        .tab.active{background:var(--accent);border-color:var(--accent);color:#000;}
        .tab-content{display:none;}
        .tab-content.active{display:block;}
        .action-bar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center;}
        .btn{padding:12px 20px;border:none;border-radius:10px;font-weight:600;cursor:pointer;font-size:.85rem;transition:.2s;display:inline-flex;align-items:center;gap:6px;}
        .btn:hover{transform:translateY(-1px);}
        .btn-primary{background:var(--accent);color:#000;}
        .btn-success{background:var(--green);color:#fff;}
        .btn-danger{background:var(--red);color:#fff;}
        .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
        .btn-small{padding:8px 12px;font-size:.75rem;}
        .btn-icon{width:32px;height:32px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:8px;}
        .search-input{flex:1;min-width:200px;padding:12px 16px;border:1px solid var(--border);border-radius:10px;font-size:.9rem;}
        .section{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:20px;}
        .table-wrapper{overflow-x:auto;}
        table{width:100%;border-collapse:collapse;min-width:700px;}
        th,td{padding:12px;text-align:left;border-bottom:1px solid var(--border);font-size:.85rem;}
        th{color:var(--dim);font-size:.75rem;text-transform:uppercase;font-weight:600;background:var(--card2);}
        tr:hover{background:rgba(255,193,7,.05);}
        .tag{padding:3px 8px;border-radius:5px;font-size:.7rem;font-weight:600;display:inline-block;}
        .tag-green{background:rgba(16,185,129,.15);color:var(--green);}
        .tag-orange{background:rgba(245,158,11,.15);color:var(--orange);}
        .tag-red{background:rgba(239,68,68,.15);color:var(--red);}
        .tag-blue{background:rgba(59,130,246,.15);color:var(--blue);}
        .tag-yellow{background:rgba(255,193,7,.2);color:#b38600;}
        .tag-gray{background:rgba(102,102,102,.15);color:var(--dim);}
        .amount{font-weight:700;color:var(--accent);}
        .actions-cell{display:flex;gap:5px;flex-wrap:wrap;}
        .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1000;justify-content:center;align-items:flex-start;padding:20px;overflow-y:auto;}
        .modal.visible{display:flex;}
        .modal-content{background:#fff;border:1px solid var(--border);border-radius:16px;width:100%;max-width:700px;margin:20px auto;max-height:90vh;overflow-y:auto;}
        .modal-header{padding:20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:10;}
        .modal-title{font-size:1.1rem;font-weight:700;}
        .modal-close{background:none;border:none;color:var(--dim);font-size:1.5rem;cursor:pointer;}
        .modal-body{padding:20px;}
        .modal-footer{padding:15px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:#fff;}
        .form-group{margin-bottom:15px;}
        .form-group label{display:block;margin-bottom:6px;font-size:.85rem;color:var(--dim);font-weight:600;}
        .form-group input,.form-group select,.form-group textarea{width:100%;padding:12px;background:#fff;border:1px solid var(--border);border-radius:8px;font-size:.9rem;}
        .form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--accent);}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:15px;}
        .form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:15px;}
        @media(max-width:600px){.form-row,.form-row-3{grid-template-columns:1fr;}}
        .form-section{margin-top:20px;padding-top:20px;border-top:1px solid var(--border);}
        .form-section-title{font-size:.9rem;font-weight:700;margin-bottom:15px;color:var(--accent);}
        .checkbox-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;}
        .checkbox-item{display:flex;align-items:center;gap:8px;font-size:.85rem;}
        .checkbox-item input{width:18px;height:18px;accent-color:var(--accent);}
        .input-with-btn{display:flex;gap:8px;}
        .input-with-btn select,.input-with-btn input{flex:1;}
        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--green);color:#fff;padding:12px 24px;border-radius:10px;font-weight:600;z-index:2000;opacity:0;transition:.3s;}
        .toast.visible{opacity:1;transform:translateX(-50%) translateY(0);}
        .empty-state{text-align:center;padding:40px;color:var(--dim);}
    </style>
</head>
<body>
    <div id="login-screen">
        <div class="login-box">
            <h2>🏠 Insta Immo</h2>
            <p style="color:var(--dim);margin-bottom:20px;">Backoffice</p>
            <input type="text" id="login-user" placeholder="Prénom">
            <input type="password" id="login-pass" placeholder="Mot de passe">
            <button onclick="login()">Connexion</button>
            <div class="login-error" id="login-error"></div>
        </div>
    </div>
    
    <div id="main-app" style="display:none;">
        <div class="container">
            <header class="header">
                <h1>🏠 Insta <span>Immo</span></h1>
                <div class="header-links">
                    <span class="user-badge" id="user-badge">👤</span>
                    <a href="./immo-dashboard.html" class="header-link">Dashboard</a>
                    <a href="./immo-biens.html" class="header-link">Biens publics</a>
                    <a href="#" class="header-link" onclick="logout()">Déconnexion</a>
                </div>
            </header>
            
            <div class="tabs">
                <button class="tab active" data-tab="biens">🏠 Biens</button>
                <button class="tab" data-tab="clients">👥 Clients</button>
                <button class="tab" data-tab="proprios">🔑 Propriétaires</button>
                <button class="tab" data-tab="visites">📅 Visites</button>
                <button class="tab" data-tab="offres">💰 Offres</button>
                <button class="tab" data-tab="tasks">✅ Tâches</button>
            </div>
            
            <!-- TAB BIENS -->
            <div class="tab-content active" id="tab-biens">
                <div class="action-bar">
                    <button class="btn btn-primary" onclick="openBienModal()">+ Nouveau bien</button>
                    <input type="text" class="search-input" placeholder="Rechercher..." id="search-biens" oninput="renderBiens()">
                </div>
                <div class="section"><div class="table-wrapper">
                    <table><thead><tr><th>Réf</th><th>Titre</th><th>Type</th><th>Zone</th><th>Prix</th><th>Statut</th><th>Actions</th></tr></thead>
                    <tbody id="biens-tbody"></tbody></table>
                </div></div>
            </div>
            
            <!-- TAB CLIENTS -->
            <div class="tab-content" id="tab-clients">
                <div class="action-bar">
                    <button class="btn btn-primary" onclick="openClientModal()">+ Nouveau client</button>
                    <button class="btn btn-outline" onclick="openMandatRechercheModal()">📄 Mandat recherche</button>
                    <input type="text" class="search-input" placeholder="Rechercher..." id="search-clients" oninput="renderClients()">
                </div>
                <div class="section"><div class="table-wrapper">
                    <table><thead><tr><th>Nom</th><th>Téléphone</th><th>Recherche</th><th>Budget</th><th>Statut</th><th>Actions</th></tr></thead>
                    <tbody id="clients-tbody"></tbody></table>
                </div></div>
            </div>
            
            <!-- TAB PROPRIOS -->
            <div class="tab-content" id="tab-proprios">
                <div class="action-bar">
                    <button class="btn btn-primary" onclick="openProprioModal()">+ Nouveau propriétaire</button>
                    <button class="btn btn-outline" onclick="openMandatVenteModal()">📄 Mandat vente</button>
                </div>
                <div class="section"><div class="table-wrapper">
                    <table><thead><tr><th>Nom</th><th>Téléphone</th><th>Email</th><th>Biens</th><th>Actions</th></tr></thead>
                    <tbody id="proprios-tbody"></tbody></table>
                </div></div>
            </div>
            
            <!-- TAB VISITES -->
            <div class="tab-content" id="tab-visites">
                <div class="action-bar">
                    <button class="btn btn-primary" onclick="openVisiteModal()">+ Nouvelle visite</button>
                </div>
                <div class="section"><div class="table-wrapper">
                    <table><thead><tr><th>Date</th><th>Bien</th><th>Client</th><th>Type</th><th>Intérêt</th><th>Bon</th><th>Actions</th></tr></thead>
                    <tbody id="visites-tbody"></tbody></table>
                </div></div>
            </div>
            
            <!-- TAB OFFRES -->
            <div class="tab-content" id="tab-offres">
                <div class="action-bar">
                    <button class="btn btn-primary" onclick="openOffreModal()">+ Nouvelle offre</button>
                </div>
                <div class="section"><div class="table-wrapper">
                    <table><thead><tr><th>Date</th><th>Bien</th><th>Client</th><th>Montant</th><th>Statut</th><th>Actions</th></tr></thead>
                    <tbody id="offres-tbody"></tbody></table>
                </div></div>
            </div>
            
            <!-- TAB TASKS -->
            <div class="tab-content" id="tab-tasks">
                <div class="action-bar">
                    <button class="btn btn-primary" onclick="openTaskModal()">+ Nouvelle tâche</button>
                </div>
                <div class="section"><div class="table-wrapper">
                    <table><thead><tr><th style="width:40px"></th><th>Tâche</th><th>Lié à</th><th>Échéance</th><th>Priorité</th><th>Actions</th></tr></thead>
                    <tbody id="tasks-tbody"></tbody></table>
                </div></div>
            </div>
        </div>
    </div>
    
    <!-- MODALS PLACEHOLDER - sera rempli par JS -->
    <div id="modals-container"></div>
    <div class="toast" id="toast"></div>
    
    <script>
// ==================== CONFIG ====================
const SUPABASE_URL='https://wxhlstificzqovfcumop.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aGxzdGlmaWN6cW92ZmN1bW9wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyNjcwOTAsImV4cCI6MjA4Njg0MzA5MH0.mt6v3SKPMhWpMw9PH7D8k3ubrR1kJNIFHw0aloLmQiQ';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const STORAGE_URL=SUPABASE_URL+'/storage/v1/object/public/immo-photos/';

// ==================== DATA ====================
let currentUser=null;
let biens=[],clients=[],proprietaires=[],visites=[],offres=[],tasks=[],photos=[];
let customZones=[];

const TYPE_LABELS={studio:'Studio',appartement:'Appartement',villa:'Villa',terrain:'Terrain',local_commercial:'Local comm.',bureau:'Bureau'};
const ZONE_LABELS={anfa:'Anfa',ain_diab:'Ain Diab',cfc:'CFC',bourgogne:'Bourgogne',bouskoura:'Bouskoura'};
const STATUT_BIEN={disponible:'Disponible',en_negociation:'En négo.',vendu:'Vendu',retire:'Retiré'};
const STATUT_COLORS={disponible:'tag-green',en_negociation:'tag-orange',vendu:'tag-blue',retire:'tag-gray'};
const CLIENT_STATUT={nouveau:'Nouveau',en_recherche:'En recherche',en_negociation:'En négo.',conclu:'Conclu',abandonne:'Abandonné'};
const CLIENT_COLORS={nouveau:'tag-blue',en_recherche:'tag-orange',en_negociation:'tag-yellow',conclu:'tag-green',abandonne:'tag-gray'};
const PHOTO_SECTIONS=[
    {id:'hero',label:'📸 Hero'},
    {id:'espaces_vie',label:'🛋️ Espaces vie'},
    {id:'chambres',label:'🛏️ Chambres'},
    {id:'cuisine',label:'🍳 Cuisine'},
    {id:'sdb',label:'🚿 SDB'},
    {id:'exterieurs',label:'🌳 Extérieurs'},
    {id:'vues',label:'👁️ Vues'},
    {id:'rdc',label:'🏠 RDC'},
    {id:'etage_1',label:'⬆️ Étage 1'},
    {id:'sous_sol',label:'⬇️ Sous-sol'},
    {id:'jardin',label:'🌳 Jardin'},
    {id:'piscine',label:'🏊 Piscine'},
    {id:'garage',label:'🚗 Garage'}
];

// ==================== AUTH ====================
async function login(){
    const user=document.getElementById('login-user').value.toLowerCase().trim();
    const pass=document.getElementById('login-pass').value;
    if(!user||!pass){document.getElementById('login-error').textContent='Remplissez les champs';return;}
    const{data,error}=await db.from('immo_users').select('*').eq('actif',true);
    if(error){document.getElementById('login-error').textContent='Erreur connexion';return;}
    const found=(data||[]).find(u=>u.prenom.toLowerCase()===user&&u.password===pass);
    if(found){currentUser=found;sessionStorage.setItem('immo-user',JSON.stringify(found));showApp();}
    else{document.getElementById('login-error').textContent='Identifiants incorrects';}
}
function logout(){sessionStorage.removeItem('immo-user');location.reload();}
function showApp(){
    document.getElementById('login-screen').style.display='none';
    document.getElementById('main-app').style.display='block';
    document.getElementById('user-badge').textContent='👤 '+currentUser.prenom;
    loadAllData();
}
// Auto-login
const saved=sessionStorage.getItem('immo-user');
if(saved){currentUser=JSON.parse(saved);showApp();}

// ==================== TABS ====================
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('tab-'+t.dataset.tab).classList.add('active');
}));

// ==================== UTILS ====================
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('visible');setTimeout(()=>t.classList.remove('visible'),2500);}
function formatMoney(n){return new Intl.NumberFormat('fr-MA').format(n||0);}
function formatDate(d){return d?new Date(d).toLocaleDateString('fr-FR'):'-';}
function formatDateTime(d){return d?new Date(d).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'-';}
function getZoneLabel(z){return ZONE_LABELS[z]||z;}

// ==================== LOAD DATA ====================
async function loadAllData(){
    const isAdmin=currentUser.role==='admin';
    const agent=currentUser.prenom.toLowerCase();
    
    const[r1,r2,r3,r4,r5,r6]=await Promise.all([
        db.from('immo_biens').select('*').order('created_at',{ascending:false}),
        db.from('immo_clients').select('*').order('created_at',{ascending:false}),
        db.from('immo_proprietaires').select('*').order('created_at',{ascending:false}),
        db.from('immo_visites').select('*,immo_biens(reference,titre),immo_clients(nom,prenom)').order('date_visite',{ascending:false}),
        db.from('immo_offres').select('*,immo_biens(reference,titre,prix),immo_clients(nom,prenom)').order('date_offre',{ascending:false}),
        db.from('immo_tasks').select('*').order('echeance',{ascending:true})
    ]);
    
    biens=r1.data||[];
    clients=r2.data||[];
    proprietaires=r3.data||[];
    visites=r4.data||[];
    offres=r5.data||[];
    tasks=r6.data||[];
    
    // Collect custom zones
    biens.forEach(b=>{if(b.zone&&!ZONE_LABELS[b.zone]){ZONE_LABELS[b.zone]=b.zone;customZones.push(b.zone);}});
    
    // Filter by agent if not admin
    if(!isAdmin){
        biens=biens.filter(b=>b.agent===agent||b.agent==='commun');
    }
    
    renderAll();
}

function renderAll(){
    renderBiens();
    renderClients();
    renderProprios();
    renderVisites();
    renderOffres();
    renderTasks();
}

// ==================== BIENS ====================
function renderBiens(){
    const search=(document.getElementById('search-biens')?.value||'').toLowerCase();
    const filtered=biens.filter(b=>
        (b.reference||'').toLowerCase().includes(search)||
        (b.titre||'').toLowerCase().includes(search)||
        (b.zone||'').toLowerCase().includes(search)
    );
    const tbody=document.getElementById('biens-tbody');
    if(!filtered.length){tbody.innerHTML='<tr><td colspan="7" class="empty-state">Aucun bien</td></tr>';return;}
    tbody.innerHTML=filtered.map(b=>`
        <tr>
            <td><strong>${b.reference||'N/A'}</strong></td>
            <td>${b.titre||'-'}</td>
            <td>${TYPE_LABELS[b.type_bien]||b.type_bien}</td>
            <td>${getZoneLabel(b.zone)}</td>
            <td class="amount">${formatMoney(b.prix)} MAD</td>
            <td><span class="tag ${STATUT_COLORS[b.statut]||'tag-gray'}">${STATUT_BIEN[b.statut]||b.statut}</span></td>
            <td class="actions-cell">
                <button class="btn btn-small btn-outline btn-icon" onclick="editBien(${b.id})" title="Modifier">✏️</button>
                <button class="btn btn-small btn-outline btn-icon" onclick="openPhotosModal(${b.id})" title="Photos">📸</button>
                <a href="./immo-bien.html?ref=${b.reference}" target="_blank" class="btn btn-small btn-outline btn-icon" title="Voir">👁️</a>
                <button class="btn btn-small btn-danger btn-icon" onclick="deleteBien(${b.id})" title="Supprimer">×</button>
            </td>
        </tr>
    `).join('');
}

// ==================== CLIENTS ====================
function renderClients(){
    const search=(document.getElementById('search-clients')?.value||'').toLowerCase();
    const filtered=clients.filter(c=>
        (c.nom||'').toLowerCase().includes(search)||
        (c.prenom||'').toLowerCase().includes(search)||
        (c.telephone||'').includes(search)
    );
    const tbody=document.getElementById('clients-tbody');
    if(!filtered.length){tbody.innerHTML='<tr><td colspan="6" class="empty-state">Aucun client</td></tr>';return;}
    tbody.innerHTML=filtered.map(c=>{
        const types=(c.types_souhaites||[]).map(t=>TYPE_LABELS[t]||t).join(', ')||'-';
        const budget=c.budget_min||c.budget_max?`${formatMoney(c.budget_min||0)} - ${formatMoney(c.budget_max||'∞')}`:'-';
        return`<tr>
            <td><strong>${c.nom}</strong> ${c.prenom||''}</td>
            <td>${c.telephone||'-'}</td>
            <td style="max-width:120px;overflow:hidden;text-overflow:ellipsis;">${types}</td>
            <td>${budget}</td>
            <td><span class="tag ${CLIENT_COLORS[c.statut]||'tag-gray'}">${CLIENT_STATUT[c.statut]||c.statut}</span></td>
            <td class="actions-cell">
                <button class="btn btn-small btn-outline btn-icon" onclick="editClient(${c.id})">✏️</button>
                <a href="./immo-client.html?code=${c.code_acces}" target="_blank" class="btn btn-small btn-outline btn-icon">👁️</a>
                <button class="btn btn-small btn-danger btn-icon" onclick="deleteClient(${c.id})">×</button>
            </td>
        </tr>`;
    }).join('');
}

// ==================== PROPRIOS ====================
function renderProprios(){
    const tbody=document.getElementById('proprios-tbody');
    if(!proprietaires.length){tbody.innerHTML='<tr><td colspan="5" class="empty-state">Aucun propriétaire</td></tr>';return;}
    tbody.innerHTML=proprietaires.map(p=>{
        const nbBiens=biens.filter(b=>b.proprietaire_id===p.id).length;
        return`<tr>
            <td><strong>${p.nom}</strong> ${p.prenom||''}</td>
            <td>${p.telephone||'-'}</td>
            <td>${p.email||'-'}</td>
            <td>${nbBiens} bien(s)</td>
            <td class="actions-cell">
                <button class="btn btn-small btn-outline btn-icon" onclick="editProprio(${p.id})">✏️</button>
                <a href="./immo-proprio.html?code=${p.code_acces}" target="_blank" class="btn btn-small btn-outline btn-icon">👁️</a>

// ==================== TASKS ====================
function renderTasks(){
    const tbody=document.getElementById('tasks-tbody');
    if(!tasks.length){tbody.innerHTML='<tr><td colspan="6" class="empty-state">Aucune tâche</td></tr>';return;}
    const prioColors={basse:'tag-gray',normale:'tag-blue',haute:'tag-orange',urgente:'tag-red'};
    tbody.innerHTML=tasks.map(t=>{
        const bien=biens.find(b=>b.id===t.bien_id);
        const client=clients.find(c=>c.id===t.client_id);
        const linked=bien?bien.reference:(client?client.nom:'-');
        return`<tr>
            <td><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask(${t.id},this.checked)" style="width:20px;height:20px;accent-color:var(--green);"></td>
            <td style="${t.done?'text-decoration:line-through;color:var(--dim);':''}">${t.titre}</td>
            <td>${linked}</td>
            <td>${formatDate(t.echeance)}</td>
            <td><span class="tag ${prioColors[t.priorite]||'tag-blue'}">${t.priorite||'normale'}</span></td>
            <td class="actions-cell">
                <button class="btn btn-small btn-outline btn-icon" onclick="editTask(${t.id})">✏️</button>
                <button class="btn btn-small btn-danger btn-icon" onclick="deleteTask(${t.id})">×</button>
            </td>
        </tr>`;
    }).join('');
}

async function toggleTask(id,done){
    await db.from('immo_tasks').update({done}).eq('id',id);
    const t=tasks.find(x=>x.id===id);if(t)t.done=done;
    renderTasks();
}

function addCustomZone(){
    const name=prompt('Nom de la nouvelle zone:');
    if(!name)return;
    const code=name.toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'');
    if(!ZONE_LABELS[code]){ZONE_LABELS[code]=name;customZones.push(code);}
    const sel=document.getElementById('bien-zone');
    sel.innerHTML+=`<option value="${code}">${name}</option>`;
    sel.value=code;
    showToast('Zone ajoutée: '+name);
}

async function saveBien(){
    const id=document.getElementById('bien-id').value;
    const data={
        titre:document.getElementById('bien-titre').value,
        type_bien:document.getElementById('bien-type').value,
        zone:document.getElementById('bien-zone').value,
        quartier:document.getElementById('bien-quartier').value||null,
        prix:parseFloat(document.getElementById('bien-prix').value)||0,
        surface_m2:parseFloat(document.getElementById('bien-surface').value)||null,
        etage:parseInt(document.getElementById('bien-etage').value)||null,
        chambres:parseInt(document.getElementById('bien-chambres').value)||0,
        salons:parseInt(document.getElementById('bien-salons').value)||0,
        sdb:parseInt(document.getElementById('bien-sdb').value)||0,
        orientation:document.getElementById('bien-orientation').value||null,
        etat:document.getElementById('bien-etat').value,
        ascenseur:document.getElementById('bien-ascenseur').checked,
        parking:document.getElementById('bien-parking').checked?1:0,
        terrasse_m2:document.getElementById('bien-terrasse').checked?1:null,
        balcon:document.getElementById('bien-balcon').checked,
        cave:document.getElementById('bien-cave').checked,
        gardien:document.getElementById('bien-gardien').checked,
        chambre_personnel:document.getElementById('bien-chpers').checked,
        piscine:document.getElementById('bien-piscine').checked,
        description:document.getElementById('bien-desc').value||null,
        video_youtube:document.getElementById('bien-youtube').value||null,
        video_format:document.getElementById('bien-vformat').value,
        commission_pct:parseFloat(document.getElementById('bien-comm').value)||2,
        proprietaire_id:document.getElementById('bien-proprio').value||null,
        agent:document.getElementById('bien-agent').value,
        statut:document.getElementById('bien-statut').value,
        publie:document.getElementById('bien-publie').value==='true'
    };
    if(!data.titre||!data.prix){alert('Titre et prix obligatoires');return;}
    try{
        if(id){await db.from('immo_biens').update(data).eq('id',id);}
        else{await db.from('immo_biens').insert([data]);}
        showToast('Bien enregistré!');closeBienModal();await loadAllData();
    }catch(e){alert('Erreur: '+e.message);}
}

    const photosList=bienPhotos||[];
    
    let sectionsHtml=PHOTO_SECTIONS.map(sec=>{
        const secPhotos=photosList.filter(p=>p.section===sec.id);
        return`<div style="background:var(--card2);border-radius:12px;padding:15px;margin-bottom:15px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                <strong>${sec.label}</strong>
                <span style="color:var(--dim);font-size:.8rem;">${secPhotos.length} photo(s)</span>
            </div>
            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;">
                ${secPhotos.map(p=>`<div style="position:relative;height:70px;background:var(--card);border-radius:8px;overflow:hidden;">
                    <img src="${STORAGE_URL}${p.storage_path}" style="width:100%;height:100%;object-fit:cover;">
                    <button onclick="deletePhoto(${p.id},'${p.storage_path}',${bienId})" style="position:absolute;top:2px;right:2px;width:18px;height:18px;background:var(--red);color:#fff;border:none;border-radius:50%;font-size:10px;cursor:pointer;">×</button>
                </div>`).join('')}
                <label style="height:70px;background:var(--card);border:2px dashed var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.5rem;color:var(--dim);">
                    <input type="file" accept="image/*" multiple style="display:none;" onchange="uploadPhotos(${bienId},'${sec.id}',this.files)">➕
                </label>
            </div>
        </div>`;
    }).join('');
    
    const html=`<div class="modal visible" id="photos-modal" onclick="if(event.target===this)closePhotosModal()">
    <div class="modal-content" style="max-width:800px;">
        <div class="modal-header"><h3 class="modal-title">📸 Photos - ${bien.reference}</h3><button class="modal-close" onclick="closePhotosModal()">×</button></div>
        <div class="modal-body">${sectionsHtml}</div>
        <div class="modal-footer"><button class="btn btn-primary" onclick="closePhotosModal()">Fermer</button></div>
    </div></div>`;
    document.getElementById('modals-container').innerHTML=html;
}
function closePhotosModal(){document.getElementById('modals-container').innerHTML='';}

async function uploadPhotos(bienId,section,files){
    if(!files.length)return;
    const bien=biens.find(b=>b.id===bienId);
    if(!bien)return;
    showToast('Upload en cours...');
    for(let i=0;i<files.length;i++){
        const file=files[i];
        const ext=file.name.split('.').pop();
        const path=`${bien.reference}/${section}/${Date.now()}_${i}.${ext}`;
        const{error}=await db.storage.from('immo-photos').upload(path,file);
        if(!error){
            await db.from('immo_bien_photos').insert({bien_id:bienId,section:section,filename:file.name,storage_path:path,ordre:i});
        }
    }
    showToast('Photos uploadées!');
    openPhotosModal(bienId);
}

async function deletePhoto(photoId,storagePath,bienId){
    if(!confirm('Supprimer cette photo?'))return;
    await db.storage.from('immo-photos').remove([storagePath]);
    await db.from('immo_bien_photos').delete().eq('id',photoId);
    showToast('Photo supprimée');
    openPhotosModal(bienId);
}

// ==================== PDF GENERATION ====================
const { jsPDF } = window.jspdf;

const PDF_MARGIN_BOTTOM = 75; // Espace réservé pour footer + signatures
const PDF_PAGE_HEIGHT = 297; // A4 height

function checkNewPage(doc, y, neededSpace = 60) {
    if (y + neededSpace > PDF_PAGE_HEIGHT - PDF_MARGIN_BOTTOM) {
        doc.addPage();
        return 30; // Reset Y position
    }
    return y;
}

function pdfHeader(doc, title) {
    // En-tête jaune
    doc.setFillColor(255, 193, 7);
    doc.rect(0, 0, 210, 30, 'F');
    
    // Logo texte
    doc.setTextColor(0, 0, 0);
    doc.setFontSize(22);
    doc.setFont('helvetica', 'bold');
    doc.text('INSTA IMMO', 15, 15);
    
    // Sous-titre
    doc.setFontSize(9);
    doc.setFont('helvetica', 'normal');
    doc.text('Votre partenaire immobilier à Casablanca', 15, 22);
    
    // Titre document
    doc.setFontSize(12);
    doc.setFont('helvetica', 'bold');
    doc.text(title, 195, 18, { align: 'right' });
    
    // Reset couleur
    doc.setTextColor(0, 0, 0);
    return 40; // Y position après header
}

function pdfFooter(doc) {
    const pageCount = doc.internal.getNumberOfPages();
    for (let i = 1; i <= pageCount; i++) {
        doc.setPage(i);
        const pageHeight = doc.internal.pageSize.height;
        doc.setFontSize(8);
        doc.setTextColor(100, 100, 100);
        doc.text('INSTA IMMO - Zouhair Benazzouz | Tél: +212 687 842 466 | Casablanca, Maroc', 105, pageHeight - 8, { align: 'center' });
    }
}

function pdfSection(doc, y, title) {
    y = checkNewPage(doc, y, 20);
    doc.setFillColor(255, 193, 7);
    doc.rect(15, y - 4, 180, 7, 'F');
    doc.setFontSize(10);
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(0, 0, 0);
    doc.text(title, 18, y);
    return y + 10;
}

function pdfField(doc, y, label, value) {
    y = checkNewPage(doc, y, 10);
    doc.setFontSize(9);
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(80, 80, 80);
    doc.text(label + ':', 18, y);
    doc.setFont('helvetica', 'normal');
    doc.setTextColor(0, 0, 0);
    doc.text(String(value || '-'), 65, y);
    return y + 6;
}

function pdfParagraph(doc, y, text, maxWidth = 175) {
    doc.setFontSize(8);
    doc.setFont('helvetica', 'normal');
    doc.setTextColor(50, 50, 50);
    const lines = doc.splitTextToSize(text, maxWidth);
    
    // Check if we need new page for all lines
    const neededHeight = lines.length * 4 + 5;
    y = checkNewPage(doc, y, neededHeight);
    
    doc.text(lines, 18, y);
    return y + (lines.length * 4) + 3;
}

function pdfSignatures(doc, y, leftLabel = 'Le Mandant:', rightLabel = 'Le Mandataire:') {
    // Toujours sur une nouvelle page si pas assez d'espace
    if (y > 200) {
        doc.addPage();
        y = 30;
    }
    
    doc.setFontSize(9);
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(0, 0, 0);
    
    // Labels
    doc.text(leftLabel, 25, y);
    doc.text(rightLabel, 125, y);
    
    // Boxes
    doc.setDrawColor(200, 200, 200);
    doc.rect(18, y + 3, 75, 35);
    doc.rect(118, y + 3, 75, 35);
    
    // Mention
    doc.setFontSize(8);
    doc.setFont('helvetica', 'normal');
    doc.setTextColor(100, 100, 100);
    doc.text('Lu et approuvé', 40, y + 43);
    doc.text('INSTA IMMO', 140, y + 43);
    
    return y + 50;
}

function genererMandatRecherche() {
    const clientId = document.getElementById('mandat-client')?.value;
    if (!clientId) { alert('Sélectionnez un client'); return; }
    const c = clients.find(x => x.id == clientId);
    if (!c) { alert('Client introuvable'); return; }
    
    const commission = document.getElementById('mandat-comm').value || '2';
    const duree = document.getElementById('mandat-duree').value || '6';
    const today = new Date().toLocaleDateString('fr-FR');
    
    const doc = new jsPDF();
    let y = pdfHeader(doc, 'MANDAT DE RECHERCHE');
    
    // Numéro et date
    doc.setFontSize(9);
    doc.setTextColor(100, 100, 100);
    doc.text(`N° MR-${Date.now().toString().slice(-6)}`, 18, y);
    doc.text(`Date: ${today}`, 170, y);
    y += 10;
    
    // Section Mandant
    y = pdfSection(doc, y, 'LE MANDANT');
    y = pdfField(doc, y, 'Nom complet', `${c.nom} ${c.prenom || ''}`);
    y = pdfField(doc, y, 'Téléphone', c.telephone);
    y = pdfField(doc, y, 'Email', c.email || '-');
    y += 3;
    
    // Section Mandataire
    y = pdfSection(doc, y, 'LE MANDATAIRE');
    y = pdfField(doc, y, 'Société', 'INSTA IMMO');
    y = pdfField(doc, y, 'Représentant', 'Zouhair Benazzouz');
    y = pdfField(doc, y, 'Téléphone', '+212 687 842 466');
    y += 3;
    
    // Section Recherche
    y = pdfSection(doc, y, 'OBJET DE LA RECHERCHE');
    const types = (c.types_souhaites || []).map(t => TYPE_LABELS[t] || t).join(', ') || 'Non spécifié';
    const zones = (c.zones_souhaitees || []).map(z => ZONE_LABELS[z] || z).join(', ') || 'Non spécifié';
    const budget = c.budget_min || c.budget_max ? `${formatMoney(c.budget_min || 0)} - ${formatMoney(c.budget_max || '∞')} MAD` : 'Non spécifié';
    
    y = pdfField(doc, y, 'Types de biens', types);
    y = pdfField(doc, y, 'Zones', zones);
    y = pdfField(doc, y, 'Budget', budget);
    if (c.chambres_min) y = pdfField(doc, y, 'Chambres min', c.chambres_min);
    
    // Critères
    let criteres = [];
    if (c.crit_ascenseur) criteres.push('Ascenseur');
    if (c.crit_parking) criteres.push('Parking');
    if (c.crit_terrasse) criteres.push('Terrasse');
    if (c.crit_vue_mer) criteres.push('Vue mer');
    if (criteres.length) y = pdfField(doc, y, 'Critères', criteres.join(', '));
    y += 3;
    
    // Section Conditions
    y = pdfSection(doc, y, 'CONDITIONS');
    y = pdfField(doc, y, 'Durée du mandat', `${duree} mois`);
    y = pdfField(doc, y, 'Commission', `${commission}% HT du prix de vente`);
    y += 3;
    
    // Clauses
    y = pdfSection(doc, y, 'CLAUSES ET CONDITIONS');
    const clauses = `Le mandant confie au mandataire la mission exclusive de rechercher un bien immobilier correspondant aux critères définis ci-dessus. Le mandataire s'engage à présenter au mandant les biens correspondant à ses critères. En cas d'acquisition d'un bien présenté par le mandataire, le mandant s'engage à verser la commission convenue. Ce mandat est valable pour une durée de ${duree} mois à compter de sa signature.`;
    y = pdfParagraph(doc, y, clauses);
    y += 5;
    
    // Signatures
    y = pdfSection(doc, y, 'SIGNATURES');
    y = pdfSignatures(doc, y, 'Le Mandant:', 'Le Mandataire:');
    
    pdfFooter(doc);
    
    doc.save(`Mandat_Recherche_${c.nom}_${today.replace(/\//g, '-')}.pdf`);
    showToast('PDF généré !');
    closeMandatModal();
}

function genererMandatVente() {
    const bienId = document.getElementById('mandat-bien')?.value;
    if (!bienId) { alert('Sélectionnez un bien'); return; }
    const b = biens.find(x => x.id == bienId);
    if (!b) { alert('Bien introuvable'); return; }
    
    const proprio = proprietaires.find(p => p.id == b.proprietaire_id);
    const commission = document.getElementById('mandat-vcomm').value || '2';
    const duree = document.getElementById('mandat-vduree').value || '6';
    const exclusif = document.getElementById('mandat-exclusif').value === 'oui';
    const today = new Date().toLocaleDateString('fr-FR');
    
    const doc = new jsPDF();
    let y = pdfHeader(doc, exclusif ? 'MANDAT DE VENTE EXCLUSIF' : 'MANDAT DE VENTE');
    
    // Numéro et date
    doc.setFontSize(10);
    doc.text(`N° MV-${b.reference}`, 20, y);
    doc.text(`Date: ${today}`, 160, y);
    y += 15;
    
    // Section Mandant (Proprio)
    y = pdfSection(doc, y, 'LE MANDANT (PROPRIÉTAIRE)');
    if (proprio) {
        y = pdfField(doc, y, 'Nom', `${proprio.nom} ${proprio.prenom || ''}`);
        y = pdfField(doc, y, 'Téléphone', proprio.telephone);
        y = pdfField(doc, y, 'Email', proprio.email || '-');
        y = pdfField(doc, y, 'Adresse', proprio.adresse || '-');
    } else {
        y = pdfField(doc, y, 'Nom', '______________________________');
        y = pdfField(doc, y, 'Téléphone', '______________________________');
    }
    y += 5;
    
    // Section Mandataire
    y = pdfSection(doc, y, 'LE MANDATAIRE');
    y = pdfField(doc, y, 'Société', 'INSTA IMMO');
    y = pdfField(doc, y, 'Représentant', 'Zouhair Benazzouz');
    y = pdfField(doc, y, 'Téléphone', '+212 687 842 466');
    y += 5;
    
    // Section Bien
    y = pdfSection(doc, y, 'DÉSIGNATION DU BIEN');
    y = pdfField(doc, y, 'Référence', b.reference);
    y = pdfField(doc, y, 'Type', TYPE_LABELS[b.type_bien] || b.type_bien);
    y = pdfField(doc, y, 'Adresse', `${getZoneLabel(b.zone)}${b.quartier ? ' - ' + b.quartier : ''}`);
    y = pdfField(doc, y, 'Surface', b.surface_m2 ? `${b.surface_m2} m²` : '-');
    y = pdfField(doc, y, 'Étage', b.etage !== null ? b.etage : '-');
    y = pdfField(doc, y, 'Chambres', b.chambres || '-');
    y += 5;
    
    // Section Prix
    y = pdfSection(doc, y, 'CONDITIONS FINANCIÈRES');
    y = pdfField(doc, y, 'Prix de vente', `${formatMoney(b.prix)} MAD`);
    y = pdfField(doc, y, 'Commission', `${commission}% HT`);
    y = pdfField(doc, y, 'Montant commission', `${formatMoney(b.prix * commission / 100)} MAD HT`);
    y += 3;
    
    // Section Conditions
    y = pdfSection(doc, y, 'DURÉE ET CONDITIONS');
    y = pdfField(doc, y, 'Type de mandat', exclusif ? 'EXCLUSIF' : 'Simple');
    y = pdfField(doc, y, 'Durée', `${duree} mois`);
    y += 3;
    
    // Clauses
    y = pdfSection(doc, y, 'CLAUSES');
    const clauseExclusif = exclusif ? 
        `Ce mandat est EXCLUSIF. Pendant toute la durée du mandat, le mandant s'interdit de confier la vente du bien à un autre intermédiaire et de traiter directement avec un acquéreur.` :
        `Ce mandat est simple. Le mandant conserve la possibilité de vendre directement ou par l'intermédiaire d'un autre mandataire.`;
    
    y = pdfParagraph(doc, y, clauseExclusif);
    y = pdfParagraph(doc, y, `Le mandataire s'engage à mettre en œuvre tous les moyens nécessaires pour réaliser la vente: publicité, visites, négociation. La commission sera due dès la signature de l'acte authentique de vente.`);
    y += 5;
    
    // Signatures
    y = pdfSection(doc, y, 'SIGNATURES');
    y = pdfSignatures(doc, y, 'Le Propriétaire:', 'Le Mandataire:');
    
    pdfFooter(doc);
    
    doc.save(`Mandat_Vente_${b.reference}_${today.replace(/\//g, '-')}.pdf`);
    showToast('PDF généré !');
    closeMandatModal();
}

// ==================== BON DE VISITE PDF ====================
async function genererBonVisitePDF(visiteId) {
    const v = visites.find(x => x.id == visiteId);
    if (!v) { alert('Visite introuvable'); return; }
    
    const bien = biens.find(b => b.id == v.bien_id) || {};
    const client = clients.find(c => c.id == v.client_id) || {};
    const today = new Date().toLocaleDateString('fr-FR');
    const dateVisite = v.date_visite ? new Date(v.date_visite).toLocaleDateString('fr-FR') : today;
    const heureVisite = v.date_visite ? new Date(v.date_visite).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'}) : '';
    
    const doc = new jsPDF();
    let y = pdfHeader(doc, 'BON DE VISITE');
    
    // Numéro et date
    doc.setFontSize(9);
    doc.setTextColor(100, 100, 100);
    doc.text(`N° BV-${visiteId}`, 18, y);
    doc.text(`Date: ${today}`, 170, y);
    y += 10;
    
    // Section Bien
    y = pdfSection(doc, y, 'BIEN VISITÉ');
    y = pdfField(doc, y, 'Référence', bien.reference || '-');
    y = pdfField(doc, y, 'Désignation', bien.titre || '-');
    y = pdfField(doc, y, 'Type', TYPE_LABELS[bien.type_bien] || '-');
    y = pdfField(doc, y, 'Localisation', `${getZoneLabel(bien.zone || '')}${bien.quartier ? ' - ' + bien.quartier : ''}`);
    y = pdfField(doc, y, 'Prix', bien.prix ? `${formatMoney(bien.prix)} MAD` : '-');
    y += 3;
    
    // Section Visiteur
    y = pdfSection(doc, y, 'LE VISITEUR');
    y = pdfField(doc, y, 'Nom complet', client.nom ? `${client.nom} ${client.prenom || ''}` : '______________________________');
    y = pdfField(doc, y, 'Téléphone', client.telephone || '______________________________');
    y = pdfField(doc, y, 'Email', client.email || '______________________________');
    y += 3;
    
    // Section Visite
    y = pdfSection(doc, y, 'LA VISITE');
    y = pdfField(doc, y, 'Date de visite', dateVisite);
    y = pdfField(doc, y, 'Heure', heureVisite || '______');
    y = pdfField(doc, y, 'Agent', v.agent || currentUser.prenom);
    y += 3;
    
    // Clause légale
    y = pdfSection(doc, y, 'ENGAGEMENT');
    const clause = `Le(a) soussigné(e) reconnaît avoir visité le bien désigné ci-dessus par l'intermédiaire exclusif d'INSTA IMMO. Toute transaction conclue directement avec le propriétaire ou par un autre intermédiaire, dans un délai de 24 mois suivant cette visite, engagera la responsabilité du visiteur au paiement de la commission convenue, sans préjudice de dommages et intérêts. Le présent bon de visite constitue une preuve de la mise en relation.`;
    y = pdfParagraph(doc, y, clause);
    y += 5;
    
    // Signatures avec signature existante si présente
    y = pdfSection(doc, y, 'SIGNATURES');
    
    // Toujours sur une nouvelle page si pas assez d'espace
    if (y > 200) {
        doc.addPage();
        y = 30;
    }
    
    doc.setFontSize(9);
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(0, 0, 0);
    
    doc.text('Le Visiteur:', 25, y);
    doc.text("L'Agent:", 125, y);
    
    doc.setDrawColor(200, 200, 200);
    doc.rect(18, y + 3, 75, 35);
    doc.rect(118, y + 3, 75, 35);
    
    // Ajouter signature si existante
    if (v.signature_data) {
        try {
            doc.addImage(v.signature_data, 'PNG', 20, y + 5, 71, 31);
        } catch(e) { console.log('Erreur signature:', e); }
    }
    
    doc.setFontSize(8);
    doc.setFont('helvetica', 'normal');
    doc.setTextColor(100, 100, 100);
    doc.text('Lu et approuvé', 40, y + 43);
    doc.text('INSTA IMMO', 140, y + 43);
    
    pdfFooter(doc);
    
    doc.save(`Bon_Visite_${bien.reference || 'BV'}_${client.nom || 'Client'}_${dateVisite.replace(/\//g, '-')}.pdf`);
    showToast('Bon de visite PDF généré !');
}
