<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fiche Client - Atlas Pose</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <style>
        :root { --bg:#0a0f1a; --card:#111827; --accent:#3b82f6; --accent2:#10b981; --text:#f3f4f6; --dim:#9ca3af; --border:#1f2937; --danger:#ef4444; --warn:#f59e0b; --purple:#8b5cf6; --orange:#f97316; }
        * { box-sizing:border-box; margin:0; padding:0; }
        body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; }
        .container { max-width:1100px; margin:0 auto; padding:15px; }

        /* Client Header */
        .client-hero { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:24px; margin-bottom:15px; }
        .client-hero-top { display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:15px; margin-bottom:16px; }
        .client-name-block { }
        .client-name { font-size:1.8rem; font-weight:800; margin-bottom:6px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
        .client-ref { font-size:.8rem; color:var(--dim); font-family:monospace; background:var(--bg); padding:4px 10px; border-radius:8px; }
        .badge-actif { padding:5px 12px; border-radius:15px; font-size:.75rem; font-weight:600; background:rgba(16,185,129,.2); color:var(--accent2); }
        .badge-inactif { padding:5px 12px; border-radius:15px; font-size:.75rem; font-weight:600; background:rgba(239,68,68,.15); color:var(--danger); }

        .client-hero-actions { display:flex; gap:8px; flex-wrap:wrap; }
        .client-contacts { display:flex; flex-wrap:wrap; gap:20px; font-size:.88rem; color:var(--dim); }
        .client-contacts span { display:flex; align-items:center; gap:6px; }
        .client-contacts a { color:var(--accent); text-decoration:none; }

        /* KPI row */
        .kpi-row { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:15px; }
        .kpi-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; text-align:center; }
        .kpi-value { font-size:1.5rem; font-weight:800; }
        .kpi-value.blue { color:var(--accent); }
        .kpi-value.green { color:var(--accent2); }
        .kpi-value.orange { color:var(--warn); }
        .kpi-value.purple { color:var(--purple); }
        .kpi-value.red { color:var(--danger); }
        .kpi-label { font-size:.72rem; color:var(--dim); margin-top:4px; }

        /* Tabs */
        .tabs { display:flex; gap:4px; margin-bottom:15px; border-bottom:1px solid var(--border); padding-bottom:0; flex-wrap:wrap; }
        .tab-btn { padding:10px 18px; background:none; border:none; color:var(--dim); cursor:pointer; font-size:.88rem; font-weight:500; border-bottom:2px solid transparent; margin-bottom:-1px; transition:.15s; }
        .tab-btn.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }
        .tab-btn:hover { color:var(--text); }
        .tab-content { display:none; }
        .tab-content.active { display:block; }

        /* Section */
        .section { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:18px; margin-bottom:15px; }
        .section-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap:wrap; gap:10px; }
        .section-title { font-size:1rem; font-weight:700; display:flex; align-items:center; gap:8px; }

        /* Buttons */
        .btn { padding:9px 16px; border:none; border-radius:10px; font-weight:600; cursor:pointer; font-size:.85rem; transition:.2s; display:inline-flex; align-items:center; gap:6px; text-decoration:none; }
        .btn:hover { transform:translateY(-1px); }
        .btn-primary { background:var(--accent); color:#fff; }
        .btn-success { background:var(--accent2); color:#fff; }
        .btn-outline { background:transparent; border:1px solid var(--border); color:var(--text); }
        .btn-danger { background:var(--danger); color:#fff; }
        .btn-small { padding:6px 12px; font-size:.78rem; }
        .btn-warn { background:var(--warn); color:#000; }

        /* Projets list */
        .projet-row { display:flex; justify-content:space-between; align-items:center; padding:13px 0; border-bottom:1px solid var(--border); flex-wrap:wrap; gap:10px; cursor:pointer; }
        .projet-row:last-child { border-bottom:none; }
        .projet-row:hover { background:rgba(255,255,255,.02); margin:0 -18px; padding-left:18px; padding-right:18px; border-radius:8px; }
        .projet-info h4 { font-size:.95rem; font-weight:600; margin-bottom:3px; }
        .projet-info-meta { display:flex; gap:10px; font-size:.78rem; color:var(--dim); flex-wrap:wrap; }
        .projet-right { display:flex; align-items:center; gap:12px; }
        .projet-budget { text-align:right; }
        .projet-budget-val { font-size:1rem; font-weight:700; color:var(--accent2); }
        .projet-budget-sub { font-size:.72rem; color:var(--dim); }

        .status-badge { padding:3px 10px; border-radius:15px; font-size:.7rem; font-weight:600; }
        .status-a_venir { background:rgba(245,158,11,.2); color:var(--warn); }
        .status-en_cours { background:rgba(59,130,246,.2); color:var(--accent); }
        .status-termine { background:rgba(16,185,129,.2); color:var(--accent2); }

        /* Commandes / Factures list */
        .item-row { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--border); flex-wrap:wrap; gap:8px; cursor:pointer; }
        .item-row:last-child { border-bottom:none; }
        .item-row:hover .item-link { color:var(--accent); text-decoration:underline; }
        .item-left h4 { font-size:.9rem; font-weight:600; margin-bottom:2px; }
        .item-left-meta { font-size:.75rem; color:var(--dim); display:flex; gap:10px; flex-wrap:wrap; }
        .item-montant { font-size:1rem; font-weight:700; color:var(--accent2); }
        .statut-badge { padding:3px 9px; border-radius:12px; font-size:.68rem; font-weight:600; }
        .statut-brouillon { background:rgba(156,163,175,.2); color:var(--dim); }
        .statut-validee { background:rgba(59,130,246,.2); color:var(--accent); }
        .statut-recue { background:rgba(16,185,129,.2); color:var(--accent2); }
        .statut-emise { background:rgba(245,158,11,.2); color:var(--warn); }
        .statut-payee { background:rgba(16,185,129,.2); color:var(--accent2); }

        /* Notes */
        .notes-block { background:var(--bg); border-radius:10px; padding:15px; font-size:.88rem; color:var(--dim); line-height:1.6; white-space:pre-wrap; }

        /* Modal */
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.85); z-index:1000; justify-content:center; align-items:flex-start; padding:15px; overflow-y:auto; }
        .modal.visible { display:flex; }
        .modal-content { background:var(--card); border:1px solid var(--border); border-radius:16px; width:100%; max-width:560px; margin:20px auto; }
        .modal-header { padding:16px 20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; background:var(--card); z-index:10; border-radius:16px 16px 0 0; }
        .modal-title { font-size:1.1rem; font-weight:700; }
        .modal-close { background:none; border:none; color:var(--dim); font-size:1.5rem; cursor:pointer; padding:5px; }
        .modal-body { padding:20px; }
        .modal-footer { padding:15px 20px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px; flex-wrap:wrap; }
        .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
        .form-row.one { grid-template-columns:1fr; }
        .form-group { display:flex; flex-direction:column; gap:5px; }
        .form-group label { font-size:.8rem; color:var(--dim); font-weight:500; }
        .form-group input, .form-group textarea, .form-group select { padding:11px 13px; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:#fff; font-size:.9rem; width:100%; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline:none; border-color:var(--accent); }
        .form-group textarea { resize:vertical; min-height:70px; }

        .empty-state { text-align:center; padding:30px; color:var(--dim); font-size:.9rem; }
        .toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--accent2); color:#fff; padding:12px 24px; border-radius:10px; font-weight:600; z-index:2000; opacity:0; transition:.3s; }
        .toast.visible { opacity:1; transform:translateX(-50%) translateY(0); }

        @media(min-width:768px) { .kpi-row { grid-template-columns:repeat(4,1fr); } }
        @media(max-width:480px) { .form-row { grid-template-columns:1fr; } .client-name { font-size:1.4rem; } }
    </style>
</head>
<body>
    <div class="container">

        <!-- Hero client -->
        <div class="client-hero" id="client-hero">
            <div class="client-hero-top">
                <div class="client-name-block">
                    <div class="client-name" id="c-name">Chargement...</div>
                    <div class="client-contacts" id="c-contacts"></div>
                </div>
                <div class="client-hero-actions">
                    <button class="btn btn-outline btn-small" onclick="openEditModal()">✏️ Modifier</button>
                    <a href="./atlas-clients.html" class="btn btn-outline btn-small">← Tous les clients</a>
                </div>
            </div>
        </div>

        <!-- KPIs -->
        <div class="kpi-row">
            <div class="kpi-card"><div class="kpi-value blue" id="kpi-projets">0</div><div class="kpi-label">Projets</div></div>
            <div class="kpi-card"><div class="kpi-value orange" id="kpi-encours">0</div><div class="kpi-label">En cours</div></div>
            <div class="kpi-card"><div class="kpi-value green" id="kpi-ca">0 DH</div><div class="kpi-label">CA dépensé</div></div>
            <div class="kpi-card"><div class="kpi-value purple" id="kpi-factures">0</div><div class="kpi-label">Factures</div></div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('projets')">🏗️ Projets</button>
            <button class="tab-btn" onclick="switchTab('commandes')">📦 Commandes</button>
            <button class="tab-btn" onclick="switchTab('factures')">🧾 Factures</button>
            <button class="tab-btn" onclick="switchTab('notes')">📝 Notes</button>
        </div>

        <!-- Tab: Projets -->
        <div class="tab-content active" id="tab-projets">
            <div class="section">
                <div class="section-header">
                    <span class="section-title">🏗️ Projets du client</span>
                </div>
                <div id="projets-list"><div class="empty-state">Aucun projet</div></div>
            </div>
        </div>

        <!-- Tab: Commandes -->
        <div class="tab-content" id="tab-commandes">
            <div class="section">
                <div class="section-header">
                    <span class="section-title">📦 Commandes</span>
                </div>
                <div id="commandes-list"><div class="empty-state">Aucune commande</div></div>
            </div>
        </div>

        <!-- Tab: Factures -->
        <div class="tab-content" id="tab-factures">
            <div class="section">
                <div class="section-header">
                    <span class="section-title">🧾 Factures</span>
                </div>
                <div id="factures-list"><div class="empty-state">Aucune facture</div></div>
            </div>
        </div>

        <!-- Tab: Notes -->
        <div class="tab-content" id="tab-notes">
            <div class="section">
                <div class="section-header">
                    <span class="section-title">📝 Notes</span>
                    <button class="btn btn-outline btn-small" onclick="openEditModal()">✏️ Modifier</button>
                </div>
                <div class="notes-block" id="notes-content">Aucune note.</div>
            </div>
        </div>

    </div>

    <!-- Modal Edit Client -->
    <div class="modal" id="edit-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">✏️ Modifier le client</h3>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="form-row">
                    <div class="form-group">
                        <label>Nom complet *</label>
                        <input type="text" id="e-nom" required>
                    </div>
                    <div class="form-group">
                        <label>Référence</label>
                        <input type="text" id="e-reference">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Téléphone</label>
                        <input type="text" id="e-telephone">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="e-email">
                    </div>
                </div>
                <div class="form-row one">
                    <div class="form-group">
                        <label>Adresse</label>
                        <input type="text" id="e-adresse">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Ville</label>
                        <input type="text" id="e-ville">
                    </div>
                    <div class="form-group">
                        <label>Statut</label>
                        <select id="e-actif">
                            <option value="true">✅ Actif</option>
                            <option value="false">⛔ Inactif</option>
                        </select>
                    </div>
                </div>
                <div class="form-row one">
                    <div class="form-group">
                        <label>Notes</label>
                        <textarea id="e-notes" rows="4"></textarea>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal()">Annuler</button>
                <button class="btn btn-primary" id="save-btn" onclick="saveClient()">Enregistrer</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
const SUPABASE_URL = 'https://wxhlstificzqovfcumop.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aGxzdGlmaWN6cW92ZmN1bW9wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyNjcwOTAsImV4cCI6MjA4Njg0MzA5MH0.mt6v3SKPMhWpMw9PH7D8k3ubrR1kJNIFHw0aloLmQiQ';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let clientId = null, client = null, projets = [], commandes = [], factures = [], depenses = [];

async function init() {
    clientId = new URLSearchParams(location.search).get('id');
    if (!clientId) { location.href = './atlas-clients.html'; return; }
    await loadData();
}

async function loadData() {
    try {
        const [cRes, pRes] = await Promise.all([
            db.from('atlas_clients').select('*').eq('id', clientId).single(),
            db.from('atlas_projects').select('*').eq('client_id', clientId).order('created_at', { ascending: false })
        ]);

        client = cRes.data;
        projets = pRes.data || [];

        if (!client) { showToast('Client introuvable', true); return; }

        // Charger commandes et factures via les projets
        if (projets.length > 0) {
            const projetIds = projets.map(p => p.id);

            const [cmdRes, dRes] = await Promise.all([
                db.from('atlas_commandes').select('*').in('project_id', projetIds).order('created_at', { ascending: false }),
                db.from('atlas_depenses').select('project_id, montant').in('project_id', projetIds)
            ]);

            commandes = cmdRes.data || [];
            depenses = dRes.data || [];

            // Charger factures via commandes
            if (commandes.length > 0) {
                const cmdIds = commandes.map(c => c.id);
                const fRes = await db.from('atlas_factures').select('*').in('commande_id', cmdIds).order('date_facture', { ascending: false });
                factures = fRes.data || [];
            }

            // Charger budget pour les projets
            const bRes = await db.from('atlas_budget').select('project_id, budget_prevu').in('project_id', projetIds);
            projets.forEach(p => {
                p._budget = (bRes.data || []).filter(b => b.project_id === p.id).reduce((s, b) => s + (parseFloat(b.budget_prevu) || 0), 0);
                p._depense = depenses.filter(d => d.project_id === p.id).reduce((s, d) => s + (parseFloat(d.montant) || 0), 0);
            });
        }

        renderPage();
    } catch(err) {
        console.error('Erreur:', err);
        showToast('Erreur de chargement', true);
    }
}

function formatMoney(n) {
    return new Intl.NumberFormat('fr-MA', { minimumFractionDigits:0 }).format(n || 0) + ' DH';
}

function formatDate(d) {
    if (!d) return '-';
    return new Date(d).toLocaleDateString('fr-FR', { day:'2-digit', month:'short', year:'numeric' });
}

function renderPage() {
    document.title = client.nom + ' - Atlas Pose';

    // Hero
    const badge = client.actif !== false ? '<span class="badge-actif">Actif</span>' : '<span class="badge-inactif">Inactif</span>';
    const ref = client.reference ? `<span class="client-ref">${client.reference}</span>` : '';
    document.getElementById('c-name').innerHTML = `👤 ${client.nom} ${ref} ${badge}`;

    const contacts = [];
    if (client.telephone) contacts.push(`<span>📞 <a href="tel:${client.telephone}">${client.telephone}</a></span>`);
    if (client.email) contacts.push(`<span>✉️ <a href="mailto:${client.email}">${client.email}</a></span>`);
    if (client.adresse) contacts.push(`<span>📍 ${client.adresse}${client.ville ? ', ' + client.ville : ''}</span>`);
    else if (client.ville) contacts.push(`<span>📍 ${client.ville}</span>`);
    document.getElementById('c-contacts').innerHTML = contacts.join('');

    // KPIs
    const totalCA = depenses.reduce((s, d) => s + (parseFloat(d.montant) || 0), 0);
    document.getElementById('kpi-projets').textContent = projets.length;
    document.getElementById('kpi-encours').textContent = projets.filter(p => p.status === 'en_cours').length;
    document.getElementById('kpi-ca').textContent = formatMoney(totalCA);
    document.getElementById('kpi-factures').textContent = factures.length;

    // Notes
    document.getElementById('notes-content').textContent = client.notes || 'Aucune note.';

    renderProjets();
    renderCommandes();
    renderFactures();
}

function renderProjets() {
    const container = document.getElementById('projets-list');
    if (!projets.length) {
        container.innerHTML = '<div class="empty-state">Aucun projet lié à ce client</div>';
        return;
    }
    container.innerHTML = projets.map(p => {
        const pct = p._budget > 0 ? Math.round((p._depense / p._budget) * 100) : 0;
        return `
        <div class="projet-row" onclick="location.href='./atlas-project.html?id=${p.id}'">
            <div class="projet-info">
                <h4>${p.name}</h4>
                <div class="projet-info-meta">
                    <span>📍 ${p.localisation || '-'}</span>
                    <span>📐 ${p.surface_m2 || 0} m²</span>
                    <span>📅 ${formatDate(p.date_debut)}</span>
                </div>
            </div>
            <div class="projet-right">
                <div class="projet-budget">
                    <div class="projet-budget-val">${formatMoney(p._depense)}</div>
                    <div class="projet-budget-sub">/ ${formatMoney(p._budget)} budget • ${pct}%</div>
                </div>
                <span class="status-badge status-${p.status}">${p.status.replace('_',' ')}</span>
                <span style="color:var(--accent)">→</span>
            </div>
        </div>`;
    }).join('');
}

function renderCommandes() {
    const container = document.getElementById('commandes-list');
    if (!commandes.length) {
        container.innerHTML = '<div class="empty-state">Aucune commande</div>';
        return;
    }
    const labels = { brouillon:'📝 Brouillon', validee:'✅ Validée', recue:'📦 Reçue', annulee:'❌ Annulée', facturee:'🧾 Facturée' };
    container.innerHTML = commandes.map(c => {
        const projet = projets.find(p => p.id === c.project_id);
        return `
        <div class="item-row" onclick="location.href='./atlas-commande.html?id=${c.id}'">
            <div class="item-left">
                <h4 class="item-link">${c.numero || 'CMD-???'} — ${c.titre}</h4>
                <div class="item-left-meta">
                    <span>📅 ${formatDate(c.date_demande)}</span>
                    ${projet ? `<span>🏗️ ${projet.name}</span>` : ''}
                    ${c.demandeur ? `<span>👤 ${c.demandeur}</span>` : ''}
                </div>
            </div>
            <div style="display:flex;align-items:center;gap:10px;">
                <span class="statut-badge statut-${c.statut}">${labels[c.statut] || c.statut}</span>
                <span style="color:var(--accent)">→</span>
            </div>
        </div>`;
    }).join('');
}

function renderFactures() {
    const container = document.getElementById('factures-list');
    if (!factures.length) {
        container.innerHTML = '<div class="empty-state">Aucune facture</div>';
        return;
    }
    container.innerHTML = factures.map(f => {
        const cmd = commandes.find(c => c.id === f.commande_id);
        const projet = cmd ? projets.find(p => p.id === cmd.project_id) : null;
        return `
        <div class="item-row" onclick="location.href='./atlas-facture.html?id=${f.id}'">
            <div class="item-left">
                <h4 class="item-link">${f.numero || 'FAC-???'}</h4>
                <div class="item-left-meta">
                    <span>📅 ${formatDate(f.date_facture)}</span>
                    ${projet ? `<span>🏗️ ${projet.name}</span>` : ''}
                    ${cmd ? `<span>📦 ${cmd.numero}</span>` : ''}
                </div>
            </div>
            <div style="display:flex;align-items:center;gap:10px;">
                <span class="item-montant">${formatMoney(f.montant_total)}</span>
                <span class="statut-badge statut-${f.statut || 'emise'}">${f.statut || 'émise'}</span>
                <span style="color:var(--accent)">→</span>
            </div>
        </div>`;
    }).join('');
}

// ===== TABS =====
function switchTab(name) {
    document.querySelectorAll('.tab-btn').forEach((b,i) => {
        b.classList.toggle('active', b.getAttribute('onclick').includes(name));
    });
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
}

// ===== EDIT MODAL =====
function openEditModal() {
    document.getElementById('e-nom').value = client.nom || '';
    document.getElementById('e-reference').value = client.reference || '';
    document.getElementById('e-telephone').value = client.telephone || '';
    document.getElementById('e-email').value = client.email || '';
    document.getElementById('e-adresse').value = client.adresse || '';
    document.getElementById('e-ville').value = client.ville || '';
    document.getElementById('e-actif').value = String(client.actif !== false);
    document.getElementById('e-notes').value = client.notes || '';
    document.getElementById('edit-modal').classList.add('visible');
}

function closeModal() {
    document.getElementById('edit-modal').classList.remove('visible');
}

async function saveClient() {
    const nom = document.getElementById('e-nom').value.trim();
    if (!nom) { showToast('Le nom est obligatoire', true); return; }

    const btn = document.getElementById('save-btn');
    btn.disabled = true; btn.textContent = '...';

    const data = {
        nom,
        reference: document.getElementById('e-reference').value.trim() || null,
        telephone: document.getElementById('e-telephone').value.trim() || null,
        email: document.getElementById('e-email').value.trim() || null,
        adresse: document.getElementById('e-adresse').value.trim() || null,
        ville: document.getElementById('e-ville').value.trim() || null,
        actif: document.getElementById('e-actif').value === 'true',
        notes: document.getElementById('e-notes').value.trim() || null
    };

    try {
        const { error } = await db.from('atlas_clients').update(data).eq('id', clientId);
        if (error) throw error;
        showToast('Client mis à jour ✓');
        closeModal();
        await loadData();
    } catch(err) {
        console.error(err);
        showToast('Erreur: ' + err.message, true);
    }
    btn.disabled = false; btn.textContent = 'Enregistrer';
}

function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.background = isError ? 'var(--danger)' : 'var(--accent2)';
    t.classList.add('visible');
    setTimeout(() => t.classList.remove('visible'), 3000);
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

init();
    </script>
