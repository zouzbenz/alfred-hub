<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ouvrier - Atlas Pose</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <style>
        :root { --bg:#0a0f1a; --card:#111827; --accent:#3b82f6; --accent2:#10b981; --text:#f3f4f6; --dim:#9ca3af; --border:#1f2937; --danger:#ef4444; --warn:#f59e0b; --purple:#8b5cf6; --orange:#f97316; }
        * { box-sizing:border-box; margin:0; padding:0; }
        body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; }
        .container { max-width:900px; margin:0 auto; padding:15px; }
        .login-screen { display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px; }
        .login-box { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:30px; width:100%; max-width:400px; text-align:center; }
        .login-box h2 { margin-bottom:8px; }
        .login-box p { color:var(--dim); margin-bottom:20px; font-size:.85rem; }
        .login-box select, .login-box input { width:100%; padding:14px; background:var(--bg); border:1px solid var(--border); border-radius:10px; color:#fff; margin-bottom:12px; text-align:center; font-size:1rem; }
        .login-box button { width:100%; padding:14px; background:var(--accent); border:none; border-radius:10px; color:#fff; font-weight:600; cursor:pointer; }
        .login-error { color:var(--danger); margin-top:12px; font-size:.85rem; }
        .content { display:none; }
        .content.visible { display:block; }
        .top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px; padding:12px; background:var(--card); border-radius:12px; border:1px solid var(--border); }
        .back-link { display:inline-flex; align-items:center; gap:6px; color:var(--accent); text-decoration:none; font-size:.85rem; padding:8px 12px; background:rgba(59,130,246,.1); border-radius:8px; }
        .header { text-align:center; padding:20px 15px; }
        .header h1 { font-size:1.8rem; margin-bottom:8px; }
        .header p { color:var(--dim); font-size:.9rem; }
        .section { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px; margin-bottom:20px; }
        .section-title { font-size:1rem; font-weight:700; margin-bottom:15px; display:flex; align-items:center; gap:8px; }
        .form-row { display:grid; grid-template-columns:1fr; gap:15px; margin-bottom:15px; }
        .form-row.two { grid-template-columns:1fr 1fr; }
        .form-group { display:flex; flex-direction:column; gap:6px; }
        .form-group label { font-size:.85rem; color:var(--dim); }
        .form-group input, .form-group select, .form-group textarea { padding:12px; background:var(--bg); border:1px solid var(--border); border-radius:10px; color:#fff; font-size:.95rem; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline:none; border-color:var(--accent); }
        .form-group textarea { min-height:80px; resize:vertical; }
        .checkbox-group { display:flex; flex-wrap:wrap; gap:12px; margin:10px 0; }
        .checkbox-item { display:flex; align-items:center; gap:6px; cursor:pointer; }
        .checkbox-item input { width:18px; height:18px; accent-color:var(--accent); }
        .photo-section { display:flex; flex-direction:column; gap:10px; }
        .photo-upload { display:flex; flex-direction:column; align-items:center; gap:15px; padding:20px; border:2px dashed var(--border); border-radius:12px; cursor:pointer; transition:.2s; }
        .photo-upload:hover { border-color:var(--accent); background:rgba(59,130,246,.05); }
        .photo-upload input { display:none; }
        .photo-preview { width:200px; height:130px; border-radius:8px; object-fit:cover; display:none; }
        .photo-preview.visible { display:block; }
        .photo-placeholder { font-size:3rem; }
        .photo-text { color:var(--dim); font-size:.85rem; text-align:center; }
        .photo-actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
        .niveau-select { display:flex; gap:10px; flex-wrap:wrap; }
        .niveau-option { padding:12px 20px; border:2px solid var(--border); border-radius:12px; cursor:pointer; transition:.2s; text-align:center; flex:1; min-width:100px; }
        .niveau-option:hover { border-color:var(--accent); }
        .niveau-option.selected { border-color:var(--accent2); background:rgba(16,185,129,.1); }
        .niveau-option input { display:none; }
        .niveau-label { font-weight:600; font-size:.9rem; }
        .niveau-desc { font-size:.75rem; color:var(--dim); margin-top:4px; }
        .btn { padding:12px 24px; border:none; border-radius:10px; font-weight:600; cursor:pointer; font-size:.95rem; transition:.2s; display:inline-flex; align-items:center; gap:8px; }
        .btn:hover { transform:translateY(-1px); }
        .btn-primary { background:var(--accent); color:#fff; }
        .btn-success { background:var(--accent2); color:#fff; }
        .btn-danger { background:var(--danger); color:#fff; }
        .btn-outline { background:transparent; border:1px solid var(--border); color:var(--text); }
        .btn-small { padding:6px 12px; font-size:.8rem; }
        .actions { display:flex; gap:12px; justify-content:flex-end; flex-wrap:wrap; margin-top:20px; }
        .affectation-item { display:flex; justify-content:space-between; align-items:center; padding:12px; background:var(--bg); border-radius:10px; margin-bottom:10px; flex-wrap:wrap; gap:10px; }
        .affectation-info { flex:1; }
        .affectation-project { font-weight:600; }
        .affectation-dates { font-size:.8rem; color:var(--dim); margin-top:4px; }
        .affectation-actions { display:flex; gap:8px; }
        .add-affectation { padding:15px; background:var(--bg); border-radius:10px; margin-top:15px; display:none; }
        .add-affectation.visible { display:block; }
        .pointage-item { display:flex; justify-content:space-between; align-items:center; padding:10px; border-bottom:1px solid var(--border); }
        .pointage-item:last-child { border-bottom:none; }
        .pointage-date { font-weight:600; }
        .pointage-details { font-size:.85rem; color:var(--dim); }
        .pointage-montant { font-weight:700; color:var(--accent2); }
        .pointage-statut { padding:3px 8px; border-radius:10px; font-size:.7rem; font-weight:600; }
        .statut-present { background:rgba(16,185,129,.2); color:var(--accent2); }
        .statut-absent { background:rgba(239,68,68,.2); color:var(--danger); }
        .statut-demi_journee { background:rgba(245,158,11,.2); color:var(--warn); }
        
        /* Modal Photo CIN */
        .photo-modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.95); z-index:2000; justify-content:center; align-items:center; padding:20px; }
        .photo-modal.visible { display:flex; }
        .photo-modal img { max-width:100%; max-height:90vh; object-fit:contain; border-radius:8px; }
        .photo-modal-close { position:absolute; top:20px; right:20px; background:var(--card); border:none; color:#fff; font-size:1.5rem; padding:10px 15px; border-radius:10px; cursor:pointer; }
        
        .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--accent2); color:#fff; padding:12px 24px; border-radius:10px; font-weight:600; z-index:2000; opacity:0; transition:.3s; }
        .toast.visible { opacity:1; transform:translateX(-50%) translateY(0); }
        @media(max-width:600px) { .form-row.two { grid-template-columns:1fr; } .niveau-select { flex-direction:column; } }
    </style>
</head>
<body>
    <div class="login-screen" id="login-screen">
        <div class="login-box">
            <h2>🔐 Accès Main d'œuvre</h2>
            <p>Sélectionnez votre nom</p>
            <select id="user-select">
                <option value="">-- Sélectionnez --</option>
                <option value="Badr">Badr</option>
                <option value="Oussama">Oussama</option>
            </select>
            <input type="password" id="password-input" placeholder="Mot de passe" onkeypress="if(event.key==='Enter')checkPassword()">
            <button onclick="checkPassword()">Accéder</button>
            <div class="login-error" id="login-error"></div>
        </div>
    </div>
    
    <div class="content" id="content">
        <div class="container">
            <div class="top-bar">
                <a href="./atlas-ouvriers.html" class="back-link">← Tous les ouvriers</a>
                <a href="./atlas-backoffice.html" class="back-link">⚙️ Admin</a>
            </div>
            
            <div class="header">
                <h1 id="page-title">👷 Nouvel ouvrier</h1>
                <p id="page-subtitle">Ajouter un nouveau membre</p>
            </div>
            
            <form id="ouvrier-form" onsubmit="saveOuvrier(event)">
                <input type="hidden" id="ouvrier-id">
                <input type="hidden" id="existing-cin-path">
                
                <div class="section">
                    <h3 class="section-title">🪪 Identité</h3>
                    <div class="form-row two">
                        <div class="form-group"><label>Prénom *</label><input type="text" id="prenom" required></div>
                        <div class="form-group"><label>Nom *</label><input type="text" id="nom" required></div>
                    </div>
                    <div class="form-row two">
                        <div class="form-group"><label>Date de naissance</label><input type="date" id="date-naissance"></div>
                        <div class="form-group"><label>Numéro CIN *</label><input type="text" id="cin" required placeholder="Ex: AB123456"></div>
                    </div>
                    <div class="form-group"><label>Téléphone</label><input type="tel" id="telephone" placeholder="Ex: 0612345678"></div>
                    
                    <div class="form-group">
                        <label>Photo CIN</label>
                        <div class="photo-section">
                            <label class="photo-upload" id="photo-upload-label">
                                <input type="file" id="cin-photo" accept="image/*" onchange="previewPhoto(this)">
                                <img class="photo-preview" id="photo-preview">
                                <span class="photo-placeholder" id="photo-placeholder">📷</span>
                                <span class="photo-text" id="photo-text">Cliquez pour ajouter la photo CIN</span>
                            </label>
                            <div class="photo-actions" id="photo-actions" style="display:none;">
                                <button type="button" class="btn btn-primary btn-small" onclick="viewCINPhoto()">👁️ Voir CIN</button>
                                <button type="button" class="btn btn-outline btn-small" onclick="changeCINPhoto()">📷 Changer</button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="section">
                    <h3 class="section-title">🔧 Compétences</h3>
                    <div class="form-row two">
                        <div class="form-group">
                            <label>Position *</label>
                            <select id="position" required>
                                <option value="aide">🤝 Aide</option>
                                <option value="poseur">🔧 Poseur</option>
                                <option value="chef_chantier">👷 Chef de chantier</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Type de contrat</label>
                            <select id="type-contrat" onchange="toggleEquipeFields()">
                                <option value="independant">🧍 Indépendant</option>
                                <option value="equipe">👥 Équipe</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group" id="equipe-fields" style="display:none;">
                        <label>Chef d'équipe / Entreprise</label>
                        <select id="chef-equipe"><option value="">-- Sélectionner --</option></select>
                        <input type="text" id="entreprise-nom" placeholder="Ou nom de l'entreprise" style="margin-top:8px;">
                    </div>
                    <div class="form-group">
                        <label>Spécialités</label>
                        <div class="checkbox-group">
                            <label class="checkbox-item"><input type="checkbox" name="specialite" value="carrelage"> Carrelage</label>
                            <label class="checkbox-item"><input type="checkbox" name="specialite" value="marbre"> Marbre</label>
                            <label class="checkbox-item"><input type="checkbox" name="specialite" value="parquet"> Parquet</label>
                            <label class="checkbox-item"><input type="checkbox" name="specialite" value="autre"> Autre</label>
                        </div>
                    </div>
                    <div class="form-group" id="specialite-autre-field" style="display:none;">
                        <label>Précisez</label>
                        <input type="text" id="specialite-autre" placeholder="Ex: Mosaïque...">
                    </div>
                    <div class="form-group">
                        <label>Niveau de compétence</label>
                        <div class="niveau-select">
                            <label class="niveau-option" onclick="selectNiveau(this,'basic')">
                                <input type="radio" name="niveau" value="basic">
                                <div class="niveau-label">📦 Basic</div>
                                <div class="niveau-desc">Débutant</div>
                            </label>
                            <label class="niveau-option" onclick="selectNiveau(this,'premium')">
                                <input type="radio" name="niveau" value="premium">
                                <div class="niveau-label">💎 Premium</div>
                                <div class="niveau-desc">Expérimenté</div>
                            </label>
                            <label class="niveau-option" onclick="selectNiveau(this,'tout_terrain')">
                                <input type="radio" name="niveau" value="tout_terrain">
                                <div class="niveau-label">⭐ Tout Terrain</div>
                                <div class="niveau-desc">Expert polyvalent</div>
                            </label>
                        </div>
                    </div>
                </div>
                
                <div class="section">
                    <h3 class="section-title">📝 Notes</h3>
                    <div class="form-group"><textarea id="notes" placeholder="Informations supplémentaires..."></textarea></div>
                    <div class="form-group"><label class="checkbox-item"><input type="checkbox" id="actif" checked> Ouvrier actif</label></div>
                </div>
                
                <div class="actions">
                    <button type="button" class="btn btn-outline" onclick="history.back()">Annuler</button>
                    <button type="button" class="btn btn-danger" id="delete-btn" style="display:none;" onclick="deleteOuvrier()">Supprimer</button>
                    <button type="submit" class="btn btn-success" id="save-btn">Enregistrer</button>
                </div>
            </form>
            
            <div class="section" id="affectations-section" style="display:none;">
                <h3 class="section-title">🏗️ Chantiers affectés</h3>
                <div id="affectations-list"></div>
                <button type="button" class="btn btn-outline" onclick="toggleAddAffectation()" style="margin-top:15px;">+ Affecter à un chantier</button>
                <div class="add-affectation" id="add-affectation-form">
                    <div class="form-row two">
                        <div class="form-group"><label>Projet</label><select id="new-affectation-project"></select></div>
                        <div class="form-group"><label>Date début</label><input type="date" id="new-affectation-date"></div>
                    </div>
                    <div class="form-row two">
                        <div class="form-group"><label>Rôle</label><input type="text" id="new-affectation-role" placeholder="Ex: Poseur principal"></div>
                        <div class="form-group"><label>Taux journalier (MAD)</label><input type="number" id="new-affectation-taux" min="0" step="50"></div>
                    </div>
                    <div style="display:flex;gap:10px;margin-top:10px;">
                        <button type="button" class="btn btn-success btn-small" onclick="saveAffectation()">Enregistrer</button>
                        <button type="button" class="btn btn-outline btn-small" onclick="toggleAddAffectation()">Annuler</button>
                    </div>
                </div>
            </div>
            
            <div class="section" id="pointage-section" style="display:none;">
                <h3 class="section-title">📋 Historique pointage (30j)</h3>
                <div id="pointage-list"></div>
            </div>
        </div>
    </div>
    
    <!-- Modal Photo CIN -->
    <div class="photo-modal" id="cin-modal" onclick="closeCINModal()">
        <button class="photo-modal-close" onclick="closeCINModal()">×</button>
        <img id="cin-modal-img" src="" alt="Photo CIN">
    </div>
    
    <div class="toast" id="toast"></div>
    
    <script>
const SUPABASE_URL = 'https://wxhlstificzqovfcumop.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aGxzdGlmaWN6cW92ZmN1bW9wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyNjcwOTAsImV4cCI6MjA4Njg0MzA5MH0.mt6v3SKPMhWpMw9PH7D8k3ubrR1kJNIFHw0aloLmQiQ';
const STORAGE_BUCKET = 'atlas-cin';
const PASSWORD = 'atlas2026';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = '', ouvrierId = null;
let ouvrier = null, affectations = [], projects = [], chefs = [], pointages = [];
let selectedPhotoFile = null;
let existingCINUrl = null;

if (sessionStorage.getItem('atlas-auth') === 'true') { currentUser = sessionStorage.getItem('atlas-user') || ''; showContent(); }

function checkPassword() {
    const user = document.getElementById('user-select').value;
    const pwd = document.getElementById('password-input').value;
    if (!user) { document.getElementById('login-error').textContent = 'Sélectionnez votre nom'; return; }
    if (pwd === PASSWORD) { currentUser = user; sessionStorage.setItem('atlas-auth', 'true'); sessionStorage.setItem('atlas-user', user); showContent(); }
    else { document.getElementById('login-error').textContent = 'Mot de passe incorrect'; }
}

async function showContent() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('content').classList.add('visible');
    ouvrierId = new URLSearchParams(window.location.search).get('id');
    await loadData();
    if (ouvrierId) await loadOuvrier();
}

async function loadData() {
    try {
        const [pRes, cRes] = await Promise.all([
            db.from('atlas_projects').select('id, name, status').order('name'),
            db.from('atlas_main_oeuvre').select('id, nom, prenom').eq('position', 'chef_chantier').eq('actif', true)
        ]);
        projects = pRes.data || []; chefs = cRes.data || [];
        document.getElementById('chef-equipe').innerHTML = '<option value="">-- Sélectionner --</option>' + chefs.map(c => `<option value="${c.id}">${c.prenom} ${c.nom}</option>`).join('');
        document.getElementById('new-affectation-project').innerHTML = '<option value="">-- Sélectionner --</option>' + projects.filter(p => p.status !== 'termine').map(p => `<option value="${p.id}">${p.name}</option>`).join('');
    } catch (err) { console.error('Erreur:', err); }
}

async function loadOuvrier() {
    try {
        const { data, error } = await db.from('atlas_main_oeuvre').select('*').eq('id', ouvrierId).single();
        if (error) throw error;
        ouvrier = data;
        document.getElementById('page-title').textContent = `👷 ${ouvrier.prenom} ${ouvrier.nom}`;
        document.getElementById('page-subtitle').textContent = 'Modifier les informations';
        document.getElementById('ouvrier-id').value = ouvrier.id;
        document.getElementById('prenom').value = ouvrier.prenom;
        document.getElementById('nom').value = ouvrier.nom;
        document.getElementById('date-naissance').value = ouvrier.date_naissance || '';
        document.getElementById('cin').value = ouvrier.cin;
        document.getElementById('telephone').value = ouvrier.telephone || '';
        document.getElementById('position').value = ouvrier.position;
        document.getElementById('type-contrat').value = ouvrier.type_contrat || 'independant';
        document.getElementById('chef-equipe').value = ouvrier.chef_equipe_id || '';
        document.getElementById('entreprise-nom').value = ouvrier.entreprise_nom || '';
        document.getElementById('notes').value = ouvrier.notes || '';
        document.getElementById('actif').checked = ouvrier.actif;
        document.getElementById('specialite-autre').value = ouvrier.specialite_autre || '';
        
        const specialites = ouvrier.specialites || [];
        document.querySelectorAll('input[name="specialite"]').forEach(cb => { cb.checked = specialites.includes(cb.value); });
        if (specialites.includes('autre')) document.getElementById('specialite-autre-field').style.display = 'block';
        
        const niveau = ouvrier.niveau_competence || 'basic';
        document.querySelectorAll('.niveau-option').forEach(opt => { if (opt.querySelector('input').value === niveau) { opt.classList.add('selected'); opt.querySelector('input').checked = true; } });
        
        // Photo CIN existante
        if (ouvrier.cin_photo_path) {
            existingCINUrl = `${SUPABASE_URL}/storage/v1/object/public/${STORAGE_BUCKET}/${ouvrier.cin_photo_path}`;
            document.getElementById('existing-cin-path').value = ouvrier.cin_photo_path;
            const preview = document.getElementById('photo-preview');
            preview.src = existingCINUrl;
            preview.classList.add('visible');
            document.getElementById('photo-placeholder').style.display = 'none';
            document.getElementById('photo-text').textContent = 'Photo CIN enregistrée';
            document.getElementById('photo-actions').style.display = 'flex';
        }
        
        toggleEquipeFields();
        document.getElementById('delete-btn').style.display = 'inline-flex';
        document.getElementById('affectations-section').style.display = 'block';
        document.getElementById('pointage-section').style.display = 'block';
        
        await loadAffectations(); await loadPointages();
    } catch (err) { console.error('Erreur:', err); showToast('Ouvrier introuvable', true); }
}

async function loadAffectations() { const { data } = await db.from('atlas_affectations').select('*').eq('ouvrier_id', ouvrierId).order('date_debut', { ascending: false }); affectations = data || []; renderAffectations(); }

function renderAffectations() {
    const list = document.getElementById('affectations-list');
    if (!affectations.length) { list.innerHTML = '<div style="color:var(--dim);text-align:center;padding:20px;">Aucune affectation</div>'; return; }
    list.innerHTML = affectations.map(a => {
        const project = projects.find(p => p.id === a.project_id); const isActive = !a.date_fin;
        return `<div class="affectation-item"><div class="affectation-info"><div class="affectation-project">${project?.name || 'Projet inconnu'} ${isActive ? '🟢' : '⚪'}</div><div class="affectation-dates">📅 ${formatDate(a.date_debut)} ${a.date_fin ? '→ ' + formatDate(a.date_fin) : '(en cours)'}${a.taux_journalier ? ' | 💰 ' + a.taux_journalier + ' MAD/j' : ''}${a.role_chantier ? ' | ' + a.role_chantier : ''}</div></div><div class="affectation-actions">${isActive ? `<button class="btn btn-outline btn-small" onclick="endAffectation(${a.id})">Terminer</button>` : ''}<button class="btn btn-danger btn-small" onclick="deleteAffectation(${a.id})">×</button></div></div>`;
    }).join('');
}

async function loadPointages() { const thirtyDaysAgo = new Date(); thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30); const { data } = await db.from('atlas_pointage').select('*').eq('ouvrier_id', ouvrierId).gte('date_pointage', thirtyDaysAgo.toISOString().split('T')[0]).order('date_pointage', { ascending: false }); pointages = data || []; renderPointages(); }

function renderPointages() {
    const list = document.getElementById('pointage-list');
    if (!pointages.length) { list.innerHTML = '<div style="color:var(--dim);text-align:center;padding:20px;">Aucun pointage récent</div>'; return; }
    list.innerHTML = pointages.map(p => { const project = projects.find(pr => pr.id === p.project_id); return `<div class="pointage-item"><div><div class="pointage-date">${formatDate(p.date_pointage)}</div><div class="pointage-details">${project?.name || '-'} | ${p.heures}h</div></div><div style="display:flex;align-items:center;gap:10px;"><span class="pointage-statut statut-${p.statut}">${p.statut}</span>${p.montant_du ? `<span class="pointage-montant">${p.montant_du} MAD</span>` : ''}${p.paye ? ' ✅' : ''}</div></div>`; }).join('');
}

function toggleEquipeFields() { document.getElementById('equipe-fields').style.display = document.getElementById('type-contrat').value === 'equipe' ? 'block' : 'none'; }
function selectNiveau(el, val) { document.querySelectorAll('.niveau-option').forEach(o => o.classList.remove('selected')); el.classList.add('selected'); el.querySelector('input').checked = true; }

function previewPhoto(input) { 
    if (input.files && input.files[0]) { 
        selectedPhotoFile = input.files[0]; 
        const reader = new FileReader(); 
        reader.onload = e => { 
            const preview = document.getElementById('photo-preview'); 
            preview.src = e.target.result; 
            preview.classList.add('visible'); 
            document.getElementById('photo-placeholder').style.display = 'none'; 
            document.getElementById('photo-text').textContent = 'Nouvelle photo sélectionnée';
            document.getElementById('photo-actions').style.display = 'flex';
        }; 
        reader.readAsDataURL(input.files[0]); 
    } 
}

function viewCINPhoto() {
    const preview = document.getElementById('photo-preview');
    if (preview.src) {
        document.getElementById('cin-modal-img').src = preview.src;
        document.getElementById('cin-modal').classList.add('visible');
    }
}

function closeCINModal() {
    document.getElementById('cin-modal').classList.remove('visible');
}

function changeCINPhoto() {
    document.getElementById('cin-photo').click();
}

document.querySelectorAll('input[name="specialite"]').forEach(cb => { cb.addEventListener('change', () => { document.getElementById('specialite-autre-field').style.display = document.querySelector('input[name="specialite"][value="autre"]').checked ? 'block' : 'none'; }); });

async function saveOuvrier(e) {
    e.preventDefault(); const btn = document.getElementById('save-btn'); btn.disabled = true; btn.textContent = 'Enregistrement...';
    const specialites = Array.from(document.querySelectorAll('input[name="specialite"]:checked')).map(cb => cb.value);
    const niveauInput = document.querySelector('input[name="niveau"]:checked');
    
    const data = { 
        nom: document.getElementById('nom').value, 
        prenom: document.getElementById('prenom').value, 
        date_naissance: document.getElementById('date-naissance').value || null, 
        cin: document.getElementById('cin').value, 
        telephone: document.getElementById('telephone').value || null, 
        position: document.getElementById('position').value, 
        specialites: specialites, 
        specialite_autre: document.getElementById('specialite-autre').value || null, 
        type_contrat: document.getElementById('type-contrat').value, 
        chef_equipe_id: document.getElementById('chef-equipe').value || null, 
        entreprise_nom: document.getElementById('entreprise-nom').value || null, 
        niveau_competence: niveauInput ? niveauInput.value : 'basic', 
        notes: document.getElementById('notes').value || null, 
        actif: document.getElementById('actif').checked, 
        updated_at: new Date().toISOString() 
    };
    
    // Conserver le chemin existant si pas de nouvelle photo
    const existingPath = document.getElementById('existing-cin-path').value;
    if (existingPath && !selectedPhotoFile) {
        data.cin_photo_path = existingPath;
    }
    
    try {
        // Upload nouvelle photo si sélectionnée
        if (selectedPhotoFile) { 
            const ext = selectedPhotoFile.name.split('.').pop(); 
            const fileName = `cin_${data.cin}_${Date.now()}.${ext}`; 
            const { error: uploadError } = await db.storage.from(STORAGE_BUCKET).upload(fileName, selectedPhotoFile); 
            if (uploadError) throw uploadError; 
            data.cin_photo_path = fileName; 
        }
        
        let result; 
        if (ouvrierId) { 
            result = await db.from('atlas_main_oeuvre').update(data).eq('id', ouvrierId); 
        } else { 
            result = await db.from('atlas_main_oeuvre').insert([data]).select(); 
        }
        
        if (result.error) throw result.error;
        showToast('Ouvrier enregistré !');
        
        if (!ouvrierId && result.data?.[0]?.id) { 
            setTimeout(() => window.location.href = `./atlas-ouvrier.html?id=${result.data[0].id}`, 1000); 
        }
    } catch (err) { 
        console.error('Erreur:', err); 
        showToast('Erreur: ' + err.message, true); 
    } finally { 
        btn.disabled = false; 
        btn.textContent = 'Enregistrer'; 
    }
}

async function deleteOuvrier() {
    if (!confirm('Supprimer cet ouvrier ? Ses affectations et pointages seront aussi supprimés.')) return;
    try { 
        await db.from('atlas_pointage').delete().eq('ouvrier_id', ouvrierId); 
        await db.from('atlas_affectations').delete().eq('ouvrier_id', ouvrierId); 
        await db.from('atlas_main_oeuvre').delete().eq('id', ouvrierId); 
        showToast('Ouvrier supprimé'); 
        setTimeout(() => window.location.href = './atlas-ouvriers.html', 1000); 
    } catch (err) { 
        console.error('Erreur:', err); 
        showToast('Erreur suppression', true); 
    }
}

function toggleAddAffectation() { const form = document.getElementById('add-affectation-form'); form.classList.toggle('visible'); if (form.classList.contains('visible')) { document.getElementById('new-affectation-date').value = new Date().toISOString().split('T')[0]; } }

async function saveAffectation() {
    const projectId = document.getElementById('new-affectation-project').value;
    if (!projectId) { showToast('Sélectionnez un projet', true); return; }
    const data = { ouvrier_id: parseInt(ouvrierId), project_id: parseInt(projectId), date_debut: document.getElementById('new-affectation-date').value || new Date().toISOString().split('T')[0], role_chantier: document.getElementById('new-affectation-role').value || null, taux_journalier: parseFloat(document.getElementById('new-affectation-taux').value) || null };
    try { const { error } = await db.from('atlas_affectations').insert([data]); if (error) throw error; showToast('Affectation ajoutée'); toggleAddAffectation(); await loadAffectations(); } catch (err) { console.error('Erreur:', err); showToast('Erreur: ' + err.message, true); }
}

async function endAffectation(id) { if (!confirm('Terminer cette affectation ?')) return; try { await db.from('atlas_affectations').update({ date_fin: new Date().toISOString().split('T')[0] }).eq('id', id); showToast('Affectation terminée'); await loadAffectations(); } catch (err) { showToast('Erreur', true); } }
async function deleteAffectation(id) { if (!confirm('Supprimer cette affectation ?')) return; try { await db.from('atlas_affectations').delete().eq('id', id); showToast('Affectation supprimée'); await loadAffectations(); } catch (err) { showToast('Erreur', true); } }

function formatDate(d) { if (!d) return '-'; return new Date(d).toLocaleDateString('fr-FR', { day:'2-digit', month:'short', year:'numeric' }); }
function showToast(msg, isError = false) { const toast = document.getElementById('toast'); toast.textContent = msg; toast.style.background = isError ? 'var(--danger)' : 'var(--accent2)'; toast.classList.add('visible'); setTimeout(() => toast.classList.remove('visible'), 3000); }
    </script>
</body>
</html>
