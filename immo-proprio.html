<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Propriétaire — Insta Immo</title>
    <meta name="description" content="Espace propriétaire Insta Immo : suivez l'avancement de la vente de vos biens, visites et offres en temps réel.">
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./immo-core.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <style>
        .bien-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
        .bien-head h3{font-size:1.15rem;margin-top:8px}
        .bien-head .price{font-size:1.25rem;font-weight:800;white-space:nowrap}
        .bien-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
        .stat{text-align:center;padding:14px 8px;background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm)}
        .stat-value{font-size:1.35rem;font-weight:800}
        .stat-label{font-size:.75rem;color:var(--dim);margin-top:2px}
        .progress-track{height:8px;background:var(--card2);border-radius:999px;margin-top:16px;overflow:hidden}
        .progress-fill{height:100%;background:var(--accent);border-radius:999px;transition:width .6s ease}

        /* Timeline */
        .timeline{position:relative;padding-left:26px;margin-top:6px}
        .timeline::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--border)}
        .timeline-item{position:relative;padding:0 0 20px 14px}
        .timeline-item:last-child{padding-bottom:4px}
        .timeline-dot{position:absolute;left:-24px;top:3px;width:18px;height:18px;border-radius:50%;
          background:#fff;border:2px solid var(--border);display:grid;place-items:center;font-size:.6rem}
        .timeline-dot.done{background:var(--green);border-color:var(--green);color:#fff}
        .timeline-dot.current{background:var(--accent);border-color:var(--accent);animation:pulse 2s infinite}
        @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,193,7,.5)}50%{box-shadow:0 0 0 7px rgba(255,193,7,0)}}
        .timeline-title{font-weight:600;font-size:.95rem}
        .timeline-item.pending .timeline-title{color:var(--dim);font-weight:500}
        .timeline-date{font-size:.8rem;color:var(--dim);margin-top:2px}
        .timeline-notes{font-size:.86rem;color:var(--dim);margin-top:5px;background:var(--card2);
          padding:9px 12px;border-radius:8px;line-height:1.6}

        .list-item{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
          background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;margin-bottom:10px;flex-wrap:wrap}
        .list-main{flex:1;min-width:180px}
        .list-title{font-weight:700;font-size:.95rem}
        .list-sub{font-size:.85rem;color:var(--dim);margin-top:2px;line-height:1.5}
        .offre-amount{font-size:1.15rem;font-weight:800}
        .logout-link{background:none;border:none;color:var(--dim);font-size:.84rem;cursor:pointer;text-decoration:underline}
    </style>
</head>
<body>
    <div class="container">
        <header class="brand-header">
            <a class="brand" href="#" onclick="return false"><b>Insta Immo</b><small>Espace propriétaire</small></a>
            <button class="logout-link" id="logout-btn" onclick="logout()" hidden>Se déconnecter</button>
        </header>

        <div id="login-screen">
            <div class="login-wrap">
                <form class="login-box" onsubmit="event.preventDefault();login();">
                    <div class="login-icon" aria-hidden="true" id="login-ico"></div>
                    <h2>Accès propriétaire</h2>
                    <p class="login-sub">Entrez le code d'accès transmis par votre agent</p>
                    <input type="text" id="login-code" class="input" placeholder="Votre code d'accès"
                        autocomplete="off" autocapitalize="none" spellcheck="false" style="text-align:center;margin-bottom:14px">
                    <button type="submit" class="btn btn-primary btn-block" id="login-btn">Suivre mes biens</button>
                    <p class="login-error" id="login-error" role="alert"></p>
                </form>
            </div>
        </div>

        <main id="main-app" style="display:none" aria-live="polite"></main>

        <footer class="site-footer">
            <p><strong>Insta Immo</strong> — Zouhair Benazzouz · Casablanca</p>
        </footer>
    </div>

    <script src="./immo-core.js"></script>
    <script>
document.getElementById('login-ico').innerHTML = ICO.cadenas;
let portal = null; // { proprio, biens, visites:[{visite,client,bien_reference}], offres:[...], etapes:[{etape,bien_reference}] }

async function login(codeParam) {
    const input = document.getElementById('login-code');
    const code = (codeParam || input.value || '').trim();
    const errEl = document.getElementById('login-error');
    if (!code) { errEl.textContent = 'Entrez votre code d\'accès.'; return; }

    const btn = document.getElementById('login-btn');
    btn.disabled = true; btn.textContent = 'Vérification…'; errEl.textContent = '';

    try {
        const { data, error } = await db.rpc('immo_proprio_portal', { p_code: code });
        if (error) throw error;
        if (!data) { errEl.textContent = 'Code invalide. Vérifiez le code transmis par votre agent.'; return; }

        portal = data;
        sessionStorage.setItem('immo_proprio_code', code);
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        document.getElementById('logout-btn').hidden = false;
        render();
    } catch (err) {
        console.error(err);
        errEl.textContent = 'Connexion impossible pour le moment. Réessayez dans un instant.';
    } finally {
        btn.disabled = false; btn.textContent = 'Suivre mes biens';
    }
}

function logout() {
    sessionStorage.removeItem('immo_proprio_code');
    location.href = location.pathname;
}

function render() {
    const proprio = portal.proprio;
    const biens = portal.biens || [];
    const visites = portal.visites || [];
    const offres = portal.offres || [];
    const etapes = portal.etapes || [];

    const biensHTML = biens.map(b => {
        const bVisites = visites.filter(v => v.visite.bien_id === b.id);
        const bOffres = offres.filter(o => o.offre.bien_id === b.id);
        const bEtapes = etapes.filter(e => e.etape.bien_id === b.id)
            .sort((x, y) => ETAPE_ORDER.indexOf(x.etape.etape) - ETAPE_ORDER.indexOf(y.etape.etape));

        const doneSet = new Set(bEtapes.map(e => e.etape.etape));
        const lastDoneIdx = ETAPE_ORDER.reduce((acc, et, i) => doneSet.has(et) ? i : acc, -1);
        const currentIdx = lastDoneIdx + 1;
        const pct = Math.round((doneSet.size / ETAPE_ORDER.length) * 100);

        const timelineHTML = ETAPE_ORDER.map((et, idx) => {
            if (!(doneSet.has(et) || idx <= currentIdx + 1)) return '';
            const data = bEtapes.find(e => e.etape.etape === et)?.etape;
            const isDone = doneSet.has(et);
            const isCurrent = idx === currentIdx;
            return `
            <div class="timeline-item ${isDone ? 'done' : isCurrent ? 'current' : 'pending'}">
                <div class="timeline-dot ${isDone ? 'done' : isCurrent ? 'current' : ''}">${isDone ? '✓' : ''}</div>
                <div class="timeline-title">${esc(ETAPE_LABELS[et])}</div>
                ${data ? `<div class="timeline-date">${formatDate(data.date_etape)}</div>` : (isCurrent ? '<div class="timeline-date">En cours</div>' : '')}
                ${data?.notes ? `<div class="timeline-notes">${escMultiline(data.notes)}</div>` : ''}
            </div>`;
        }).join('');

        return `
        <section class="section card">
            <div class="bien-head">
                <div>
                    <span class="ref-plate">${esc(b.reference)}</span>
                    <h3 class="display" style="font-weight:500">${esc(b.titre)}</h3>
                    <p style="color:var(--dim);font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;margin-top:4px">${esc(ZONE_LABELS[b.zone] || b.zone)}${b.quartier ? ' · ' + esc(b.quartier) : ''}</p>
                </div>
                <div class="price">${formatMoney(b.prix)} <small style="font-size:.65em;color:var(--dim)">MAD</small></div>
            </div>
            <div class="bien-stats">
                <div class="stat"><div class="stat-value">${bVisites.length}</div><div class="stat-label">Visites</div></div>
                <div class="stat"><div class="stat-value">${bOffres.length}</div><div class="stat-label">Offres</div></div>
                <div class="stat"><div class="stat-value">${pct}%</div><div class="stat-label">Avancement</div></div>
            </div>
            <div class="progress-track" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Avancement de la vente">
                <div class="progress-fill" style="width:${pct}%"></div>
            </div>
            <h4 class="section-title" style="margin-top:28px;font-size:1.05rem">Avancement de la vente</h4>
            <div class="timeline">${timelineHTML}</div>
        </section>`;
    }).join('');

    const visitesHTML = visites.length ? visites.slice(0, 10).map(({ visite: v, client: c, bien_reference }) => `
        <div class="list-item">
            <div class="list-main">
                <div class="list-title">${formatDate(v.date_visite)} · ${esc(bien_reference || '')}</div>
                <div class="list-sub">${esc(INTERET_LABELS[v.interet] || 'En attente du retour visiteur')}</div>
            </div>
            ${v.type_visite ? `<span class="badge badge-blue">${esc(String(v.type_visite).replace(/_/g, ' '))}</span>` : ''}
        </div>`).join('') : '<div class="empty">Aucune visite pour le moment. Dès qu\'un acheteur visite votre bien, elle apparaît ici.</div>';

    const offresHTML = offres.length ? offres.map(({ offre: o, bien_reference }) => {
        const [label, color] = STATUT_OFFRE[o.statut] || ['En attente', 'orange'];
        return `
        <div class="list-item">
            <div class="list-main">
                <div class="offre-amount">${formatMoney(o.montant)} <small style="font-size:.65em;color:var(--dim)">MAD</small></div>
                <div class="list-sub">${esc(bien_reference || '')} · reçue le ${formatDate(o.date_offre)}
                ${o.conditions ? `<br>${esc(o.conditions)}` : ''}</div>
            </div>
            <span class="badge badge-${color}">${esc(label)}</span>
        </div>`;
    }).join('') : '<div class="empty">Aucune offre reçue pour le moment.</div>';

    document.getElementById('main-app').innerHTML = `
        <div class="welcome">
            <h2 class="display">Bonjour ${esc(proprio.prenom || proprio.nom)}</h2>
            <p>Suivez la vente de ${biens.length > 1 ? 'vos biens' : 'votre bien'} en toute transparence</p>
        </div>

        ${biensHTML || '<section class="section"><div class="empty">Aucun bien enregistré pour le moment.</div></section>'}

        <section class="section">
            <h3 class="section-title">Dernières visites <span class="badge">${visites.length}</span></h3>
            ${visitesHTML}
        </section>

        <section class="section">
            <h3 class="section-title">Offres reçues <span class="badge">${offres.length}</span></h3>
            ${offresHTML}
        </section>

        <div class="contact-box">
            <h3>Une question sur la vente ?</h3>
            <p>Votre agent est disponible 7j/7</p>
            <div class="contact-actions">
                <a href="${AGENCE.whatsapp}" class="btn btn-primary" rel="noopener">Écrire sur WhatsApp</a>
                <a href="tel:${AGENCE.tel}" class="btn btn-outline">${esc(AGENCE.tel)}</a>
            </div>
        </div>`;
}

const urlCode = new URLSearchParams(location.search).get('code');
const savedCode = sessionStorage.getItem('immo_proprio_code');
if (urlCode || savedCode) {
    document.getElementById('login-code').value = urlCode || savedCode;
    login(urlCode || savedCode);
}
    </script>
</body>
</html>
