<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clients - Atlas Pose</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <style>
        :root { --bg:#0a0f1a; --card:#111827; --accent:#3b82f6; --accent2:#10b981; --text:#f3f4f6; --dim:#9ca3af; --border:#1f2937; --danger:#ef4444; --warn:#f59e0b; --purple:#8b5cf6; --orange:#f97316; }
        * { box-sizing:border-box; margin:0; padding:0; }
        body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; }
        .container { max-width:1200px; margin:0 auto; padding:15px; }

        .header { text-align:center; padding:20px 15px 25px; }
        .header h1 { font-size:2rem; margin-bottom:8px; display:flex; align-items:center; justify-content:center; gap:10px; }
        .header p { color:var(--dim); font-size:1rem; }

        .stats-row { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:25px; }
        .stat-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:15px; text-align:center; }
        .stat-value { font-size:1.5rem; font-weight:800; }
        .stat-value.blue { color:var(--accent); }
        .stat-value.green { color:var(--accent2); }
        .stat-value.orange { color:var(--warn); }
        .stat-value.purple { color:var(--purple); }
        .stat-label { font-size:.75rem; color:var(--dim); margin-top:4px; }

        .actions-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px; }
        .search-box { flex:1; max-width:380px; }
        .search-box input { width:100%; padding:11px 16px; background:var(--card); border:1px solid var(--border); border-radius:25px; color:#fff; font-size:.9rem; }
        .search-box input:focus { outline:none; border-color:var(--accent); }

        .btn { padding:10px 18px; border:none; border-radius:10px; font-weight:600; cursor:pointer; font-size:.85rem; transition:.2s; display:inline-flex; align-items:center; gap:6px; text-decoration:none; }
        .btn:hover { transform:translateY(-1px); }
        .btn-primary { background:var(--accent); color:#fff; }
        .btn-danger { background:var(--danger); color:#fff; }
        .btn-outline { background:transparent; border:1px solid var(--border); color:var(--text); }
        .btn-small { padding:6px 12px; font-size:.8rem; }
        .btn-icon { padding:6px 10px; font-size:.85rem; }

        .clients-grid { display:grid; grid-template-columns:1fr; gap:15px; }

        .client-card { background:var(--card); border:1px solid var(--border); border-radius:16px; overflow:hidden; transition:.3s; cursor:pointer; }
        .client-card:hover { transform:translateY(-3px); box-shadow:0 10px 30px rgba(0,0,0,.3); border-color:var(--accent); }

        .client-header { padding:18px 18px 12px; }
        .client-top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px; }
        .client-name { font-size:1.15rem; font-weight:700; }
        .client-ref { font-size:.75rem; color:var(--dim); font-family:monospace; background:var(--bg); padding:3px 8px; border-radius:6px; }
        .client-meta { display:flex; flex-wrap:wrap; gap:12px; font-size:.82rem; color:var(--dim); }
        .client-meta span { display:flex; align-items:center; gap:4px; }

        .client-stats { display:grid; grid-template-columns:repeat(3,1fr); border-top:1px solid var(--border); }
        .client-stat { padding:12px; text-align:center; border-right:1px solid var(--border); }
        .client-stat:last-child { border-right:none; }
        .client-stat-val { font-size:1rem; font-weight:700; }
        .client-stat-val.blue { color:var(--accent); }
        .client-stat-val.green { color:var(--accent2); }
        .client-stat-val.orange { color:var(--warn); }
        .client-stat-label { font-size:.68rem; color:var(--dim); margin-top:2px; }

        .client-actions { padding:10px 14px; background:rgba(0,0,0,.15); display:flex; justify-content:flex-end; gap:8px; }

        /* Modal */
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.85); z-index:1000; justify-content:center; align-items:flex-start; padding:15px; overflow-y:auto; }
        .modal.visible { display:flex; }
        .modal-content { background:var(--card); border:1px solid var(--border); border-radius:16px; width:100%; max-width:560px; margin:20px auto; }
        .modal-header { padding:16px 20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; background:var(--card); z-index:10; border-radius:16px 16px 0 0; }
        .modal-title { font-size:1.1rem; font-weight:700; }
        .modal-close { background:none; border:none; color:var(--dim); font-size:1.5rem; cursor:pointer; padding:5px; }
        .modal-body { padding:20px; }
        .modal-footer { padding:15px 20px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px; flex-wrap:wrap; }

        .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
        .form-row.one { grid-template-columns:1fr; }
        .form-group { display:flex; flex-direction:column; gap:5px; }
        .form-group label { font-size:.8rem; color:var(--dim); font-weight:500; }
        .form-group input, .form-group textarea, .form-group select { padding:11px 13px; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:#fff; font-size:.9rem; width:100%; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline:none; border-color:var(--accent); }
        .form-group textarea { resize:vertical; min-height:70px; }

        .badge-actif { padding:4px 10px; border-radius:15px; font-size:.72rem; font-weight:600; background:rgba(16,185,129,.2); color:var(--accent2); }
        .badge-inactif { padding:4px 10px; border-radius:15px; font-size:.72rem; font-weight:600; background:rgba(239,68,68,.15); color:var(--danger); }

        .empty-state { text-align:center; padding:50px; color:var(--dim); }
        .loading { text-align:center; padding:40px; color:var(--dim); }

        .toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--accent2); color:#fff; padding:12px 24px; border-radius:10px; font-weight:600; z-index:2000; opacity:0; transition:.3s; font-size:.9rem; }
        .toast.visible { opacity:1; transform:translateX(-50%) translateY(0); }

        @media(min-width:600px) { .clients-grid { grid-template-columns:repeat(2,1fr); } .stats-row { grid-template-columns:repeat(4,1fr); } }
        @media(min-width:960px) { .clients-grid { grid-template-columns:repeat(3,1fr); } }
        @media(max-width:480px) { .form-row { grid-template-columns:1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👤 Clients</h1>
            <p>Gestion du portefeuille clients</p>
        </div>

        <div class="stats-row">
            <div class="stat-card"><div class="stat-value blue" id="stat-total">0</div><div class="stat-label">Total clients</div></div>
            <div class="stat-card"><div class="stat-value green" id="stat-actifs">0</div><div class="stat-label">Actifs</div></div>
            <div class="stat-card"><div class="stat-value orange" id="stat-projets">0</div><div class="stat-label">Projets liés</div></div>
            <div class="stat-card"><div class="stat-value purple" id="stat-ca">0</div><div class="stat-label">CA total (DH)</div></div>
        </div>

        <div class="actions-bar">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="🔍 Rechercher un client...">
            </div>
            <button class="btn btn-primary" onclick="openModal()">+ Nouveau client</button>
        </div>

        <div class="clients-grid" id="clients-grid">
            <div class="loading">Chargement des clients...</div>
        </div>
    </div>

    <!-- Modal Client -->
    <div class="modal" id="client-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="modal-title">Nouveau client</h3>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="client-id">
                <div class="form-row">
                    <div class="form-group">
                        <label>Nom complet *</label>
                        <input type="text" id="c-nom" placeholder="Ex: Omar Lazrak" required>
                    </div>
                    <div class="form-group">
                        <label>Référence</label>
                        <input type="text" id="c-reference" placeholder="Ex: C-015">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Téléphone</label>
                        <input type="text" id="c-telephone" placeholder="+212 6XX XXX XXX">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="c-email" placeholder="client@email.com">
                    </div>
                </div>
                <div class="form-row one">
                    <div class="form-group">
                        <label>Adresse</label>
                        <input type="text" id="c-adresse" placeholder="Adresse complète">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Ville</label>
                        <input type="text" id="c-ville" placeholder="Ex: Casablanca">
                    </div>
                    <div class="form-group">
                        <label>Statut</label>
                        <select id="c-actif">
                            <option value="true">✅ Actif</option>
                            <option value="false">⛔ Inactif</option>
                        </select>
                    </div>
                </div>
                <div class="form-row one">
                    <div class="form-group">
                        <label>Notes</label>
                        <textarea id="c-notes" placeholder="Informations complémentaires..."></textarea>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal()">Annuler</button>
                <button class="btn btn-primary" id="save-btn" onclick="saveClient()">Enregistrer</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
const SUPABASE_URL = 'https://wxhlstificzqovfcumop.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aGxzdGlmaWN6cW92ZmN1bW9wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyNjcwOTAsImV4cCI6MjA4Njg0MzA5MH0.mt6v3SKPMhWpMw9PH7D8k3ubrR1kJNIFHw0aloLmQiQ';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let allClients = [], allProjects = [], allDepenses = [], searchQuery = '';

async function loadData() {
    try {
        const [cRes, pRes, dRes] = await Promise.all([
            db.from('atlas_clients').select('*').order('nom', { ascending: true }),
            db.from('atlas_projects').select('id, name, client_id, status'),
            db.from('atlas_depenses').select('project_id, montant')
        ]);
        allClients = cRes.data || [];
        allProjects = pRes.data || [];
        allDepenses = dRes.data || [];
        renderStats();
        renderClients();
    } catch(err) {
        console.error('Erreur:', err);
        showToast('Erreur de chargement', true);
    }
}

function getClientProjects(clientId) {
    return allProjects.filter(p => p.client_id === clientId);
}

function getClientCA(clientId) {
    const projectIds = getClientProjects(clientId).map(p => p.id);
    return allDepenses
        .filter(d => projectIds.includes(d.project_id))
        .reduce((sum, d) => sum + (parseFloat(d.montant) || 0), 0);
}

function formatMoney(n) {
    if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
    if (n >= 1000) return Math.round(n/1000) + 'K';
    return new Intl.NumberFormat('fr-MA').format(n||0);
}

function renderStats() {
    const totalProjets = allProjects.filter(p => p.client_id).length;
    const totalCA = allClients.reduce((sum, c) => sum + getClientCA(c.id), 0);
    document.getElementById('stat-total').textContent = allClients.length;
    document.getElementById('stat-actifs').textContent = allClients.filter(c => c.actif).length;
    document.getElementById('stat-projets').textContent = totalProjets;
    document.getElementById('stat-ca').textContent = formatMoney(totalCA);
}

function renderClients() {
    const grid = document.getElementById('clients-grid');
    let filtered = allClients;
    if (searchQuery) {
        const q = searchQuery.toLowerCase();
        filtered = allClients.filter(c =>
            c.nom.toLowerCase().includes(q) ||
            (c.reference && c.reference.toLowerCase().includes(q)) ||
            (c.ville && c.ville.toLowerCase().includes(q)) ||
            (c.telephone && c.telephone.includes(q))
        );
    }
    if (!filtered.length) {
        grid.innerHTML = '<div class="empty-state">Aucun client trouvé</div>';
        return;
    }
    grid.innerHTML = filtered.map(c => {
        const projets = getClientProjects(c.id);
        const ca = getClientCA(c.id);
        const projetsActifs = projets.filter(p => p.status === 'en_cours').length;
        return `
        <div class="client-card">
            <div class="client-header" onclick="location.href='./atlas-client.html?id=${c.id}'">
                <div class="client-top">
                    <div class="client-name">${c.nom}</div>
                    <div style="display:flex;gap:6px;align-items:center;">
                        ${c.reference ? `<span class="client-ref">${c.reference}</span>` : ''}
                        <span class="${c.actif ? 'badge-actif' : 'badge-inactif'}">${c.actif ? 'Actif' : 'Inactif'}</span>
                    </div>
                </div>
                <div class="client-meta">
                    ${c.telephone ? `<span>📞 ${c.telephone}</span>` : ''}
                    ${c.ville ? `<span>📍 ${c.ville}</span>` : ''}
                </div>
            </div>
            <div class="client-stats">
                <div class="client-stat">
                    <div class="client-stat-val blue">${projets.length}</div>
                    <div class="client-stat-label">Projets</div>
                </div>
                <div class="client-stat">
                    <div class="client-stat-val orange">${projetsActifs}</div>
                    <div class="client-stat-label">En cours</div>
                </div>
                <div class="client-stat">
                    <div class="client-stat-val green">${formatMoney(ca)}</div>
                    <div class="client-stat-label">CA (DH)</div>
                </div>
            </div>
            <div class="client-actions">
                <button class="btn btn-outline btn-small btn-icon" onclick="editClient(${c.id})" title="Modifier">✏️ Modifier</button>
                <button class="btn btn-outline btn-small btn-icon" onclick="location.href='./atlas-client.html?id=${c.id}'" title="Voir fiche">👁️ Fiche</button>
                <button class="btn btn-danger btn-small btn-icon" onclick="deleteClient(${c.id}, '${c.nom.replace(/'/g, "\\'")}')">🗑️</button>
            </div>
        </div>`;
    }).join('');
}

// ===== MODAL =====
function openModal(client = null) {
    document.getElementById('modal-title').textContent = client ? 'Modifier client' : 'Nouveau client';
    document.getElementById('client-id').value = client?.id || '';
    document.getElementById('c-nom').value = client?.nom || '';
    document.getElementById('c-reference').value = client?.reference || '';
    document.getElementById('c-telephone').value = client?.telephone || '';
    document.getElementById('c-email').value = client?.email || '';
    document.getElementById('c-adresse').value = client?.adresse || '';
    document.getElementById('c-ville').value = client?.ville || '';
    document.getElementById('c-actif').value = client ? String(client.actif !== false) : 'true';
    document.getElementById('c-notes').value = client?.notes || '';
    document.getElementById('client-modal').classList.add('visible');
    document.getElementById('c-nom').focus();
}

function closeModal() {
    document.getElementById('client-modal').classList.remove('visible');
}

function editClient(id) {
    const client = allClients.find(c => c.id === id);
    if (client) openModal(client);
}

async function saveClient() {
    const nom = document.getElementById('c-nom').value.trim();
    if (!nom) { showToast('Le nom est obligatoire', true); return; }

    const btn = document.getElementById('save-btn');
    btn.disabled = true; btn.textContent = '...';

    const id = document.getElementById('client-id').value;
    const data = {
        nom,
        reference: document.getElementById('c-reference').value.trim() || null,
        telephone: document.getElementById('c-telephone').value.trim() || null,
        email: document.getElementById('c-email').value.trim() || null,
        adresse: document.getElementById('c-adresse').value.trim() || null,
        ville: document.getElementById('c-ville').value.trim() || null,
        actif: document.getElementById('c-actif').value === 'true',
        notes: document.getElementById('c-notes').value.trim() || null
    };

    try {
        if (id) {
            const { error } = await db.from('atlas_clients').update(data).eq('id', id);
            if (error) throw error;
            showToast('Client modifié ✓');
        } else {
            const { error } = await db.from('atlas_clients').insert([data]);
            if (error) throw error;
            showToast('Client créé ✓');
        }
        closeModal();
        await loadData();
    } catch(err) {
        console.error(err);
        showToast('Erreur: ' + err.message, true);
    }
    btn.disabled = false; btn.textContent = 'Enregistrer';
}

async function deleteClient(id, nom) {
    // Vérifier si le client a des projets liés
    const projets = getClientProjects(id);
    if (projets.length > 0) {
        showToast(`Impossible — ${projets.length} projet(s) lié(s). Déliez d'abord.`, true);
        return;
    }
    if (!confirm(`Supprimer "${nom}" ? Cette action est irréversible.`)) return;
    try {
        const { error } = await db.from('atlas_clients').delete().eq('id', id);
        if (error) throw error;
        showToast('Client supprimé');
        await loadData();
    } catch(err) {
        showToast('Erreur: ' + err.message, true);
    }
}

function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.background = isError ? 'var(--danger)' : 'var(--accent2)';
    t.classList.add('visible');
    setTimeout(() => t.classList.remove('visible'), 3000);
}

document.getElementById('search-input').addEventListener('input', e => {
    searchQuery = e.target.value.trim();
    renderClients();
});

document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
});

loadData();
    </script>
    <script src="./atlas-nav.js"></script>
</body>
</html>
