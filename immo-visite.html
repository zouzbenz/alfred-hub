<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Insta Immo - Bon de Visite</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <style>
        :root{--bg:#fff;--card:#f8f9fa;--border:#e0e0e0;--text:#1a1a1a;--dim:#666;--accent:#FFC107;--green:#10b981;--red:#ef4444;}
        *{box-sizing:border-box;margin:0;padding:0;}
        body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
        .container{max-width:700px;margin:0 auto;padding:20px;}
        .header{text-align:center;padding:20px 0;border-bottom:2px solid var(--accent);margin-bottom:30px;}
        .logo{font-size:1.8rem;font-weight:800;margin-bottom:5px;}
        .logo span{color:var(--accent);}
        .subtitle{color:var(--dim);font-size:.9rem;}
        .doc-title{text-align:center;font-size:1.5rem;font-weight:800;margin-bottom:30px;text-transform:uppercase;letter-spacing:2px;}
        .section{margin-bottom:25px;}
        .section-title{font-size:.9rem;font-weight:700;color:var(--accent);margin-bottom:15px;text-transform:uppercase;letter-spacing:1px;}
        .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;}
        @media(max-width:500px){.info-grid{grid-template-columns:1fr;}}
        .info-item{background:var(--card);padding:15px;border-radius:10px;}
        .info-label{font-size:.75rem;color:var(--dim);margin-bottom:5px;}
        .info-value{font-weight:600;}
        .bien-card{background:var(--card);border-radius:12px;padding:20px;}
        .bien-ref{display:inline-block;background:var(--accent);color:#000;padding:4px 10px;border-radius:6px;font-size:.75rem;font-weight:700;margin-bottom:10px;}
        .bien-title{font-size:1.2rem;font-weight:700;margin-bottom:10px;}
        .bien-details{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;font-size:.9rem;color:var(--dim);}
        .clause{background:#fff3cd;border:1px solid #ffc107;border-radius:12px;padding:20px;margin:30px 0;}
        .clause-title{font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
        .clause-text{font-size:.85rem;line-height:1.6;text-align:justify;}
        .signature-section{margin-top:30px;}
        .signature-box{background:var(--card);border:2px dashed var(--border);border-radius:12px;padding:20px;text-align:center;}
        .signature-label{font-size:.9rem;color:var(--dim);margin-bottom:15px;}
        .signature-canvas{background:#fff;border:1px solid var(--border);border-radius:10px;touch-action:none;cursor:crosshair;}
        .signature-actions{display:flex;gap:10px;margin-top:15px;justify-content:center;}
        .btn{padding:12px 24px;border:none;border-radius:10px;font-weight:600;cursor:pointer;font-size:.9rem;transition:.2s;}
        .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
        .btn-primary{background:var(--accent);color:#000;}
        .btn-success{background:var(--green);color:#fff;}
        .btn-danger{background:var(--red);color:#fff;}
        .btn:disabled{opacity:.5;cursor:not-allowed;}
        .date-section{display:flex;justify-content:space-between;align-items:center;margin-top:30px;padding-top:20px;border-top:1px solid var(--border);}
        .date-item{text-align:center;}
        .date-label{font-size:.75rem;color:var(--dim);}
        .date-value{font-weight:600;margin-top:5px;}
        .success-message{background:rgba(16,185,129,.1);border:2px solid var(--green);border-radius:12px;padding:30px;text-align:center;margin-top:30px;}
        .success-icon{font-size:3rem;margin-bottom:15px;}
        .success-title{font-size:1.3rem;font-weight:700;color:var(--green);margin-bottom:10px;}
        .success-text{color:var(--dim);}
        .loading{text-align:center;padding:50px;color:var(--dim);}
        .error{text-align:center;padding:50px;color:var(--red);}
        @media print{
            .signature-actions,.btn{display:none!important;}
            .signature-canvas{border:1px solid #000;}
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">🏠 Insta <span>Immo</span></div>
            <div class="subtitle">Agence Immobilière - Casablanca</div>
        </header>
        
        <div id="content">
            <div class="loading">Chargement du bon de visite...</div>
        </div>
    </div>
    
    <script>
const SUPABASE_URL='https://wxhlstificzqovfcumop.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aGxzdGlmaWN6cW92ZmN1bW9wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyNjcwOTAsImV4cCI6MjA4Njg0MzA5MH0.mt6v3SKPMhWpMw9PH7D8k3ubrR1kJNIFHw0aloLmQiQ';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const params=new URLSearchParams(window.location.search);
const visiteId=params.get('visite');

let visite=null,bien=null,client=null;
let canvas,ctx,isDrawing=false,lastX=0,lastY=0;

const ZONE_LABELS={anfa:'Anfa',ain_diab:'Ain Diab',cfc:'CFC',bourgogne:'Bourgogne',bouskoura:'Bouskoura'};
const TYPE_LABELS={studio:'Studio',appartement:'Appartement',villa:'Villa',terrain:'Terrain',local_commercial:'Local commercial',bureau:'Bureau'};

async function loadVisite(){
    if(!visiteId){
        document.getElementById('content').innerHTML='<div class="error">Visite non spécifiée</div>';
        return;
    }
    
    const{data,error}=await db.from('immo_visites').select('*,immo_biens(*),immo_clients(*)').eq('id',visiteId).single();
    
    if(error||!data){
        document.getElementById('content').innerHTML='<div class="error">Visite non trouvée</div>';
        return;
    }
    
    visite=data;
    bien=data.immo_biens;
    client=data.immo_clients;
    
    if(visite.bon_signe){
        renderSigned();
    }else{
        render();
    }
}

function formatMoney(n){return new Intl.NumberFormat('fr-MA').format(n||0);}
function formatDate(d){return d?new Date(d).toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'}):new Date().toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'});}
function formatDateTime(d){return d?new Date(d).toLocaleString('fr-FR'):new Date().toLocaleString('fr-FR');}

function render(){
    const now=new Date();
    
    document.getElementById('content').innerHTML=`
        <h2 class="doc-title">Bon de Visite</h2>
        
        <div class="section">
            <div class="section-title">👤 Informations du visiteur</div>
            <div class="info-grid">
                <div class="info-item">
                    <div class="info-label">Nom & Prénom</div>
                    <div class="info-value">${client?.nom||'-'} ${client?.prenom||''}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Téléphone</div>
                    <div class="info-value">${client?.telephone||'-'}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Email</div>
                    <div class="info-value">${client?.email||'-'}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Date de visite</div>
                    <div class="info-value">${formatDateTime(visite.date_visite)}</div>
                </div>
            </div>
        </div>
        
        <div class="section">
            <div class="section-title">🏠 Bien visité</div>
            <div class="bien-card">
                <span class="bien-ref">${bien?.reference||'-'}</span>
                <h3 class="bien-title">${bien?.titre||'-'}</h3>
                <div class="bien-details">
                    <div>📍 ${ZONE_LABELS[bien?.zone]||bien?.zone||'-'}${bien?.quartier?' - '+bien.quartier:''}</div>
                    <div>🏠 ${TYPE_LABELS[bien?.type_bien]||bien?.type_bien||'-'}</div>
                    <div>📐 ${bien?.surface_m2||'-'} m²</div>
                    <div>💰 ${formatMoney(bien?.prix)} MAD</div>
                    ${bien?.etage!==null?`<div>🏢 Étage ${bien.etage}</div>`:''}
                    ${bien?.chambres?`<div>🛏️ ${bien.chambres} chambres</div>`:''}
                </div>
            </div>
        </div>
        
        <div class="clause">
            <div class="clause-title">⚖️ Clause de protection</div>
            <div class="clause-text">
                Le(a) soussigné(e) reconnaît avoir visité le bien désigné ci-dessus par l'intermédiaire exclusif d'<strong>INSTA IMMO</strong>. 
                Toute transaction conclue directement avec le propriétaire ou par un autre intermédiaire, dans un délai de <strong>24 mois</strong> suivant cette visite, 
                engagera la responsabilité du visiteur au paiement de la commission convenue, sans préjudice de dommages et intérêts. 
                Le présent bon de visite constitue une preuve de la mise en relation.
            </div>
        </div>
        
        <div class="signature-section">
            <div class="section-title">✍️ Signature du visiteur</div>
            <div class="signature-box">
                <div class="signature-label">Signez dans le cadre ci-dessous</div>
                <canvas id="signature-canvas" class="signature-canvas" width="400" height="200"></canvas>
                <div class="signature-actions">
                    <button class="btn btn-outline" onclick="clearSignature()">Effacer</button>
                    <button class="btn btn-success" onclick="saveSignature()" id="save-btn">✅ Valider et signer</button>
                </div>
            </div>
        </div>
        
        <div class="date-section">
            <div class="date-item">
                <div class="date-label">Fait à</div>
                <div class="date-value">Casablanca</div>
            </div>
            <div class="date-item">
                <div class="date-label">Le</div>
                <div class="date-value">${formatDate()}</div>
            </div>
        </div>
    `;
    
    initCanvas();
}

function renderSigned(){
    document.getElementById('content').innerHTML=`
        <h2 class="doc-title">Bon de Visite</h2>
        
        <div class="success-message">
            <div class="success-icon">✅</div>
            <div class="success-title">Bon de visite signé</div>
            <div class="success-text">Ce document a été signé le ${formatDateTime(visite.updated_at||visite.created_at)}</div>
        </div>
        
        <div class="section" style="margin-top:30px;">
            <div class="section-title">👤 Informations du visiteur</div>
            <div class="info-grid">
                <div class="info-item">
                    <div class="info-label">Nom & Prénom</div>
                    <div class="info-value">${client?.nom||'-'} ${client?.prenom||''}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Téléphone</div>
                    <div class="info-value">${client?.telephone||'-'}</div>
                </div>
            </div>
        </div>
        
        <div class="section">
            <div class="section-title">🏠 Bien visité</div>
            <div class="bien-card">
                <span class="bien-ref">${bien?.reference||'-'}</span>
                <h3 class="bien-title">${bien?.titre||'-'}</h3>
                <div class="bien-details">
                    <div>📍 ${ZONE_LABELS[bien?.zone]||'-'}</div>
                    <div>💰 ${formatMoney(bien?.prix)} MAD</div>
                </div>
            </div>
        </div>
        
        ${visite.signature_data?`
        <div class="section">
            <div class="section-title">✍️ Signature</div>
            <div style="background:var(--card);padding:20px;border-radius:12px;text-align:center;">
                <img src="${visite.signature_data}" style="max-width:300px;border:1px solid var(--border);border-radius:10px;">
            </div>
        </div>
        `:''}
    `;
}

function initCanvas(){
    canvas=document.getElementById('signature-canvas');
    ctx=canvas.getContext('2d');
    
    // High DPI support
    const dpr=window.devicePixelRatio||1;
    const rect=canvas.getBoundingClientRect();
    canvas.width=rect.width*dpr;
    canvas.height=rect.height*dpr;
    canvas.style.width=rect.width+'px';
    canvas.style.height=rect.height+'px';
    ctx.scale(dpr,dpr);
    
    ctx.strokeStyle='#1a1a1a';
    ctx.lineWidth=2;
    ctx.lineCap='round';
    ctx.lineJoin='round';
    
    // Mouse events
    canvas.addEventListener('mousedown',startDrawing);
    canvas.addEventListener('mousemove',draw);
    canvas.addEventListener('mouseup',stopDrawing);
    canvas.addEventListener('mouseout',stopDrawing);
    
    // Touch events
    canvas.addEventListener('touchstart',handleTouchStart,{passive:false});
    canvas.addEventListener('touchmove',handleTouchMove,{passive:false});
    canvas.addEventListener('touchend',stopDrawing);
}

function getPos(e){
    const rect=canvas.getBoundingClientRect();
    return{
        x:e.clientX-rect.left,
        y:e.clientY-rect.top
    };
}

function startDrawing(e){
    isDrawing=true;
    const pos=getPos(e);
    lastX=pos.x;
    lastY=pos.y;
}

function draw(e){
    if(!isDrawing)return;
    const pos=getPos(e);
    ctx.beginPath();
    ctx.moveTo(lastX,lastY);
    ctx.lineTo(pos.x,pos.y);
    ctx.stroke();
    lastX=pos.x;
    lastY=pos.y;
}

function stopDrawing(){
    isDrawing=false;
}

function handleTouchStart(e){
    e.preventDefault();
    const touch=e.touches[0];
    const rect=canvas.getBoundingClientRect();
    isDrawing=true;
    lastX=touch.clientX-rect.left;
    lastY=touch.clientY-rect.top;
}

function handleTouchMove(e){
    e.preventDefault();
    if(!isDrawing)return;
    const touch=e.touches[0];
    const rect=canvas.getBoundingClientRect();
    const x=touch.clientX-rect.left;
    const y=touch.clientY-rect.top;
    ctx.beginPath();
    ctx.moveTo(lastX,lastY);
    ctx.lineTo(x,y);
    ctx.stroke();
    lastX=x;
    lastY=y;
}

function clearSignature(){
    const dpr=window.devicePixelRatio||1;
    ctx.clearRect(0,0,canvas.width/dpr,canvas.height/dpr);
}

function isCanvasEmpty(){
    const dpr=window.devicePixelRatio||1;
    const pixelData=ctx.getImageData(0,0,canvas.width,canvas.height).data;
    for(let i=3;i<pixelData.length;i+=4){
        if(pixelData[i]!==0)return false;
    }
    return true;
}

async function saveSignature(){
    if(isCanvasEmpty()){
        alert('Veuillez signer avant de valider');
        return;
    }
    
    const btn=document.getElementById('save-btn');
    btn.disabled=true;
    btn.textContent='Enregistrement...';
    
    try{
        // Get signature as base64
        const signatureData=canvas.toDataURL('image/png');
        
        // Update visite
        const{error}=await db.from('immo_visites').update({
            bon_genere:true,
            bon_signe:true,
            signature_data:signatureData
        }).eq('id',visiteId);
        
        if(error)throw error;
        
        // Reload to show success
        visite.bon_signe=true;
        visite.signature_data=signatureData;
        renderSigned();
        
    }catch(err){
        alert('Erreur: '+err.message);
        btn.disabled=false;
        btn.textContent='✅ Valider et signer';
    }
}

loadVisite();
    </script>
</body>
</html>
