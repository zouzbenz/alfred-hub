<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bon de visite — Insta Immo</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./immo-core.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <style>
        .doc-title{text-align:center;font-size:1.35rem;font-weight:800;margin:6px 0 30px;
          text-transform:uppercase;letter-spacing:.18em}
        .doc-title small{display:block;font-size:.72rem;font-weight:600;color:var(--dim);
          letter-spacing:.06em;text-transform:none;margin-top:4px}
        .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
        @media (max-width:520px){.info-grid{grid-template-columns:1fr}}
        .info-item{background:var(--card);border:1px solid var(--border);padding:14px 16px;border-radius:var(--radius-sm)}
        .info-label{font-size:.72rem;color:var(--dim);margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em}
        .info-value{font-weight:700;font-size:.96rem}
        .bien-details{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;font-size:.9rem;color:var(--dim);margin-top:12px}
        .clause{background:var(--accent-soft);border:1px solid #f0dc9e;border-radius:var(--radius);padding:22px;margin:30px 0}
        .clause-title{font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
        .clause-text{font-size:.87rem;line-height:1.75;text-align:justify}
        .signature-box{background:var(--card);border:2px dashed #d3d7dc;border-radius:var(--radius);padding:20px;text-align:center}
        .signature-canvas{background:#fff;border:1px solid var(--border);border-radius:10px;
          touch-action:none;cursor:crosshair;width:100%;max-width:440px;height:190px}
        .signature-actions{display:flex;gap:10px;margin-top:16px;justify-content:center;flex-wrap:wrap}
        .date-section{display:flex;justify-content:space-between;margin-top:30px;padding-top:20px;border-top:1px solid var(--border)}
        .date-item{text-align:center}
        .date-label{font-size:.72rem;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
        .date-value{font-weight:700;margin-top:4px}
        .success-message{background:rgba(15,157,110,.08);border:2px solid var(--green);border-radius:var(--radius);
          padding:32px;text-align:center;margin-bottom:30px}
        .success-icon{font-size:2.6rem;margin-bottom:10px}
        .success-title{font-size:1.25rem;font-weight:800;color:var(--green);margin-bottom:6px}
        .success-text{color:var(--dim);font-size:.92rem}
        @media print{
            .signature-actions,.btn,.brand-header a.btn,.no-print{display:none!important}
            body{padding:0}
            .clause{border:1px solid #999;background:#fff}
        }
    </style>
</head>
<body>
    <div class="container-narrow">
        <header class="brand-header">
            <a class="brand" href="#" onclick="return false">
                <span class="brand-mark" aria-hidden="true">🏠</span>
                <span>Insta Immo<small>Agence immobilière · Casablanca</small></span>
            </a>
        </header>

        <main id="content" aria-live="polite">
            <div class="state"><div class="spinner" aria-hidden="true"></div><p>Chargement du bon de visite…</p></div>
        </main>

        <footer class="site-footer">
            <p><strong>Insta Immo</strong> — Zouhair Benazzouz · Casablanca</p>
        </footer>
    </div>

    <script src="./immo-core.js"></script>
    <script>
const params = new URLSearchParams(location.search);
const visiteId = parseInt(params.get('visite'), 10);
const accessCode = (params.get('code') || '').trim();

let docData = null; // { visite, bien, client }
let canvas, ctx, isDrawing = false, lastX = 0, lastY = 0, hasInk = false;

async function loadVisite() {
    if (!visiteId || !accessCode) {
        uiError('content', 'Lien incomplet',
            'Ce bon de visite s\'ouvre uniquement via le lien sécurisé transmis par votre agent (il contient votre code d\'accès). Demandez-lui de vous le renvoyer.');
        return;
    }
    try {
        const { data, error } = await db.rpc('immo_visite_get', { p_visite_id: visiteId, p_code: accessCode });
        if (error) throw error;
        if (!data) {
            uiError('content', 'Bon de visite introuvable',
                'Le lien est invalide ou a expiré. Contactez votre agent pour recevoir un nouveau lien.');
            return;
        }
        docData = data;
        docData.visite.bon_signe ? renderSigned() : renderToSign();
    } catch (err) {
        console.error(err);
        uiError('content', 'Chargement impossible', 'Vérifiez votre connexion puis actualisez la page.');
    }
}

function bienCardHTML() {
    const b = docData.bien || {};
    return `
    <div class="card">
        <span class="ref-plate">${esc(b.reference || '—')}</span>
        <h3 style="font-size:1.1rem;margin-top:10px">${esc(b.titre || 'Bien')}</h3>
        <div class="bien-details">
            <div>📍 ${esc(ZONE_LABELS[b.zone] || b.zone || '—')}${b.quartier ? ' · ' + esc(b.quartier) : ''}</div>
            <div>🏠 ${esc(TYPE_LABELS[b.type_bien] || b.type_bien || '—')}</div>
            <div>📐 ${b.surface_m2 ? esc(b.surface_m2) + ' m²' : '—'}</div>
            <div>💰 ${formatMoney(b.prix)} MAD</div>
            ${(b.etage !== null && b.etage !== undefined) ? `<div>🏢 Étage ${esc(b.etage)}</div>` : ''}
            ${b.chambres ? `<div>🛏️ ${esc(b.chambres)} chambres</div>` : ''}
        </div>
    </div>`;
}

function visitorGridHTML(compact) {
    const c = docData.client || {}, v = docData.visite;
    return `
    <div class="info-grid">
        <div class="info-item"><div class="info-label">Nom & prénom</div>
            <div class="info-value">${esc(c.nom || '—')} ${esc(c.prenom || '')}</div></div>
        <div class="info-item"><div class="info-label">Téléphone</div>
            <div class="info-value">${esc(c.telephone || '—')}</div></div>
        ${compact ? '' : `
        <div class="info-item"><div class="info-label">Date de visite</div>
            <div class="info-value">${formatDateTime(v.date_visite)}</div></div>
        <div class="info-item"><div class="info-label">Type de visite</div>
            <div class="info-value">${esc(String(v.type_visite || 'Sur place').replace(/_/g, ' '))}</div></div>`}
    </div>`;
}

function renderToSign() {
    document.getElementById('content').innerHTML = `
        <h1 class="doc-title">Bon de visite<small>Document contractuel — Insta Immo</small></h1>

        <section class="section">
            <div class="section-title">👤 Informations du visiteur</div>
            ${visitorGridHTML(false)}
        </section>

        <section class="section">
            <div class="section-title">🏠 Bien visité</div>
            ${bienCardHTML()}
        </section>

        <div class="clause">
            <div class="clause-title">⚖️ Clause de protection</div>
            <p class="clause-text">
                Le(a) soussigné(e) reconnaît avoir visité le bien désigné ci-dessus par l'intermédiaire exclusif d'<strong>INSTA IMMO</strong>.
                Toute transaction conclue directement avec le propriétaire ou par un autre intermédiaire, dans un délai de <strong>24 mois</strong>
                suivant cette visite, engagera la responsabilité du visiteur au paiement de la commission convenue, sans préjudice de dommages
                et intérêts. Le présent bon de visite constitue une preuve de la mise en relation.
            </p>
        </div>

        <section class="section">
            <div class="section-title">✍️ Signature du visiteur</div>
            <div class="signature-box">
                <p style="font-size:.9rem;color:var(--dim);margin-bottom:14px">Signez au doigt ou à la souris dans le cadre ci-dessous</p>
                <canvas id="signature-canvas" class="signature-canvas" aria-label="Zone de signature"></canvas>
                <div class="signature-actions">
                    <button class="btn btn-outline" onclick="clearSignature()">Effacer</button>
                    <button class="btn btn-success" onclick="saveSignature()" id="save-btn">✓ Valider et signer</button>
                </div>
                <p class="login-error" id="sign-error" role="alert"></p>
            </div>
        </section>

        <div class="date-section">
            <div class="date-item"><div class="date-label">Fait à</div><div class="date-value">Casablanca</div></div>
            <div class="date-item"><div class="date-label">Le</div><div class="date-value">${formatDateLong()}</div></div>
        </div>`;
    initCanvas();
}

function renderSigned() {
    const v = docData.visite;
    document.getElementById('content').innerHTML = `
        <h1 class="doc-title">Bon de visite<small>Document contractuel — Insta Immo</small></h1>

        <div class="success-message">
            <div class="success-icon" aria-hidden="true">✅</div>
            <div class="success-title">Bon de visite signé</div>
            <div class="success-text">Document signé et enregistré le ${formatDateTime(v.updated_at || v.created_at)}</div>
        </div>

        <section class="section">
            <div class="section-title">👤 Visiteur</div>
            ${visitorGridHTML(true)}
        </section>

        <section class="section">
            <div class="section-title">🏠 Bien visité</div>
            ${bienCardHTML()}
        </section>

        ${v.signature_data && String(v.signature_data).startsWith('data:image/png;base64,') ? `
        <section class="section">
            <div class="section-title">✍️ Signature</div>
            <div class="card" style="text-align:center">
                <img src="${escAttr(v.signature_data)}" alt="Signature du visiteur"
                    style="max-width:300px;margin:0 auto;border:1px solid var(--border);border-radius:10px">
            </div>
        </section>` : ''}

        <div class="signature-actions no-print" style="margin-top:26px">
            <button class="btn btn-outline" onclick="window.print()">🖨️ Imprimer / PDF</button>
        </div>`;
}

/* ---- Canvas de signature (souris + tactile, haute densité) ---- */
function initCanvas() {
    canvas = document.getElementById('signature-canvas');
    ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);
    ctx.strokeStyle = '#141414';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    const pos = e => {
        const r = canvas.getBoundingClientRect();
        const src = e.touches ? e.touches[0] : e;
        return { x: src.clientX - r.left, y: src.clientY - r.top };
    };
    const start = e => { e.preventDefault(); isDrawing = true; const p = pos(e); lastX = p.x; lastY = p.y; };
    const move = e => {
        if (!isDrawing) return;
        e.preventDefault();
        const p = pos(e);
        ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(p.x, p.y); ctx.stroke();
        lastX = p.x; lastY = p.y; hasInk = true;
    };
    const stop = () => { isDrawing = false; };

    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    canvas.addEventListener('mouseup', stop);
    canvas.addEventListener('mouseout', stop);
    canvas.addEventListener('touchstart', start, { passive: false });
    canvas.addEventListener('touchmove', move, { passive: false });
    canvas.addEventListener('touchend', stop);
}

function clearSignature() {
    const dpr = window.devicePixelRatio || 1;
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
    hasInk = false;
    document.getElementById('sign-error').textContent = '';
}

async function saveSignature() {
    const errEl = document.getElementById('sign-error');
    if (!hasInk) { errEl.textContent = 'Signez dans le cadre avant de valider.'; return; }

    const btn = document.getElementById('save-btn');
    btn.disabled = true; btn.textContent = 'Enregistrement…'; errEl.textContent = '';

    try {
        const signatureData = canvas.toDataURL('image/png');
        const { data: ok, error } = await db.rpc('immo_visite_sign', {
            p_visite_id: visiteId, p_code: accessCode, p_signature: signatureData
        });
        if (error) throw error;
        if (!ok) { errEl.textContent = 'Signature refusée : ce bon est peut-être déjà signé. Actualisez la page.'; return; }

        docData.visite.bon_signe = true;
        docData.visite.signature_data = signatureData;
        docData.visite.updated_at = new Date().toISOString();
        renderSigned();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (err) {
        console.error(err);
        errEl.textContent = 'Enregistrement impossible. Vérifiez votre connexion et réessayez.';
    } finally {
        btn.disabled = false; btn.textContent = '✓ Valider et signer';
    }
}

loadVisite();
    </script>
</body>
</html>
