<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Factures - Atlas Pose</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
</head>
<body>
    <div class="container">

        <div class="page-header">
            <div>
                <h1 class="page-title">Factures</h1>
                <p class="page-subtitle">Facturation clients & fournisseurs</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-clay" onclick="openNewFactureClient()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    Nouvelle facture client
                </button>
            </div>
        </div>

        <!-- Stats globales -->
        <div class="stats-row">
            <div class="stat-card"><div class="stat-value green" id="stat-ca">0 DH</div><div class="stat-label">CA Clients TTC</div></div>
            <div class="stat-card"><div class="stat-value red" id="stat-depenses">0 DH</div><div class="stat-label">Fournisseurs</div></div>
            <div class="stat-card"><div class="stat-value blue" id="stat-marge">0 DH</div><div class="stat-label">Marge brute</div></div>
            <div class="stat-card"><div class="stat-value clay" id="stat-impayees">0</div><div class="stat-label">Impayées</div></div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" data-tab="clients" onclick="switchTab('clients')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                Factures Clients
                <span class="tab-count" id="tab-count-clients">0</span>
            </button>
            <button class="tab" data-tab="fournisseurs" onclick="switchTab('fournisseurs')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                Factures Fournisseurs
                <span class="tab-count" id="tab-count-fournisseurs">0</span>
            </button>
        </div>

        <!-- Filters Clients -->
        <div class="filters" id="filters-clients">
            <button class="filter-btn active" data-filter="all">Toutes</button>
            <button class="filter-btn" data-filter="brouillon">Brouillons</button>
            <button class="filter-btn" data-filter="devis">Devis</button>
            <button class="filter-btn" data-filter="emise">Émises</button>
            <button class="filter-btn" data-filter="payee">Payées</button>
        </div>
        <!-- Filters Fournisseurs -->
        <div class="filters" id="filters-fournisseurs" style="display:none">
            <button class="filter-btn active" data-filter="all">Toutes</button>
        </div>

        <!-- Search -->
        <div class="search-row">
            <div class="search-box">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="search-input" placeholder="Rechercher une facture...">
            </div>
        </div>

        <!-- Section Clients -->
        <div id="section-clients">
            <div class="factures-grid" id="grid-clients"><div class="empty-state"><p>Chargement...</p></div></div>
        </div>

        <!-- Section Fournisseurs -->
        <div id="section-fournisseurs" style="display:none">
            <div class="factures-grid" id="grid-fournisseurs"><div class="empty-state"><p>Chargement...</p></div></div>
        </div>

        <div class="footer">Atlas<em class="serif">Pose</em> · Factures v2.0</div>
    </div>

    <!-- Modal Nouvelle Facture Client -->
    <div class="modal-overlay" id="new-fc-modal" style="display:none" onclick="if(event.target===this)closeNewFCModal()">
        <div class="modal">
            <div class="modal-title">Nouvelle facture client</div>
            <form id="new-fc-form" onsubmit="createFactureClient(event)">
                <div><label>Objet *</label><input type="text" id="fc-objet" required placeholder="Ex: Pose carrelage salon"></div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px">
                    <div><label>Client *</label><select id="fc-client" required onchange="onClientSelect()"><option value="">— Sélectionner —</option></select></div>
                    <div><label>Projet</label><select id="fc-project"><option value="">— Aucun —</option></select></div>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px">
                    <div><label>ICE Client</label><input type="text" id="fc-client-ice" placeholder="ICE du client"></div>
                    <div><label>Adresse Client</label><input type="text" id="fc-client-adresse" placeholder="Adresse"></div>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px">
                    <div><label>Taux TVA (%)</label><input type="number" id="fc-tva" value="20" min="0" max="100" step="1"></div>
                    <div><label>Date échéance</label><input type="date" id="fc-echeance"></div>
                </div>
                <div style="margin-top:14px"><label>Notes</label><textarea id="fc-notes" rows="2" placeholder="Notes internes..."></textarea></div>
                <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:22px">
                    <button type="button" class="btn btn-outline" onclick="closeNewFCModal()">Annuler</button>
                    <button type="submit" class="btn btn-clay" id="fc-save-btn">Créer en brouillon</button>
                </div>
            </form>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <style>
        .search-row { margin-bottom:20px; }
        .search-box { position:relative; max-width:480px; margin:0 auto; }
        .search-box input { padding-left:40px; border-radius:99px; }
        .search-icon { position:absolute; left:14px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--dim); pointer-events:none; }

        /* Tabs */
        .tabs { display:flex; gap:4px; margin-bottom:20px; background:var(--bg2); border-radius:var(--r-lg); padding:4px; border:1px solid var(--border); }
        .tab { flex:1; display:flex; align-items:center; justify-content:center; gap:8px; padding:12px 16px; background:transparent; border:none; border-radius:var(--r-md); color:var(--text2); font-family:'Outfit',sans-serif; font-size:.85rem; font-weight:500; cursor:pointer; transition:all .15s; }
        .tab svg { width:16px; height:16px; flex-shrink:0; }
        .tab:hover { color:var(--text); background:rgba(128,128,128,.06); }
        .tab.active { background:var(--card); color:var(--text); font-weight:600; box-shadow:var(--shadow-sm); border:1px solid var(--border); }
        .tab-count { background:var(--accent-lo); color:var(--accent); padding:2px 8px; border-radius:99px; font-size:.7rem; font-weight:700; }
        .tab.active .tab-count { background:var(--accent); color:#fff; }

        /* Factures grid */
        .factures-grid { display:grid; grid-template-columns:1fr; gap:12px; }
        @media(min-width:600px) { .factures-grid { grid-template-columns:repeat(2,1fr); } }
        @media(min-width:960px) { .factures-grid { grid-template-columns:repeat(3,1fr); } }

        /* ── Card Fournisseur (reprend l'ancien design) ── */
        .fac-card { background:var(--card); border:1px solid var(--border); border-radius:var(--r-xl); padding:18px; transition:all .2s; cursor:pointer; }
        .fac-card:hover { transform:translateY(-2px); box-shadow:var(--shadow-md); border-color:var(--accent2); }
        .fac-card-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; flex-wrap:wrap; gap:8px; }
        .fac-numero { font-family:'Outfit',sans-serif; font-weight:700; font-size:1.05rem; letter-spacing:-0.02em; color:var(--accent2); }
        .fac-date { font-size:.82rem; color:var(--dim); white-space:nowrap; }
        .fac-commande { font-size:.82rem; color:var(--accent); margin-top:2px; }
        .fac-info { font-size:.82rem; color:var(--dim); margin-bottom:10px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
        .fac-projets { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:10px; }
        .fac-projet-tag { font-size:.68rem; font-weight:600; padding:2px 8px; border-radius:99px; background:var(--accent-lo); color:var(--accent); border:1px solid rgba(59,130,246,.15); }
        .fac-footer { display:flex; justify-content:space-between; align-items:center; padding-top:10px; border-top:1px solid var(--border); }
        .fac-montant { font-family:'Outfit',sans-serif; font-weight:800; font-size:1.1rem; color:var(--accent2); letter-spacing:-0.02em; }
        .fac-badges { display:flex; gap:6px; }
        .fac-badge { padding:3px 9px; border-radius:99px; font-size:.7rem; font-weight:600; }
        .fac-badge-pdf { background:var(--accent-lo); color:var(--accent); }
        .fac-badge-justif { background:var(--clay-lo); color:var(--clay); }

        /* ── Card Client ── */
        .fac-card.client-card:hover { border-color:var(--clay); }
        .fac-numero.client { color:var(--clay); }
        .fac-montant.client { color:var(--clay); }
        .fc-statut { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:99px; font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em; }
        .fc-statut::before { content:''; width:5px; height:5px; border-radius:50%; background:currentColor; }
        .fc-statut-brouillon { background:var(--card2); color:var(--dim); }
        .fc-statut-devis { background:var(--clay-lo); color:var(--clay); }
        .fc-statut-emise { background:var(--accent-md); color:var(--accent); }
        .fc-statut-payee { background:var(--accent2-md); color:var(--accent2); }
        .fc-statut-annulee { background:var(--danger-lo); color:var(--danger); }

        @media(max-width:768px) {
            .tabs { flex-direction:column; }
            .tab { justify-content:flex-start; padding:10px 14px; }
            .fac-card-header { flex-direction:column; }
        }
    </style>

    <script>
const SUPABASE_URL = 'https://wxhlstificzqovfcumop.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aGxzdGlmaWN6cW92ZmN1bW9wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyNjcwOTAsImV4cCI6MjA4Njg0MzA5MH0.mt6v3SKPMhWpMw9PH7D8k3ubrR1kJNIFHw0aloLmQiQ';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let facturesClients=[], facturesFourn=[], commandes=[], projects=[], clients=[], ventilations=[];
let currentTab='clients', filterClient='all', filterFourn='all', searchQuery='';

async function loadData() {
    try {
        const [fcRes, ffRes, cmdRes, pRes, cRes, ventRes] = await Promise.all([
            db.from('atlas_factures_clients').select('*').order('created_at',{ascending:false}),
            db.from('atlas_factures').select('*').order('created_at',{ascending:false}),
            db.from('atlas_commandes').select('id, numero, titre'),
            db.from('atlas_projects').select('id, name'),
            db.from('atlas_clients').select('id, nom, telephone, email, adresse, ville'),
            db.from('atlas_facture_ventilation').select('facture_id, project_id')
        ]);
        facturesClients = fcRes.data||[];
        facturesFourn = ffRes.data||[];
        commandes = cmdRes.data||[];
        projects = pRes.data||[];
        clients = cRes.data||[];
        ventilations = ventRes.data||[];

        // Compter justificatifs pour chaque facture fournisseur
        for (let fac of facturesFourn) {
            const {count} = await db.from('atlas_facture_justificatifs').select('*',{count:'exact',head:true}).eq('facture_id',fac.id);
            fac.nb_justificatifs = count||0;
        }

        populateSelects();
        renderStats();
        renderAll();
    } catch(err) { console.error('Erreur:',err); }
}

function populateSelects() {
    document.getElementById('fc-client').innerHTML = '<option value="">— Sélectionner —</option>'+clients.map(c=>`<option value="${c.id}">${c.nom}</option>`).join('');
    document.getElementById('fc-project').innerHTML = '<option value="">— Aucun —</option>'+projects.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
}

function formatMoney(n) { return new Intl.NumberFormat('fr-MA',{minimumFractionDigits:0}).format(n||0)+' DH'; }
function formatDate(d) { return d ? new Date(d).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'}) : '—'; }
function getCmd(id) { return commandes.find(c=>c.id===id); }
function getProjName(id) { return projects.find(p=>p.id===id)?.name||null; }

// Récupérer les projets ventilés pour une facture fournisseur
function getFactureProjects(facId) {
    const pIds = [...new Set(ventilations.filter(v=>v.facture_id===facId).map(v=>v.project_id))];
    return pIds.map(id=>getProjName(id)).filter(Boolean);
}

function renderStats() {
    const caClients = facturesClients.reduce((s,f)=>s+(parseFloat(f.montant_ttc)||0),0);
    const depFourn = facturesFourn.reduce((s,f)=>s+(parseFloat(f.montant_total)||0),0);
    document.getElementById('stat-ca').textContent = formatMoney(caClients);
    document.getElementById('stat-depenses').textContent = formatMoney(depFourn);
    document.getElementById('stat-marge').textContent = formatMoney(caClients-depFourn);
    document.getElementById('stat-impayees').textContent = facturesClients.filter(f=>f.statut==='emise').length;
    document.getElementById('tab-count-clients').textContent = facturesClients.length;
    document.getElementById('tab-count-fournisseurs').textContent = facturesFourn.length;
}

function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
    document.getElementById('section-clients').style.display = tab==='clients'?'block':'none';
    document.getElementById('section-fournisseurs').style.display = tab==='fournisseurs'?'block':'none';
    document.getElementById('filters-clients').style.display = tab==='clients'?'flex':'none';
    document.getElementById('filters-fournisseurs').style.display = tab==='fournisseurs'?'flex':'none';
}
// Expose for nav sub-menu
window.switchTab = switchTab;

function renderAll() { renderClients(); renderFournisseurs(); }

const STATUT_LABELS = {brouillon:'Brouillon',devis:'Devis',emise:'Émise',payee:'Payée',annulee:'Annulée'};

function renderClients() {
    let data = [...facturesClients];
    if (filterClient!=='all') data = data.filter(f=>f.statut===filterClient);
    if (searchQuery) { const q=searchQuery.toLowerCase(); data=data.filter(f=>(f.numero||'').toLowerCase().includes(q)||(f.objet||'').toLowerCase().includes(q)||(f.client_nom||'').toLowerCase().includes(q)); }
    const grid = document.getElementById('grid-clients');
    if (!data.length) { grid.innerHTML='<div class="empty-state"><p>Aucune facture client</p></div>'; return; }

    grid.innerHTML = data.map(f=>{
        const projName = getProjName(f.project_id);
        return `<div class="fac-card client-card" onclick="location.href='./atlas-facture-client.html?id=${f.id}'">
            <div class="fac-card-header">
                <div>
                    <div class="fac-numero client">${f.numero||f.numero_devis||'Brouillon #'+f.id}</div>
                    <div style="font-size:.82rem;color:var(--text2);margin-top:2px">${f.objet||''}</div>
                </div>
                <span class="fc-statut fc-statut-${f.statut}">${STATUT_LABELS[f.statut]||f.statut}</span>
            </div>
            <div class="fac-info">
                <span>👤 ${f.client_nom||'—'}</span>
                <span>📅 ${formatDate(f.date_facture)}</span>
            </div>
            ${projName?`<div class="fac-projets"><span class="fac-projet-tag">🏗️ ${projName}</span></div>`:''}
            <div class="fac-footer">
                <span class="fac-montant client">${formatMoney(f.montant_ttc)}</span>
                <div class="fac-badges">
                    ${f.devis_pdf_path?'<span class="fac-badge fac-badge-pdf">📋 Devis</span>':''}
                    ${f.facture_pdf_path?'<span class="fac-badge fac-badge-pdf">📄 Facture</span>':''}
                </div>
            </div>
        </div>`;
    }).join('');
}

function renderFournisseurs() {
    let data = [...facturesFourn];
    if (searchQuery) { const q=searchQuery.toLowerCase(); data=data.filter(f=>(f.numero||'').toLowerCase().includes(q)); }
    const grid = document.getElementById('grid-fournisseurs');
    if (!data.length) { grid.innerHTML='<div class="empty-state"><p>Aucune facture fournisseur</p></div>'; return; }

    grid.innerHTML = data.map(f=>{
        const cmd = getCmd(f.commande_id);
        const projets = getFactureProjects(f.id);

        return `<div class="fac-card" onclick="location.href='./atlas-facture.html?id=${f.id}'">
            <div class="fac-card-header">
                <div>
                    <div class="fac-numero">${f.numero||'FAC-'+f.id}</div>
                    ${cmd?`<div class="fac-commande">📦 ${cmd.numero}</div>`:''}
                </div>
                <div class="fac-date">📅 ${formatDate(f.date_facture)}</div>
            </div>
            <div class="fac-info">
                ${cmd?`<span>📋 ${cmd.titre}</span>`:''}
            </div>
            ${projets.length?`<div class="fac-projets">${projets.map(p=>`<span class="fac-projet-tag">🏗️ ${p}</span>`).join('')}</div>`:''}
            <div class="fac-footer">
                <span class="fac-montant">${formatMoney(f.montant_total)}</span>
                <div class="fac-badges">
                    ${f.pdf_path?'<span class="fac-badge fac-badge-pdf">📄 PDF</span>':''}
                    ${f.nb_justificatifs>0?`<span class="fac-badge fac-badge-justif">📸 ${f.nb_justificatifs}</span>`:''}
                </div>
            </div>
        </div>`;
    }).join('');
}

// Filters
document.querySelectorAll('#filters-clients .filter-btn').forEach(btn=>btn.addEventListener('click',()=>{
    document.querySelectorAll('#filters-clients .filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); filterClient=btn.dataset.filter; renderClients();
}));
document.getElementById('search-input').addEventListener('input',e=>{ searchQuery=e.target.value.trim(); renderAll(); });

// Modal
function onClientSelect() {
    const c = clients.find(x=>x.id==document.getElementById('fc-client').value);
    if(c) document.getElementById('fc-client-adresse').value = [c.adresse,c.ville].filter(Boolean).join(', ');
}
function openNewFactureClient() {
    document.getElementById('new-fc-form').reset();
    document.getElementById('fc-tva').value='20';
    document.getElementById('new-fc-modal').style.display='flex';
}
function closeNewFCModal() { document.getElementById('new-fc-modal').style.display='none'; }

async function createFactureClient(e) {
    e.preventDefault();
    const btn=document.getElementById('fc-save-btn'); btn.disabled=true; btn.textContent='Création...';
    const clientId=parseInt(document.getElementById('fc-client').value);
    const client=clients.find(c=>c.id===clientId);
    const data={
        objet:document.getElementById('fc-objet').value.trim(), statut:'brouillon',
        client_id:clientId, project_id:document.getElementById('fc-project').value?parseInt(document.getElementById('fc-project').value):null,
        client_nom:client?.nom||null, client_ice:document.getElementById('fc-client-ice').value.trim()||null,
        client_adresse:document.getElementById('fc-client-adresse').value.trim()||null,
        taux_tva:parseFloat(document.getElementById('fc-tva').value)||20,
        date_echeance:document.getElementById('fc-echeance').value||null,
        notes:document.getElementById('fc-notes').value.trim()||null,
        date_facture:new Date().toISOString().split('T')[0],
    };
    try {
        const {data:newFac,error}=await db.from('atlas_factures_clients').insert([data]).select().single();
        if(error) throw error;
        showToast('Facture créée en brouillon ✓');
        closeNewFCModal();
        setTimeout(()=>location.href='./atlas-facture-client.html?id='+newFac.id,500);
    } catch(err) { showToast('Erreur: '+err.message,true); }
    finally { btn.disabled=false; btn.textContent='Créer en brouillon'; }
}

function showToast(msg,isError=false) {
    const t=document.getElementById('toast'); t.textContent=msg;
    t.className='toast '+(isError?'toast-error':'toast-success'); t.style.display='block';
    setTimeout(()=>{t.style.display='none';},3000);
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeNewFCModal();});

// Auto-switch tab based on URL hash
if(window.location.hash==='#fournisseurs') switchTab('fournisseurs');

loadData();
setInterval(loadData,60000);
    </script>
    <script src="./atlas-nav.js"></script>
</body>
</html>
