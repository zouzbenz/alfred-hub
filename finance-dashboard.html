<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Finance Hub - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <style>
        :root { 
            --bg:#0a0a0a; --card:#141414; --card2:#1a1a1a; --border:#2a2a2a; 
            --text:#fff; --dim:#888; --accent:#6366f1; --accent2:#8b5cf6;
            --green:#10b981; --red:#ef4444; --orange:#f59e0b; --blue:#3b82f6;
        }
        * { box-sizing:border-box; margin:0; padding:0; }
        body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; }
        
        .container { max-width:1400px; margin:0 auto; padding:15px; }
        
        /* Header */
        .header { display:flex; justify-content:space-between; align-items:center; padding:15px 0; margin-bottom:20px; flex-wrap:wrap; gap:15px; }
        .header h1 { font-size:1.6rem; font-weight:800; display:flex; align-items:center; gap:10px; }
        .header-links { display:flex; gap:10px; }
        .header-link { padding:10px 16px; background:var(--card); border:1px solid var(--border); border-radius:10px; color:var(--dim); text-decoration:none; font-size:.85rem; transition:.2s; }
        .header-link:hover { border-color:var(--accent); color:var(--text); }
        .header-link.active { background:var(--accent); border-color:var(--accent); color:#fff; }
        
        /* Solde principal */
        .solde-card { background:linear-gradient(135deg, var(--accent), var(--accent2)); border-radius:20px; padding:25px; margin-bottom:20px; }
        .solde-label { font-size:.85rem; opacity:.8; margin-bottom:5px; }
        .solde-value { font-size:2.5rem; font-weight:800; }
        .solde-value.positive { color:#fff; }
        .solde-value.negative { color:#fecaca; }
        .solde-sub { display:flex; gap:20px; margin-top:15px; font-size:.85rem; opacity:.9; }
        .solde-sub span { display:flex; align-items:center; gap:5px; }
        
        /* KPIs */
        .kpis { display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; margin-bottom:20px; }
        .kpi { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px; text-align:center; }
        .kpi-icon { font-size:1.3rem; margin-bottom:8px; }
        .kpi-value { font-size:1.4rem; font-weight:800; margin-bottom:4px; }
        .kpi-value.expense { color:var(--red); }
        .kpi-value.income { color:var(--green); }
        .kpi-label { font-size:.75rem; color:var(--dim); }
        
        /* Filtres */
        .filters { display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
        .filter-group { display:flex; background:var(--card); border-radius:10px; overflow:hidden; border:1px solid var(--border); }
        .filter-btn { padding:10px 16px; background:transparent; border:none; color:var(--dim); font-size:.8rem; font-weight:600; cursor:pointer; transition:.2s; }
        .filter-btn:hover { color:var(--text); }
        .filter-btn.active { background:var(--accent); color:#fff; }
        
        /* Sections */
        .section { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px; margin-bottom:20px; }
        .section-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; }
        .section-title { font-size:1rem; font-weight:700; display:flex; align-items:center; gap:8px; }
        .section-link { font-size:.8rem; color:var(--accent); text-decoration:none; }
        
        /* Budgets */
        .budget-item { margin-bottom:15px; }
        .budget-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
        .budget-name { font-size:.85rem; display:flex; align-items:center; gap:6px; }
        .budget-values { font-size:.8rem; color:var(--dim); }
        .budget-bar { height:8px; background:var(--border); border-radius:4px; overflow:hidden; }
        .budget-fill { height:100%; border-radius:4px; transition:width .5s; }
        .budget-fill.safe { background:linear-gradient(90deg, var(--green), #34d399); }
        .budget-fill.warning { background:linear-gradient(90deg, var(--orange), #fbbf24); }
        .budget-fill.danger { background:linear-gradient(90deg, var(--red), #f87171); }
        .budget-status { font-size:.75rem; margin-top:4px; }
        .budget-status.saved { color:var(--green); }
        .budget-status.over { color:var(--red); }
        
        /* Scheduled */
        .scheduled-item { display:flex; align-items:center; gap:12px; padding:12px; background:var(--card2); border-radius:10px; margin-bottom:8px; }
        .scheduled-check { width:28px; height:28px; border-radius:8px; border:2px solid var(--border); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.2s; flex-shrink:0; }
        .scheduled-check:hover { border-color:var(--green); }
        .scheduled-check.paid { background:var(--green); border-color:var(--green); }
        .scheduled-check.paid::after { content:'✓'; color:#fff; font-size:.8rem; }
        .scheduled-info { flex:1; min-width:0; }
        .scheduled-name { font-size:.9rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .scheduled-meta { font-size:.75rem; color:var(--dim); display:flex; gap:10px; flex-wrap:wrap; }
        .scheduled-amount { font-size:1rem; font-weight:700; color:var(--red); white-space:nowrap; }
        .scheduled-date { font-size:.75rem; color:var(--dim); text-align:right; }
        
        /* Transactions */
        .transaction-item { display:flex; align-items:center; gap:12px; padding:12px; border-bottom:1px solid var(--border); }
        .transaction-item:last-child { border-bottom:none; }
        .transaction-icon { width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:1.1rem; flex-shrink:0; }
        .transaction-icon.expense { background:rgba(239,68,68,.15); }
        .transaction-icon.income { background:rgba(16,185,129,.15); }
        .transaction-info { flex:1; min-width:0; }
        .transaction-name { font-size:.9rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .transaction-meta { font-size:.75rem; color:var(--dim); }
        .transaction-amount { font-size:1rem; font-weight:700; }
        .transaction-amount.expense { color:var(--red); }
        .transaction-amount.income { color:var(--green); }
        .transaction-tags { display:flex; gap:4px; margin-top:4px; }
        .tag { padding:2px 6px; border-radius:4px; font-size:.65rem; font-weight:600; }
        .tag.pro { background:rgba(99,102,241,.2); color:var(--accent); }
        .tag.perso { background:rgba(139,92,246,.2); color:var(--accent2); }
        .tag.cash { background:rgba(245,158,11,.2); color:var(--orange); }
        .tag.formel { background:rgba(59,130,246,.2); color:var(--blue); }
        
        /* Empty state */
        .empty-state { text-align:center; padding:40px; color:var(--dim); }
        
        /* Footer */
        .footer { text-align:center; padding:20px; color:var(--dim); font-size:.8rem; }
        .footer a { color:var(--accent); text-decoration:none; }
        
        /* Responsive */
        @media(max-width:900px) { .kpis { grid-template-columns:repeat(2, 1fr); } }
        @media(max-width:500px) { 
            .kpis { grid-template-columns:1fr 1fr; gap:8px; }
            .kpi { padding:14px 10px; }
            .kpi-value { font-size:1.1rem; }
            .solde-value { font-size:2rem; }
            .header h1 { font-size:1.3rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>💰 Finance Hub</h1>
            <div class="header-links">
                <a href="./" class="header-link">Hub</a>
                <a href="./finance-dashboard.html" class="header-link active">Dashboard</a>
                <a href="./finance-backoffice.html" class="header-link">Gestion</a>
            </div>
        </header>
        
        <!-- Solde principal -->
        <div class="solde-card">
            <div class="solde-label">Solde du mois</div>
            <div class="solde-value positive" id="solde-mois">+0 MAD</div>
            <div class="solde-sub">
                <span>📈 Revenus: <strong id="revenus-mois">0</strong></span>
                <span>📉 Dépenses: <strong id="depenses-mois">0</strong></span>
            </div>
        </div>
        
        <!-- KPIs -->
        <div class="kpis">
            <div class="kpi">
                <div class="kpi-icon">📅</div>
                <div class="kpi-value expense" id="kpi-jour">0</div>
                <div class="kpi-label">Aujourd'hui</div>
            </div>
            <div class="kpi">
                <div class="kpi-icon">📆</div>
                <div class="kpi-value expense" id="kpi-semaine">0</div>
                <div class="kpi-label">Cette semaine</div>
            </div>
            <div class="kpi">
                <div class="kpi-icon">🗓️</div>
                <div class="kpi-value expense" id="kpi-mois">0</div>
                <div class="kpi-label">Ce mois</div>
            </div>
            <div class="kpi">
                <div class="kpi-icon">📊</div>
                <div class="kpi-value expense" id="kpi-annee">0</div>
                <div class="kpi-label">Cette année</div>
            </div>
        </div>
        
        <!-- Filtres -->
        <div class="filters">
            <div class="filter-group">
                <button class="filter-btn active" data-filter="type" data-value="all">Tout</button>
                <button class="filter-btn" data-filter="type" data-value="pro">Pro</button>
                <button class="filter-btn" data-filter="type" data-value="perso">Perso</button>
            </div>
            <div class="filter-group">
                <button class="filter-btn active" data-filter="mode" data-value="all">Tout</button>
                <button class="filter-btn" data-filter="mode" data-value="cash">Cash</button>
                <button class="filter-btn" data-filter="mode" data-value="formel">Formel</button>
            </div>
        </div>
        
        <!-- Budgets -->
        <div class="section">
            <div class="section-header">
                <h2 class="section-title">📊 Budgets du mois</h2>
                <a href="./finance-backoffice.html" class="section-link">Gérer →</a>
            </div>
            <div id="budgets-list">
                <div class="empty-state">Chargement...</div>
            </div>
        </div>
        
        <!-- À venir -->
        <div class="section">
            <div class="section-header">
                <h2 class="section-title">⏰ À payer ce mois</h2>
            </div>
            <div id="scheduled-list">
                <div class="empty-state">Chargement...</div>
            </div>
        </div>
        
        <!-- Dernières transactions -->
        <div class="section">
            <div class="section-header">
                <h2 class="section-title">📝 Dernières transactions</h2>
                <a href="./finance-backoffice.html" class="section-link">Voir tout →</a>
            </div>
            <div id="transactions-list">
                <div class="empty-state">Chargement...</div>
            </div>
        </div>
        
        <div class="footer">
            <a href="./">Alfred Hub</a> • <a href="./finance-backoffice.html">Gestion</a>
        </div>
    </div>
    
    <script>
const SUPABASE_URL = 'https://wxhlstificzqovfcumop.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aGxzdGlmaWN6cW92ZmN1bW9wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyNjcwOTAsImV4cCI6MjA4Njg0MzA5MH0.mt6v3SKPMhWpMw9PH7D8k3ubrR1kJNIFHw0aloLmQiQ';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const CATEGORIES = {
    // Perso
    courses: { icon: '🛒', label: 'Courses' },
    fruits_legumes: { icon: '🥬', label: 'Fruits & Légumes' },
    maison: { icon: '🏠', label: 'Maison' },
    restaurant: { icon: '🍽️', label: 'Restaurant' },
    transport: { icon: '🚗', label: 'Transport' },
    loisirs: { icon: '🎬', label: 'Loisirs' },
    shopping: { icon: '👕', label: 'Shopping' },
    sante: { icon: '💊', label: 'Santé' },
    abonnements_perso: { icon: '📱', label: 'Abonnements' },
    cadeaux: { icon: '🎁', label: 'Cadeaux' },
    autre_perso: { icon: '💸', label: 'Autre' },
    // Pro
    production_neo: { icon: '🎬', label: 'Production Neo' },
    materiel: { icon: '💼', label: 'Matériel' },
    deplacements_pro: { icon: '🚚', label: 'Déplacements' },
    salaires: { icon: '💰', label: 'Salaires' },
    abonnements_pro: { icon: '📋', label: 'Abonnements Pro' },
    autre_pro: { icon: '💸', label: 'Autre Pro' },
    // Revenus
    paiement_client: { icon: '💵', label: 'Paiement client' },
    virement: { icon: '🏦', label: 'Virement' },
    autre_revenu: { icon: '💰', label: 'Autre revenu' }
};

let transactions = [], budgets = [], scheduled = [], scheduledPayments = [];
let filterType = 'all', filterMode = 'all';

// Dates helpers
const today = new Date();
const todayStr = today.toISOString().split('T')[0];
const startOfWeek = new Date(today); startOfWeek.setDate(today.getDate() - today.getDay() + 1);
const startOfMonth = new Date(today.getFullYear(), today.getMonth(), 1);
const startOfYear = new Date(today.getFullYear(), 0, 1);
const currentMonthKey = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;

async function loadData() {
    const [tRes, bRes, sRes, spRes] = await Promise.all([
        db.from('finance_transactions').select('*').order('date_transaction', { ascending: false }),
        db.from('finance_budgets').select('*'),
        db.from('finance_scheduled').select('*').eq('active', true),
        db.from('finance_scheduled_payments').select('*').eq('mois_annee', currentMonthKey)
    ]);
    
    transactions = tRes.data || [];
    budgets = bRes.data || [];
    scheduled = sRes.data || [];
    scheduledPayments = spRes.data || [];
    
    render();
}

function formatMoney(n) {
    return new Intl.NumberFormat('fr-MA', { maximumFractionDigits: 0 }).format(Math.abs(n || 0));
}

function formatMoneyShort(n) {
    const abs = Math.abs(n || 0);
    if (abs >= 1000000) return (abs / 1000000).toFixed(1) + 'M';
    if (abs >= 1000) return (abs / 1000).toFixed(0) + 'K';
    return formatMoney(abs);
}

function getFilteredTransactions() {
    return transactions.filter(t => {
        if (filterType !== 'all' && t.pro_perso !== filterType) return false;
        if (filterMode !== 'all' && t.mode_paiement !== filterMode) return false;
        return true;
    });
}

function calcKPIs() {
    const filtered = getFilteredTransactions().filter(t => t.type === 'depense');
    
    const jour = filtered.filter(t => t.date_transaction === todayStr).reduce((s, t) => s + parseFloat(t.montant), 0);
    const semaine = filtered.filter(t => new Date(t.date_transaction) >= startOfWeek).reduce((s, t) => s + parseFloat(t.montant), 0);
    const mois = filtered.filter(t => new Date(t.date_transaction) >= startOfMonth).reduce((s, t) => s + parseFloat(t.montant), 0);
    const annee = filtered.filter(t => new Date(t.date_transaction) >= startOfYear).reduce((s, t) => s + parseFloat(t.montant), 0);
    
    document.getElementById('kpi-jour').textContent = formatMoneyShort(jour);
    document.getElementById('kpi-semaine').textContent = formatMoneyShort(semaine);
    document.getElementById('kpi-mois').textContent = formatMoneyShort(mois);
    document.getElementById('kpi-annee').textContent = formatMoneyShort(annee);
}

function calcSolde() {
    const filtered = getFilteredTransactions().filter(t => new Date(t.date_transaction) >= startOfMonth);
    const revenus = filtered.filter(t => t.type === 'revenu').reduce((s, t) => s + parseFloat(t.montant), 0);
    const depenses = filtered.filter(t => t.type === 'depense').reduce((s, t) => s + parseFloat(t.montant), 0);
    const solde = revenus - depenses;
    
    const soldeEl = document.getElementById('solde-mois');
    soldeEl.textContent = (solde >= 0 ? '+' : '-') + formatMoney(solde) + ' MAD';
    soldeEl.className = 'solde-value ' + (solde >= 0 ? 'positive' : 'negative');
    
    document.getElementById('revenus-mois').textContent = formatMoney(revenus) + ' MAD';
    document.getElementById('depenses-mois').textContent = formatMoney(depenses) + ' MAD';
}

function renderBudgets() {
    const container = document.getElementById('budgets-list');
    const monthTransactions = getFilteredTransactions().filter(t => 
        t.type === 'depense' && new Date(t.date_transaction) >= startOfMonth
    );
    
    // Filter budgets based on current filter
    let filteredBudgets = budgets;
    if (filterType !== 'all') {
        filteredBudgets = budgets.filter(b => b.pro_perso === filterType);
    }
    
    if (!filteredBudgets.length) {
        container.innerHTML = '<div class="empty-state">Aucun budget défini</div>';
        return;
    }
    
    container.innerHTML = filteredBudgets.map(b => {
        const spent = monthTransactions.filter(t => t.categorie === b.categorie).reduce((s, t) => s + parseFloat(t.montant), 0);
        const budget = parseFloat(b.budget_mensuel);
        const pct = budget > 0 ? Math.round((spent / budget) * 100) : 0;
        const reste = budget - spent;
        const cat = CATEGORIES[b.categorie] || { icon: '💰', label: b.categorie };
        
        let barClass = 'safe';
        if (pct > 100) barClass = 'danger';
        else if (pct > 80) barClass = 'warning';
        
        return `
        <div class="budget-item">
            <div class="budget-header">
                <span class="budget-name">${cat.icon} ${cat.label}</span>
                <span class="budget-values">${formatMoney(spent)} / ${formatMoney(budget)} MAD</span>
            </div>
            <div class="budget-bar"><div class="budget-fill ${barClass}" style="width:${Math.min(pct, 100)}%"></div></div>
            <div class="budget-status ${reste >= 0 ? 'saved' : 'over'}">
                ${reste >= 0 ? '✅ ' + formatMoney(reste) + ' restant' : '⚠️ ' + formatMoney(Math.abs(reste)) + ' dépassé'}
            </div>
        </div>`;
    }).join('');
}

function renderScheduled() {
    const container = document.getElementById('scheduled-list');
    
    // Filter by pro/perso
    let filteredScheduled = scheduled;
    if (filterType !== 'all') {
        filteredScheduled = scheduled.filter(s => s.pro_perso === filterType);
    }
    
    if (!filteredScheduled.length) {
        container.innerHTML = '<div class="empty-state">Aucune dépense récurrente</div>';
        return;
    }
    
    // Sort by jour_echeance
    filteredScheduled.sort((a, b) => a.jour_echeance - b.jour_echeance);
    
    container.innerHTML = filteredScheduled.map(s => {
        const payment = scheduledPayments.find(p => p.scheduled_id === s.id);
        const isPaid = payment?.paid || false;
        const cat = CATEGORIES[s.categorie] || { icon: '💰', label: s.categorie };
        const dateStr = s.jour_echeance ? `${s.jour_echeance}/${today.getMonth() + 1}` : '-';
        
        return `
        <div class="scheduled-item">
            <div class="scheduled-check ${isPaid ? 'paid' : ''}" onclick="toggleScheduledPayment(${s.id}, ${isPaid})"></div>
            <div class="scheduled-info">
                <div class="scheduled-name">${s.designation}</div>
                <div class="scheduled-meta">
                    <span>${cat.icon} ${cat.label}</span>
                    <span class="tag ${s.pro_perso}">${s.pro_perso}</span>
                    <span class="tag ${s.mode_paiement}">${s.mode_paiement}</span>
                </div>
            </div>
            <div>
                <div class="scheduled-amount">-${formatMoney(s.montant)}</div>
                <div class="scheduled-date">📅 ${dateStr}</div>
            </div>
        </div>`;
    }).join('');
}

async function toggleScheduledPayment(scheduledId, currentStatus) {
    const existing = scheduledPayments.find(p => p.scheduled_id === scheduledId);
    
    if (existing) {
        await db.from('finance_scheduled_payments').update({ 
            paid: !currentStatus, 
            paid_date: !currentStatus ? todayStr : null 
        }).eq('id', existing.id);
    } else {
        await db.from('finance_scheduled_payments').insert({
            scheduled_id: scheduledId,
            mois_annee: currentMonthKey,
            paid: true,
            paid_date: todayStr
        });
    }
    
    await loadData();
}

function renderTransactions() {
    const container = document.getElementById('transactions-list');
    const filtered = getFilteredTransactions().slice(0, 10);
    
    if (!filtered.length) {
        container.innerHTML = '<div class="empty-state">Aucune transaction</div>';
        return;
    }
    
    container.innerHTML = filtered.map(t => {
        const cat = CATEGORIES[t.categorie] || { icon: '💰', label: t.categorie };
        const isExpense = t.type === 'depense';
        const date = new Date(t.date_transaction).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' });
        
        return `
        <div class="transaction-item">
            <div class="transaction-icon ${isExpense ? 'expense' : 'income'}">${cat.icon}</div>
            <div class="transaction-info">
                <div class="transaction-name">${t.designation}</div>
                <div class="transaction-meta">${cat.label} • ${date}</div>
                <div class="transaction-tags">
                    <span class="tag ${t.pro_perso}">${t.pro_perso}</span>
                    <span class="tag ${t.mode_paiement}">${t.mode_paiement}</span>
                </div>
            </div>
            <div class="transaction-amount ${isExpense ? 'expense' : 'income'}">
                ${isExpense ? '-' : '+'}${formatMoney(t.montant)}
            </div>
        </div>`;
    }).join('');
}

function render() {
    calcSolde();
    calcKPIs();
    renderBudgets();
    renderScheduled();
    renderTransactions();
}

// Filters
document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        const filter = btn.dataset.filter;
        const value = btn.dataset.value;
        
        // Update active state in group
        btn.parentElement.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        if (filter === 'type') filterType = value;
        if (filter === 'mode') filterMode = value;
        
        render();
    });
});

loadData();
    </script>
</body>
</html>
