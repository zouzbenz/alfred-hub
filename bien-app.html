<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bien immobilier — Insta Immo Casablanca</title>
    <meta name="description" content="Découvrez ce bien immobilier à Casablanca proposé par Insta Immo : photos, caractéristiques, visite vidéo et prise de contact directe.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Insta Immo">
    <meta property="og:title" content="Bien immobilier — Insta Immo Casablanca">
    <meta property="og:description" content="Photos, caractéristiques et visite vidéo de ce bien à Casablanca.">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./immo-core.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <style>
        /* ---- Spécifique page bien — Éditorial Casablanca ---- */
        .head-grid{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:24px}
        .head-grid h1{font-family:var(--serif);font-weight:400;font-size:clamp(1.7rem,4vw,2.8rem);line-height:1.12;margin:12px 0 8px;text-wrap:balance;max-width:18em}
        .head-location{font-size:.76rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
        .head-price{text-align:right}
        .head-price .price{font-family:var(--serif);font-size:clamp(1.6rem,3.6vw,2.4rem);font-weight:500;white-space:nowrap;letter-spacing:-.01em}
        .head-price .price small{font-size:.5em;font-weight:500;color:var(--dim);font-family:var(--sans)}
        .head-price .nego{font-size:.78rem;color:var(--gold-dark);font-weight:500;margin-top:2px;letter-spacing:.06em;text-transform:uppercase}
        .badges{display:flex;gap:8px;margin-bottom:28px;flex-wrap:wrap}

        /* Galerie hero */
        .gallery{display:grid;grid-template-columns:2fr 1fr;grid-auto-rows:190px;gap:10px;margin-bottom:36px}
        .gallery .g-item{border-radius:var(--radius);overflow:hidden;background:var(--card2);cursor:pointer;position:relative;border:none;padding:0}
        .gallery .g-item img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
        .gallery .g-item:hover img{transform:scale(1.03)}
        .gallery .g-main{grid-row:span 2}
        .gallery .g-more{position:absolute;inset:0;background:rgba(15,15,15,.55);color:#fff;
          display:grid;place-items:center;font-weight:700;font-size:1rem}
        .gallery.single{grid-template-columns:1fr;grid-auto-rows:clamp(240px,45vw,430px)}
        .gallery-empty{aspect-ratio:16/8;border-radius:var(--radius);background:var(--card2);
          display:grid;place-items:center;font-size:4rem;color:var(--dim);margin-bottom:36px}

        /* Lightbox */
        .lightbox{position:fixed;inset:0;background:rgba(10,10,10,.94);z-index:100;display:none;
          flex-direction:column;align-items:center;justify-content:center;padding:20px}
        .lightbox.open{display:flex}
        .lightbox img{max-width:min(1100px,94vw);max-height:80vh;object-fit:contain;border-radius:10px}
        .lb-caption{color:#fff;opacity:.75;font-size:.88rem;margin-top:14px}
        .lb-btn{position:absolute;background:rgba(255,255,255,.12);color:#fff;border:none;width:46px;height:46px;
          border-radius:50%;font-size:1.3rem;cursor:pointer;display:grid;place-items:center}
        .lb-btn:hover{background:rgba(255,255,255,.25)}
        .lb-close{top:18px;right:18px}
        .lb-prev{left:14px;top:50%;transform:translateY(-50%)}
        .lb-next{right:14px;top:50%;transform:translateY(-50%)}

        /* Caractéristiques — liste éditoriale à filets */
        .features-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:0 clamp(24px,4vw,56px)}
        .feature{display:flex;align-items:baseline;justify-content:space-between;gap:14px;
          padding:13px 2px;border-bottom:1px solid var(--border)}
        .feature-icon{display:none}
        .feature-label{font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
        .feature-value{font-weight:600;font-size:.95rem;text-align:right}

        /* Vidéo */
        .video-container{position:relative;padding-bottom:56.25%;height:0;border-radius:var(--radius);overflow:hidden;background:#000}
        .video-container.vertical{padding-bottom:0;height:min(620px,150vw);max-width:350px;margin:0 auto}
        .video-container iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}

        .description{font-size:1.02rem;line-height:1.95;color:var(--dim-dark);max-width:none;column-gap:48px}
        @media (min-width:900px){.description{font-size:1.05rem}}
        .points-forts{background:rgba(227,160,8,.05);border:1px solid #EBD9A8;border-left:3px solid var(--gold);
          border-radius:var(--radius);padding:22px 24px;margin-top:20px;font-size:.95rem;line-height:1.85}
        .points-forts strong{display:block;margin-bottom:8px;font-family:var(--serif);font-weight:500;font-size:1.05rem}

        /* Sections d'espaces */
        .space-section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:16px}
        .space-title{font-family:var(--serif);font-size:1.15rem;font-weight:500;margin-bottom:14px}
        .space-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:12px}
        .space-photo{aspect-ratio:4/3;border-radius:var(--radius-sm);overflow:hidden;background:var(--card2);cursor:pointer;border:none;padding:0}
        .space-photo img{width:100%;height:100%;object-fit:cover;transition:transform .25s}
        .space-photo:hover img{transform:scale(1.05)}
        .space-desc{color:var(--dim);font-size:.9rem;line-height:1.7}
        .space-ia{background:rgba(227,160,8,.05);border-color:#EBD9A8;border-left:3px solid var(--gold)}
        .ia-disclaimer{font-size:.79rem;color:var(--dim-dark);background:rgba(255,255,255,.65);border-radius:2px;padding:10px 14px;margin-bottom:14px;line-height:1.65;font-style:italic}
        .tour-container{position:relative;padding-bottom:62%;height:0;border-radius:var(--radius);overflow:hidden;background:#0d0d0d}
        .tour-container iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
        @media (max-width:640px){.tour-container{padding-bottom:130%}}
        .tour-hint{text-align:center;color:var(--dim);font-size:.82rem;margin-top:10px}

        /* Barre CTA sticky mobile */
        .sticky-cta{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--ivory);
          border-top:1px solid var(--border);padding:10px 16px calc(10px + env(safe-area-inset-bottom));
          display:none;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 -6px 24px rgba(0,0,0,.08)}
        .sticky-cta .sc-price{font-family:var(--serif);font-weight:500;font-size:1.1rem;line-height:1.2}
        .sticky-cta .sc-price small{display:block;font-size:.7rem;font-weight:600;color:var(--dim)}
        .sticky-cta .btn{padding:11px 18px;min-height:42px}
        @media (max-width:760px){
          .sticky-cta{display:flex}
          body{padding-bottom:76px}
          .head-price{text-align:left}
          .gallery{grid-template-columns:1fr;grid-auto-rows:clamp(200px,52vw,300px)}
          .gallery .g-main{grid-row:auto}
          .gallery .g-item:nth-child(n+3){display:none}
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="brand-header">
            <a class="brand" href="./immo-biens.html" aria-label="Insta Immo — retour aux biens"><b>Insta Immo</b><small>Casablanca</small></a>
            <a href="./immo-biens.html" class="btn btn-outline" style="min-height:42px;padding:10px 20px;font-size:.85rem">← Toute la sélection</a>
        </header>

        <main id="content" aria-live="polite">
            <div class="state"><div class="spinner" aria-hidden="true"></div><p>Chargement du bien…</p></div>
        </main>

        <footer class="site-footer">
            <span>© 2026 <b>Insta Immo</b> — Zouhair Benazzouz · Casablanca</span>
            <span class="devise">La bonne adresse existe.</span>
        </footer>
    </div>

    <!-- Barre d'action mobile -->
    <div class="sticky-cta" id="sticky-cta" hidden></div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Galerie photos">
        <button class="lb-btn lb-close" onclick="closeLightbox()" aria-label="Fermer">✕</button>
        <button class="lb-btn lb-prev" onclick="lbNav(-1)" aria-label="Photo précédente">‹</button>
        <img id="lb-img" src="" alt="">
        <button class="lb-btn lb-next" onclick="lbNav(1)" aria-label="Photo suivante">›</button>
        <div class="lb-caption" id="lb-caption"></div>
    </div>

    <script src="./immo-core.js"></script>
    <script>
const _pathMatch = location.pathname.match(/\/bien\/([^\/?#]+)/);
const ref = _pathMatch ? decodeURIComponent(_pathMatch[1]) : new URLSearchParams(location.search).get('ref');
let allPhotos = []; let lbIndex = 0; let galleryScope = { start: 0, end: 0 }; let lbScope = { start: 0, end: 0 };

async function loadBien() {
    if (!ref) { uiError('content', 'Référence manquante', 'Le lien utilisé est incomplet. Vérifiez qu\'il contient bien la référence du bien.'); return; }

    try {
        const { data: bien, error } = await db.from('immo_biens').select('*').eq('reference', ref).maybeSingle();
        if (error) throw error;
        if (!bien) { uiError('content', 'Bien introuvable', 'Ce bien n\'est plus disponible ou le lien est incorrect.'); return; }

        const [photosR, sectionsR] = await Promise.all([
            db.from('immo_bien_photos').select('*').eq('bien_id', bien.id).order('ordre'),
            db.from('immo_bien_sections').select('*').eq('bien_id', bien.id).order('ordre')
        ]);

        document.title = `${bien.titre} · ${formatMoney(bien.prix)} MAD — Insta Immo`;
        const metaDesc = `${TYPE_LABELS[bien.type_bien] || 'Bien'} à ${ZONE_LABELS[bien.zone] || bien.zone}, ${bien.surface_m2 || '—'} m² · ${formatMoney(bien.prix)} MAD. Insta Immo Casablanca.`;
        document.querySelector('meta[name="description"]').setAttribute('content', metaDesc);
        document.querySelector('meta[property="og:title"]').setAttribute('content', document.title);
        document.querySelector('meta[property="og:description"]').setAttribute('content', metaDesc);

        render(bien, photosR.data || [], sectionsR.data || []);
    } catch (err) {
        console.error(err);
        uiError('content', 'Impossible de charger ce bien', 'Vérifiez votre connexion puis actualisez la page.');
    }
}

function render(bien, photos, sections) {
    /* Photos triées : ordre officiel des sections, puis ordre interne */
    const sorted = sortPhotos(photos);
    const heroPhotos = sorted.filter(p => p.section === 'hero');
    const otherPhotos = sorted.filter(p => p.section !== 'hero');
    /* La lightbox de la galerie principale navigue sur hero + tout, dans l'ordre */
    allPhotos = sorted.map(p => ({
        url: photoUrl(p.storage_path),
        caption: SECTION_LABELS[p.section] || p.section,
        section: p.section
    }));
    galleryScope = { start: 0, end: allPhotos.length };

    /* Galerie hero : jusqu'à 5 vignettes, la 5e affiche le compteur */
    let galleryHTML;
    if (!allPhotos.length) {
        galleryHTML = `<div class="gallery-empty" aria-hidden="true">🏠</div>`;
    } else if (allPhotos.length === 1) {
        galleryHTML = `<div class="gallery single">
            <button class="g-item g-main" onclick="openLightbox(0)" aria-label="Agrandir la photo">
              <img src="${escAttr(allPhotos[0].url)}" alt="${escAttr(bien.titre)}"></button></div>`;
    } else {
        const thumbs = allPhotos.slice(0, 5);
        galleryHTML = `<div class="gallery">` + thumbs.map((p, i) => `
            <button class="g-item ${i === 0 ? 'g-main' : ''}" onclick="openLightbox(${i})" aria-label="Voir la photo ${i + 1} sur ${allPhotos.length}">
                <img src="${escAttr(p.url)}" alt="${escAttr(bien.titre)} — ${escAttr(p.caption)}" loading="${i === 0 ? 'eager' : 'lazy'}">
                ${i === 4 && allPhotos.length > 5 ? `<span class="g-more">+ ${allPhotos.length - 5} photos</span>` : ''}
            </button>`).join('') + `</div>`;
    }

    const features = [
        bien.surface_m2 && ['📐', 'Surface', `${esc(bien.surface_m2)} m²`],
        bien.surface_terrain && ['🌍', 'Terrain', `${esc(bien.surface_terrain)} m²`],
        bien.chambres && ['🛏️', 'Chambres', esc(bien.chambres)],
        bien.salons && ['🛋️', 'Salons', esc(bien.salons)],
        bien.sdb && ['🚿', 'Salles de bain', esc(bien.sdb)],
        (bien.etage !== null && bien.etage !== undefined) && ['🏢', 'Étage', esc(bien.etage)],
        bien.orientation && ['🧭', 'Orientation', esc(bien.orientation)],
        bien.annee_construction && ['📅', 'Année', esc(bien.annee_construction)],
        bien.parking > 0 && ['🚗', 'Parking', `${esc(bien.parking)} place${bien.parking > 1 ? 's' : ''}`],
        bien.terrasse_m2 > 0 && ['☀️', 'Terrasse', `${esc(bien.terrasse_m2)} m²`],
        bien.jardin_m2 > 0 && ['🌳', 'Jardin', `${esc(bien.jardin_m2)} m²`],
        bien.cuisine && ['🍳', 'Cuisine', esc(bien.cuisine)]
    ].filter(Boolean).map(([icon, label, value]) => `
        <div class="feature"><span class="feature-label">${label}</span><span class="feature-value">${value}</span></div>`).join('');

    const equipements = [
        bien.ascenseur && 'Ascenseur', bien.gardien && 'Gardien', bien.piscine && 'Piscine',
        bien.balcon && 'Balcon', bien.cave && 'Cave', bien.buanderie && 'Buanderie',
        bien.chambre_personnel && 'Chambre personnel'
    ].filter(Boolean).map(e => `<span class="badge" style="gap:7px"><span style="color:var(--gold)">✓</span>${esc(e)}</span>`).join('');

    /* Sections d'espaces, dans l'ordre officiel ; la lightbox reste dans la section */
    const bySection = new Map();
    otherPhotos.forEach(p => { if (!bySection.has(p.section)) bySection.set(p.section, []); bySection.get(p.section).push(p); });
    let offset = heroPhotos.length;
    let sectionsHTML = '', iaHTML = '';
    for (const [sec, list] of bySection) {
        const info = sections.find(s => s.section === sec);
        const isIA = sec === 'refonte_ia';
        const html = `
        <div class="space-section ${isIA ? 'space-ia' : ''}">
            <div class="space-title">${esc(SECTION_LABELS[sec] || sec)}</div>
            ${isIA ? '<p class="ia-disclaimer">Visualisations générées par intelligence artificielle pour vous aider à vous projeter — images non contractuelles, ne reflétant pas l\'état réel du bien.</p>' : ''}
            <div class="space-photos">
                ${list.map((p, i) => `<button class="space-photo" onclick="openLightbox(${offset + i}, ${offset}, ${offset + list.length})" aria-label="Agrandir — ${escAttr(SECTION_LABELS[sec] || sec)}">
                    <img src="${escAttr(photoUrl(p.storage_path))}" alt="${escAttr((SECTION_LABELS[sec] || sec) + (p.description ? ' — ' + p.description : ''))}" loading="lazy"></button>`).join('')}
            </div>
            ${info?.description ? `<p class="space-desc">${escMultiline(info.description)}</p>` : ''}
        </div>`;
        offset += list.length;
        if (isIA) iaHTML += html; else sectionsHTML += html;
    }

    const ytId = getYouTubeId(bien.video_youtube);
    const vt = (bien.visite_virtuelle || '').trim();
    const tourUrl = vt ? (vt.startsWith('http') ? vt : (vt.startsWith('/') ? vt : '/' + vt)) : null;
    const waText = encodeURIComponent(`Bonjour, je suis intéressé(e) par le bien ${bien.reference} — ${bien.titre}`);

    document.getElementById('content').innerHTML = `
        <div class="head-grid">
            <div>
                <span class="ref-plate">${esc(bien.reference)}</span>
                <h1>${esc(bien.titre)}</h1>
                <p class="head-location">${esc(ZONE_LABELS[bien.zone] || bien.zone)}${bien.quartier ? ' · ' + esc(bien.quartier) : ''} · Casablanca</p>
            </div>
            <div class="head-price">
                <div class="price">${formatMoney(bien.prix)} <small>MAD</small></div>
                ${bien.negociable ? '<div class="nego">Prix négociable</div>' : ''}
            </div>
        </div>

        <div class="badges">
            <span class="badge">${esc(TYPE_LABELS[bien.type_bien] || bien.type_bien)}</span>
            ${bien.etat ? `<span class="badge">${esc(ETAT_LABELS[bien.etat] || bien.etat)}</span>` : ''}
            ${equipements}
        </div>

        ${galleryHTML}

        <section class="section">
            <h2 class="section-title">Caractéristiques</h2>
            <div class="features-grid">${features || '<p class="empty">Caractéristiques à venir</p>'}</div>
        </section>

        ${bien.description ? `
        <section class="section">
            <h2 class="section-title">Description</h2>
            <p class="description">${escMultiline(bien.description)}</p>
            ${bien.points_forts ? `<div class="points-forts"><strong>Points forts</strong>${escMultiline(bien.points_forts)}</div>` : ''}
        </section>` : ''}

        ${ytId ? `
        <section class="section">
            <h2 class="section-title">Visite vidéo</h2>
            <div class="video-container ${bien.video_format === 'vertical' ? 'vertical' : ''}">
                <iframe src="https://www.youtube-nocookie.com/embed/${escAttr(ytId)}" title="Visite vidéo — ${escAttr(bien.titre)}"
                    allow="accelerometer; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe>
            </div>
        </section>` : ''}

        ${tourUrl ? `
        <section class="section">
            <h2 class="section-title">Visite virtuelle 360°</h2>
            <div class="tour-container">
                <iframe src="${escAttr(tourUrl)}" title="Visite virtuelle — ${escAttr(bien.titre)}"
                    allow="accelerometer; gyroscope; magnetometer; xr-spatial-tracking; fullscreen" allowfullscreen loading="lazy"></iframe>
            </div>
            <p class="tour-hint">Cliquez-glissez pour explorer — plein écran recommandé</p>
        </section>` : ''}

        ${sectionsHTML ? `
        <section class="section">
            <h2 class="section-title">Découvrir le bien</h2>
            ${sectionsHTML}
        </section>` : ''}

        ${iaHTML ? `
        <section class="section">
            <h2 class="section-title">Imaginez le potentiel</h2>
            ${iaHTML}
        </section>` : ''}

        <div class="contact-box">
            <p class="eyebrow" style="margin-bottom:10px">Visite privée</p>
            <h3 class="display">Ce bien mérite d'être vu. Organisons votre visite.</h3>
            <p>Zouhair Benazzouz — réponse personnelle, 7 j / 7</p>
            <div class="contact-actions">
                <a href="${AGENCE.whatsapp}?text=${waText}" class="btn btn-primary" rel="noopener">Écrire sur WhatsApp</a>
                <a href="tel:${AGENCE.tel}" class="btn btn-outline">${esc(AGENCE.tel)}</a>
            </div>
        </div>`;

    /* Barre sticky mobile */
    const sc = document.getElementById('sticky-cta');
    sc.hidden = false;
    sc.innerHTML = `
        <div class="sc-price">${formatMoney(bien.prix)} MAD<small>${esc(bien.reference)} · ${esc(ZONE_LABELS[bien.zone] || bien.zone)}</small></div>
        <a href="${AGENCE.whatsapp}?text=${waText}" class="btn btn-primary" rel="noopener">Organiser une visite</a>`;
}

/* ---- Lightbox ---- */
function openLightbox(i, scopeStart, scopeEnd) {
    lbIndex = i;
    lbScope = (scopeStart !== undefined) ? { start: scopeStart, end: scopeEnd } : galleryScope;
    updateLightbox();
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
}
function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
}
function lbNav(dir) {
    const n = lbScope.end - lbScope.start;
    lbIndex = lbScope.start + ((lbIndex - lbScope.start + dir + n) % n);
    updateLightbox();
}
function updateLightbox() {
    const p = allPhotos[lbIndex];
    if (!p) return;
    document.getElementById('lb-img').src = p.url;
    const pos = lbIndex - lbScope.start + 1, total = lbScope.end - lbScope.start;
    document.getElementById('lb-caption').textContent = `${p.caption} — ${pos} / ${total}`;
}
document.addEventListener('keydown', e => {
    if (!document.getElementById('lightbox').classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') lbNav(-1);
    if (e.key === 'ArrowRight') lbNav(1);
});
document.getElementById('lightbox').addEventListener('click', e => { if (e.target.id === 'lightbox') closeLightbox(); });

loadBien();
    </script>
</body>
</html>
