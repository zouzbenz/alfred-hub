<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stock - Atlas Pose</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
</head>
<body>
    <div class="container">

        <div class="page-header">
            <div>
                <h1 class="page-title">Stock</h1>
                <p class="page-subtitle">Suivi des matériaux — arrivées & consommations</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-outline btn-small" onclick="toggleView()" id="view-toggle-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                    <span id="view-label">Cartes</span>
                </button>
                <button class="btn btn-clay" onclick="openModal()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    Nouveau stock
                </button>
            </div>
        </div>

        <div class="stats-row">
            <div class="stat-card"><div class="stat-value blue" id="stat-total">0</div><div class="stat-label">Articles</div></div>
            <div class="stat-card"><div class="stat-value green" id="stat-en-stock">0</div><div class="stat-label">En stock</div></div>
            <div class="stat-card"><div class="stat-value orange" id="stat-en-cours">0</div><div class="stat-label">En utilisation</div></div>
            <div class="stat-card"><div class="stat-value red" id="stat-epuise">0</div><div class="stat-label">Épuisé</div></div>
        </div>

        <div class="section">
            <div class="section-header"><span class="section-title">Par type</span></div>
            <div class="types-grid" id="types-grid"></div>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">Tous</button>
            <button class="filter-btn" data-filter="en_stock">En stock</button>
            <button class="filter-btn" data-filter="en_cours">En cours</button>
            <button class="filter-btn" data-filter="epuise">Épuisé</button>
        </div>

        <div class="search-filter-row">
            <div class="search-box">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="search-input" placeholder="Rechercher un article...">
            </div>
            <select id="project-filter"><option value="">Tous les projets</option></select>
            <select id="type-filter"><option value="">Tous les types</option></select>
        </div>

        <!-- Table View -->
        <div class="section" id="table-view">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr><th>Article</th><th>Type</th><th>Déclinaison</th><th>Projet</th><th>Arrivée</th><th>Fin</th><th>Statut</th><th>Qté</th><th></th></tr>
                    </thead>
                    <tbody id="stock-tbody"><tr><td colspan="9" class="empty-state">Chargement...</td></tr></tbody>
                </table>
            </div>
        </div>

        <!-- Cards View -->
        <div id="cards-view" style="display:none"><div class="stock-cards-grid" id="stock-cards-grid"></div></div>

        <div class="footer">Atlas<em class="serif">Pose</em> · Stock v1.0</div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="stock-modal" style="display:none" onclick="if(event.target===this)closeModal()">
        <div class="modal">
            <div class="modal-title" id="modal-title">Nouveau stock</div>
            <form id="stock-form" onsubmit="saveStock(event)">
                <input type="hidden" id="s-id" value="">
                <div><label>Nom de l'article *</label><input type="text" id="s-nom" required placeholder="Ex: Carrelage 60x60 Gris"></div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px">
                    <div><label>Type *</label>
                        <select id="s-type" required>
                            <option value="">— Sélectionner —</option>
                            <option value="carrelage">Carrelage</option><option value="faience">Faïence</option>
                            <option value="marbre">Marbre</option><option value="granit">Granit</option>
                            <option value="bois">Bois</option><option value="peinture">Peinture</option>
                            <option value="colle">Colle & Mortier</option><option value="joint">Joint</option>
                            <option value="sanitaire">Sanitaire</option><option value="plomberie">Plomberie</option>
                            <option value="electricite">Électricité</option><option value="quincaillerie">Quincaillerie</option>
                            <option value="isolation">Isolation</option><option value="outillage">Outillage</option>
                            <option value="autre">Autre</option>
                        </select>
                    </div>
                    <div><label>Déclinaison</label><input type="text" id="s-declinaison" placeholder="Ex: Gris Clair, 30x60, Mat..."></div>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px">
                    <div><label>Quantité</label><input type="number" id="s-quantite" step="0.01" min="0" placeholder="0"></div>
                    <div><label>Unité</label>
                        <select id="s-unite">
                            <option value="m2">m²</option><option value="ml">ml</option><option value="kg">kg</option>
                            <option value="sac">sac(s)</option><option value="unite">unité(s)</option>
                            <option value="lot">lot(s)</option><option value="litre">litre(s)</option><option value="palette">palette(s)</option>
                        </select>
                    </div>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px">
                    <div><label>Date d'arrivée *</label><input type="date" id="s-date-arrivee" required></div>
                    <div><label>Date de fin</label><input type="date" id="s-date-fin"></div>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px">
                    <div><label>Projet lié</label><select id="s-project"><option value="">— Aucun —</option></select></div>
                    <div><label>Commande liée</label><select id="s-commande"><option value="">— Aucune —</option></select></div>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px">
                    <div><label>Fournisseur</label><select id="s-fournisseur"><option value="">— Aucun —</option></select></div>
                    <div><label>Emplacement</label><input type="text" id="s-emplacement" placeholder="Dépôt, Chantier..."></div>
                </div>
                <div style="margin-top:14px"><label>Notes</label><textarea id="s-notes" rows="2" placeholder="Détails, références, couleurs..."></textarea></div>
                <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:22px">
                    <button type="button" class="btn btn-outline" onclick="closeModal()">Annuler</button>
                    <button type="submit" class="btn btn-clay" id="save-btn">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <style>
        .search-filter-row { display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
        .search-box { position:relative; flex:1; min-width:200px; }
        .search-box input { padding-left:40px; }
        .search-icon { position:absolute; left:13px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--dim); pointer-events:none; }
        .search-filter-row select { min-width:160px; }

        .types-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:8px; }
        .type-card { background:var(--bg2); border:1px solid var(--border); border-radius:var(--r-md); padding:12px; text-align:center; cursor:pointer; transition:all .15s; }
        .type-card:hover { border-color:var(--accent); transform:translateY(-1px); }
        .type-card.active { border-color:var(--clay); background:var(--clay-lo); }
        .type-label { font-size:.72rem; color:var(--text2); font-weight:600; text-transform:capitalize; }
        .type-count { font-family:'Outfit',sans-serif; font-size:1.3rem; font-weight:800; margin-top:3px; color:var(--text); letter-spacing:-0.03em; }
        .type-sub { font-size:.62rem; color:var(--dim); margin-top:2px; }

        .stock-status { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:99px; font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em; }
        .stock-status::before { content:''; width:5px; height:5px; border-radius:50%; background:currentColor; flex-shrink:0; }
        .stock-en_stock { background:var(--accent2-md); color:var(--accent2); }
        .stock-en_cours { background:var(--warn-lo); color:var(--warn); }
        .stock-epuise { background:var(--danger-lo); color:var(--danger); }

        .stock-link { font-size:.78rem; color:var(--accent); text-decoration:none; }
        .stock-link:hover { text-decoration:underline; }
        .declinaison-tag { display:inline-block; padding:2px 8px; border-radius:99px; font-size:.68rem; font-weight:600; background:var(--card2); color:var(--text2); border:1px solid var(--border); }
        .qty-cell { font-family:'Outfit',sans-serif; font-weight:700; font-size:.88rem; }
        .duration-badge { font-size:.65rem; color:var(--dim); background:var(--bg2); padding:2px 6px; border-radius:99px; margin-top:3px; display:inline-block; }

        .action-btn { background:none; border:none; color:var(--dim); cursor:pointer; padding:4px; border-radius:var(--r-sm); transition:all .15s; }
        .action-btn:hover { color:var(--danger); background:var(--danger-lo); }
        .action-btn.edit:hover { color:var(--accent); background:var(--accent-lo); }
        .action-btn svg { width:14px; height:14px; }

        .stock-cards-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
        .stock-card { background:var(--card); border:1px solid var(--border); border-radius:var(--r-xl); padding:18px; transition:all .2s; }
        .stock-card:hover { border-color:var(--border2); transform:translateY(-2px); box-shadow:var(--shadow-md); }
        .stock-card-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; }
        .stock-card-name { font-family:'Outfit',sans-serif; font-weight:700; font-size:1rem; letter-spacing:-0.02em; }
        .stock-card-type { font-size:.72rem; color:var(--text2); margin-top:2px; text-transform:capitalize; }
        .stock-card-body { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        .stock-card-label { font-size:.62rem; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; font-weight:600; }
        .stock-card-value { font-size:.85rem; margin-top:2px; font-weight:500; }
        .stock-card-footer { display:flex; justify-content:space-between; align-items:center; margin-top:14px; padding-top:12px; border-top:1px solid var(--border); }

        @media(max-width:768px) {
            .search-filter-row select { min-width:100%; }
            table { font-size:.78rem; }
            thead th:nth-child(3), tbody td:nth-child(3),
            thead th:nth-child(4), tbody td:nth-child(4) { display:none; }
            .stock-cards-grid { grid-template-columns:1fr; }
        }
    </style>

    <script>
const SUPABASE_URL = 'https://wxhlstificzqovfcumop.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aGxzdGlmaWN6cW92ZmN1bW9wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyNjcwOTAsImV4cCI6MjA4Njg0MzA5MH0.mt6v3SKPMhWpMw9PH7D8k3ubrR1kJNIFHw0aloLmQiQ';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let stocks = [], projects = [], commandes = [], fournisseurs = [];
let currentFilter = 'all', searchQuery = '', projectFilter = '', typeFilter = '';
let viewMode = 'table';

const TYPE_LABELS = {carrelage:'Carrelage',faience:'Faïence',marbre:'Marbre',granit:'Granit',bois:'Bois',peinture:'Peinture',colle:'Colle & Mortier',joint:'Joint',sanitaire:'Sanitaire',plomberie:'Plomberie',electricite:'Électricité',quincaillerie:'Quincaillerie',isolation:'Isolation',outillage:'Outillage',autre:'Autre'};
function typeLabel(t) { return TYPE_LABELS[t] || t; }

async function loadData() {
    try {
        const [sRes, pRes, cmdRes, fRes] = await Promise.all([
            db.from('atlas_stock').select('*').order('date_arrivee', { ascending: false }),
            db.from('atlas_projects').select('id, name'),
            db.from('atlas_commandes').select('id, numero, titre'),
            db.from('atlas_fournisseurs').select('id, nom')
        ]);
        stocks = sRes.data || [];
        projects = pRes.data || [];
        commandes = cmdRes.data || [];
        fournisseurs = fRes.data || [];
        populateFilters();
        renderAll();
    } catch (err) { console.error('Erreur:', err); }
}

function populateFilters() {
    document.getElementById('project-filter').innerHTML = '<option value="">Tous les projets</option>' + projects.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
    const types = [...new Set(stocks.map(s => s.type).filter(Boolean))].sort();
    document.getElementById('type-filter').innerHTML = '<option value="">Tous les types</option>' + types.map(t => `<option value="${t}">${typeLabel(t)}</option>`).join('');
    document.getElementById('s-project').innerHTML = '<option value="">— Aucun —</option>' + projects.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
    document.getElementById('s-commande').innerHTML = '<option value="">— Aucune —</option>' + commandes.map(c => `<option value="${c.id}">${c.numero||'CMD-'+c.id} — ${c.titre}</option>`).join('');
    document.getElementById('s-fournisseur').innerHTML = '<option value="">— Aucun —</option>' + fournisseurs.map(f => `<option value="${f.id}">${f.nom}</option>`).join('');
}

function getStatus(s) {
    const today = new Date().toISOString().split('T')[0];
    if (s.date_fin && s.date_fin <= today) return 'epuise';
    if (s.date_arrivee && s.date_arrivee <= today) return 'en_cours';
    return 'en_stock';
}
const STATUS_LABELS = {en_stock:'En stock',en_cours:'En cours',epuise:'Épuisé'};

function formatDate(d) { return d ? new Date(d).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'}) : '—'; }
function getDuration(from, to) {
    if (!from) return null;
    const start = new Date(from), end = to ? new Date(to) : new Date();
    const days = Math.ceil((end-start)/(1000*60*60*24));
    if (days < 0) return null;
    if (days === 0) return "aujourd'hui";
    if (days < 30) return days + ' j';
    return Math.floor(days/30) + ' mois';
}
function getProjectName(id) { return projects.find(p => p.id == id)?.name || null; }

function getFiltered() {
    let data = [...stocks];
    if (currentFilter !== 'all') data = data.filter(s => getStatus(s) === currentFilter);
    if (projectFilter) data = data.filter(s => String(s.project_id) === projectFilter);
    if (typeFilter) data = data.filter(s => s.type === typeFilter);
    if (searchQuery) { const q = searchQuery.toLowerCase(); data = data.filter(s => (s.nom||'').toLowerCase().includes(q) || (s.type||'').toLowerCase().includes(q) || (s.declinaison||'').toLowerCase().includes(q) || (s.emplacement||'').toLowerCase().includes(q) || (s.notes||'').toLowerCase().includes(q)); }
    return data;
}

function renderAll() { renderStats(); renderTypes(); renderStock(); }

function renderStats() {
    document.getElementById('stat-total').textContent = stocks.length;
    document.getElementById('stat-en-stock').textContent = stocks.filter(s => getStatus(s)==='en_stock').length;
    document.getElementById('stat-en-cours').textContent = stocks.filter(s => getStatus(s)==='en_cours').length;
    document.getElementById('stat-epuise').textContent = stocks.filter(s => getStatus(s)==='epuise').length;
}

function renderTypes() {
    const map = {};
    stocks.forEach(s => { const t = s.type||'autre'; if(!map[t]) map[t]={total:0,dec:new Set()}; map[t].total++; if(s.declinaison) map[t].dec.add(s.declinaison); });
    const entries = Object.entries(map).sort((a,b) => b[1].total - a[1].total);
    document.getElementById('types-grid').innerHTML = entries.length ? entries.map(([t,d]) =>
        `<div class="type-card ${typeFilter===t?'active':''}" onclick="clickType('${t}')"><div class="type-label">${typeLabel(t)}</div><div class="type-count">${d.total}</div><div class="type-sub">${d.dec.size} décl.</div></div>`
    ).join('') : '<p style="color:var(--dim);font-size:.85rem;padding:10px">Aucun article</p>';
}

function clickType(t) {
    typeFilter = typeFilter === t ? '' : t;
    document.getElementById('type-filter').value = typeFilter;
    renderAll();
}

function renderStock() {
    const filtered = getFiltered();
    if (viewMode === 'table') renderTable(filtered); else renderCards(filtered);
}

function renderTable(filtered) {
    const tbody = document.getElementById('stock-tbody');
    if (!filtered.length) { tbody.innerHTML = '<tr><td colspan="9"><div class="empty-state"><p>Aucun article trouvé</p></div></td></tr>'; return; }
    tbody.innerHTML = filtered.map(s => {
        const st = getStatus(s), pn = getProjectName(s.project_id), dur = getDuration(s.date_arrivee, s.date_fin);
        return `<tr>
            <td><div style="font-weight:600">${s.nom||'—'}</div>${s.emplacement?`<div style="font-size:.68rem;color:var(--dim);margin-top:2px">📍 ${s.emplacement}</div>`:''}</td>
            <td style="text-transform:capitalize;font-size:.82rem">${typeLabel(s.type)}</td>
            <td>${s.declinaison?`<span class="declinaison-tag">${s.declinaison}</span>`:'<span style="color:var(--dim)">—</span>'}</td>
            <td>${pn?`<a class="stock-link" href="./atlas-project.html?id=${s.project_id}">🏗️ ${pn}</a>`:'<span style="color:var(--dim)">—</span>'}</td>
            <td style="white-space:nowrap">${formatDate(s.date_arrivee)}</td>
            <td style="white-space:nowrap">${s.date_fin?formatDate(s.date_fin):'<span style="color:var(--dim)">—</span>'}${dur?` <span class="duration-badge">${dur}</span>`:''}</td>
            <td><span class="stock-status stock-${st}">${STATUS_LABELS[st]}</span></td>
            <td class="qty-cell">${s.quantite?`${s.quantite} ${s.unite||''}`:'—'}</td>
            <td style="white-space:nowrap">
                <button class="action-btn edit" onclick="editStock(${s.id})" title="Modifier"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
                <button class="action-btn" onclick="deleteStock(${s.id})" title="Supprimer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg></button>
            </td></tr>`;
    }).join('');
}

function renderCards(filtered) {
    const grid = document.getElementById('stock-cards-grid');
    if (!filtered.length) { grid.innerHTML = '<div class="empty-state"><p>Aucun article trouvé</p></div>'; return; }
    grid.innerHTML = filtered.map(s => {
        const st = getStatus(s), pn = getProjectName(s.project_id), dur = getDuration(s.date_arrivee, s.date_fin);
        return `<div class="stock-card">
            <div class="stock-card-header">
                <div><div class="stock-card-name">${s.nom||'—'}</div><div class="stock-card-type">${typeLabel(s.type)}${s.declinaison?' · <span class="declinaison-tag">'+s.declinaison+'</span>':''}</div></div>
                <span class="stock-status stock-${st}">${STATUS_LABELS[st]}</span>
            </div>
            <div class="stock-card-body">
                <div><div class="stock-card-label">Arrivée</div><div class="stock-card-value">${formatDate(s.date_arrivee)}</div></div>
                <div><div class="stock-card-label">Fin</div><div class="stock-card-value">${s.date_fin?formatDate(s.date_fin):'—'}${dur?' <span class="duration-badge">'+dur+'</span>':''}</div></div>
                <div><div class="stock-card-label">Quantité</div><div class="stock-card-value">${s.quantite?s.quantite+' '+(s.unite||''):'—'}</div></div>
                <div><div class="stock-card-label">Projet</div><div class="stock-card-value">${pn?'<a class="stock-link" href="./atlas-project.html?id='+s.project_id+'">'+pn+'</a>':'—'}</div></div>
                ${s.emplacement?'<div><div class="stock-card-label">Lieu</div><div class="stock-card-value">📍 '+s.emplacement+'</div></div>':''}
            </div>
            <div class="stock-card-footer">
                <div style="font-size:.72rem;color:var(--dim)">${s.notes?'📝 '+s.notes.substring(0,40)+(s.notes.length>40?'...':''):''}</div>
                <div>
                    <button class="action-btn edit" onclick="editStock(${s.id})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
                    <button class="action-btn" onclick="deleteStock(${s.id})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg></button>
                </div>
            </div>
        </div>`;
    }).join('');
}

function toggleView() {
    viewMode = viewMode === 'table' ? 'cards' : 'table';
    document.getElementById('table-view').style.display = viewMode === 'table' ? 'block' : 'none';
    document.getElementById('cards-view').style.display = viewMode === 'cards' ? 'block' : 'none';
    document.getElementById('view-label').textContent = viewMode === 'table' ? 'Cartes' : 'Tableau';
    renderStock();
}

// Filters
document.querySelectorAll('.filter-btn').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active'); currentFilter = btn.dataset.filter; renderAll();
}));
document.getElementById('search-input').addEventListener('input', e => { searchQuery = e.target.value.trim(); renderAll(); });
document.getElementById('project-filter').addEventListener('change', e => { projectFilter = e.target.value; renderAll(); });
document.getElementById('type-filter').addEventListener('change', e => { typeFilter = e.target.value; renderAll(); });

// Modal
function openModal(stock=null) {
    document.getElementById('stock-form').reset();
    document.getElementById('s-id').value = '';
    document.getElementById('modal-title').textContent = 'Nouveau stock';
    document.getElementById('s-date-arrivee').value = new Date().toISOString().split('T')[0];
    if (stock) {
        document.getElementById('modal-title').textContent = 'Modifier stock';
        document.getElementById('s-id').value = stock.id;
        document.getElementById('s-nom').value = stock.nom || '';
        document.getElementById('s-type').value = stock.type || '';
        document.getElementById('s-declinaison').value = stock.declinaison || '';
        document.getElementById('s-quantite').value = stock.quantite || '';
        document.getElementById('s-unite').value = stock.unite || 'm2';
        document.getElementById('s-date-arrivee').value = stock.date_arrivee || '';
        document.getElementById('s-date-fin').value = stock.date_fin || '';
        document.getElementById('s-project').value = stock.project_id || '';
        document.getElementById('s-commande').value = stock.commande_id || '';
        document.getElementById('s-fournisseur').value = stock.fournisseur_id || '';
        document.getElementById('s-emplacement').value = stock.emplacement || '';
        document.getElementById('s-notes').value = stock.notes || '';
    }
    document.getElementById('stock-modal').style.display = 'flex';
}
function closeModal() { document.getElementById('stock-modal').style.display = 'none'; }

function editStock(id) { const s = stocks.find(x => x.id === id); if(s) openModal(s); }

async function saveStock(e) {
    e.preventDefault();
    const btn = document.getElementById('save-btn');
    btn.disabled = true; btn.textContent = 'Enregistrement...';
    const id = document.getElementById('s-id').value;
    const data = {
        nom: document.getElementById('s-nom').value.trim(),
        type: document.getElementById('s-type').value,
        declinaison: document.getElementById('s-declinaison').value.trim() || null,
        quantite: parseFloat(document.getElementById('s-quantite').value) || null,
        unite: document.getElementById('s-unite').value,
        date_arrivee: document.getElementById('s-date-arrivee').value,
        date_fin: document.getElementById('s-date-fin').value || null,
        project_id: document.getElementById('s-project').value ? parseInt(document.getElementById('s-project').value) : null,
        commande_id: document.getElementById('s-commande').value ? parseInt(document.getElementById('s-commande').value) : null,
        fournisseur_id: document.getElementById('s-fournisseur').value ? parseInt(document.getElementById('s-fournisseur').value) : null,
        emplacement: document.getElementById('s-emplacement').value.trim() || null,
        notes: document.getElementById('s-notes').value.trim() || null,
    };
    try {
        const res = id
            ? await db.from('atlas_stock').update(data).eq('id', parseInt(id))
            : await db.from('atlas_stock').insert([data]);
        if (res.error) throw res.error;
        showToast(id ? 'Stock modifié ✓' : 'Stock ajouté ✓');
        closeModal(); loadData();
    } catch(err) { showToast('Erreur: '+err.message, true); }
    finally { btn.disabled = false; btn.textContent = 'Enregistrer'; }
}

async function deleteStock(id) {
    if (!confirm('Supprimer cet article ?')) return;
    try { const {error} = await db.from('atlas_stock').delete().eq('id',id); if(error) throw error; showToast('Supprimé'); loadData(); }
    catch(err) { showToast('Erreur: '+err.message, true); }
}

function showToast(msg, isError=false) {
    const t = document.getElementById('toast'); t.textContent = msg;
    t.className = 'toast '+(isError?'toast-error':'toast-success'); t.style.display='block';
    setTimeout(() => { t.style.display='none'; }, 3000);
}

document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });
loadData();
setInterval(loadData, 60000);
