<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Néo Storytellers</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#0d0d0d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #161616;
            --accent-color: #e63946;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --border-color: #2a2a2a;
            --success: #2ecc71;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }

        body, html {
            margin: 0; 
            padding: 0; 
            min-height: 100%; 
            width: 100%;
            background-color: var(--bg-color); 
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
        }

        .main-wrapper {
            min-height: 100vh; 
            padding: 20px;
            display: flex; 
            flex-direction: column; 
            align-items: center;
        }

        .dashboard {
            width: 100%; 
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: var(--card-bg); 
            padding: 20px; 
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        /* Header */
        .header {
            display: flex; 
            flex-direction: column;
            gap: 10px;
            border-bottom: 2px solid var(--accent-color); 
            padding-bottom: 15px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header h1 { 
            margin: 0; 
            font-size: 1.5rem; 
            font-weight: 800; 
        }
        
        .agency { 
            color: var(--accent-color); 
            font-size: 0.8rem; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            font-weight: 600; 
        }
        
        .back-hub { 
            text-decoration: none; 
            color: var(--accent-color); 
            font-size: 0.75rem; 
            display: inline-block;
            margin-bottom: 5px;
            padding: 5px 0;
        }

        .time-display {
            text-align: right;
        }

        #clock { 
            font-size: 1.5rem; 
            font-weight: 700; 
        }
        
        #top-date { 
            color: var(--text-dim); 
            font-size: 0.8rem; 
        }

        /* Sections */
        .section { 
            background: rgba(255, 255, 255, 0.02); 
            padding: 15px; 
            border-radius: 12px; 
            border: 1px solid var(--border-color); 
        }
        
        .section h3 { 
            margin: 0 0 15px 0; 
            font-size: 0.85rem; 
            color: var(--accent-color); 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }

        /* Tasks */
        .task-item { 
            display: flex; 
            align-items: center; 
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem; 
            cursor: pointer; 
        }

        .task-item:last-child {
            border-bottom: none;
        }
        
        .checkbox { 
            width: 22px; 
            height: 22px; 
            border: 2px solid var(--border-color); 
            border-radius: 6px; 
            margin-right: 12px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 14px; 
            flex-shrink: 0;
            transition: 0.2s;
        }
        
        .task-item.done .checkbox { 
            background: var(--success); 
            border-color: var(--success); 
            color: white; 
        }
        
        .task-item.done .checkbox::after { content: "✓"; }
        .task-item.done span { 
            text-decoration: line-through; 
            color: var(--text-dim); 
        }

        .task-item .delete-btn {
            margin-left: auto;
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            padding: 5px 10px;
            font-size: 1rem;
        }

        .task-item .delete-btn:hover {
            color: var(--accent-color);
        }

        /* Input row */
        .input-row {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .input-row input {
            flex: 1;
            min-width: 120px;
            background: #111; 
            border: 1px solid var(--border-color); 
            color: white; 
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .input-row input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .input-row button {
            background: var(--accent-color); 
            border: none; 
            color: white; 
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
        }

        .input-row button:active {
            transform: scale(0.95);
        }

        /* Calendar */
        .calendar-grid { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            text-align: center; 
            font-size: 0.8rem;
            gap: 2px;
        }
        
        .day-name { 
            font-weight: bold; 
            color: var(--text-dim); 
            padding: 8px 0;
        }
        
        .day { 
            padding: 10px 5px;
            cursor: pointer; 
            border-radius: 8px; 
            transition: 0.2s; 
            position: relative; 
        }
        
        .day:hover, .day:active { 
            background: rgba(255, 255, 255, 0.1); 
        }
        
        .day.today { 
            color: var(--accent-color); 
            font-weight: bold; 
            background: rgba(230, 57, 70, 0.15); 
        }

        .day.selected {
            background: rgba(255, 255, 255, 0.15);
        }
        
        .day.has-event::after { 
            content: ''; 
            position: absolute; 
            bottom: 3px; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 5px; 
            height: 5px; 
            background: var(--accent-color); 
            border-radius: 50%; 
        }

        #event-details {
            margin-top: 15px; 
            padding: 12px;
            border-left: 3px solid var(--accent-color);
            background: rgba(255, 255, 255, 0.02); 
            font-size: 0.85rem;
            border-radius: 0 8px 8px 0;
        }

        .event-list-item { 
            padding: 8px 0;
            display: flex; 
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .event-list-item:last-child {
            border-bottom: none;
        }
        
        .event-list-item span::before { 
            content: "•"; 
            color: var(--accent-color); 
            margin-right: 10px;
            font-weight: bold;
        }

        /* Projects */
        .project-item { 
            padding: 12px 0; 
            border-bottom: 1px solid var(--border-color); 
            display: flex; 
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap; 
            gap: 5px; 
        }

        .project-item:last-child {
            border-bottom: none;
        }

        .project-name {
            font-weight: 600;
        }
        
        .project-status { 
            font-size: 0.8rem; 
            color: var(--text-dim);
            background: rgba(255,255,255,0.05);
            padding: 4px 10px;
            border-radius: 20px;
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            padding: 5px;
            font-size: 0.9rem;
        }

        .delete-btn:hover {
            color: var(--accent-color);
        }

        /* Grid layout for tablet/desktop */
        @media (min-width: 600px) {
            .main-wrapper {
                padding: 30px;
            }

            .dashboard {
                padding: 30px;
                gap: 20px;
            }

            .header h1 { font-size: 2rem; }
            #clock { font-size: 2rem; }

            .sections-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 20px;
            }
        }

        @media (min-width: 900px) {
            .dashboard {
                padding: 40px;
            }

            .header h1 { font-size: 2.5rem; }
        }

        /* Sync indicator */
        .sync-status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 100;
        }

        .sync-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
        }

        .sync-dot.offline {
            background: #e74c3c;
        }

        .sync-dot.syncing {
            background: var(--accent-color);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: var(--text-dim);
        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <div class="dashboard">
            <div class="header">
                <div class="header-top">
                    <div>
                        <a href="./index.html" class="back-hub">← Retour au Hub</a>
                        <div class="agency">Néo Storytellers</div>
                        <h1>Zouhair Benazzouz</h1>
                    </div>
                    <div class="time-display">
                        <div id="clock">00:00:00</div>
                        <div id="top-date">...</div>
                    </div>
                </div>
            </div>

            <div class="sections-grid">
                <div class="section">
                    <h3>📋 Tâches du jour</h3>
                    <div id="task-list"><div class="loading">Chargement...</div></div>
                    <div class="input-row">
                        <input type="text" id="new-task" placeholder="Nouvelle tâche...">
                        <button onclick="addTask()">+</button>
                    </div>
                </div>

                <div class="section">
                    <h3>📅 Calendrier</h3>
                    <div class="calendar-grid">
                        <div class="day-name">L</div>
                        <div class="day-name">M</div>
                        <div class="day-name">M</div>
                        <div class="day-name">J</div>
                        <div class="day-name">V</div>
                        <div class="day-name">S</div>
                        <div class="day-name">D</div>
                    </div>
                    <div class="calendar-grid" id="calendar-days"></div>
                    <div id="event-details">
                        <div id="event-text">Cliquez sur une date</div>
                    </div>
                    <div class="input-row" id="event-input-container" style="display: none;">
                        <input type="text" id="event-input" placeholder="Ajouter un événement...">
                        <button onclick="saveEvent()">+</button>
                    </div>
                </div>

                <div class="section">
                    <h3>🎬 Projets en cours</h3>
                    <div id="projects-list"><div class="loading">Chargement...</div></div>
                    <div class="input-row">
                        <input type="text" id="new-project-name" placeholder="Projet...">
                        <input type="text" id="new-project-status" placeholder="Statut...">
                        <button onclick="addProject()">+</button>
                    </div>
                </div>

                <div class="section">
                    <h3>📆 À Venir</h3>
                    <div id="upcoming-list"><div class="loading">Chargement...</div></div>
                    <div class="input-row">
                        <input type="text" id="new-upcoming-name" placeholder="Événement...">
                        <input type="text" id="new-upcoming-date" placeholder="Date...">
                        <button onclick="addUpcoming()">+</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="sync-status">
        <div class="sync-dot" id="sync-dot"></div>
        <span id="sync-text">Connexion...</span>
    </div>

    <script>
        // ===== SUPABASE CONFIG =====
        const SUPABASE_URL = 'https://wxhlstificzqovfcumop.db.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aGxzdGlmaWN6cW92ZmN1bW9wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyNjcwOTAsImV4cCI6MjA4Njg0MzA5MH0.mt6v3SKPMhWpMw9PH7D8k3ubrR1kJNIFHw0aloLmQiQ';
        
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ===== DATA =====
        let selectedDateStr = "";
        let events = [];
        let tasks = [];
        let projects = [];
        let upcoming = [];

        // ===== SYNC STATUS =====
        function updateSyncStatus(status) {
            const dot = document.getElementById('sync-dot');
            const text = document.getElementById('sync-text');
            
            if (status === 'syncing') {
                dot.className = 'sync-dot syncing';
                text.textContent = 'Sync...';
            } else if (status === 'synced') {
                dot.className = 'sync-dot';
                text.textContent = 'Synced ✓';
            } else if (status === 'offline') {
                dot.className = 'sync-dot offline';
                text.textContent = 'Offline';
            } else if (status === 'error') {
                dot.className = 'sync-dot offline';
                text.textContent = 'Erreur';
            }
        }

        // ===== TASKS =====
        async function loadTasks() {
            updateSyncStatus('syncing');
            const { data, error } = await db
                .from('tasks')
                .select('*')
                .order('created_at', { ascending: false });
            
            if (error) {
                console.error('Error loading tasks:', error);
                updateSyncStatus('error');
                return;
            }
            tasks = data || [];
            renderTasks();
            updateSyncStatus('synced');
        }

        function renderTasks() {
            const container = document.getElementById('task-list');
            if (tasks.length === 0) {
                container.innerHTML = '<div style="color: var(--text-dim); padding: 10px 0;">Aucune tâche</div>';
                return;
            }
            container.innerHTML = tasks.map(t => `
                <div class="task-item ${t.done ? 'done' : ''}" onclick="toggleTask(${t.id})">
                    <div class="checkbox"></div>
                    <span>${t.text}</span>
                    <button class="delete-btn" onclick="event.stopPropagation(); deleteTask(${t.id})">×</button>
                </div>
            `).join('');
        }

        async function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;
            
            updateSyncStatus('syncing');
            const { error } = await db
                .from('tasks')
                .update({ done: !task.done })
                .eq('id', id);
            
            if (error) {
                console.error('Error updating task:', error);
                updateSyncStatus('error');
                return;
            }
            await loadTasks();
        }

        async function addTask() {
            const input = document.getElementById('new-task');
            if (!input.value.trim()) return;
            
            updateSyncStatus('syncing');
            const { error } = await db
                .from('tasks')
                .insert([{ text: input.value.trim(), done: false }]);
            
            if (error) {
                console.error('Error adding task:', error);
                updateSyncStatus('error');
                return;
            }
            input.value = '';
            await loadTasks();
        }

        async function deleteTask(id) {
            updateSyncStatus('syncing');
            const { error } = await db
                .from('tasks')
                .delete()
                .eq('id', id);
            
            if (error) {
                console.error('Error deleting task:', error);
                updateSyncStatus('error');
                return;
            }
            await loadTasks();
        }

        // ===== EVENTS =====
        async function loadEvents() {
            const { data, error } = await db
                .from('events')
                .select('*');
            
            if (error) {
                console.error('Error loading events:', error);
                return;
            }
            events = data || [];
            initCalendar();
        }

        function initCalendar() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const today = now.getDate();
            const firstDay = (new Date(year, month, 1).getDay() + 6) % 7;
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const grid = document.getElementById('calendar-days');
            grid.innerHTML = '';
            
            for (let i = 0; i < firstDay; i++) {
                grid.innerHTML += '<div></div>';
            }
            
            for (let i = 1; i <= daysInMonth; i++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                const isToday = i === today;
                const hasEvent = events.some(e => e.date === dateStr);
                const isSelected = dateStr === selectedDateStr;
                
                const dayDiv = document.createElement('div');
                dayDiv.className = `day ${isToday ? 'today' : ''} ${hasEvent ? 'has-event' : ''} ${isSelected ? 'selected' : ''}`;
                dayDiv.textContent = i;
                dayDiv.onclick = () => selectDate(dateStr);
                grid.appendChild(dayDiv);
            }
        }

        function selectDate(dateStr) {
            selectedDateStr = dateStr;
            initCalendar();
            renderEvents(dateStr);
            document.getElementById('event-input-container').style.display = 'flex';
        }

        function renderEvents(dateStr) {
            const container = document.getElementById('event-text');
            const dayEvents = events.filter(e => e.date === dateStr);
            
            if (dayEvents.length > 0) {
                container.innerHTML = dayEvents.map(ev => 
                    `<div class="event-list-item">
                        <span>${ev.title}</span>
                        <button class="delete-btn" onclick="deleteEvent(${ev.id})">×</button>
                    </div>`
                ).join('');
            } else {
                container.innerHTML = '<div style="color: var(--text-dim);">Rien de prévu</div>';
            }
        }

        async function saveEvent() {
            const input = document.getElementById('event-input');
            if (!selectedDateStr || !input.value.trim()) return;
            
            updateSyncStatus('syncing');
            const { error } = await db
                .from('events')
                .insert([{ date: selectedDateStr, title: input.value.trim() }]);
            
            if (error) {
                console.error('Error adding event:', error);
                updateSyncStatus('error');
                return;
            }
            input.value = '';
            await loadEvents();
            renderEvents(selectedDateStr);
            updateSyncStatus('synced');
        }

        async function deleteEvent(id) {
            updateSyncStatus('syncing');
            const { error } = await db
                .from('events')
                .delete()
                .eq('id', id);
            
            if (error) {
                console.error('Error deleting event:', error);
                updateSyncStatus('error');
                return;
            }
            await loadEvents();
            renderEvents(selectedDateStr);
            updateSyncStatus('synced');
        }

        // ===== PROJECTS =====
        async function loadProjects() {
            const { data, error } = await db
                .from('projects')
                .select('*')
                .order('created_at', { ascending: false });
            
            if (error) {
                console.error('Error loading projects:', error);
                return;
            }
            projects = data || [];
            renderProjects();
        }

        function renderProjects() {
            const container = document.getElementById('projects-list');
            if (projects.length === 0) {
                container.innerHTML = '<div style="color: var(--text-dim); padding: 10px 0;">Aucun projet</div>';
                return;
            }
            container.innerHTML = projects.map(p => `
                <div class="project-item">
                    <span class="project-name">${p.name}</span>
                    <span class="project-status">${p.status}</span>
                    <button class="delete-btn" onclick="deleteProject(${p.id})">×</button>
                </div>
            `).join('');
        }

        async function addProject() {
            const name = document.getElementById('new-project-name');
            const status = document.getElementById('new-project-status');
            if (!name.value.trim()) return;
            
            updateSyncStatus('syncing');
            const { error } = await db
                .from('projects')
                .insert([{ 
                    name: name.value.trim(), 
                    status: status.value.trim() || 'En cours'
                }]);
            
            if (error) {
                console.error('Error adding project:', error);
                updateSyncStatus('error');
                return;
            }
            name.value = '';
            status.value = '';
            await loadProjects();
            updateSyncStatus('synced');
        }

        async function deleteProject(id) {
            updateSyncStatus('syncing');
            const { error } = await db
                .from('projects')
                .delete()
                .eq('id', id);
            
            if (error) {
                console.error('Error deleting project:', error);
                updateSyncStatus('error');
                return;
            }
            await loadProjects();
            updateSyncStatus('synced');
        }

        // ===== UPCOMING =====
        async function loadUpcoming() {
            const { data, error } = await db
                .from('upcoming')
                .select('*')
                .order('created_at', { ascending: false });
            
            if (error) {
                console.error('Error loading upcoming:', error);
                return;
            }
            upcoming = data || [];
            renderUpcoming();
        }

        function renderUpcoming() {
            const container = document.getElementById('upcoming-list');
            if (upcoming.length === 0) {
                container.innerHTML = '<div style="color: var(--text-dim); padding: 10px 0;">Rien à venir</div>';
                return;
            }
            container.innerHTML = upcoming.map(u => `
                <div class="project-item">
                    <span class="project-name">${u.name}</span>
                    <span class="project-status">${u.date}</span>
                    <button class="delete-btn" onclick="deleteUpcoming(${u.id})">×</button>
                </div>
            `).join('');
        }

        async function addUpcoming() {
            const name = document.getElementById('new-upcoming-name');
            const date = document.getElementById('new-upcoming-date');
            if (!name.value.trim()) return;
            
            updateSyncStatus('syncing');
            const { error } = await db
                .from('upcoming')
                .insert([{ 
                    name: name.value.trim(), 
                    date: date.value.trim() || 'À définir'
                }]);
            
            if (error) {
                console.error('Error adding upcoming:', error);
                updateSyncStatus('error');
                return;
            }
            name.value = '';
            date.value = '';
            await loadUpcoming();
            updateSyncStatus('synced');
        }

        async function deleteUpcoming(id) {
            updateSyncStatus('syncing');
            const { error } = await db
                .from('upcoming')
                .delete()
                .eq('id', id);
            
            if (error) {
                console.error('Error deleting upcoming:', error);
                updateSyncStatus('error');
                return;
            }
            await loadUpcoming();
            updateSyncStatus('synced');
        }

        // ===== CLOCK =====
        function updateTime() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('fr-FR');
            document.getElementById('top-date').textContent = now.toLocaleDateString('fr-FR', { 
                weekday: 'long', 
                day: 'numeric', 
                month: 'long' 
            });
        }

        // ===== REAL-TIME SYNC =====
        function setupRealtimeSync() {
            supabase
                .channel('public:tasks')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'tasks' }, () => loadTasks())
                .subscribe();

            supabase
                .channel('public:events')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'events' }, () => {
                    loadEvents();
                    if (selectedDateStr) renderEvents(selectedDateStr);
                })
                .subscribe();

            supabase
                .channel('public:projects')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'projects' }, () => loadProjects())
                .subscribe();

            supabase
                .channel('public:upcoming')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'upcoming' }, () => loadUpcoming())
                .subscribe();
        }

        // ===== INIT =====
        async function init() {
            updateTime();
            setInterval(updateTime, 1000);
            
            // Load all data
            await Promise.all([
                loadTasks(),
                loadEvents(),
                loadProjects(),
                loadUpcoming()
            ]);
            
            // Setup real-time sync
            setupRealtimeSync();
        }

        init();

        // Enter key support
        document.getElementById('new-task').addEventListener('keypress', e => { if (e.key === 'Enter') addTask(); });
        document.getElementById('event-input').addEventListener('keypress', e => { if (e.key === 'Enter') saveEvent(); });
        document.getElementById('new-project-name').addEventListener('keypress', e => { if (e.key === 'Enter') addProject(); });
        document.getElementById('new-upcoming-name').addEventListener('keypress', e => { if (e.key === 'Enter') addUpcoming(); });

        // Online/offline detection
        window.addEventListener('online', () => { updateSyncStatus('synced'); init(); });
        window.addEventListener('offline', () => updateSyncStatus('offline'));
    </script>
</body>
</html>
