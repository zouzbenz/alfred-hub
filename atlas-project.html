<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Projet - Atlas Pose</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <style>
        :root { --bg:#0a0f1a; --card:#111827; --accent:#3b82f6; --accent2:#10b981; --text:#f3f4f6; --dim:#9ca3af; --border:#1f2937; --danger:#ef4444; --warn:#f59e0b; --purple:#8b5cf6; --info:#0ea5e9; }
        * { box-sizing:border-box; margin:0; padding:0; }
        body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; }
        .container { max-width:1200px; margin:0 auto; padding:15px; }
        
        .login-screen { display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px; }
        .login-box { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:30px; width:100%; max-width:400px; text-align:center; }
        .login-box h2 { margin-bottom:8px; }
        .login-box p { color:var(--dim); margin-bottom:20px; font-size:.85rem; }
        .login-box input { width:100%; padding:14px; background:var(--bg); border:1px solid var(--border); border-radius:10px; color:#fff; margin-bottom:12px; text-align:center; }
        .login-box button { width:100%; padding:14px; background:var(--accent); border:none; border-radius:10px; color:#fff; font-weight:600; cursor:pointer; }
        .login-error { color:var(--danger); margin-top:12px; font-size:.85rem; }
        
        .content { display:none; }
        .content.visible { display:block; }
        
        .top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap:wrap; gap:10px; padding:12px; background:var(--card); border-radius:12px; border:1px solid var(--border); }
        .back-link { display:inline-flex; align-items:center; gap:6px; color:var(--accent); text-decoration:none; font-size:.85rem; padding:8px 12px; background:rgba(59,130,246,.1); border-radius:8px; }
        
        .project-header { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px; margin-bottom:15px; }
        .project-title { font-size:1.5rem; font-weight:800; margin-bottom:8px; display:flex; align-items:center; flex-wrap:wrap; gap:10px; }
        .project-meta { display:flex; gap:15px; flex-wrap:wrap; color:var(--dim); font-size:.85rem; }
        .status-badge { padding:5px 12px; border-radius:20px; font-size:.75rem; font-weight:600; }
        .status-a_venir { background:rgba(245,158,11,.2); color:var(--warn); }
        .status-en_cours { background:rgba(59,130,246,.2); color:var(--accent); }
        .status-termine { background:rgba(16,185,129,.2); color:var(--accent2); }
        
        .stats-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; margin-bottom:15px; }
        .stat-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:15px; text-align:center; }
        .stat-value { font-size:1.3rem; font-weight:800; }
        .stat-value.blue { color:var(--accent); }
        .stat-value.green { color:var(--accent2); }
        .stat-value.orange { color:var(--warn); }
        .stat-value.red { color:var(--danger); }
        .stat-label { font-size:.7rem; color:var(--dim); margin-top:4px; }
        
        .section { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:15px; margin-bottom:15px; }
        .section-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap:wrap; gap:10px; }
        .section-title { font-size:1rem; font-weight:700; }
        
        .btn { padding:8px 14px; border:none; border-radius:8px; font-weight:600; cursor:pointer; font-size:.8rem; display:inline-flex; align-items:center; gap:5px; }
        .btn-outline { background:transparent; border:1px solid var(--border); color:var(--text); }
        .btn-small { padding:6px 10px; font-size:.75rem; }
        .btn-icon { padding:6px; min-width:32px; justify-content:center; }
        .btn-warning { background:var(--warn); color:#fff; }
        .btn-info { background:var(--info); color:#fff; }
        
        .table-wrapper { overflow-x:auto; }
        .comparison-table { width:100%; border-collapse:collapse; min-width:450px; font-size:.85rem; }
        .comparison-table th, .comparison-table td { padding:10px; text-align:left; border-bottom:1px solid var(--border); }
        .comparison-table th { color:var(--dim); font-size:.7rem; text-transform:uppercase; }
        .comparison-table .cat-name { font-weight:600; }
        .comparison-table .amount { text-align:right; font-family:monospace; }
        .comparison-table .reste.negative { color:var(--danger); }
        .comparison-table .reste.positive { color:var(--accent2); }
        
        .mini-progress { height:5px; background:var(--border); border-radius:3px; overflow:hidden; width:60px; }
        .mini-progress-fill { height:100%; border-radius:3px; }
        .mini-progress-fill.safe { background:var(--accent2); }
        .mini-progress-fill.warning { background:var(--warn); }
        .mini-progress-fill.danger { background:var(--danger); }
        
        .depense-item { background:var(--bg); border-radius:10px; padding:12px; margin-bottom:10px; }
        .depense-header { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
        .depense-info h4 { font-size:.9rem; margin-bottom:4px; }
        .depense-amount { font-size:1rem; font-weight:700; color:var(--accent2); }
        .depense-meta { display:flex; flex-wrap:wrap; gap:5px; font-size:.7rem; color:var(--dim); align-items:center; margin-top:4px; }
        .depense-tag { padding:2px 6px; background:rgba(255,255,255,.05); border-radius:4px; }
        .depense-tag.whatsapp { background:rgba(37,211,102,.15); color:#25d366; }
        .depense-tag.backoffice { background:rgba(59,130,246,.15); color:var(--accent); }
        .depense-tag.vocal { background:rgba(245,158,11,.15); color:var(--warn); }
        .depense-tag.image { background:rgba(168,85,247,.15); color:#a855f7; }
        .depense-actions { margin-top:8px; }
        
        .gallery-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(100px, 1fr)); gap:8px; margin-top:15px; }
        .gallery-item { aspect-ratio:1; border-radius:8px; overflow:hidden; cursor:pointer; border:2px solid var(--border); }
        .gallery-item:hover { border-color:var(--accent); }
        .gallery-item img { width:100%; height:100%; object-fit:cover; }
        
        .photo-modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.95); z-index:2000; justify-content:center; align-items:center; padding:20px; }
        .photo-modal.visible { display:flex; }
        .photo-modal img { max-width:100%; max-height:90vh; object-fit:contain; border-radius:8px; }
        .photo-modal-close { position:absolute; top:15px; right:15px; background:var(--card); border:none; color:#fff; font-size:1.3rem; padding:10px 15px; border-radius:10px; cursor:pointer; }
        
        /* Tâches Styles */
        .task-section { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 15px; margin-bottom: 15px; }
        .task-list { margin-top: 15px; }
        .task-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px; border-radius: 10px; margin-bottom: 8px; background: var(--bg); border: 1px solid var(--border); position: relative; }
        .task-item.completed { opacity: 0.7; background: rgba(16, 185, 129, 0.05); border-color: rgba(16, 185, 129, 0.2); }
        .task-item.priority-high { border-left: 3px solid var(--danger); }
        .task-item.priority-medium { border-left: 3px solid var(--warn); }
        .task-item.priority-low { border-left: 3px solid var(--accent2); }
        .task-item.has-reminder::after { 
            content: "⏰"; 
            position: absolute; 
            top: 8px; 
            right: 8px; 
            font-size: 0.8rem; 
            color: var(--info);
        }
        .task-checkbox { margin-top: 2px; width: 18px; height: 18px; accent-color: var(--accent2); }
        .task-content { flex: 1; }
        .task-title { font-weight: 600; margin-bottom: 4px; }
        .task-description { font-size: 0.8rem; color: var(--dim); margin-bottom: 6px; }
        .task-meta { display: flex; gap: 12px; font-size: 0.7rem; color: var(--dim); flex-wrap: wrap; align-items: center; }
        .task-completed-by::before { content: "✅ "; }
        .task-completed-at::before { content: "🕐 "; }
        .task-reminder { color: var(--info); font-weight: 600; }
        .task-priority { padding: 2px 6px; border-radius: 4px; font-size: 0.65rem; font-weight: 600; }
        .priority-high-tag { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        .priority-medium-tag { background: rgba(245, 158, 11, 0.2); color: var(--warn); }
        .priority-low-tag { background: rgba(16, 185, 129, 0.2); color: var(--accent2); }
        .task-actions { display: flex; gap: 4px; margin-top: 8px; }
        .task-action-btn { padding: 4px 8px; font-size: 0.7rem; border-radius: 4px; }
        .separator-line { height: 1px; background: var(--border); margin: 15px 0; position: relative; }
        .separator-line::after { content: "TÂCHES TERMINÉES"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--card); padding: 0 15px; font-size: 0.7rem; color: var(--dim); font-weight: 600; }
        
        /* Modal Styles */
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.85); z-index:1000; justify-content:center; align-items:flex-start; padding:10px; overflow-y:auto; }
        .modal.visible { display:flex; }
        .modal-content { background:var(--card); border:1px solid var(--border); border-radius:16px; width:100%; max-width:500px; margin:20px auto; }
        .modal-header { padding:15px 20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; background:var(--card); z-index:10; border-radius:16px 16px 0 0; }
        .modal-title { font-size:1.1rem; font-weight:700; }
        .modal-close { background:none; border:none; color:var(--dim); font-size:1.5rem; cursor:pointer; padding:5px; }
        .modal-body { padding:20px; }
        .modal-footer { padding:15px 20px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px; flex-wrap:wrap; }
        .form-group { display:flex; flex-direction:column; gap:5px; margin-bottom:15px; }
        .form-group label { font-size:.8rem; color:var(--dim); }
        .form-group input, .form-group textarea, .form-group select { padding:12px; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:#fff; font-size:.9rem; width:100%; }
        .form-group textarea { resize:vertical; min-height:80px; }
        .form-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        
        .empty-state { text-align:center; padding:30px; color:var(--dim); }
        .footer { text-align:center; padding:30px; color:var(--dim); font-size:.8rem; }
        .footer a { color:var(--accent); text-decoration:none; margin:0 8px; }

        /* Écosystème chantier */
        .eco-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
        .eco-card{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
        .eco-card-header{display:flex;justify-content:space-between;align-items:flex-start}
        .eco-name{font-weight:700;font-size:.92rem}
        .eco-metier{font-size:.65rem;font-weight:600;padding:2px 8px;border-radius:99px;background:rgba(194,65,12,.12);color:#c2410c;text-transform:uppercase;letter-spacing:.03em}
        .eco-entreprise{font-size:.78rem;color:var(--dim)}
        .eco-contact{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
        .eco-contact a{font-size:.78rem;color:var(--accent);text-decoration:none;display:inline-flex;align-items:center;gap:3px}
        .eco-contact a:hover{text-decoration:underline}
        .eco-wa{padding:3px 10px;border-radius:99px;font-size:.7rem;font-weight:600;background:#25d366;color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
        .eco-role{font-size:.72rem;color:var(--dim);font-style:italic;margin-top:2px}
        .eco-remove{background:none;border:none;color:var(--dim);cursor:pointer;font-size:.75rem;padding:2px 6px;border-radius:6px;transition:all .15s}
        .eco-remove:hover{color:var(--danger);background:rgba(239,68,68,.1)}
        
        @media(min-width:768px) { .stats-grid { grid-template-columns:repeat(4, 1fr); } }
        @media(max-width:480px) { .depense-header { flex-direction:column; } .form-row { grid-template-columns:1fr; } }
    </style>
</head>
<body>
    <div class="login-screen" id="login-screen">
        <div class="login-box">
            <h2>🔐 Accès Projet</h2>
            <p>Mot de passe du chantier</p>
            <input type="password" id="password-input" placeholder="Mot de passe" onkeypress="if(event.key==='Enter')checkPassword()">
            <button onclick="checkPassword()">Accéder</button>
            <div class="login-error" id="login-error"></div>
        </div>
    </div>
    
    <div class="content" id="content">
        <div class="container">
            <div class="top-bar">
                <a href="./atlas-projects.html" class="back-link">← Tous les projets</a>
                
            </div>
            
            <div class="project-header" id="project-header"><div class="project-title">Chargement...</div></div>
            <div class="stats-grid" id="stats-grid"></div>
            
            <div class="section">
                <h3 class="section-title">📊 Budget vs Réel</h3>
                <div class="table-wrapper">
                    <table class="comparison-table">
                        <thead><tr><th>Catégorie</th><th class="amount">Budget</th><th class="amount">Dépensé</th><th class="amount">Reste</th><th>%</th></tr></thead>
                        <tbody id="comparison-tbody"></tbody>
                        <tfoot id="comparison-tfoot"></tfoot>
                    </table>
                </div>
            </div>
            
            <div class="section task-section">
                <div class="section-header">
                    <h3 class="section-title">📋 Tâches du projet</h3>
                    <button class="btn btn-outline btn-small" onclick="openAddTaskModal()">+ Ajouter tâche</button>
                </div>
                <div id="tasks-container"></div>
            </div>
            
            <div class="section">
                <div class="section-header">
                    <h3 class="section-title">📝 Historique</h3>
                    <button class="btn btn-outline btn-small" onclick="toggleGallery()">🖼️ Photos</button>
                </div>
                <div id="gallery-section" style="display:none;"><div class="gallery-grid" id="gallery-grid"></div></div>
                <div id="depenses-list"></div>
            </div>
            
            <!-- Écosystème chantier -->
            <div class="section">
                <div class="section-header">
                    <h3 class="section-title">👥 Écosystème chantier</h3>
                    <button class="btn btn-outline btn-small" onclick="openEcoModal()">+ Ajouter</button>
                </div>
                <div class="eco-grid" id="eco-grid"><div style="color:var(--dim);font-size:.85rem">Chargement...</div></div>
            </div>
            
            <div class="footer"><a href="./atlas-projects.html">Projets</a><a href="./atlas-tasks.html">📋 Tâches globales</a></div>
        </div>
    </div>
    
    <div class="photo-modal" id="photo-modal" onclick="closePhotoModal()">
        <button class="photo-modal-close" onclick="closePhotoModal()">×</button>
        <img id="photo-modal-img" src="" alt="Photo">
    </div>
    
    <!-- Modal Ajout/Édition Tâche -->
    <div class="modal" id="task-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="task-modal-title"> Nouvelle Tâche</h3>
                <button class="modal-close" onclick="closeTaskModal()">×</button>
            </div>
            <form onsubmit="saveTask(event)">
                <input type="hidden" id="task-id">
                <div class="modal-body">
                    <div class="form-group">
                        <label>Titre *</label>
                        <input type="text" id="task-title" placeholder="Ex: Commander matériaux" required>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="task-description" placeholder="Détails supplémentaires..."></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Priorité</label>
                            <select id="task-priority">
                                <option value="low">Basse</option>
                                <option value="medium" selected>Moyenne</option>
                                <option value="high">Haute</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Rappel (optionnel)</label>
                            <input type="datetime-local" id="task-reminder">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" onclick="closeTaskModal()">Annuler</button>
                    <button type="submit" class="btn btn-primary" id="save-task-btn">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Modal Écosystème -->
    <div id="eco-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);z-index:1001;align-items:center;justify-content:center;padding:20px" onclick="if(event.target===this)closeEcoModal()">
        <div style="background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto">
            <h3 style="font-size:1.1rem;font-weight:700;margin-bottom:16px">Ajouter un intervenant</h3>
            <div style="margin-bottom:14px">
                <label style="font-size:.72rem;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:6px">Depuis l'annuaire</label>
                <select id="eco-select" style="width:100%;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:.875rem"><option value="">— Choisir —</option></select>
            </div>
            <div style="margin-bottom:14px">
                <label style="font-size:.72rem;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:6px">Rôle sur ce projet</label>
                <input type="text" id="eco-role" placeholder="Ex: Responsable plâtrerie RDC" style="width:100%;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:.875rem">
            </div>
            <div style="text-align:center;color:var(--dim);font-size:.8rem;margin:16px 0">— ou créer un nouveau —</div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
                <div><label style="font-size:.72rem;font-weight:700;color:var(--dim);text-transform:uppercase;display:block;margin-bottom:4px">Nom *</label><input type="text" id="eco-new-nom" placeholder="Nom" style="width:100%;padding:8px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.85rem"></div>
                <div><label style="font-size:.72rem;font-weight:700;color:var(--dim);text-transform:uppercase;display:block;margin-bottom:4px">Métier *</label>
                    <select id="eco-new-metier" style="width:100%;padding:8px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.85rem"><option value="">—</option><option value="architecte">Architecte</option><option value="architecte_interieur">Archi. intérieur</option><option value="maitre_ouvrage">Maître d'ouvrage</option><option value="maitre_oeuvre">Maître d'œuvre</option><option value="macon">Maçon</option><option value="platrier">Plâtrier</option><option value="etancheiste">Étanchéiste</option><option value="plombier">Plombier</option><option value="electricien">Électricien</option><option value="chauffagiste">Chauffagiste</option><option value="climatisation">Climatisation</option><option value="sanitariste">Sanitaires</option><option value="peintre">Peintre</option><option value="menuisier_bois">Menuisier bois</option><option value="menuisier_alu">Menuisier alu</option><option value="cuisiniste">Cuisiniste</option><option value="faux_plafondiste">Faux plafond</option><option value="marbrier">Marbrier</option><option value="vitrier">Vitrier</option><option value="serrurier">Serrurier</option><option value="autre">Autre</option></select>
                </div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
                <div><label style="font-size:.72rem;font-weight:700;color:var(--dim);text-transform:uppercase;display:block;margin-bottom:4px">Téléphone</label><input type="tel" id="eco-new-tel" placeholder="06..." style="width:100%;padding:8px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.85rem"></div>
                <div><label style="font-size:.72rem;font-weight:700;color:var(--dim);text-transform:uppercase;display:block;margin-bottom:4px">Email</label><input type="email" id="eco-new-email" placeholder="email@..." style="width:100%;padding:8px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.85rem"></div>
            </div>
            <div style="display:flex;gap:10px;justify-content:flex-end">
                <button class="btn btn-outline" onclick="closeEcoModal()">Annuler</button>
                <button class="btn btn-success" onclick="addIntervenant()">Ajouter au projet</button>
            </div>
        </div>
    </div>

    <script>

async function loadProject() {
    if (!projectId) { document.getElementById('login-screen').innerHTML = '<div class="login-box"><h2>❌</h2><p>Projet non trouvé</p></div>'; return; }
    
    const { data } = await db.from('atlas_projects').select('*').eq('id', projectId).single();
    if (!data) { document.getElementById('login-screen').innerHTML = '<div class="login-box"><h2>❌</h2><p>Projet non trouvé</p></div>'; return; }
    
    project = data;
    const [bRes, dRes, tRes] = await Promise.all([
        db.from('atlas_budget').select('*').eq('project_id', projectId),
        db.from('atlas_depenses').select('*').eq('project_id', projectId).order('created_at', { ascending: false }),
        db.from('atlas_taches').select('*').eq('project_id', projectId).order('created_at', { ascending: true })
    ]);
    budgets = bRes.data || [];
    depenses = dRes.data || [];
    taches = tRes.data || [];
    
    // Charger le client si lié
    if (project.client_id) {
        const { data: cData } = await db.from('atlas_clients').select('id, nom, telephone, email').eq('id', project.client_id).single();
        clientData = cData;
    }
    
    // Charger les intervenants du projet
    const [aiRes, piRes] = await Promise.all([
        db.from('atlas_intervenants').select('*').eq('actif', true).order('nom'),
        db.from('atlas_projet_intervenants').select('*').eq('project_id', projectId)
    ]);
    allIntervenants = aiRes.data || [];
    projetIntervenants = piRes.data || [];
    
    if (isAdmin || !project.password) showContent();
    checkReminders(); // Vérifier les rappels au chargement
}

function formatMoney(n) { return new Intl.NumberFormat('fr-MA', { maximumFractionDigits: 0 }).format(n || 0); }
function formatDateTime(d) {
    if (!d) return '-';
    const date = new Date(d);
    return date.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: '2-digit' }) + ' ' + date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}

function formatReminderDateTime(d) {
    if (!d) return '';
    const date = new Date(d);
    return date.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: '2-digit' }) + ' à ' + date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}

function getBudgetByCategory(catId) { return budgets.filter(b => b.categorie === catId).reduce((s, b) => s + (parseFloat(b.budget_prevu) || 0), 0); }
function getDepensesByCategory(catId) { return depenses.filter(d => d.categorie === catId).reduce((s, d) => s + (parseFloat(d.montant) || 0), 0); }

function render() {
    document.title = `${project.name} - Atlas Pose`;
    
    document.getElementById('project-header').innerHTML = `
        <div class="project-title">${project.name}<span class="status-badge status-${project.status}">${project.status.replace('_', ' ')}</span></div>
        <div class="project-meta">
            <span>🏢 ${(() => {
                if (project.client_id && clientData) {
                    return '<a href="./atlas-client.html?id=' + project.client_id + '" style="color:var(--accent);text-decoration:none;">' + clientData.nom + '</a>';
                }
                return project.client_name || '-';
            })()}</span>
            <span>📍 ${project.localisation || '-'}</span>
            <span>📐 ${project.surface_m2 || 0} m²</span>
            <span>👷 ${project.nb_employes || 0} employés</span>
        </div>`;
    
    const totalBudget = budgets.reduce((s, b) => s + (parseFloat(b.budget_prevu) || 0), 0);
    const totalSpent = depenses.reduce((s, d) => s + (parseFloat(d.montant) || 0), 0);
    const reste = totalBudget - totalSpent;
    const pct = totalBudget > 0 ? Math.round((totalSpent / totalBudget) * 100) : 0;
    
    document.getElementById('stats-grid').innerHTML = `
        <div class="stat-card"><div class="stat-value blue">${formatMoney(totalBudget)}</div><div class="stat-label">Budget</div></div>
        <div class="stat-card"><div class="stat-value green">${formatMoney(totalSpent)}</div><div class="stat-label">Dépensé</div></div>
        <div class="stat-card"><div class="stat-value ${reste < 0 ? 'red' : 'orange'}">${formatMoney(reste)}</div><div class="stat-label">Reste</div></div>
        <div class="stat-card"><div class="stat-value ${pct > 100 ? 'red' : 'blue'}">${pct}%</div><div class="stat-label">Consommé</div></div>`;
    
    // Table
    let tb = 0, ts = 0;
    document.getElementById('comparison-tbody').innerHTML = CATEGORIES.map(cat => {
        const b = getBudgetByCategory(cat.id), s = getDepensesByCategory(cat.id), r = b - s;
        const p = b > 0 ? Math.round((s / b) * 100) : (s > 0 ? 100 : 0);
        const pc = p > 100 ? 'danger' : p > 80 ? 'warning' : 'safe';
        tb += b; ts += s;
        if (b === 0 && s === 0) return '';
        return `<tr><td class="cat-name">${cat.label}</td><td class="amount">${formatMoney(b)}</td><td class="amount" style="color:var(--accent2)">${formatMoney(s)}</td><td class="amount reste ${r < 0 ? 'negative' : 'positive'}">${formatMoney(r)}</td><td><div class="mini-progress"><div class="mini-progress-fill ${pc}" style="width:${Math.min(p,100)}%"></div></div></td></tr>`;
    }).join('');
    
    const tr = tb - ts, tp = tb > 0 ? Math.round((ts / tb) * 100) : 0;
    document.getElementById('comparison-tfoot').innerHTML = `<tr style="font-weight:700;background:rgba(59,130,246,.1)"><td>TOTAL</td><td class="amount">${formatMoney(tb)}</td><td class="amount" style="color:var(--accent2)">${formatMoney(ts)}</td><td class="amount ${tr < 0 ? 'negative' : 'positive'}">${formatMoney(tr)}</td><td>${tp}%</td></tr>`;
    
    renderGallery();
    renderDepenses();
    renderTasks(); // Ajout des tâches
    renderEcosysteme();
}

function renderTasks() {
    const container = document.getElementById('tasks-container');
    
    if (!taches.length) {
        container.innerHTML = '<div class="empty-state">Aucune tâche</div>';
        return;
    }
    
    const pendingTasks = taches.filter(t => !t.completed);
    const completedTasks = taches.filter(t => t.completed).reverse();
    
    let html = '';
    
    // Tâches en attente
    if (pendingTasks.length > 0) {
        html += pendingTasks.map(task => {
            const hasReminder = task.reminder_datetime && new Date(task.reminder_datetime) > new Date();
            return `
            <div class="task-item ${task.priority ? 'priority-' + task.priority : ''} ${hasReminder ? 'has-reminder' : ''}" data-task-id="${task.id}">
                <input type="checkbox" class="task-checkbox" onchange="toggleTask(${task.id}, this.checked)" ${task.completed ? 'checked' : ''}>
                <div class="task-content">
                    <div class="task-title">${task.titre}</div>
                    ${task.description ? `<div class="task-description">${task.description}</div>` : ''}
                    <div class="task-meta">
                        ${task.priority ? `<span class="task-priority priority-${task.priority}-tag">${task.priority === 'high' ? 'Haute' : task.priority === 'medium' ? 'Moyenne' : 'Basse'}</span>` : ''}
                        ${hasReminder ? `<span class="task-reminder">⏰ ${formatReminderDateTime(task.reminder_datetime)}</span>` : ''}
                        ${task.created_at ? `Créée: ${formatDateTime(task.created_at)}` : ''}
                    </div>
                    <div class="task-actions">
                        <button class="btn btn-outline btn-small task-action-btn" onclick="editTask(${task.id})">✏️ Éditer</button>
                        ${hasReminder ? `<button class="btn btn-info btn-small task-action-btn" onclick="clearReminder(${task.id})">🚫 Annuler rappel</button>` : ''}
                    </div>
                </div>
            </div>`;
        }).join('');
    }
    
    // Ligne de séparation
    if (pendingTasks.length > 0 && completedTasks.length > 0) {
        html += '<div class="separator-line"></div>';
    }
    
    // Tâches terminées
    if (completedTasks.length > 0) {
        html += completedTasks.map(task => {
            const hasReminder = task.reminder_datetime && new Date(task.reminder_datetime) > new Date();
            return `
            <div class="task-item completed ${task.priority ? 'priority-' + task.priority : ''} ${hasReminder ? 'has-reminder' : ''}" data-task-id="${task.id}">
                <input type="checkbox" class="task-checkbox" onchange="toggleTask(${task.id}, this.checked)" checked>
                <div class="task-content">
                    <div class="task-title">${task.titre}</div>
                    ${task.description ? `<div class="task-description">${task.description}</div>` : ''}
                    <div class="task-meta">
                        ${task.priority ? `<span class="task-priority priority-${task.priority}-tag">${task.priority === 'high' ? 'Haute' : task.priority === 'medium' ? 'Moyenne' : 'Basse'}</span>` : ''}
                        ${hasReminder ? `<span class="task-reminder">⏰ ${formatReminderDateTime(task.reminder_datetime)}</span>` : ''}
                        ${task.completed_by ? `<span class="task-completed-by">${task.completed_by}</span>` : ''}
                        ${task.completed_at ? `<span class="task-completed-at">${formatDateTime(task.completed_at)}</span>` : ''}
                    </div>
                    <div class="task-actions">
                        <button class="btn btn-outline btn-small task-action-btn" onclick="editTask(${task.id})">✏️ Éditer</button>
                    </div>
                </div>
            </div>`;
        }).join('');
    }
    
    container.innerHTML = html;
}

async function toggleTask(taskId, completed) {
    const task = taches.find(t => t.id === taskId);
    if (!task) return;
    
    // Update minimal — seulement 'completed' qui est sûr d'exister
    const updateData = { completed: completed };
    
    // Ajouter completed_at et completed_by seulement si la tâche les supporte
    if (task.hasOwnProperty('completed_at')) {
        updateData.completed_at = completed ? new Date().toISOString() : null;
    }
    if (task.hasOwnProperty('completed_by')) {
        updateData.completed_by = completed ? (currentUser || null) : null;
    }
    
    try {
        const { error } = await db.from('atlas_taches').update(updateData).eq('id', taskId);
        if (error) {
            // Si erreur 400, réessayer avec seulement 'completed'
            console.warn('Update complet échoué, retry minimal:', error.message);
            await db.from('atlas_taches').update({ completed }).eq('id', taskId);
        }
        const taskIndex = taches.findIndex(t => t.id === taskId);
        if (taskIndex !== -1) {
            taches[taskIndex] = { ...taches[taskIndex], ...updateData };
        }
        renderTasks();
    } catch (error) {
        console.error('Erreur toggleTask:', error);
        const checkbox = document.querySelector(`[data-task-id="${taskId}"] .task-checkbox`);
        if (checkbox) checkbox.checked = !completed;
    }
}

function editTask(taskId) {
    const task = taches.find(t => t.id === taskId);
    if (!task) return;
    
    document.getElementById('task-modal-title').textContent = 'Modifier Tâche';
    document.getElementById('task-id').value = task.id;
    document.getElementById('task-title').value = task.titre;
    document.getElementById('task-description').value = task.description || '';
    document.getElementById('task-priority').value = task.priority || 'medium';
    
    // Formatage de la date pour l'input datetime-local
    if (task.reminder_datetime) {
        const date = new Date(task.reminder_datetime);
        const formatted = date.toISOString().slice(0, 16);
        document.getElementById('task-reminder').value = formatted;
    } else {
        document.getElementById('task-reminder').value = '';
    }
    
    document.getElementById('task-modal').classList.add('visible');
}

async function saveTask(e) {
    e.preventDefault();
    const btn = document.getElementById('save-task-btn');
    btn.disabled = true;
    btn.textContent = '...';
    
    const titre = document.getElementById('task-title').value.trim();
    if (!titre) {
        alert('Titre requis');
        btn.disabled = false;
        btn.textContent = 'Enregistrer';
        return;
    }
    
    const taskId = document.getElementById('task-id').value;
    const taskData = {
        project_id: parseInt(projectId),
        titre: titre,
        description: document.getElementById('task-description').value || null,
        priority: document.getElementById('task-priority').value || 'medium'
    };
    
    // Ajouter le rappel si présent
    const reminderValue = document.getElementById('task-reminder').value;
    if (reminderValue) {
        taskData.reminder_datetime = new Date(reminderValue).toISOString();
        taskData.reminder_sent = false;
    }
    
    try {
        if (taskId) {
            // Modification
            await db.from('atlas_taches').update(taskData).eq('id', taskId);
            // Mettre à jour localement
            const taskIndex = taches.findIndex(t => t.id === parseInt(taskId));
            if (taskIndex !== -1) {
                taches[taskIndex] = { ...taches[taskIndex], ...taskData };
            }
        } else {
            // Création
            const { data } = await db.from('atlas_taches').insert([taskData]).select();
            if (data && data[0]) {
                taches.push(data[0]); // Ajouter localement
            }
        }
        
        closeTaskModal();
        renderTasks();
        showToast(taskId ? 'Tâche modifiée !' : 'Tâche ajoutée !');
    } catch (error) {
        alert('Erreur: ' + error.message);
    }
    
    btn.disabled = false;
    btn.textContent = 'Enregistrer';
}

async function clearReminder(taskId) {
    try {
        await db.from('atlas_taches').update({
            reminder_datetime: null,
            reminder_sent: null
        }).eq('id', taskId);
        
        // Mettre à jour localement
        const taskIndex = taches.findIndex(t => t.id === taskId);
        if (taskIndex !== -1) {
            taches[taskIndex].reminder_datetime = null;
            taches[taskIndex].reminder_sent = null;
        }
        
        renderTasks();
        showToast('Rappel annulé');
    } catch (error) {
        console.error('Erreur:', error);
        alert('Erreur lors de l\'annulation du rappel');
    }
}

function showToast(msg) {
    // Simple toast notification
    const toast = document.createElement('div');
    toast.style.position = 'fixed';
    toast.style.bottom = '20px';
    toast.style.left = '50%';
    toast.style.transform = 'translateX(-50%)';
    toast.style.background = 'var(--accent2)';
    toast.style.color = '#fff';
    toast.style.padding = '12px 24px';
    toast.style.borderRadius = '8px';
    toast.style.fontWeight = '600';
    toast.style.zIndex = '2000';
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(() => {
        if (toast.parentNode) {
            toast.parentNode.removeChild(toast);
        }
    }, 2500);
}

// === SYSTEME DE RAPPELS ===
async function checkReminders() {
    const now = new Date();
    const tasksWithReminders = taches.filter(task => 
        task.reminder_datetime && 
        !task.reminder_sent && 
        !task.completed &&
        new Date(task.reminder_datetime) <= now
    );
    
    for (const task of tasksWithReminders) {
        try {
            // Afficher notification
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification('🔔 Rappel de tâche', {
                    body: `Tâche: ${task.titre}\nProjet: ${project.name}`,
                    icon: './favicon.ico'
                });
            } else if ('Notification' in window && Notification.permission !== 'denied') {
                Notification.requestPermission();
            }
            
            // Marquer comme envoyé
            await db.from('atlas_taches').update({ reminder_sent: true }).eq('id', task.id);
            
            // Mettre à jour localement
            const taskIndex = taches.findIndex(t => t.id === task.id);
            if (taskIndex !== -1) {
                taches[taskIndex].reminder_sent = true;
            }
            
        } catch (error) {
            console.error('Erreur rappel:', error);
        }
    }
}

// Demander permission pour les notifications
if ('Notification' in window) {
    if (Notification.permission === 'default') {
        Notification.requestPermission();
    }
}

    // Si pas d'existant sélectionné, créer un nouveau
    if (!intervId) {
        const nom = document.getElementById('eco-new-nom').value.trim();
        const metier = document.getElementById('eco-new-metier').value;
        if (!nom || !metier) { showNotification('Choisissez un intervenant ou remplissez nom + métier', 'error'); return; }
        try {
            const { data: newI, error } = await db.from('atlas_intervenants').insert([{
                nom: nom, corps_metier: metier,
                telephone: document.getElementById('eco-new-tel').value.trim() || null,
                email: document.getElementById('eco-new-email').value.trim() || null
            }]).select().single();
            if (error) throw error;
            intervId = newI.id;
        } catch (err) { showNotification('Erreur création: ' + err.message, 'error'); return; }
    }

    // Créer le lien
    try {
        const { error } = await db.from('atlas_projet_intervenants').insert([{
            project_id: parseInt(projectId), intervenant_id: intervId, role: role
        }]);
        if (error) throw error;
        showNotification('Intervenant ajouté au projet ✓');
        closeEcoModal();
        // Recharger les intervenants
        const [aiRes, piRes] = await Promise.all([
            db.from('atlas_intervenants').select('*').eq('actif', true).order('nom'),
            db.from('atlas_projet_intervenants').select('*').eq('project_id', projectId)
        ]);
        allIntervenants = aiRes.data || [];
        projetIntervenants = piRes.data || [];
        renderEcosysteme();
    } catch (err) { showNotification('Erreur: ' + err.message, 'error'); }
}

async function removeIntervenant(piId) {
    if (!confirm('Retirer cet intervenant du projet ?')) return;
    try {
        await db.from('atlas_projet_intervenants').delete().eq('id', piId);
        projetIntervenants = projetIntervenants.filter(pi => pi.id !== piId);
        renderEcosysteme();
        showNotification('Intervenant retiré');
    } catch (err) { showNotification('Erreur', 'error'); }
}

loadProject();
    </script>
    <script src="./atlas-nav.js"></script>
</body>
