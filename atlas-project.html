<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Projet - Atlas Pose</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <style>
        :root { --bg:#0a0f1a; --card:#111827; --accent:#3b82f6; --accent2:#10b981; --text:#f3f4f6; --dim:#9ca3af; --border:#1f2937; --danger:#ef4444; --warn:#f59e0b; }
        * { box-sizing:border-box; margin:0; padding:0; }
        body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; }
        .container { max-width:1200px; margin:0 auto; padding:15px; }
        
        .login-screen { display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px; }
        .login-box { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:30px; width:100%; max-width:400px; text-align:center; }
        .login-box h2 { margin-bottom:8px; }
        .login-box p { color:var(--dim); margin-bottom:20px; font-size:.85rem; }
        .login-box input { width:100%; padding:14px; background:var(--bg); border:1px solid var(--border); border-radius:10px; color:#fff; margin-bottom:12px; text-align:center; }
        .login-box button { width:100%; padding:14px; background:var(--accent); border:none; border-radius:10px; color:#fff; font-weight:600; cursor:pointer; }
        .login-error { color:var(--danger); margin-top:12px; font-size:.85rem; }
        
        .content { display:none; }
        .content.visible { display:block; }
        
        .top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap:wrap; gap:10px; padding:12px; background:var(--card); border-radius:12px; border:1px solid var(--border); }
        .back-link { display:inline-flex; align-items:center; gap:6px; color:var(--accent); text-decoration:none; font-size:.85rem; padding:8px 12px; background:rgba(59,130,246,.1); border-radius:8px; }
        
        .project-header { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px; margin-bottom:15px; }
        .project-title { font-size:1.5rem; font-weight:800; margin-bottom:8px; display:flex; align-items:center; flex-wrap:wrap; gap:10px; }
        .project-meta { display:flex; gap:15px; flex-wrap:wrap; color:var(--dim); font-size:.85rem; }
        .status-badge { padding:5px 12px; border-radius:20px; font-size:.75rem; font-weight:600; }
        .status-a_venir { background:rgba(245,158,11,.2); color:var(--warn); }
        .status-en_cours { background:rgba(59,130,246,.2); color:var(--accent); }
        .status-termine { background:rgba(16,185,129,.2); color:var(--accent2); }
        
        .stats-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; margin-bottom:15px; }
        .stat-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:15px; text-align:center; }
        .stat-value { font-size:1.3rem; font-weight:800; }
        .stat-value.blue { color:var(--accent); }
        .stat-value.green { color:var(--accent2); }
        .stat-value.orange { color:var(--warn); }
        .stat-value.red { color:var(--danger); }
        .stat-label { font-size:.7rem; color:var(--dim); margin-top:4px; }
        
        .section { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:15px; margin-bottom:15px; }
        .section-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap:wrap; gap:10px; }
        .section-title { font-size:1rem; font-weight:700; }
        
        .btn { padding:8px 14px; border:none; border-radius:8px; font-weight:600; cursor:pointer; font-size:.8rem; display:inline-flex; align-items:center; gap:5px; }
        .btn-outline { background:transparent; border:1px solid var(--border); color:var(--text); }
        .btn-small { padding:6px 10px; font-size:.75rem; }
        
        .table-wrapper { overflow-x:auto; }
        .comparison-table { width:100%; border-collapse:collapse; min-width:450px; font-size:.85rem; }
        .comparison-table th, .comparison-table td { padding:10px; text-align:left; border-bottom:1px solid var(--border); }
        .comparison-table th { color:var(--dim); font-size:.7rem; text-transform:uppercase; }
        .comparison-table .cat-name { font-weight:600; }
        .comparison-table .amount { text-align:right; font-family:monospace; }
        .comparison-table .reste.negative { color:var(--danger); }
        .comparison-table .reste.positive { color:var(--accent2); }
        
        .mini-progress { height:5px; background:var(--border); border-radius:3px; overflow:hidden; width:60px; }
        .mini-progress-fill { height:100%; border-radius:3px; }
        .mini-progress-fill.safe { background:var(--accent2); }
        .mini-progress-fill.warning { background:var(--warn); }
        .mini-progress-fill.danger { background:var(--danger); }
        
        .depense-item { background:var(--bg); border-radius:10px; padding:12px; margin-bottom:10px; }
        .depense-header { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
        .depense-info h4 { font-size:.9rem; margin-bottom:4px; }
        .depense-amount { font-size:1rem; font-weight:700; color:var(--accent2); }
        .depense-meta { display:flex; flex-wrap:wrap; gap:5px; font-size:.7rem; color:var(--dim); align-items:center; margin-top:4px; }
        .depense-tag { padding:2px 6px; background:rgba(255,255,255,.05); border-radius:4px; }
        .depense-tag.whatsapp { background:rgba(37,211,102,.15); color:#25d366; }
        .depense-tag.backoffice { background:rgba(59,130,246,.15); color:var(--accent); }
        .depense-tag.vocal { background:rgba(245,158,11,.15); color:var(--warn); }
        .depense-tag.image { background:rgba(168,85,247,.15); color:#a855f7; }
        .depense-actions { margin-top:8px; }
        
        .gallery-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(100px, 1fr)); gap:8px; margin-top:15px; }
        .gallery-item { aspect-ratio:1; border-radius:8px; overflow:hidden; cursor:pointer; border:2px solid var(--border); }
        .gallery-item:hover { border-color:var(--accent); }
        .gallery-item img { width:100%; height:100%; object-fit:cover; }
        
        .photo-modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.95); z-index:2000; justify-content:center; align-items:center; padding:20px; }
        .photo-modal.visible { display:flex; }
        .photo-modal img { max-width:100%; max-height:90vh; object-fit:contain; border-radius:8px; }
        .photo-modal-close { position:absolute; top:15px; right:15px; background:var(--card); border:none; color:#fff; font-size:1.3rem; padding:10px 15px; border-radius:10px; cursor:pointer; }
        
        /* Tâches Styles */
        .task-section { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 15px; margin-bottom: 15px; }
        .task-list { margin-top: 15px; }
        .task-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px; border-radius: 10px; margin-bottom: 8px; background: var(--bg); border: 1px solid var(--border); }
        .task-item.completed { opacity: 0.7; background: rgba(16, 185, 129, 0.05); border-color: rgba(16, 185, 129, 0.2); }
        .task-checkbox { margin-top: 2px; width: 18px; height: 18px; accent-color: var(--accent2); }
        .task-content { flex: 1; }
        .task-title { font-weight: 600; margin-bottom: 4px; }
        .task-description { font-size: 0.8rem; color: var(--dim); margin-bottom: 6px; }
        .task-meta { display: flex; gap: 12px; font-size: 0.7rem; color: var(--dim); }
        .task-completed-by::before { content: "✅ "; }
        .task-completed-at::before { content: "🕐 "; }
        .separator-line { height: 1px; background: var(--border); margin: 15px 0; position: relative; }
        .separator-line::after { content: "TÂCHES TERMINÉES"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--card); padding: 0 15px; font-size: 0.7rem; color: var(--dim); font-weight: 600; }
        
        /* Modal Styles */
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.85); z-index:1000; justify-content:center; align-items:flex-start; padding:10px; overflow-y:auto; }
        .modal.visible { display:flex; }
        .modal-content { background:var(--card); border:1px solid var(--border); border-radius:16px; width:100%; max-width:500px; margin:20px auto; }
        .modal-header { padding:15px 20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; background:var(--card); z-index:10; border-radius:16px 16px 0 0; }
        .modal-title { font-size:1.1rem; font-weight:700; }
        .modal-close { background:none; border:none; color:var(--dim); font-size:1.5rem; cursor:pointer; padding:5px; }
        .modal-body { padding:20px; }
        .modal-footer { padding:15px 20px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px; flex-wrap:wrap; }
        .form-group { display:flex; flex-direction:column; gap:5px; margin-bottom:15px; }
        .form-group label { font-size:.8rem; color:var(--dim); }
        .form-group input, .form-group textarea { padding:12px; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:#fff; font-size:.9rem; width:100%; }
        .form-group textarea { resize:vertical; min-height:80px; }
        
        .empty-state { text-align:center; padding:30px; color:var(--dim); }
        .footer { text-align:center; padding:30px; color:var(--dim); font-size:.8rem; }
        .footer a { color:var(--accent); text-decoration:none; margin:0 8px; }
        
        @media(min-width:768px) { .stats-grid { grid-template-columns:repeat(4, 1fr); } }
        @media(max-width:480px) { .depense-header { flex-direction:column; } }
    </style>
</head>
<body>
    <div class="login-screen" id="login-screen">
        <div class="login-box">
            <h2>🔐 Accès Projet</h2>
            <p>Mot de passe du chantier</p>
            <input type="password" id="password-input" placeholder="Mot de passe" onkeypress="if(event.key==='Enter')checkPassword()">
            <button onclick="checkPassword()">Accéder</button>
            <div class="login-error" id="login-error"></div>
        </div>
    </div>
    
    <div class="content" id="content">
        <div class="container">
            <div class="top-bar">
                <a href="./atlas-projects.html" class="back-link">← Tous les projets</a>
                <a href="./" class="back-link">🏠 Alfred Hub</a>
            </div>
            
            <div class="project-header" id="project-header"><div class="project-title">Chargement...</div></div>
            <div class="stats-grid" id="stats-grid"></div>
            
            <div class="section">
                <h3 class="section-title">📊 Budget vs Réel</h3>
                <div class="table-wrapper">
                    <table class="comparison-table">
                        <thead><tr><th>Catégorie</th><th class="amount">Budget</th><th class="amount">Dépensé</th><th class="amount">Reste</th><th>%</th></tr></thead>
                        <tbody id="comparison-tbody"></tbody>
                        <tfoot id="comparison-tfoot"></tfoot>
                    </table>
                </div>
            </div>
            
            <div class="section task-section">
                <div class="section-header">
                    <h3 class="section-title">📋 Tâches du projet</h3>
                    <button class="btn btn-outline btn-small" onclick="openAddTaskModal()">+ Ajouter tâche</button>
                </div>
                <div id="tasks-container"></div>
            </div>
            
            <div class="section">
                <div class="section-header">
                    <h3 class="section-title">📝 Historique</h3>
                    <button class="btn btn-outline btn-small" onclick="toggleGallery()">🖼️ Photos</button>
                </div>
                <div id="gallery-section" style="display:none;"><div class="gallery-grid" id="gallery-grid"></div></div>
                <div id="depenses-list"></div>
            </div>
            
            <div class="footer"><a href="./atlas-projects.html">Projets</a><a href="./">Alfred Hub</a></div>
        </div>
    </div>
    
    <div class="photo-modal" id="photo-modal" onclick="closePhotoModal()">
        <button class="photo-modal-close" onclick="closePhotoModal()">×</button>
        <img id="photo-modal-img" src="" alt="Photo">
    </div>
    
    <!-- Modal Ajout Tâche -->
    <div class="modal" id="task-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title"> Nouvelle Tâche</h3>
                <button class="modal-close" onclick="closeTaskModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Titre *</label>
                    <input type="text" id="task-title" placeholder="Ex: Commander matériaux">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="task-description" placeholder="Détails supplémentaires..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeTaskModal()">Annuler</button>
                <button class="btn btn-primary" onclick="saveTask()">Ajouter</button>
            </div>
        </div>
    </div>
    
    <script>
const SUPABASE_URL = 'https://wxhlstificzqovfcumop.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aGxzdGlmaWN6cW92ZmN1bW9wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyNjcwOTAsImV4cCI6MjA4Njg0MzA5MH0.mt6v3SKPMhWpMw9PH7D8k3ubrR1kJNIFHw0aloLmQiQ';
const STORAGE_BUCKET = 'atlas-factures';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const CATEGORIES = [
    { id: 'fourniture', label: 'Fourniture' },
    { id: 'colle', label: 'Colle' },
    { id: 'joints', label: 'Joints' },
    { id: 'chape', label: 'Chape' },
    { id: 'main_oeuvre', label: "Main d'œuvre" },
    { id: 'transport', label: 'Transport' },
    { id: 'mise_en_place', label: 'Mise en place' },
    { id: 'nettoyage', label: 'Nettoyage' },
    { id: 'materiel', label: 'Matériel' },
    { id: 'prorata', label: 'Prorata' },
    { id: 'aleas', label: 'Aléas' }
];

const projectId = new URLSearchParams(location.search).get('id');
let project = null, budgets = [], depenses = [], taches = [];
const isAdmin = sessionStorage.getItem('atlas-auth') === 'true';
const currentUser = sessionStorage.getItem('atlas-user') || 'Utilisateur';

async function loadProject() {
    if (!projectId) { document.getElementById('login-screen').innerHTML = '<div class="login-box"><h2>❌</h2><p>Projet non trouvé</p></div>'; return; }
    
    const { data } = await db.from('atlas_projects').select('*').eq('id', projectId).single();
    if (!data) { document.getElementById('login-screen').innerHTML = '<div class="login-box"><h2>❌</h2><p>Projet non trouvé</p></div>'; return; }
    
    project = data;
    const [bRes, dRes, tRes] = await Promise.all([
        db.from('atlas_budget').select('*').eq('project_id', projectId),
        db.from('atlas_depenses').select('*').eq('project_id', projectId).order('created_at', { ascending: false }),
        db.from('atlas_taches').select('*').eq('project_id', projectId).order('created_at', { ascending: true })
    ]);
    budgets = bRes.data || [];
    depenses = dRes.data || [];
    taches = tRes.data || [];
    
    if (isAdmin || !project.password) showContent();
}

function checkPassword() {
    if (document.getElementById('password-input').value === project.password) showContent();
    else document.getElementById('login-error').textContent = 'Mot de passe incorrect';
}

function showContent() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('content').classList.add('visible');
    render();
}

function formatMoney(n) { return new Intl.NumberFormat('fr-MA', { maximumFractionDigits: 0 }).format(n || 0); }
function formatDateTime(d) {
    if (!d) return '-';
    const date = new Date(d);
    return date.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: '2-digit' }) + ' ' + date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}

function getBudgetByCategory(catId) { return budgets.filter(b => b.categorie === catId).reduce((s, b) => s + (parseFloat(b.budget_prevu) || 0), 0); }
function getDepensesByCategory(catId) { return depenses.filter(d => d.categorie === catId).reduce((s, d) => s + (parseFloat(d.montant) || 0), 0); }

function render() {
    document.title = `${project.name} - Atlas Pose`;
    
    document.getElementById('project-header').innerHTML = `
        <div class="project-title">${project.name}<span class="status-badge status-${project.status}">${project.status.replace('_', ' ')}</span></div>
        <div class="project-meta">
            <span>🏢 ${project.client_name || '-'}</span>
            <span>📍 ${project.localisation || '-'}</span>
            <span>📐 ${project.surface_m2 || 0} m²</span>
            <span>👷 ${project.nb_employes || 0} employés</span>
        </div>`;
    
    const totalBudget = budgets.reduce((s, b) => s + (parseFloat(b.budget_prevu) || 0), 0);
    const totalSpent = depenses.reduce((s, d) => s + (parseFloat(d.montant) || 0), 0);
    const reste = totalBudget - totalSpent;
    const pct = totalBudget > 0 ? Math.round((totalSpent / totalBudget) * 100) : 0;
    
    document.getElementById('stats-grid').innerHTML = `
        <div class="stat-card"><div class="stat-value blue">${formatMoney(totalBudget)}</div><div class="stat-label">Budget</div></div>
        <div class="stat-card"><div class="stat-value green">${formatMoney(totalSpent)}</div><div class="stat-label">Dépensé</div></div>
        <div class="stat-card"><div class="stat-value ${reste < 0 ? 'red' : 'orange'}">${formatMoney(reste)}</div><div class="stat-label">Reste</div></div>
        <div class="stat-card"><div class="stat-value ${pct > 100 ? 'red' : 'blue'}">${pct}%</div><div class="stat-label">Consommé</div></div>`;
    
    // Table
    let tb = 0, ts = 0;
    document.getElementById('comparison-tbody').innerHTML = CATEGORIES.map(cat => {
        const b = getBudgetByCategory(cat.id), s = getDepensesByCategory(cat.id), r = b - s;
        const p = b > 0 ? Math.round((s / b) * 100) : (s > 0 ? 100 : 0);
        const pc = p > 100 ? 'danger' : p > 80 ? 'warning' : 'safe';
        tb += b; ts += s;
        if (b === 0 && s === 0) return '';
        return `<tr><td class="cat-name">${cat.label}</td><td class="amount">${formatMoney(b)}</td><td class="amount" style="color:var(--accent2)">${formatMoney(s)}</td><td class="amount reste ${r < 0 ? 'negative' : 'positive'}">${formatMoney(r)}</td><td><div class="mini-progress"><div class="mini-progress-fill ${pc}" style="width:${Math.min(p,100)}%"></div></div></td></tr>`;
    }).join('');
    
    const tr = tb - ts, tp = tb > 0 ? Math.round((ts / tb) * 100) : 0;
    document.getElementById('comparison-tfoot').innerHTML = `<tr style="font-weight:700;background:rgba(59,130,246,.1)"><td>TOTAL</td><td class="amount">${formatMoney(tb)}</td><td class="amount" style="color:var(--accent2)">${formatMoney(ts)}</td><td class="amount ${tr < 0 ? 'negative' : 'positive'}">${formatMoney(tr)}</td><td>${tp}%</td></tr>`;
    
    renderGallery();
    renderDepenses();
    renderTasks(); // Ajout des tâches
}

function renderGallery() {
    const photos = depenses.filter(d => d.photo_path);
    document.getElementById('gallery-grid').innerHTML = photos.length ? photos.map(d => `<div class="gallery-item" onclick="viewPhoto('${d.photo_path}')"><img src="${SUPABASE_URL}/storage/v1/object/public/${STORAGE_BUCKET}/${d.photo_path}" loading="lazy"></div>`).join('') : '<p style="color:var(--dim)">Aucune photo</p>';
}

function toggleGallery() {
    const s = document.getElementById('gallery-section');
    s.style.display = s.style.display === 'none' ? 'block' : 'none';
}

function renderDepenses() {
    const container = document.getElementById('depenses-list');
    if (!depenses.length) { container.innerHTML = '<div class="empty-state">Aucune dépense</div>'; return; }
    
    const sorted = [...depenses].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    
    container.innerHTML = sorted.slice(0, 30).map(d => {
        const catLabel = CATEGORIES.find(c => c.id === d.categorie)?.label || d.categorie;
        const entryClass = d.entry_method === 'whatsapp' ? 'whatsapp' : 'backoffice';
        const formatClass = d.message_format === 'vocal' ? 'vocal' : (d.message_format === 'image' ? 'image' : '');
        
        return `<div class="depense-item">
            <div class="depense-header">
                <div class="depense-info">
                    <h4>${d.designation}</h4>
                    <div class="depense-meta">
                        <span class="depense-tag">${catLabel}</span>
                        <span class="depense-tag ${entryClass}">${d.entry_method || 'manuel'}</span>
                        ${d.message_format && d.message_format !== 'manuel' ? `<span class="depense-tag ${formatClass}">${d.message_format}</span>` : ''}
                        ${d.sender_name ? `<span>👤 ${d.sender_name}</span>` : ''}
                        <span>🕐 ${formatDateTime(d.created_at)}</span>
                        ${d.fournisseur ? `<span>🏪 ${d.fournisseur}</span>` : ''}
                    </div>
                </div>
                <div class="depense-amount">${formatMoney(d.montant)} MAD</div>
            </div>
            ${d.photo_path ? `<div class="depense-actions"><button class="btn btn-outline btn-small" onclick="viewPhoto('${d.photo_path}')">📷 Photo</button></div>` : ''}
        </div>`;
    }).join('');
    
    if (sorted.length > 30) container.innerHTML += `<div style="text-align:center;padding:15px;color:var(--dim)">+ ${sorted.length - 30} autres</div>`;
}

function viewPhoto(path) {
    document.getElementById('photo-modal-img').src = `${SUPABASE_URL}/storage/v1/object/public/${STORAGE_BUCKET}/${path}`;
    document.getElementById('photo-modal').classList.add('visible');
}
function closePhotoModal() { document.getElementById('photo-modal').classList.remove('visible'); }

// === FONCTIONS POUR LES TÂCHES ===
function renderTasks() {
    const container = document.getElementById('tasks-container');
    
    if (!taches.length) {
        container.innerHTML = '<div class="empty-state">Aucune tâche</div>';
        return;
    }
    
    const pendingTasks = taches.filter(t => !t.completed);
    const completedTasks = taches.filter(t => t.completed).reverse();
    
    let html = '';
    
    // Tâches en attente
    if (pendingTasks.length > 0) {
        html += pendingTasks.map(task => `
            <div class="task-item" data-task-id="${task.id}">
                <input type="checkbox" class="task-checkbox" onchange="toggleTask(${task.id}, this.checked)" ${task.completed ? 'checked' : ''}>
                <div class="task-content">
                    <div class="task-title">${task.titre}</div>
                    ${task.description ? `<div class="task-description">${task.description}</div>` : ''}
                    <div class="task-meta">
                        ${task.created_at ? `Créée: ${formatDateTime(task.created_at)}` : ''}
                    </div>
                </div>
            </div>
        `).join('');
    }
    
    // Ligne de séparation
    if (pendingTasks.length > 0 && completedTasks.length > 0) {
        html += '<div class="separator-line"></div>';
    }
    
    // Tâches terminées
    if (completedTasks.length > 0) {
        html += completedTasks.map(task => `
            <div class="task-item completed" data-task-id="${task.id}">
                <input type="checkbox" class="task-checkbox" onchange="toggleTask(${task.id}, this.checked)" checked>
                <div class="task-content">
                    <div class="task-title">${task.titre}</div>
                    ${task.description ? `<div class="task-description">${task.description}</div>` : ''}
                    <div class="task-meta">
                        ${task.completed_by ? `<span class="task-completed-by">${task.completed_by}</span>` : ''}
                        ${task.completed_at ? `<span class="task-completed-at">${formatDateTime(task.completed_at)}</span>` : ''}
                    </div>
                </div>
            </div>
        `).join('');
    }
    
    container.innerHTML = html;
}

async function toggleTask(taskId, completed) {
    const task = taches.find(t => t.id === taskId);
    if (!task) return;
    
    const updateData = {
        completed: completed,
        completed_at: completed ? new Date().toISOString() : null,
        completed_by: completed ? currentUser : null
    };
    
    try {
        await db.from('atlas_taches').update(updateData).eq('id', taskId);
        // Mettre à jour localement
        const taskIndex = taches.findIndex(t => t.id === taskId);
        if (taskIndex !== -1) {
            taches[taskIndex] = { ...taches[taskIndex], ...updateData };
        }
        renderTasks(); // Rafraîchir l'affichage
    } catch (error) {
        console.error('Erreur:', error);
        // Rétablir l'état précédent en cas d'erreur
        const checkbox = document.querySelector(`[data-task-id="${taskId}"] .task-checkbox`);
        if (checkbox) checkbox.checked = !completed;
    }
}

async function saveTask() {
    const titre = document.getElementById('task-title').value.trim();
    if (!titre) {
        alert('Titre requis');
        return;
    }
    
    const taskData = {
        project_id: parseInt(projectId),
        titre: titre,
        description: document.getElementById('task-description').value || null
    };
    
    try {
        const { data } = await db.from('atlas_taches').insert([taskData]).select();
        if (data && data[0]) {
            taches.push(data[0]); // Ajouter localement
        }
        closeTaskModal();
        document.getElementById('task-title').value = '';
        document.getElementById('task-description').value = '';
        renderTasks();
        showToast('Tâche ajoutée !');
    } catch (error) {
        alert('Erreur: ' + error.message);
    }
}

// Fonctions modal
function openAddTaskModal() {
    document.getElementById('task-modal').classList.add('visible');
}

function closeTaskModal() {
    document.getElementById('task-modal').classList.remove('visible');
}

function showToast(msg) {
    // Simple toast notification
    const toast = document.createElement('div');
    toast.style.position = 'fixed';
    toast.style.bottom = '20px';
    toast.style.left = '50%';
    toast.style.transform = 'translateX(-50%)';
    toast.style.background = 'var(--accent2)';
    toast.style.color = '#fff';
    toast.style.padding = '12px 24px';
    toast.style.borderRadius = '8px';
    toast.style.fontWeight = '600';
    toast.style.zIndex = '2000';
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(() => {
        if (toast.parentNode) {
            toast.parentNode.removeChild(toast);
        }
    }, 2500);
}

loadProject();
