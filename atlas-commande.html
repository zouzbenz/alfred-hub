<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Commande - Atlas Pose</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <style>
        :root { --bg:#0a0f1a; --card:#111827; --accent:#3b82f6; --accent2:#10b981; --text:#f3f4f6; --dim:#9ca3af; --border:#1f2937; --danger:#ef4444; --warn:#f59e0b; --purple:#8b5cf6; --orange:#f97316; }
        * { box-sizing:border-box; margin:0; padding:0; }
        body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; }
        .container { max-width:1000px; margin:0 auto; padding:15px; }
        
        .top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px; padding:12px; background:var(--card); border-radius:12px; border:1px solid var(--border); }
        .back-link { display:inline-flex; align-items:center; gap:6px; color:var(--accent); text-decoration:none; font-size:.85rem; padding:8px 12px; background:rgba(59,130,246,.1); border-radius:8px; }
        
        .header { padding:20px 15px 30px; }
        .header-top { display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:15px; margin-bottom:15px; }
        .header h1 { font-size:1.8rem; margin-bottom:5px; }
        .header-numero { font-family:monospace; color:var(--dim); font-size:.9rem; }
        .header-statut { padding:8px 16px; border-radius:20px; font-size:.85rem; font-weight:600; cursor:pointer; }
        .statut-brouillon { background:rgba(156,163,175,.2); color:var(--dim); }
        .statut-validee { background:rgba(59,130,246,.2); color:var(--accent); }
        .statut-recue { background:rgba(16,185,129,.2); color:var(--accent2); }
        .statut-annulee { background:rgba(239,68,68,.2); color:var(--danger); }
        
        .header-info { display:flex; flex-wrap:wrap; gap:20px; color:var(--dim); font-size:.9rem; }
        .header-info span { display:flex; align-items:center; gap:6px; }
        
        .section { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px; margin-bottom:20px; }
        .section-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap:wrap; gap:10px; }
        .section-title { font-size:1rem; font-weight:700; display:flex; align-items:center; gap:8px; }
        
        .btn { padding:10px 18px; border:none; border-radius:10px; font-weight:600; cursor:pointer; font-size:.85rem; transition:.2s; display:inline-flex; align-items:center; gap:6px; text-decoration:none; }
        .btn:hover { transform:translateY(-1px); }
        .btn-primary { background:var(--accent); color:#fff; }
        .btn-success { background:var(--accent2); color:#fff; }
        .btn-outline { background:transparent; border:1px solid var(--border); color:var(--text); }
        .btn-danger { background:var(--danger); color:#fff; }
        .btn-warn { background:var(--warn); color:#fff; }
        .btn-small { padding:6px 12px; font-size:.8rem; }
        .btn:disabled { opacity:.5; cursor:not-allowed; transform:none; }
        
        .form-group { margin-bottom:15px; }
        .form-group label { display:block; font-size:.85rem; color:var(--dim); margin-bottom:6px; }
        .form-group input, .form-group select, .form-group textarea { width:100%; padding:12px; background:var(--bg); border:1px solid var(--border); border-radius:10px; color:#fff; font-size:.9rem; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline:none; border-color:var(--accent); }
        .form-row { display:grid; grid-template-columns:1fr 1fr; gap:15px; }
        
        .lignes-table { width:100%; border-collapse:collapse; margin-top:15px; }
        .lignes-table th, .lignes-table td { padding:12px 10px; text-align:left; border-bottom:1px solid var(--border); }
        .lignes-table th { font-size:.75rem; color:var(--dim); font-weight:600; text-transform:uppercase; }
        .lignes-table td { font-size:.9rem; }
        .lignes-table tr:hover { background:rgba(59,130,246,.05); }
        .lignes-table .amount { text-align:right; font-weight:600; }
        .lignes-table .actions { text-align:right; white-space:nowrap; }
        .ligne-incomplete { background:rgba(245,158,11,.1); }
        
        .total-row { background:var(--bg); font-weight:700; }
        .total-row td { border-bottom:none; padding-top:15px; }
        
        .add-ligne-form { background:var(--bg); padding:15px; border-radius:12px; margin-top:15px; display:none; }
        .add-ligne-form.visible { display:block; }
        .add-ligne-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        .add-ligne-grid .full { grid-column:1/-1; }
        
        .fournisseur-select-group { position:relative; }
        .fournisseur-autre-input { margin-top:8px; display:none; }
        .fournisseur-autre-input.visible { display:block; }
        .create-fournisseur-link { font-size:.75rem; color:var(--accent); cursor:pointer; margin-top:5px; display:none; }
        .create-fournisseur-link.visible { display:inline-block; }
        
        .actions-footer { display:flex; gap:12px; justify-content:flex-end; flex-wrap:wrap; margin-top:20px; padding-top:20px; border-top:1px solid var(--border); }
        
        .pdf-section { background:var(--bg); padding:15px; border-radius:10px; margin-top:15px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
        .pdf-info { display:flex; align-items:center; gap:10px; }
        .pdf-icon { font-size:2rem; }
        
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.85); z-index:1000; justify-content:center; align-items:flex-start; padding:20px; overflow-y:auto; }
        .modal.visible { display:flex; }
        .modal-content { background:var(--card); border:1px solid var(--border); border-radius:16px; width:100%; max-width:500px; margin:40px auto; }
        .modal-header { padding:15px 20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
        .modal-title { font-size:1.1rem; font-weight:700; }
        .modal-close { background:none; border:none; color:var(--dim); font-size:1.5rem; cursor:pointer; }
        .modal-body { padding:20px; }
        .modal-footer { padding:15px 20px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px; }
        
        .statut-dropdown { position:absolute; top:100%; right:0; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:8px 0; z-index:100; display:none; min-width:150px; }
        .statut-dropdown.visible { display:block; }
        .statut-dropdown button { width:100%; padding:10px 15px; background:none; border:none; color:var(--text); text-align:left; cursor:pointer; font-size:.85rem; }
        .statut-dropdown button:hover { background:var(--bg); }
        
        .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--accent2); color:#fff; padding:12px 24px; border-radius:10px; font-weight:600; z-index:2000; opacity:0; transition:.3s; }
        .toast.visible { opacity:1; transform:translateX(-50%) translateY(0); }
        
        .footer { text-align:center; padding:30px; color:var(--dim); font-size:.8rem; }
        .footer a { color:var(--accent); text-decoration:none; margin:0 8px; }
        
        @media(max-width:600px) { 
            .form-row, .add-ligne-grid { grid-template-columns:1fr; }
            .lignes-table { font-size:.8rem; }
            .lignes-table th, .lignes-table td { padding:8px 5px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <a href="./atlas-commandes.html" class="back-link">← Toutes les commandes</a>
            <a href="./atlas-backoffice.html" class="back-link">⚙️ Admin</a>
        </div>
        
        <div class="header" id="header">
            <div class="header-top">
                <div>
                    <h1 id="cmd-titre">Chargement...</h1>
                    <div class="header-numero" id="cmd-numero"></div>
                </div>
                <div style="position:relative;">
                    <span class="header-statut" id="cmd-statut" onclick="toggleStatutDropdown()"></span>
                    <div class="statut-dropdown" id="statut-dropdown">
                        <button onclick="changeStatut('brouillon')">📝 Brouillon</button>
                        <button onclick="changeStatut('validee')">✅ Validée</button>
                        <button onclick="changeStatut('recue')">📦 Reçue</button>
                        <button onclick="changeStatut('annulee')">❌ Annulée</button>
                    </div>
                </div>
            </div>
            <div class="header-info">
                <span id="cmd-date">📅 -</span>
                <span id="cmd-project">🏗️ -</span>
                <span id="cmd-demandeur">👤 -</span>
            </div>
        </div>
        
        <!-- Section Lignes de commande -->
        <div class="section">
            <div class="section-header">
                <h3 class="section-title">📋 Articles commandés</h3>
                <button class="btn btn-primary btn-small" onclick="toggleAddLigne()" id="add-ligne-btn">+ Ajouter article</button>
            </div>
            
            <table class="lignes-table">
                <thead>
                    <tr>
                        <th>Désignation</th>
                        <th>Fournisseur</th>
                        <th>Qté</th>
                        <th class="amount">P.U.</th>
                        <th class="amount">Montant</th>
                        <th class="actions"></th>
                    </tr>
                </thead>
                <tbody id="lignes-tbody">
                    <tr><td colspan="6" style="text-align:center;color:var(--dim);padding:30px;">Chargement...</td></tr>
                </tbody>
                <tfoot>
                    <tr class="total-row">
                        <td colspan="4"><strong>TOTAL</strong></td>
                        <td class="amount" id="total-montant">0 DH</td>
                        <td></td>
                    </tr>
                </tfoot>
            </table>
            
            <!-- Formulaire ajout ligne -->
            <div class="add-ligne-form" id="add-ligne-form">
                <div class="add-ligne-grid">
                    <div class="form-group full">
                        <label>Désignation *</label>
                        <input type="text" id="ligne-designation" placeholder="Ex: Colle à carrelage 25kg">
                    </div>
                    <div class="form-group">
                        <label>Catégorie</label>
                        <select id="ligne-categorie">
                            <option value="">-- Sélectionner --</option>
                            <option value="Matériaux">🧱 Matériaux</option>
                            <option value="Outillage">🔧 Outillage</option>
                            <option value="Consommables">📦 Consommables</option>
                            <option value="EPI">🦺 EPI (Sécurité)</option>
                            <option value="Transport">🚚 Transport</option>
                            <option value="Location">🏗️ Location</option>
                            <option value="Sous-traitance">👷 Sous-traitance</option>
                            <option value="Autre">📝 Autre</option>
                        </select>
                    </div>
                    <div class="form-group fournisseur-select-group">
                        <label>Fournisseur</label>
                        <select id="ligne-fournisseur" onchange="handleFournisseurChange(this)">
                            <option value="">-- Sélectionner --</option>
                            <option value="__autre__">➕ Autre (saisie libre)</option>
                        </select>
                        <input type="text" id="ligne-fournisseur-autre" class="fournisseur-autre-input" placeholder="Nom du fournisseur">
                        <span class="create-fournisseur-link" id="create-fournisseur-link" onclick="createFournisseurFromAutre()">💾 Créer comme fournisseur</span>
                    </div>
                    <div class="form-group">
                        <label>Quantité</label>
                        <input type="number" id="ligne-quantite" value="1" min="0.01" step="0.01">
                    </div>
                    <div class="form-group">
                        <label>Unité</label>
                        <select id="ligne-unite">
                            <option value="unité">Unité</option>
                            <option value="kg">Kg</option>
                            <option value="m²">m²</option>
                            <option value="ml">ml</option>
                            <option value="sac">Sac</option>
                            <option value="carton">Carton</option>
                            <option value="palette">Palette</option>
                            <option value="lot">Lot</option>
                            <option value="forfait">Forfait</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Prix unitaire (DH)</label>
                        <input type="number" id="ligne-prix" min="0" step="0.01" placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label>Référence</label>
                        <input type="text" id="ligne-reference" placeholder="Réf. fournisseur">
                    </div>
                </div>
                <div style="display:flex;gap:10px;margin-top:15px;">
                    <button class="btn btn-success btn-small" onclick="saveLigne()">Enregistrer</button>
                    <button class="btn btn-outline btn-small" onclick="toggleAddLigne()">Annuler</button>
                </div>
            </div>
        </div>
        
        <!-- Section PDF Bon de commande -->
        <div class="section" id="pdf-section" style="display:none;">
            <h3 class="section-title">📄 Bon de commande</h3>
            <div class="pdf-section">
                <div class="pdf-info">
                    <span class="pdf-icon">📄</span>
                    <div>
                        <div id="pdf-filename">bon-commande.pdf</div>
                        <div style="font-size:.8rem;color:var(--dim);" id="pdf-date">Généré le -</div>
                    </div>
                </div>
                <div style="display:flex;gap:10px;">
                    <button class="btn btn-outline btn-small" onclick="viewPDF()">👁️ Voir</button>
                    <button class="btn btn-primary btn-small" onclick="regeneratePDF()">🔄 Régénérer</button>
                </div>
            </div>
        </div>
        
        <!-- Section Notes -->
        <div class="section">
            <h3 class="section-title">📝 Notes</h3>
            <textarea id="cmd-notes" style="width:100%;min-height:80px;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:#fff;resize:vertical;" placeholder="Notes de la commande..."></textarea>
            <button class="btn btn-outline btn-small" style="margin-top:10px;" onclick="saveNotes()">Sauvegarder notes</button>
        </div>
        
        <!-- Actions -->
        <div class="actions-footer">
            <button class="btn btn-outline" onclick="history.back()">Retour</button>
            <button class="btn btn-success" id="btn-valider" onclick="validerCommande()">✅ Valider et générer PDF</button>
        </div>
        
        <div class="footer">
            <a href="./atlas-commandes.html">Commandes</a>
            <a href="./atlas-projects.html">Projets</a>
        </div>
    </div>
    
    <!-- Modal édition ligne -->
    <div class="modal" id="edit-ligne-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">✏️ Modifier article</h3>
                <button class="modal-close" onclick="closeEditModal()">×</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="edit-ligne-id">
                <div class="form-group">
                    <label>Désignation *</label>
                    <input type="text" id="edit-designation">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Catégorie</label>
                        <select id="edit-categorie">
                            <option value="">-- Sélectionner --</option>
                            <option value="Matériaux">🧱 Matériaux</option>
                            <option value="Outillage">🔧 Outillage</option>
                            <option value="Consommables">📦 Consommables</option>
                            <option value="EPI">🦺 EPI</option>
                            <option value="Transport">🚚 Transport</option>
                            <option value="Location">🏗️ Location</option>
                            <option value="Sous-traitance">👷 Sous-traitance</option>
                            <option value="Autre">📝 Autre</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Fournisseur</label>
                        <select id="edit-fournisseur" onchange="handleEditFournisseurChange(this)">
                            <option value="">-- Sélectionner --</option>
                            <option value="__autre__">➕ Autre (saisie libre)</option>
                        </select>
                        <input type="text" id="edit-fournisseur-autre" class="fournisseur-autre-input" placeholder="Nom du fournisseur">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Quantité</label>
                        <input type="number" id="edit-quantite" min="0.01" step="0.01">
                    </div>
                    <div class="form-group">
                        <label>Prix unitaire (DH)</label>
                        <input type="number" id="edit-prix" min="0" step="0.01">
                    </div>
                </div>
                <div class="form-group">
                    <label>Référence</label>
                    <input type="text" id="edit-reference">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeEditModal()">Annuler</button>
                <button class="btn btn-success" onclick="updateLigne()">Enregistrer</button>
            </div>
        </div>
    </div>
    
    <div class="toast" id="toast"></div>
    
    <script>
const SUPABASE_URL = 'https://wxhlstificzqovfcumop.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aGxzdGlmaWN6cW92ZmN1bW9wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyNjcwOTAsImV4cCI6MjA4Njg0MzA5MH0.mt6v3SKPMhWpMw9PH7D8k3ubrR1kJNIFHw0aloLmQiQ';
const STORAGE_BUCKET = 'atlas-factures';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let commandeId = null, commande = null, lignes = [], projects = [], suppliers = [];

async function init() {
    commandeId = new URLSearchParams(location.search).get('id');
    if (!commandeId) { location.href = './atlas-commandes.html'; return; }
    await loadData();
}

async function loadData() {
    try {
        const [cmdRes, lignesRes, projRes, suppRes] = await Promise.all([
            db.from('atlas_commandes').select('*').eq('id', commandeId).single(),
            db.from('atlas_commande_lignes').select('*').eq('commande_id', commandeId).order('created_at'),
            db.from('atlas_projects').select('id, name').order('name'),
            db.from('atlas_fournisseurs').select('id, nom').order('nom')
        ]);
        
        commande = cmdRes.data;
        lignes = lignesRes.data || [];
        projects = projRes.data || [];
        suppliers = suppRes.data || [];
        
        if (!commande) { showToast('Commande introuvable', true); return; }
        
        renderHeader();
        renderLignes();
        populateSuppliers();
        updateUI();
    } catch (err) {
        console.error('Erreur:', err);
        showToast('Erreur de chargement', true);
    }
}

function formatDate(d) {
    if (!d) return '-';
    return new Date(d).toLocaleDateString('fr-FR', { day:'2-digit', month:'short', year:'numeric' });
}

function formatMoney(n) {
    return new Intl.NumberFormat('fr-MA', { minimumFractionDigits:0 }).format(n || 0) + ' DH';
}

function renderHeader() {
    document.getElementById('cmd-titre').textContent = commande.titre;
    document.getElementById('cmd-numero').textContent = commande.numero || 'CMD-' + commande.id;
    
    const statutLabels = { brouillon: '📝 Brouillon', validee: '✅ Validée', recue: '📦 Reçue', annulee: '❌ Annulée' };
    const statutEl = document.getElementById('cmd-statut');
    statutEl.textContent = statutLabels[commande.statut] || commande.statut;
    statutEl.className = 'header-statut statut-' + commande.statut;
    
    document.getElementById('cmd-date').textContent = '📅 ' + formatDate(commande.date_demande);
    
    const project = projects.find(p => p.id === commande.project_id);
    document.getElementById('cmd-project').textContent = project ? '🏗️ ' + project.name : '';
    document.getElementById('cmd-project').style.display = project ? 'flex' : 'none';
    
    document.getElementById('cmd-demandeur').textContent = commande.demandeur ? '👤 ' + commande.demandeur : '';
    document.getElementById('cmd-demandeur').style.display = commande.demandeur ? 'flex' : 'none';
    
    document.getElementById('cmd-notes').value = commande.notes || '';
}

function populateSuppliers() {
    const options = '<option value="">-- Sélectionner --</option><option value="__autre__">➕ Autre (saisie libre)</option>' + 
        suppliers.map(s => `<option value="${s.id}">${s.nom}</option>`).join('');
    document.getElementById('ligne-fournisseur').innerHTML = options;
    document.getElementById('edit-fournisseur').innerHTML = options;
}

function handleFournisseurChange(select) {
    const autreInput = document.getElementById('ligne-fournisseur-autre');
    const createLink = document.getElementById('create-fournisseur-link');
    if (select.value === '__autre__') {
        autreInput.classList.add('visible');
        autreInput.focus();
    } else {
        autreInput.classList.remove('visible');
        autreInput.value = '';
        createLink.classList.remove('visible');
    }
}

function handleEditFournisseurChange(select) {
    const autreInput = document.getElementById('edit-fournisseur-autre');
    if (select.value === '__autre__') {
        autreInput.classList.add('visible');
        autreInput.focus();
    } else {
        autreInput.classList.remove('visible');
        autreInput.value = '';
    }
}

document.getElementById('ligne-fournisseur-autre').addEventListener('input', function() {
    const createLink = document.getElementById('create-fournisseur-link');
    createLink.classList.toggle('visible', this.value.trim().length > 0);
});

async function createFournisseurFromAutre() {
    const nom = document.getElementById('ligne-fournisseur-autre').value.trim();
    if (!nom) return;
    
    try {
        const { data, error } = await db.from('atlas_fournisseurs').insert([{ nom, type: 'vendeur' }]).select();
        if (error) throw error;
        
        if (data && data[0]) {
            suppliers.push({ id: data[0].id, nom: data[0].nom });
            populateSuppliers();
            document.getElementById('ligne-fournisseur').value = data[0].id;
            document.getElementById('ligne-fournisseur-autre').classList.remove('visible');
            document.getElementById('ligne-fournisseur-autre').value = '';
            document.getElementById('create-fournisseur-link').classList.remove('visible');
            showToast('Fournisseur créé !');
        }
    } catch (err) {
        console.error('Erreur:', err);
        showToast('Erreur création fournisseur', true);
    }
}

function getFournisseurDisplay(ligne) {
    if (ligne.fournisseur_id) {
        const s = suppliers.find(sup => sup.id === ligne.fournisseur_id);
        return s ? s.nom : '?';
    }
    if (ligne.fournisseur_autre) {
        return ligne.fournisseur_autre + ' <small style="color:var(--warn);">(non enregistré)</small>';
    }
    return '<span style="color:var(--warn);">À définir</span>';
}

function renderLignes() {
    const tbody = document.getElementById('lignes-tbody');
    
    if (!lignes.length) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--dim);padding:30px;">Aucun article. Cliquez sur "+ Ajouter article".</td></tr>';
        document.getElementById('total-montant').textContent = '0 DH';
        return;
    }
    
    let total = 0;
    tbody.innerHTML = lignes.map(l => {
        const montant = parseFloat(l.montant) || 0;
        total += montant;
        const isIncomplete = !l.prix_unitaire || (!l.fournisseur_id && !l.fournisseur_autre);
        
        return `
        <tr class="${isIncomplete ? 'ligne-incomplete' : ''}" data-id="${l.id}">
            <td>
                <strong>${l.designation}</strong>
                ${l.categorie ? `<br><small style="color:var(--dim);">${l.categorie}</small>` : ''}
                ${l.reference ? `<br><small style="color:var(--dim);">Réf: ${l.reference}</small>` : ''}
            </td>
            <td>${getFournisseurDisplay(l)}</td>
            <td>${l.quantite || 1} ${l.unite || ''}</td>
            <td class="amount">${l.prix_unitaire ? formatMoney(l.prix_unitaire) : '<span style="color:var(--warn);">-</span>'}</td>
            <td class="amount">${montant ? formatMoney(montant) : '-'}</td>
            <td class="actions">
                <button class="btn btn-outline btn-small" onclick="editLigne(${l.id})">✏️</button>
                <button class="btn btn-danger btn-small" onclick="deleteLigne(${l.id})">×</button>
            </td>
        </tr>`;
    }).join('');
    
    document.getElementById('total-montant').textContent = formatMoney(total);
}

}

async function changeStatut(newStatut) {

        await db.from('atlas_commandes').update({ statut: newStatut, updated_at: new Date().toISOString() }).eq('id', commandeId);

function toggleAddLigne() {
    const form = document.getElementById('add-ligne-form');
    form.classList.toggle('visible');
    if (form.classList.contains('visible')) {
        document.getElementById('ligne-designation').value = '';
        document.getElementById('ligne-quantite').value = '1';
        document.getElementById('ligne-prix').value = '';
        document.getElementById('ligne-reference').value = '';
        document.getElementById('ligne-categorie').value = '';
        document.getElementById('ligne-fournisseur').value = '';
        document.getElementById('ligne-fournisseur-autre').value = '';
        document.getElementById('ligne-fournisseur-autre').classList.remove('visible');
        document.getElementById('create-fournisseur-link').classList.remove('visible');

    }
}

async function saveLigne() {
    const designation = document.getElementById('ligne-designation').value.trim();
    if (!designation) { showToast('Désignation obligatoire', true); return; }
    
    const fournisseurSelect = document.getElementById('ligne-fournisseur').value;
    const fournisseurAutre = document.getElementById('ligne-fournisseur-autre').value.trim();
    
    const data = {
        commande_id: parseInt(commandeId),
        designation: designation,
        categorie: document.getElementById('ligne-categorie').value || null,
        fournisseur_id: (fournisseurSelect && fournisseurSelect !== '__autre__') ? parseInt(fournisseurSelect) : null,
        fournisseur_autre: (fournisseurSelect === '__autre__' && fournisseurAutre) ? fournisseurAutre : null,
        quantite: parseFloat(document.getElementById('ligne-quantite').value) || 1,
        unite: document.getElementById('ligne-unite').value || 'unité',
        prix_unitaire: parseFloat(document.getElementById('ligne-prix').value) || null,
        reference: document.getElementById('ligne-reference').value || null
    };
    
    if (data.prix_unitaire && data.quantite) {
        data.montant = data.quantite * data.prix_unitaire;
    }
    
    try {
        const { error } = await db.from('atlas_commande_lignes').insert([data]);
        if (error) throw error;
        
        showToast('Article ajouté');
        toggleAddLigne();
        await loadData();
    } catch (err) {
        console.error('Erreur:', err);
        showToast('Erreur: ' + err.message, true);
    }
}

function editLigne(id) {
    const ligne = lignes.find(l => l.id === id);
    if (!ligne) return;
    
    document.getElementById('edit-ligne-id').value = id;
    document.getElementById('edit-designation').value = ligne.designation;
    document.getElementById('edit-categorie').value = ligne.categorie || '';
    document.getElementById('edit-quantite').value = ligne.quantite || 1;
    document.getElementById('edit-prix').value = ligne.prix_unitaire || '';
    document.getElementById('edit-reference').value = ligne.reference || '';
    
    // Fournisseur
    if (ligne.fournisseur_id) {
        document.getElementById('edit-fournisseur').value = ligne.fournisseur_id;
        document.getElementById('edit-fournisseur-autre').classList.remove('visible');
    } else if (ligne.fournisseur_autre) {
        document.getElementById('edit-fournisseur').value = '__autre__';
        document.getElementById('edit-fournisseur-autre').value = ligne.fournisseur_autre;
        document.getElementById('edit-fournisseur-autre').classList.add('visible');
    } else {
        document.getElementById('edit-fournisseur').value = '';
        document.getElementById('edit-fournisseur-autre').classList.remove('visible');
    }
    
    document.getElementById('edit-ligne-modal').classList.add('visible');
}

function closeEditModal() {
    document.getElementById('edit-ligne-modal').classList.remove('visible');
}

async function updateLigne() {
    const id = document.getElementById('edit-ligne-id').value;
    const quantite = parseFloat(document.getElementById('edit-quantite').value) || 1;
    const prix = parseFloat(document.getElementById('edit-prix').value) || null;
    
    const fournisseurSelect = document.getElementById('edit-fournisseur').value;
    const fournisseurAutre = document.getElementById('edit-fournisseur-autre').value.trim();
    
    const data = {
        designation: document.getElementById('edit-designation').value,
        categorie: document.getElementById('edit-categorie').value || null,
        fournisseur_id: (fournisseurSelect && fournisseurSelect !== '__autre__') ? parseInt(fournisseurSelect) : null,
        fournisseur_autre: (fournisseurSelect === '__autre__' && fournisseurAutre) ? fournisseurAutre : null,
        quantite: quantite,
        prix_unitaire: prix,
        reference: document.getElementById('edit-reference').value || null,
        montant: (prix && quantite) ? prix * quantite : null
    };
    
    try {
        const { error } = await db.from('atlas_commande_lignes').update(data).eq('id', id);
        if (error) throw error;
        
        showToast('Article mis à jour');
        closeEditModal();
        await loadData();
    } catch (err) {
        console.error('Erreur:', err);
        showToast('Erreur: ' + err.message, true);
    }
}

async function deleteLigne(id) {
    if (!confirm('Supprimer cet article ?')) return;
    
    try {
        const { error } = await db.from('atlas_commande_lignes').delete().eq('id', id);
        if (error) throw error;
        
        showToast('Article supprimé');
        await loadData();
    } catch (err) {
        console.error('Erreur:', err);
        showToast('Erreur', true);
    }
}

async function saveNotes() {
    try {
        await db.from('atlas_commandes').update({ notes: document.getElementById('cmd-notes').value }).eq('id', commandeId);
        showToast('Notes sauvegardées');
    } catch (err) {

    }
}

async function validerCommande() {
    if (lignes.length === 0) {
        showToast('Ajoutez au moins un article', true);
        return;
    }
    
    // Vérifier lignes incomplètes (warning mais pas bloquant)
    const incomplete = lignes.filter(l => !l.prix_unitaire || (!l.fournisseur_id && !l.fournisseur_autre));
    if (incomplete.length > 0) {
        if (!confirm(`${incomplete.length} article(s) sans prix ou fournisseur. Continuer quand même ?`)) return;
    }
    
    try {
        // 1. Générer et stocker le PDF
        const pdfBlob = await generatePDFBlob();
        const pdfFilename = `${commande.numero || 'CMD-' + commande.id}-bon-commande-${Date.now()}.html`;
        
        const { error: uploadError } = await db.storage.from(STORAGE_BUCKET).upload(pdfFilename, pdfBlob, { contentType: 'text/html' });
        if (uploadError) console.warn('Erreur upload PDF:', uploadError);
        
        // 2. Mettre à jour la commande
        const updateData = {
            statut: 'validee',
            bon_commande_path: pdfFilename,
            updated_at: new Date().toISOString()
        };
        await db.from('atlas_commandes').update(updateData).eq('id', commandeId);
        
        // 3. Calculer le total
        const total = lignes.reduce((sum, l) => sum + (parseFloat(l.montant) || 0), 0);
        
        // 4. Créer les dépenses par projet (si projet lié)
        if (commande.project_id && total > 0) {
            const depenseData = {
                project_id: commande.project_id,
                category: 'Achats',
                description: `Commande ${commande.numero || '#' + commande.id}: ${commande.titre}`,
                amount: total,
                date: new Date().toISOString().split('T')[0],
                validated: true,
                source: 'commande',
                source_id: parseInt(commandeId)
            };
            await db.from('atlas_depenses').insert([depenseData]);
        }
        
        // 5. Créer les opérations fournisseurs
        const fournisseursIds = [...new Set(lignes.filter(l => l.fournisseur_id).map(l => l.fournisseur_id))];
        for (const fId of fournisseursIds) {
            const lignesFournisseur = lignes.filter(l => l.fournisseur_id === fId);
            const montantFournisseur = lignesFournisseur.reduce((sum, l) => sum + (parseFloat(l.montant) || 0), 0);
            
            if (montantFournisseur > 0) {
                const operationData = {
                    fournisseur_id: fId,
                    project_id: commande.project_id,
                    type: 'achat',
                    description: `Commande ${commande.numero}: ${lignesFournisseur.map(l => l.designation).join(', ')}`,
                    montant: montantFournisseur,
                    date_operation: new Date().toISOString().split('T')[0],
                    statut: 'en_attente',
                    source: 'commande',
                    source_id: parseInt(commandeId)
                };
                await db.from('atlas_operations').insert([operationData]);
            }
        }
        
        // 6. Créer tâche "Valider facture à réception"
        const tacheData = {
            project_id: commande.project_id,
            titre: `📦 Réception commande: ${commande.titre}`,
            description: `Valider la réception de la commande ${commande.numero || '#' + commande.id} et créer la facture`,
            priority: 'medium',
            source: 'commande',
            source_id: parseInt(commandeId),
            completed: false
        };
        await db.from('atlas_taches').insert([tacheData]);
        
        // 7. Marquer ancienne tâche comme complétée
        await db.from('atlas_taches').update({ completed: true, completed_at: new Date().toISOString() })
            .eq('source', 'commande').eq('source_id', commandeId).ilike('titre', '%Compléter%');
        
        showToast('Commande validée ! PDF généré, dépenses et opérations créées.');
        await loadData();
        
    } catch (err) {
        console.error('Erreur:', err);
        showToast('Erreur: ' + err.message, true);
    }
}

async function viewPDF() {
    if (!commande.bon_commande_path) return;
    
    const { data } = await db.storage.from(STORAGE_BUCKET).getPublicUrl(commande.bon_commande_path);
    if (data?.publicUrl) {
        window.open(data.publicUrl, '_blank');
    }
}

async function regeneratePDF() {
    if (!confirm('Régénérer le bon de commande avec les données actuelles ?')) return;
    
    try {
        const pdfBlob = await generatePDFBlob();
        const pdfFilename = `${commande.numero || 'CMD-' + commande.id}-bon-commande-${Date.now()}.html`;
        
        // Supprimer ancien fichier si existe
        if (commande.bon_commande_path) {
            await db.storage.from(STORAGE_BUCKET).remove([commande.bon_commande_path]);
        }
        
        const { error } = await db.storage.from(STORAGE_BUCKET).upload(pdfFilename, pdfBlob, { contentType: 'text/html' });
        if (error) throw error;
        
        await db.from('atlas_commandes').update({ bon_commande_path: pdfFilename, updated_at: new Date().toISOString() }).eq('id', commandeId);
        
        showToast('PDF régénéré !');
        await loadData();
    } catch (err) {
        console.error('Erreur:', err);
        showToast('Erreur: ' + err.message, true);
    }
}

function showToast(msg, isError = false) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.style.background = isError ? 'var(--danger)' : 'var(--accent2)';
    toast.classList.add('visible');
    setTimeout(() => toast.classList.remove('visible'), 3000);
}
