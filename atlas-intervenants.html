<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Intervenants - Atlas Pose</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <div>
                <h1 class="page-title">Intervenants</h1>
                <p class="page-subtitle">Annuaire des professionnels chantier</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-clay" onclick="openModal()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    Nouvel intervenant
                </button>
            </div>
        </div>

        <div class="stats-row">
            <div class="stat-card"><div class="stat-value blue" id="stat-total">0</div><div class="stat-label">Total</div></div>
            <div class="stat-card"><div class="stat-value green" id="stat-actifs">0</div><div class="stat-label">Actifs</div></div>
            <div class="stat-card"><div class="stat-value orange" id="stat-metiers">0</div><div class="stat-label">Corps de métier</div></div>
            <div class="stat-card"><div class="stat-value clay" id="stat-projets">0</div><div class="stat-label">Sur des projets</div></div>
        </div>

        <!-- Filtres par corps de métier -->
        <div class="metiers-grid" id="metiers-grid"></div>

        <div class="search-row">
            <div class="search-box">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="search-input" placeholder="Rechercher un intervenant...">
            </div>
        </div>

        <div class="intervenants-grid" id="intervenants-grid">
            <div class="empty-state"><p>Chargement...</p></div>
        </div>

        <div class="footer">Atlas<em class="serif">Pose</em> · Intervenants v1.0</div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="interv-modal" style="display:none" onclick="if(event.target===this)closeModal()">
        <div class="modal">
            <div class="modal-title" id="modal-title">Nouvel intervenant</div>
            <form id="interv-form" onsubmit="saveIntervenant(event)">
                <input type="hidden" id="i-id">
                <div><label>Nom complet *</label><input type="text" id="i-nom" required placeholder="Ex: Mohamed Alaoui"></div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px">
                    <div><label>Corps de métier *</label>
                        <select id="i-metier" required>
                            <option value="">— Sélectionner —</option>
                            <optgroup label="Pilotage & Décision">
                                <option value="architecte">Architecte</option>
                                <option value="architecte_interieur">Architecte d'intérieur</option>
                                <option value="maitre_ouvrage">Maître d'ouvrage</option>
                                <option value="maitre_oeuvre">Maître d'œuvre</option>
                                <option value="bureau_etudes">Bureau d'études</option>
                                <option value="decorateur">Décorateur</option>
                            </optgroup>
                            <optgroup label="Gros œuvre & Structure">
                                <option value="macon">Maçon</option>
                                <option value="platrier">Plâtrier</option>
                                <option value="etancheiste">Étanchéiste</option>
                            </optgroup>
                            <optgroup label="Second œuvre technique">
                                <option value="plombier">Plombier</option>
                                <option value="electricien">Électricien</option>
                                <option value="chauffagiste">Chauffagiste</option>
                                <option value="climatisation">Climatisation / CVC</option>
                                <option value="sanitariste">Installateur sanitaires</option>
                            </optgroup>
                            <optgroup label="Finitions">
                                <option value="peintre">Peintre</option>
                                <option value="menuisier_bois">Menuisier bois</option>
                                <option value="menuisier_alu">Menuisier aluminium</option>
                                <option value="cuisiniste">Cuisiniste</option>
                                <option value="faux_plafondiste">Faux-plafondiste</option>
                                <option value="marbrier">Marbrier</option>
                                <option value="vitrier">Vitrier</option>
                                <option value="serrurier">Serrurier / Métallier</option>
                            </optgroup>
                            <optgroup label="Contrôle & Divers">
                                <option value="geometre">Géomètre</option>
                                <option value="bureau_controle">Bureau de contrôle</option>
                                <option value="autre">Autre</option>
                            </optgroup>
                        </select>
                    </div>
                    <div><label>Entreprise</label><input type="text" id="i-entreprise" placeholder="Nom de l'entreprise"></div>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px">
                    <div><label>Téléphone</label><input type="tel" id="i-tel" placeholder="06 00 00 00 00"></div>
                    <div><label>Email</label><input type="email" id="i-email" placeholder="email@exemple.com"></div>
                </div>
                <div style="margin-top:14px"><label>Notes</label><textarea id="i-notes" rows="2" placeholder="Détails, spécialités..."></textarea></div>
                <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:22px">
                    <button type="button" class="btn btn-outline" onclick="closeModal()">Annuler</button>
                    <button type="submit" class="btn btn-clay" id="save-btn">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <style>
        .search-row{margin-bottom:20px}.search-box{position:relative;max-width:440px}
        .search-box input{padding-left:40px}
        .search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--dim);pointer-events:none}

        .metiers-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
        .metier-tag{padding:6px 14px;border-radius:99px;font-size:.75rem;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text2);transition:all .15s;font-family:'Outfit',sans-serif}
        .metier-tag:hover{border-color:var(--border2);color:var(--text)}
        .metier-tag.active{background:var(--clay);border-color:var(--clay);color:#fff}
        .metier-tag .count{margin-left:4px;opacity:.6}

        .intervenants-grid{display:grid;grid-template-columns:1fr;gap:14px}
        @media(min-width:600px){.intervenants-grid{grid-template-columns:repeat(2,1fr)}}
        @media(min-width:900px){.intervenants-grid{grid-template-columns:repeat(3,1fr)}}

        .interv-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-xl);padding:18px;transition:all .2s}
        .interv-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--clay)}
        .interv-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
        .interv-name{font-family:'Outfit',sans-serif;font-weight:700;font-size:1.05rem;letter-spacing:-0.02em}
        .interv-entreprise{font-size:.8rem;color:var(--text2);margin-top:2px}
        .interv-metier{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:.68rem;font-weight:700;background:var(--clay-lo);color:var(--clay);text-transform:uppercase;letter-spacing:.03em}
        .interv-contact{display:flex;flex-direction:column;gap:6px;margin:12px 0}
        .interv-contact-item{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--text2)}
        .interv-contact-item a{color:var(--accent);text-decoration:none}
        .interv-contact-item a:hover{text-decoration:underline}
        .interv-projets{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
        .interv-projet-tag{padding:2px 8px;border-radius:99px;font-size:.65rem;font-weight:600;background:var(--accent-lo);color:var(--accent);border:1px solid rgba(59,130,246,.15)}
        .interv-footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
        .interv-actions{display:flex;gap:4px}
        .action-btn{background:none;border:none;color:var(--dim);cursor:pointer;padding:6px;border-radius:var(--r-sm);transition:all .15s}
        .action-btn:hover{color:var(--accent);background:var(--accent-lo)}
        .action-btn.danger:hover{color:var(--danger);background:var(--danger-lo)}
        .action-btn svg{width:14px;height:14px}

        .wa-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:99px;font-size:.72rem;font-weight:600;background:#25d366;color:#fff;text-decoration:none;border:none;cursor:pointer;transition:all .15s}
        .wa-btn:hover{filter:brightness(1.1);transform:translateY(-1px)}

        @media(max-width:768px){.page-header{flex-direction:column;align-items:stretch}.header-actions{width:100%}.header-actions .btn{width:100%;justify-content:center}}
    </style>

    <script>
const SUPABASE_URL='https://wxhlstificzqovfcumop.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aGxzdGlmaWN6cW92ZmN1bW9wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyNjcwOTAsImV4cCI6MjA4Njg0MzA5MH0.mt6v3SKPMhWpMw9PH7D8k3ubrR1kJNIFHw0aloLmQiQ';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const METIER_LABELS={architecte:'Architecte',architecte_interieur:"Archi. d'intérieur",maitre_ouvrage:"Maître d'ouvrage",maitre_oeuvre:"Maître d'œuvre",bureau_etudes:"Bureau d'études",decorateur:'Décorateur',macon:'Maçon',platrier:'Plâtrier',etancheiste:'Étanchéiste',plombier:'Plombier',electricien:'Électricien',chauffagiste:'Chauffagiste',climatisation:'Climatisation',sanitariste:'Sanitaires',peintre:'Peintre',menuisier_bois:'Menuisier bois',menuisier_alu:'Menuisier alu',cuisiniste:'Cuisiniste',faux_plafondiste:'Faux plafond',marbrier:'Marbrier',vitrier:'Vitrier',serrurier:'Serrurier',geometre:'Géomètre',bureau_controle:'Bureau contrôle',autre:'Autre'};

let intervenants=[],liens=[],projects=[],filterMetier='',searchQuery='';

async function loadData(){
    try{
        const[iR,lR,pR]=await Promise.all([
            db.from('atlas_intervenants').select('*').order('nom'),
            db.from('atlas_projet_intervenants').select('*'),
            db.from('atlas_projects').select('id, name')
        ]);
        intervenants=iR.data||[];liens=lR.data||[];projects=pR.data||[];
        renderStats();renderMetiers();renderIntervenants();
    }catch(e){console.error(e);}
}

function getProjectsForInterv(iId){
    const pIds=[...new Set(liens.filter(l=>l.intervenant_id===iId).map(l=>l.project_id))];
    return pIds.map(id=>{const p=projects.find(x=>x.id===id);return p?{id:p.id,name:p.name}:null;}).filter(Boolean);
}

function renderStats(){
    document.getElementById('stat-total').textContent=intervenants.length;
    document.getElementById('stat-actifs').textContent=intervenants.filter(i=>i.actif).length;
    document.getElementById('stat-metiers').textContent=new Set(intervenants.map(i=>i.corps_metier)).size;
    const withProjects=new Set(liens.map(l=>l.intervenant_id)).size;
    document.getElementById('stat-projets').textContent=withProjects;
}

function renderMetiers(){
    const counts={};
    intervenants.forEach(i=>{const m=i.corps_metier||'autre';counts[m]=(counts[m]||0)+1;});
    const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
    document.getElementById('metiers-grid').innerHTML=
        '<button class="metier-tag '+(filterMetier===''?'active':'')+'" onclick="setFilter(\'\')">Tous <span class="count">'+intervenants.length+'</span></button>'+
        sorted.map(([m,c])=>'<button class="metier-tag '+(filterMetier===m?'active':'')+'" onclick="setFilter(\''+m+'\')">'+(METIER_LABELS[m]||m)+' <span class="count">'+c+'</span></button>').join('');
}

function setFilter(m){filterMetier=m;renderMetiers();renderIntervenants();}

function renderIntervenants(){
    let data=[...intervenants];
    if(filterMetier)data=data.filter(i=>i.corps_metier===filterMetier);
    if(searchQuery){const q=searchQuery.toLowerCase();data=data.filter(i=>(i.nom||'').toLowerCase().includes(q)||(i.entreprise||'').toLowerCase().includes(q)||(i.email||'').toLowerCase().includes(q)||(i.telephone||'').toLowerCase().includes(q));}

    const grid=document.getElementById('intervenants-grid');
    if(!data.length){grid.innerHTML='<div class="empty-state"><p>Aucun intervenant trouvé</p></div>';return;}

    grid.innerHTML=data.map(i=>{
        const projs=getProjectsForInterv(i.id);
        const tel=i.telephone?i.telephone.replace(/\s/g,''):'';
        const waLink=tel?'https://wa.me/212'+tel.replace(/^0/,''):'';

        return '<div class="interv-card">'+
            '<div class="interv-header"><div><div class="interv-name">'+i.nom+'</div>'+(i.entreprise?'<div class="interv-entreprise">🏢 '+i.entreprise+'</div>':'')+'</div><span class="interv-metier">'+(METIER_LABELS[i.corps_metier]||i.corps_metier)+'</span></div>'+
            '<div class="interv-contact">'+
                (i.telephone?'<div class="interv-contact-item">📞 <a href="tel:'+tel+'">'+i.telephone+'</a></div>':'')+
                (i.email?'<div class="interv-contact-item">📧 <a href="mailto:'+i.email+'">'+i.email+'</a></div>':'')+
            '</div>'+
            (projs.length?'<div class="interv-projets">'+projs.map(p=>'<span class="interv-projet-tag">🏗️ '+p.name+'</span>').join('')+'</div>':'')+
            '<div class="interv-footer"><div class="interv-actions">'+
                (waLink?'<a class="wa-btn" href="'+waLink+'" target="_blank">💬 WhatsApp</a>':'')+
            '</div><div class="interv-actions">'+
                '<button class="action-btn" onclick="editInterv('+i.id+')" title="Modifier"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>'+
                '<button class="action-btn danger" onclick="deleteInterv('+i.id+')" title="Supprimer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg></button>'+
            '</div></div></div>';
    }).join('');
}

document.getElementById('search-input').addEventListener('input',e=>{searchQuery=e.target.value.trim();renderIntervenants();});

function openModal(interv=null){
    document.getElementById('interv-form').reset();document.getElementById('i-id').value='';
    document.getElementById('modal-title').textContent='Nouvel intervenant';
    if(interv){
        document.getElementById('modal-title').textContent='Modifier';
        document.getElementById('i-id').value=interv.id;
        document.getElementById('i-nom').value=interv.nom||'';
        document.getElementById('i-metier').value=interv.corps_metier||'';
        document.getElementById('i-entreprise').value=interv.entreprise||'';
        document.getElementById('i-tel').value=interv.telephone||'';
        document.getElementById('i-email').value=interv.email||'';
        document.getElementById('i-notes').value=interv.notes||'';
    }
    document.getElementById('interv-modal').style.display='flex';
}
function closeModal(){document.getElementById('interv-modal').style.display='none';}
function editInterv(id){const i=intervenants.find(x=>x.id===id);if(i)openModal(i);}

async function saveIntervenant(e){
    e.preventDefault();const btn=document.getElementById('save-btn');btn.disabled=true;btn.textContent='Enregistrement...';
    const id=document.getElementById('i-id').value;
    const data={nom:document.getElementById('i-nom').value.trim(),corps_metier:document.getElementById('i-metier').value,entreprise:document.getElementById('i-entreprise').value.trim()||null,telephone:document.getElementById('i-tel').value.trim()||null,email:document.getElementById('i-email').value.trim()||null,notes:document.getElementById('i-notes').value.trim()||null};
    try{
        const res=id?await db.from('atlas_intervenants').update(data).eq('id',parseInt(id)):await db.from('atlas_intervenants').insert([data]);
        if(res.error)throw res.error;
        showToast(id?'Modifié ✓':'Ajouté ✓');closeModal();loadData();
    }catch(err){showToast('Erreur: '+err.message,true);}
    finally{btn.disabled=false;btn.textContent='Enregistrer';}
}

async function deleteInterv(id){
    if(!confirm('Supprimer cet intervenant et ses liaisons projets ?'))return;
    try{
        await db.from('atlas_projet_intervenants').delete().eq('intervenant_id',id);
        await db.from('atlas_intervenants').delete().eq('id',id);
        showToast('Supprimé');loadData();
    }catch(err){showToast('Erreur: '+err.message,true);}
}

function showToast(m,e=false){const t=document.getElementById('toast');t.textContent=m;t.className='toast '+(e?'toast-error':'toast-success');t.style.display='block';setTimeout(()=>{t.style.display='none';},3000);}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
loadData();
    </script>
    <script src="./atlas-nav.js"></script>
</body>
</html>
