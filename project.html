<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Projet - Néo Storytellers</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#0d0d0d">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #161616;
            --accent-color: #e63946;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --border-color: #2a2a2a;
            --success: #2ecc71;
            --warning: #f39c12;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Password Screen */
        .password-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }

        .password-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .password-box h2 {
            margin-bottom: 10px;
        }

        .password-box p {
            color: var(--text-dim);
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .password-box input {
            width: 100%;
            padding: 15px;
            background: #111;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            margin-bottom: 15px;
            text-align: center;
        }

        .password-box input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .password-box button {
            width: 100%;
            padding: 15px;
            background: var(--accent-color);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .password-box button:hover {
            opacity: 0.9;
        }

        .password-error {
            color: #e74c3c;
            margin-top: 15px;
            font-size: 0.85rem;
        }

        /* Project Content */
        .project-content {
            display: none;
        }

        .project-content.visible {
            display: block;
        }

        /* Back link - only for admin */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--accent-color);
            text-decoration: none;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .back-link.hidden {
            display: none;
        }

        /* Project Header */
        .project-header {
            position: relative;
            height: 250px;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .project-header-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            filter: brightness(0.4);
        }

        .project-header-content {
            position: relative;
            z-index: 1;
            height: 100%;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .project-status-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-en_cours { background: var(--accent-color); color: white; }
        .status-a_venir { background: var(--warning); color: black; }
        .status-complete { background: var(--success); color: white; }

        .project-name {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .project-meta {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .project-meta-item {
            font-size: 0.9rem;
        }

        .project-meta-item span {
            color: var(--text-dim);
        }

        /* Info Grid */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .info-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            padding: 20px;
        }

        .info-card-title {
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .info-card-value {
            font-size: 1.2rem;
            font-weight: 600;
        }

        /* Progress Section */
        .section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title-icon {
            font-size: 1.2rem;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .stat-box {
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--accent-color);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-top: 5px;
        }

        /* Progress Bar */
        .progress-container {
            margin-top: 15px;
        }

        .progress-bar {
            height: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-color), var(--warning));
            border-radius: 5px;
            transition: width 0.5s ease;
        }

        .progress-fill.green {
            background: linear-gradient(90deg, var(--success), #27ae60);
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        .progress-percent {
            font-weight: 700;
            color: var(--text-main);
        }

        /* Two columns */
        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .two-col {
                grid-template-columns: 1fr;
            }

            .project-name {
                font-size: 1.8rem;
            }

            .project-header {
                height: 200px;
            }
        }

        /* Description */
        .description {
            color: var(--text-dim);
            line-height: 1.6;
            font-size: 0.95rem;
        }

        /* Payment */
        .payment-status {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .payment-percent {
            font-size: 2.5rem;
            font-weight: 800;
        }

        .payment-percent.paid {
            color: var(--success);
        }

        .payment-percent.partial {
            color: var(--warning);
        }

        .payment-percent.unpaid {
            color: var(--accent-color);
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 100px;
            color: var(--text-dim);
        }

        /* Error */
        .error {
            text-align: center;
            padding: 100px;
            color: var(--accent-color);
        }

        /* Footer branding */
        .footer-branding {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-dim);
            font-size: 0.8rem;
        }

        .footer-branding a {
            color: var(--accent-color);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Password Screen -->
        <div class="password-screen" id="password-screen">
            <div class="password-box">
                <h2>🔐 Accès Projet</h2>
                <p>Entrez le mot de passe pour accéder aux détails du projet</p>
                <input type="password" id="project-password" placeholder="Mot de passe" onkeypress="if(event.key==='Enter')checkProjectPassword()">
                <button onclick="checkProjectPassword()">Accéder</button>
                <div class="password-error" id="password-error"></div>
            </div>
        </div>

        <!-- Project Content -->
        <div class="project-content" id="project-content">
            <a href="./neo-projects.html" class="back-link" id="back-link">← Retour aux projets</a>
            <div id="project-details">
                <div class="loading">Chargement du projet...</div>
            </div>
        </div>
    </div>

    <script>
        // Supabase Config
        const SUPABASE_URL = 'https://wxhlstificzqovfcumop.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aGxzdGlmaWN6cW92ZmN1bW9wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyNjcwOTAsImV4cCI6MjA4Njg0MzA5MH0.mt6v3SKPMhWpMw9PH7D8k3ubrR1kJNIFHw0aloLmQiQ';
        
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Get project ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const projectId = urlParams.get('id');

        let currentProject = null;
        let isAdmin = false;

        // Check if user is admin (came from backoffice)
        if (sessionStorage.getItem('neo-backoffice-auth') === 'true') {
            isAdmin = true;
        }

        // Format date
        function formatDate(dateStr) {
            if (!dateStr) return 'Non définie';
            const date = new Date(dateStr);
            return date.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
        }

        // Calculate percentage
        function calcPercent(done, total) {
            if (!total || total === 0) return 0;
            return Math.round((done / total) * 100);
        }

        // Get image URL from storage
        function getImageUrl(path) {
            if (!path) return null;
            const { data } = db.storage.from('project-covers').getPublicUrl(path);
            return data.publicUrl;
        }

        // Load project data first to check if password is required
        async function loadProjectData() {
            if (!projectId) {
                document.getElementById('password-screen').innerHTML = '<div class="password-box"><h2>❌ Erreur</h2><p>Projet non trouvé</p></div>';
                return;
            }

            const { data, error } = await db
                .from('neo_projects')
                .select('*')
                .eq('id', projectId)
                .single();

            if (error || !data) {
                document.getElementById('password-screen').innerHTML = '<div class="password-box"><h2>❌ Erreur</h2><p>Projet non trouvé</p></div>';
                return;
            }

            currentProject = data;

            // If admin or no password required, show directly
            if (isAdmin || !data.password) {
                showProject();
            }
            // Otherwise, show password screen
        }

        // Check project password
        function checkProjectPassword() {
            const input = document.getElementById('project-password').value;
            
            if (input === currentProject.password) {
                showProject();
            } else {
                document.getElementById('password-error').textContent = 'Mot de passe incorrect';
            }
        }

        // Show project content
        function showProject() {
            document.getElementById('password-screen').style.display = 'none';
            document.getElementById('project-content').classList.add('visible');
            
            // Hide back link for non-admin users
            if (!isAdmin) {
                document.getElementById('back-link').classList.add('hidden');
            }

            renderProject(currentProject);
        }

        // Render project
        function renderProject(p) {
            const defaultBg = 'https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?w=1200&q=80';
            
            // Use uploaded image or default
            let bgUrl = defaultBg;
            if (p.cover_image_path) {
                bgUrl = getImageUrl(p.cover_image_path);
            } else if (p.cover_photo_url) {
                bgUrl = p.cover_photo_url;
            }
            
            const selectionPercent = calcPercent(p.selected_photos, p.total_photos);
            const lightroomPercent = calcPercent(p.lightroom_done, p.lightroom_total);
            const photoshopPercent = calcPercent(p.photoshop_done, p.photoshop_total);
            const davinciPercent = calcPercent(p.davinci_rendered, p.davinci_reels);
            
            let paymentClass = 'unpaid';
            if (p.payment_percent >= 100) paymentClass = 'paid';
            else if (p.payment_percent > 0) paymentClass = 'partial';

            document.title = `${p.name} - Néo Storytellers`;

            document.getElementById('project-details').innerHTML = `
                <!-- Header -->
                <div class="project-header">
                    <div class="project-header-bg" style="background-image: url('${bgUrl}')"></div>
                    <span class="project-status-badge status-${p.status}">${p.status.replace('_', ' ')}</span>
                    <div class="project-header-content">
                        <h1 class="project-name">${p.name}</h1>
                        <div class="project-meta">
                            <div class="project-meta-item"><span>Client:</span> ${p.client_name || 'Non défini'}</div>
                            <div class="project-meta-item"><span>Début:</span> ${formatDate(p.date_start)}</div>
                        </div>
                    </div>
                </div>

                <!-- Description -->
                ${p.description ? `
                <div class="section">
                    <h3 class="section-title"><span class="section-title-icon">📝</span> Description</h3>
                    <p class="description">${p.description}</p>
                </div>
                ` : ''}

                <!-- Photos Section -->
                <div class="section">
                    <h3 class="section-title"><span class="section-title-icon">📸</span> Sélection Photos</h3>
                    <div class="stats-grid">
                        <div class="stat-box">
                            <div class="stat-value">${p.total_photos || 0}</div>
                            <div class="stat-label">Total prises</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value">${p.selected_photos || 0}</div>
                            <div class="stat-label">Sélectionnées</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value">${selectionPercent}%</div>
                            <div class="stat-label">Taux sélection</div>
                        </div>
                    </div>
                </div>

                <div class="two-col">
                    <!-- Lightroom -->
                    <div class="section">
                        <h3 class="section-title"><span class="section-title-icon">🎨</span> Lightroom</h3>
                        <div class="stats-grid">
                            <div class="stat-box">
                                <div class="stat-value">${p.lightroom_total || 0}</div>
                                <div class="stat-label">Total</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-value">${p.lightroom_done || 0}</div>
                                <div class="stat-label">Traitées</div>
                            </div>
                        </div>
                        <div class="progress-container">
                            <div class="progress-bar">
                                <div class="progress-fill ${lightroomPercent >= 100 ? 'green' : ''}" style="width: ${lightroomPercent}%"></div>
                            </div>
                            <div class="progress-text">
                                <span>Progression</span>
                                <span class="progress-percent">${lightroomPercent}%</span>
                            </div>
                        </div>
                    </div>

                    <!-- Photoshop -->
                    <div class="section">
                        <h3 class="section-title"><span class="section-title-icon">✨</span> Photoshop</h3>
                        <div class="stats-grid">
                            <div class="stat-box">
                                <div class="stat-value">${p.photoshop_total || 0}</div>
                                <div class="stat-label">Total</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-value">${p.photoshop_done || 0}</div>
                                <div class="stat-label">Traitées</div>
                            </div>
                        </div>
                        <div class="progress-container">
                            <div class="progress-bar">
                                <div class="progress-fill ${photoshopPercent >= 100 ? 'green' : ''}" style="width: ${photoshopPercent}%"></div>
                            </div>
                            <div class="progress-text">
                                <span>Progression</span>
                                <span class="progress-percent">${photoshopPercent}%</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- DaVinci -->
                <div class="section">
                    <h3 class="section-title"><span class="section-title-icon">🎬</span> DaVinci Resolve</h3>
                    <div class="stats-grid">
                        <div class="stat-box">
                            <div class="stat-value">${p.davinci_reels || 0}</div>
                            <div class="stat-label">Reels prévus</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value">${p.davinci_rendered || 0}</div>
                            <div class="stat-label">Rendus</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value">${davinciPercent}%</div>
                            <div class="stat-label">Progression</div>
                        </div>
                    </div>
                    <div class="progress-container">
                        <div class="progress-bar">
                            <div class="progress-fill ${davinciPercent >= 100 ? 'green' : ''}" style="width: ${davinciPercent}%"></div>
                        </div>
                    </div>
                </div>

                <div class="two-col">
                    <!-- Payment -->
                    <div class="section">
                        <h3 class="section-title"><span class="section-title-icon">💰</span> Statut Paiement</h3>
                        <div class="payment-status">
                            <div class="payment-percent ${paymentClass}">${p.payment_percent || 0}%</div>
                            <div>
                                <div style="font-weight: 600;">${p.payment_percent >= 100 ? 'Payé' : p.payment_percent > 0 ? 'Paiement partiel' : 'En attente'}</div>
                                <div style="color: var(--text-dim); font-size: 0.85rem;">du montant total</div>
                            </div>
                        </div>
                    </div>

                    <!-- Project Status -->
                    <div class="section">
                        <h3 class="section-title"><span class="section-title-icon">📊</span> Statut Projet</h3>
                        <div class="stats-grid">
                            <div class="stat-box">
                                <div class="stat-value">${p.project_percent || 0}%</div>
                                <div class="stat-label">Complété</div>
                            </div>
                        </div>
                        <div class="progress-container">
                            <div class="progress-bar">
                                <div class="progress-fill ${p.project_percent >= 100 ? 'green' : ''}" style="width: ${p.project_percent || 0}%"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="footer-branding">
                    Projet suivi par <a href="#">Néo Storytellers</a>
                </div>
            `;
        }

        // Real-time sync
        if (projectId) {
            db.channel('neo_projects_detail')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'neo_projects', filter: `id=eq.${projectId}` }, async () => {
                    const { data } = await db.from('neo_projects').select('*').eq('id', projectId).single();
                    if (data) {
                        currentProject = data;
                        if (document.getElementById('project-content').classList.contains('visible')) {
                            renderProject(data);
                        }
                    }
                })
                .subscribe();
        }

        // Init
        loadProjectData();
    </script>
</body>
</html>
